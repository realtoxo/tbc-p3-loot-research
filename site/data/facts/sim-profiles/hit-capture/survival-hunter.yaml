notes:
  off_piece_review_2026_08_09: >-
    REVIEWED 9 August 2026 against
    data/facts/sim-profiles/hit-capture-review/open-divergences.yaml; no
    pick changed. This capture is AT its ranged hit cap at both tier
    anchors (hit-captured.yaml: state full, gap 0), and SV.csv carries its
    own "If Hit Capped" column, which is the column that governs a capped
    set. Read there, the three flagged divergences shrink or invert.
    RING1: Ring of Lethality falls from 203.54 to 175.04 capped, BELOW the
    worn Ring of the Recalcitrant's 179.04 — the workbook itself, read at
    the right column, endorses the hold, and Lethality's 19 hit would be
    surplus. TRINKET2: Tsunami Talisman falls from 139.52 to 124.52
    capped, an edge of 6.52 over Bloodlust Brooch's 118.00 resting on
    crit-versus-attack-power valuation, not on any stat this spec lacks.
    WAIST: Boneweave Girdle falls from 339.08 to 313.58 capped, 4.37 over
    Don Alejandro's Money Belt's 309.21, inside the tab's own noise. The
    trinket and waist holds therefore stand unsettled rather than
    endorsed: no mechanic separates the items once surplus hit is
    discounted, and a sim or the guide's stated reasoning would settle
    them. Note the contrast with the Beast Mastery capture, which is
    SHORT at both tier anchors and DID take Boneweave Girdle in the same
    audit: the same item resolves opposite ways because the two hunters
    sit on opposite sides of the cap, which is the fact a council reads
    when the belt drops.
  availability_corrections: >-
    Entry ring2: Band of Eternity (29298) is a Scale of the Sands reputation
    reward, and Scale of the Sands is the Mount Hyjal faction, so it cannot
    be held before Phase 3 opens. Replaced with Ring of Lethality (30052,
    Serpentshrine Cavern, Phase 2, 19 melee hit), the top-ranked prephase
    Finger item in the ladder not already held in ring1 (Ring of the
    Recalcitrant). Entry total_item_hit rises from 68 to 87. The tier-anchor
    ring2 (Band of Eternity, same item) is left as-is: the availability
    checker reports it only as unverified there, not as a failure, since the
    rule this file enforces applies to the pre-Phase-3 entry anchor only.
  downgraded_slots: >-
    Against the source's full-clear Phase 3 list: shoulder (Gronnstalker's
    Spaulders, Mother Shahraz), legs (Gronnstalker's Leggings, Illidari
    Council) and chest (Gronnstalker's Chestguard, Illidan Stormrage) are
    dropped entirely, their Tier 5 equivalents kept instead, because those
    three bosses are not reachable in the window per data/facts/progression.yaml.
    Feet (Shadowmaster's Boots) is also a Mother Shahraz drop and is dropped for
    the same reason, keeping the Phase 2 pick. The ranged weapon and trinket
    upgrades that require Archimonde (Bristleblitz Striker) or the Illidari
    Council (Madness of the Betrayer) are withheld in tier_hands_only and, for
    Madness of the Betrayer, in tier_hands_and_head too, since only the head
    token is unlocked by Archimonde, not a Black Temple boss past Gurtogg
    Bloodboil. Wrist (Insidious Bands, Teron Gorefiend), waist (Don Alejandro's
    Money Belt, Anetheron) and the main-hand weapon (Halberd of Desolation,
    High Warlord Naj'entus) are upgraded in both tier states, because all three
    source bosses are inside the "reliably down" list in
    data/facts/progression.yaml. Legs stays Rift Stalker Leggings (Tier 5)
    rather than the source's full-clear "Best" pick, Bow-stitched Leggings
    (Azgalor), so the Tier 5 four-piece survives taking the hands token alone,
    matching the verdict already recorded in
    data/facts/sim-profiles/token-arithmetic.yaml that hands is the slot
    released to take Tier 6, not legs. The weapon slot is downgraded from the
    source's full-clear pick, two Blade of Infamy (Anetheron), to a single
    Halberd of Desolation (Naj'entus): getting two drops of the same item from
    one boss inside the window is far less certain than getting one drop of a
    different item from a different boss, and the source itself frames the
    Halberd as the early pickup while working toward two Blades of Infamy.
  uncertain: >-
    Both Gronnstalker's Armor pieces reachable in this window carry zero item
    hit: Gronnstalker's Gloves (31001, hands) and Gronnstalker's Helmet (31003,
    head), each confirmed against the live item tooltip (no mlehitrtng /
    rgdhitrtng field on either). The other three Gronnstalker's pieces
    (shoulder 31006, chest 31004, legs 31005) were also checked and likewise
    carry no hit field, so "Gronnstalker's Armor carries ZERO hit on all five
    pieces" holds for all five, not only the two reachable here. Because both
    Archimonde-gated swaps (head token, and the ranged weapon upgrade to
    Bristleblitz Striker) replace a zero-hit item with another zero-hit item,
    tier_hands_only and tier_hands_and_head land on the identical total, 92:
    clearing Archimonde changes what is worn, not the hit total. The Phase 2
    source lists two tied "Best" feet items, Cobra-Lash Boots (30104) and
    Star-Strider Boots (29951); Cobra-Lash Boots was picked arbitrarily since
    both carry 0 hit and the choice does not move any total. The Phase 3
    source's ring pick, Band of the Eternal Champion (29301), requires Exalted
    with The Scale of the Sands; whether that reputation is reachable in the
    window is unverified, so Band of Eternity (29298) is carried forward
    unchanged from entry instead — moot for the total either way, since 29301
    also carries no hit. Whether this roster's actual clear pace matches the
    generic four-to-six-week forecast is itself flagged unverified in
    data/facts/progression.yaml.
