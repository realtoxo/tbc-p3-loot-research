    ppm: 1.0
    icd_seconds: none_modeled
    duration_seconds: 6
    off_hand: >-
      The simulator restricts the trigger to the hand wielding the weapon,
      via GetMeleeProcMaskForHands, so an off-hand copy procs from off-hand
      swings and a main-hand copy does not.
    note: >-
      The tooltip reads chance on hit and prints no rate. The simulator
      models the drain as flat 20 shadow damage per landed melee attack
