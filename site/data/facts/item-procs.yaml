open_questions:
  ppm_provenance: >-
    The simulator states 1 PPM for Dragonspine Trophy, Madness of the
    Betrayer and Syphon of the Nathrezim, and 10 PPM inside the Badge of the
    Swarmguard window, but the code does not say whether those figures were
    measured against the game or adopted by convention. The tooltip publishes
    none of them. Until a measurement source is found, treat a PPM figure
    here as the simulator's model rather than a game constant.
  madness_icd: >-
    Madness of the Betrayer carries no internal cooldown in the simulator
    and none on the tooltip, while Dragonspine Trophy at the same 1 PPM
    carries a published 20 second one. Whether the game enforces an
    unpublished cooldown on Madness is not settled by either source.
  syphon_self_heal: >-
    The Syphon of the Nathrezim tooltip says the fel energy drains life from
    opponents; the simulator models 20 flat shadow damage per attack and no
    heal to the wielder. Which the game does is not settled here.
  healer_items_unsimulated: >-
    Memento of Tyrande and Crystal Spire of Karabor have no implementation
    in the simulator source, so their entries rest on the tooltip alone and
    no second source corroborates them.
