      Tracking only. The effect grants no combat stat, so no trigger figure
      exists to collect. The item's combat value is its stat line in
      items.csv.
    source: "tooltip item 32235"

  - item_id: 32257
    name: Idol of the White Stag
    effect: "94 attack power for 20 sec after Mangle"
    kind: ability_triggered
    trigger: every cast of Mangle
    proc_chance_percent: 100
    icd_seconds: none_modeled
    duration_seconds: 20
    note: >-
      Deterministic. Uptime is set by how often Mangle is pressed, not by a
      roll, so a 20 second buff against a 6 second Mangle cooldown is
      refreshed before it falls.
    source: "wowsims sim/druid/items.go; tooltip item 32257"

  - item_id: 32262
