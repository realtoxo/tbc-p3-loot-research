# Trigger data for effect-bearing items. Hand-authored.
#
# HOLDS   How often an item effect fires: proc chance, procs per minute,
#         internal cooldown, the trigger mask, and which effects are on-use
#         rather than chance-based. This is the half of every trinket
#         comparison that item-effects.csv does not carry; that table records
#         what an effect grants and for how long, and its PROVENANCE.md states
#         that the trigger lives in the simulator source, which is where these
#         figures were read.
# NOT HERE  No ranking, no uptime estimate, no expected-value figure. Turning
#         a rate and a duration into a value is a judgment on a fight profile.
# SCOPE   Every row of item-effects.csv with tier T6, fourteen rows across
#         thirteen items, plus every trinket worn in any capture under
#         sim-profiles/hit-capture/, seventeen distinct trinkets. One item,
#         Shadowmoon Insignia, is in both sets, so there are twenty-nine
#         entries. A trinket nobody wears is out of scope on purpose.
#
# BEFORE YOU USE A FIGURE
#   A figure marked unpublished is unpublished, not zero and not one. The
#   2.4.3 tooltip endpoint prints a proc chance and cooldown for some items
#   and stays silent for others, and the simulator models the silent ones
#   with a procs-per-minute rate instead of a chance. A PPM figure and a
#   percent chance are different units: PPM scales with weapon speed and a
#   percent does not. Where the simulator models no internal cooldown and the
#   tooltip prints none, icd_seconds reads none_modeled, which is a statement
#   about the sources and not a claim that the game has no cooldown.

meta:
  captured: 2026-08-09
  patch: 2.4.3
  edition: TBC Classic Anniversary Edition
  phase: 3
  scope_from:
    - data/facts/item-effects.csv, rows with tier T6
    - data/facts/sim-profiles/hit-capture/*.yaml, trinket slots
  feeds: trinket and weapon-effect comparisons in the compendium
  excludes: >-
    What each effect grants and for how long, which item-effects.csv already
    carries and is not restated here. Trinkets no captured set wears.
    Non-T6 effect items outside the worn-trinket list.

sources:
  primary:
    - key: wowsims
      name: WoWSims TBC simulator source
      repo: github.com/wowsims/tbc
      commit: 3301fca59306a747e521274c36e073e69acc7b77
      committed: 2026-08-06
      observed: 2026-08-09
      files:
        - sim/common/melee_trinkets.go
        - sim/common/caster_trinkets.go
        - sim/common/melee_items.go
        - sim/common/lightning_capacitor.go
        - sim/druid/items.go
        - sim/hunter/items.go
        - sim/paladin/items.go
        - sim/rogue/items.go
        - sim/mage/mana_gems.go
        - sim/shaman/electric_spell.go
      note: >-
        Fetched from raw.githubusercontent.com at master on the observed date.
        Where an entry cites wowsims, the exact file is named on the entry.
        The simulator encodes each trigger as code: a percent chance appears
        as a procChance constant, a rate as a NewPPMManager argument, an
        internal cooldown as an icd Duration, and the trigger mask as a
        ProcMask test. Whether a PPM value in this source derives from
        measurement or from project convention is not stated in the code; see
        open_questions.ppm_provenance.
    - key: tooltip
      name: Wowhead TBC Classic tooltip endpoint
      form: https://nether.wowhead.com/tbc/tooltip/item/<ID>
      observed: 2026-08-09
      note: >-
        Server-rendered against the 2.4.3 data environment. For some items the
        tooltip itself prints a proc chance and cooldown in parentheses; where
        it does, the entry quotes it and the figure counts as published by the
        game data. Where it does not, the tooltip still fixes the trigger
        wording, the granted effect and the on-use cooldown.

# Field vocabulary, applied to every entry:
#   kind                 proc | on_use | on_use_proc_window | ability_triggered
#                        | passive
#   trigger              What fires it, in the source's own terms.
#   proc_chance_percent  Percent chance per trigger, or unpublished.
#   ppm                  Procs per minute, or unpublished. PPM and chance are
#                        alternatives; an entry carries at most one number.
#   icd_seconds          Internal cooldown between procs, none_modeled, or
#                        unpublished.
#   duration_seconds     How long the granted effect lasts. Restated from
#                        item-effects.csv only where needed to read the entry.
#   cooldown_seconds     On-use items only. The use cooldown.
#   off_hand             Whether an off-hand swing can trigger it, where the
#                        source answers it. Melee triggers only.
#   periodic             Whether periodic damage can trigger it, where the
#                        source answers it. Spell triggers only.
#   source               Which source each figure came from, per figure.

items:

