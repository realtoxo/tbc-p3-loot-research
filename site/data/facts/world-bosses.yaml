# The two outdoor world bosses and everything they drop.
#
# THIS FILE HOLDS THE LOOT TABLES, WHICH ARE FACTS. Whether this guild runs
# them is a judgment and lives at data/judgments/capture-fidelity.yaml
# raid_scope. It ruled on 9 August 2026 that the guild does not, so nothing
# here may appear in a captured set, in a comparison baseline or in a slot
# shortlist.
#
# WHY THIS IS A FILE AND NOT A LIST IN A SCRIPT. Two tools need it,
# tools/check_capture_availability.py to fail a capture that wears one and
# tools/extract_ladder.py to keep them out of what the compendium recommends,
# and a second copy is what goes stale.
#
# WHY IT IS NOT IN drops.csv. That table is generated from the encounter data
# for the seven instanced zones, so neither npc appears in it and nothing that
# joins through it can see these items. That blindness is exactly how eleven
# slots across four captures passed every check until 9 August 2026.

meta:
  observed: 2026-08-09
  sources:
    - Icy Veins, TBC world-boss loot tables, updated 12 January 2026
    - Wowpedia, per-item pages
    - >-
      The wowsims item database, read across the whole id range rather than by
      name. That is how completeness was established: 30722 to 30741 is one
      unbroken block, ten items for each boss, and every id inside it belongs
      to one of the two.
  completeness: >-
    Both tables in full, not only the items a capture happened to wear. A
    partial list is worse than none, because it reads as enforcement while
    letting the next pick through.
  not_in_items_csv: >-
    ALL TWENTY are absent from data/facts/items.csv, because that table is
    generated from what the ladder references and the ladder no longer
    references any of them. This line read "three of the twenty are absent"
    and was true only until the exclusion landed, an hour later on the same
    day. items.csv is generated, so a note about its contents goes stale
    whenever a generator changes, which is the hazard AGENTS.md names as
    stating one fact at two boundaries.
    The point the original line was making still stands and is worth keeping: a
    lookup by NAME against items.csv would never have found these items, so the
    list was built by reading the id range out of the database instead.
  attribution_was_wrong_once: >-
    Anger-Spark Gloves (30725) is a DOOMWALKER drop. An earlier note in this
    repository credited Doom Lord Kazzak, and the captures that named Doomwalker
    were right.

