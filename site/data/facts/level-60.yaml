# Level-60 raid content, and every item of it the workbook ranks.
#
# THIS FILE HOLDS THE ITEMS, WHICH ARE FACTS. Whether this guild runs that
# content is a judgment and lives at data/judgments/capture-fidelity.yaml
# raid_scope. It ruled on 9 August 2026 that the guild does not.
#
# WHY IT EXISTS, AND WHAT IT FIXES. The ruling was enforced in one place only,
# tools/extract_ladder.py, by matching the workbook's Location string against
# the single name "Naxxramas". Two adversarial reviews on 10 August 2026 found
# three separate errors in that, each worse than the last.
#
# FIRST: a sweep was said to have found "exactly one level-60 name in use".
# It found one because it looked for one.
#
# SECOND, and this one shipped: the largest level-60 bucket in the workbook is
# not named after a raid at all. It is filed under the literal string
# "Classic", 45 rows and 23 items, holding the Ahn'Qiraj Fallen God set, two
# Blackwing Lair trinkets, the Faith tier and all four Atiesh ids. Ring of the
# Fallen God (21709, C'Thun) was ranked 5 in the Shadow Priest ring shortlist
# and RENDERED ON THE BUILT PAGE while a filter claimed to exclude it.
#
# THIRD: the ruling said "not one of the seventeen captures wears any level-60
# item" and therefore left captures unchecked. TWO DID. Badge of the Swarmguard,
# an Ahn'Qiraj trinket, sat in seven slots across both warriors, and the Fury
# capture named its source in its own field.
#
# The common cause of the second and third is the same as the world bosses:
# drops.csv covers the seven instanced Outland zones, so no level-60 content
# appears in it and every check that joins through it is blind.
#
# HOW THE LIST WAS BUILT. Every row on the 21 tabs the extractor actually reads
# whose Location is one of the four strings below, with the item id taken from
# the row's own Wowhead link rather than from its name. A first attempt counted
# across all 25 CSVs in the directory, including tabs no spec maps to, which is
# why its figures were wrong as well as incomplete.

meta:
  built: 2026-08-10
  from: >-
    data/research/epv-workbook, the Location column of the 21 tabs named in
    tools/extract_ladder.py SPECS. Not all 25 CSVs in the directory: four are
    unmapped and counting them inflated an earlier version of this file.
  method: >-
    Ids read from each row's Wowhead link, names resolved against the wowsims
    item database. Never by name: this project has mis-dispositioned an item on
    its name four times.
  completeness: >-
    Complete for what the workbook ranks, which is the only surface the
    compendium can recommend from. It is NOT a complete list of level-60 raid
    loot and does not need to be.
  found_by: >-
    Two independent adversarial reviews on 10 August 2026, both asked to refute
    rather than confirm. One found the missing captures, the other found the
    "Classic" bucket and the live rendered row.

# Matched on the workbook's Location string, which is the right axis for the
# ladder because the exclusion is whole raids rather than a table of drops.
# "Classic" is a location string and not a raid name, which is exactly why it
# was missed.
raids: [Naxxramas, Classic, Blackwing Lair, "Ahn'Qiraj"]

rows_per_location_on_the_used_tabs:
  Naxxramas: 91
  Classic: 45
  Blackwing Lair: 11
  "Ahn'Qiraj": 1

# NOT EXCLUDED, AND RECORDED SO THE NEXT READER DOES NOT HAVE TO REDISCOVER IT.
# Two further rows sit under "Scarlet Monastery" and its misspelling "Scarlet
# Monestery": The Horseman's Helm (33808) and The Horseman's Blade (38175).
# Those are Hallow's End holiday drops, not level-60 raid loot, so this ruling
# does not reach them. They raise a different availability question, because
# Hallow's End runs in October and Phase 3 opens on 27 August. Neither reaches
# the ladder today.
holiday_items_not_covered_by_this_ruling:
  33808: The Horseman's Helm
  38175: The Horseman's Blade

