open_questions:

  collection_order:
    blocks: Every throughput figure the compendium would quote.
    detail: >-
      Nothing is collected. Order by what a figure would decide. The three specs
      hit.yaml records as short come first, feral_bear, protection_paladin and
      arcane_mage, because a short state is the only cap state that creates a
      claim on loot. Then the two that change state between anchors,
      beast_mastery_hunter and protection_warrior, since their tier sets carry
      no hit and that movement is already recorded but not measured. Then the
      contested pairs, the two ferals and the two warriors, who share a set and
      contest the same pieces.

  gear_for_the_entry_anchor:
    blocks: The entry profile for every spec.
    detail: >-
      The entry gear set is currently computed inside tools/extract_ladder.py to
      derive a supply figure and then discarded, so there is no list to copy
      into a profile. Publishing it is a separate deferred task. Until then an
      entry profile has to be assembled by hand from the EP Workbook, which is
      slower and will not agree with the supply figures unless the same rule is
      followed.

  rotation_source:
    blocks: Comparability between specs.
    detail: >-
      Rotation quality varies sharply between specs in a simulator and distorts
      absolute damage far more than it distorts what one point of a stat is
      worth within a spec. A rotation copied from a community source carries that
      source's assumptions. Whether a rotation is taken from the simulator's
      default, from a community guide, or written here, is not decided, and it
      has to be the same choice across specs or cross-spec figures are not
      comparable.
