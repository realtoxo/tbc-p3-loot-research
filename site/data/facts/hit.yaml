# Hit and expertise, per spec. Hand-authored.
#
# HOLDS   The four hit caps, expertise against boss dodge and parry, the talents
#         and buffs supplying them, and each spec's position at Phase 3 entry.
# NOT HERE  Crit is in crit.yaml. Haste is in haste.yaml. Tank defense
#         thresholds are in crit.yaml under tank_defensive_thresholds.
#
# BEFORE YOU USE A FIGURE
#   Improved Faerie Fire is ASSUMED. It supplies 48 rating against physical
#   targets and is what holds retribution_paladin, beast_mastery_hunter and
#   protection_warrior at full. Each carries state_before_improved_faerie_fire.
#   Racials are NOT assumed. Consumables, gems and enchants are NOT counted.
#   supplied_at_p3_entry and state are the ENTRY anchor. supplied_at_tier_anchor
#   and state_at_tier_anchor belong to the RETIRED five-piece rule, kept for the
#   audit trail and consistent with it, and they are NOT what a spec wears. See
#   method.tier_anchor_rule_is_RETIRED.
#   THE LIVE FIGURES ARE IN data/facts/hit-captured.yaml, per spec and per
#   anchor, generated from the captures and verified against them by just check.
#   This header used to say two rostered specs move from full to short between
#   the anchors, beast_mastery_hunter and protection_warrior. Neither does on
#   the captured sets. Both readings are kept below and only one describes gear
#   anybody wears.
#   A short state is not automatically a claim on loot. Check
#   gap_closeable_by_gems_and_enchants first.
#
# SOURCE  Talents read rank by rank from the 2.4.3 tooltip endpoint at
#   nether.wowhead.com. Caps and conversions from TBC-era sources cross-checked
#   against the wowsims constants. Gear supply computed from the ladders in
#   data/research/epv-workbook per method.gear_set_rule; see
#   method.known_weakness for its bias. Buff policy from data/facts/roster.yaml.
#   What is not settled is in open_questions.
meta:
  computed: 2026-08-08
  anchor: phase_3_entry
  anchors: [phase_3_entry, phase_3_tier]
  tier_anchor_computed: 2026-08-08

assumptions:
  racials_assumed: false
  group_buffs_assumed: true
  consumables_assumed: false
  gems_and_enchants_counted: false
  improved_faerie_fire_assumed: true
  improved_faerie_fire_ruling: >-
    RULED IN by the guild lead on 8 August 2026: assume Improved Faerie Fire
    throughout. Every physical target therefore drops by 48 rating, and
    retribution_paladin, beast_mastery_hunter and protection_warrior move from
    short to full. Each of those three carries state_before_improved_faerie_fire
    so the earlier reading stays visible. It remains melee and ranged hit only.
    It grants no spell hit until patch 3.0.2, so no caster benefits.
  note: >-
    Gems and enchants are excluded from every supplied figure below because the
    ladder does not fix them. They are a real and discretionary hit budget, and
    it is large enough to close most of the short calls in this file. It is
    quantified under discretionary_hit_budget below. Read that block before
    treating any short state as a structural gap.

# Hit reachable WITHOUT changing an equipped item. Verified 8 August 2026 by an
# exhaustive sweep of the 2.4.3 item and spell data rather than from guides.
#
# This block does not change any state below. States are computed from the
# ladder, which is the auditable basis. This is what tells the council whether a
# short state is a real claim on hit-bearing loot or a player's own housekeeping.
discretionary_hit_budget:

  physical:
    gems_per_socket: 10
    gem: Rigid Lionseye, epic, Phase 3. Rigid Dawnstone at 8 is the rare fallback.
    hybrid_gem: >-
      Glinting Pyrestone, item 32220, epic, Phase 3. Plus 5 hit and plus 5
      agility, matches a red or a yellow socket. Verified at the tooltip
      endpoint. Named because a pure hit gem is rarely what a player actually
      sockets, so a supply figure built only on Rigid Lionseye overstates what
      is given up to reach a cap.
    enchants:
      - name: Glyph of Ferocity
        slot: head
        rating: 16
      - name: Enchant Boots - Surefooted
        slot: boots
        rating: 10
    enchant_total: 26
    ceiling: 116
    realistic: 50 to 70
    note: >-
      Ceiling assumes nine usable sockets, all gemmed for hit, which nobody
      does. The realistic figure is hit enchants plus three or four hit gems.
      There is NO melee hit glove enchant in TBC. Enchant Gloves - Precision
      is a Wrath enchant and does not exist in 2.4.3.
    confidence: good

  spell:
    gems_per_socket: 10
    gem: Great Lionseye, epic, Phase 3. Great Dawnstone at 8 is the rare fallback.
    hybrid_gem: >-
      Veiled Pyrestone, item 32221, epic, Phase 3. Plus 5 spell hit and plus 6
      spell damage, matches a red or a yellow socket. Verified at the tooltip
      endpoint.
    enchants:
      - name: Enchant Gloves - Spell Strike
        slot: gloves
        rating: 15
      - name: Glyph of Power
        slot: head
        rating: 14
    enchant_total: 29
    ceiling: 119
    realistic: 50 to 70
    note: >-
      Enchant Boots - Surefooted supplies melee hit and is worthless to a
      caster, so casters have one fewer enchant slot than the physical column
      suggests.
    confidence: good

  hunter_only:
    name: Biznicks 247x128 Accurascope
    slot: ranged weapon
    rating: 30
    note: >-
      Engineering scope, a permanent weapon augment. Thirty ranged hit for a
      hunter is most of the gap on the beast_mastery_hunter entry by itself.
    confidence: good

  consumables:
    physical: Spicy Hot Talbuk, 20 hit rating, melee and ranged.
    spell: >-
      NONE. No food, elixir, flask or potion in TBC grants spell hit. Hit rating
      and spell hit rating are separate item stats until patch 3.0.2. This
      asymmetry falls entirely on arcane_mage, which is one of the two specs
      called short here.
    defense: >-
      Flask of Fortification, item 22851. Plus 500 maximum health and plus 10
      defense rating for two hours, and it persists through death. Verified at
      the tooltip endpoint. This is the only consumable in TBC that supplies
      defense rating, and it is relevant to every tank entry below that treats
      crit immunity as the binding constraint. Note the opposite case: Insane
      Strength Potion, item 22828, REMOVES 75 defense rating for 15 seconds.
    note: Not assumed, per assumptions.consumables_assumed. Recorded for the asymmetry.
    confidence: good

  no_route:
    - No meta gem grants hit.
    - No prismatic gem and no way to add a socket to any item exists in TBC.
    - >-
      No general-purpose cloak, bracer, chest, weapon, ring, shoulder or leg
      enchant grants hit. Two class-locked leg exceptions exist and are recorded
      under class_locked_hit_levers. They are deliberately excluded from
      enchant_total above, because they are not additive.
    - No belt buckle and no belt augment of any kind exists in TBC.
    - Enchant Ring - Striking is weapon damage, not hit. It is a common misread.

  # Not supply. Every other entry in this block is hit gained without giving
  # anything up: the gem was going to be socketed and the food eaten regardless.
  # These two displace a leg enchant and return less than they take.
  class_locked_hit_levers:
    levers:
      - name: Falcon's Call
        item_id: 19785
        class: hunter
        grants: 24 ranged attack power, 10 stamina, 10 hit rating
        slot: a leg or head slot item
        displaces_on_legs: Nethercobra Leg Armor, 50 attack power and 12 crit rating
        net_trade: minus 26 attack power and minus 12 crit rating, for 10 hit and 10 stamina
        source: >-
          Zanza the Restless in Zul'Gurub. Zandalar Tribe Friendly, a Primal
          Hakkari Idol and the Hunter voodoo doll. Verified live in 2.4.3 at
          the item tooltip endpoint. The quest was removed in patch 4.0.3a,
          after TBC, and Zul'Gurub is a level 60 raid that is trivial at 70.
      - name: Presence of Sight
        item_id: 19787
        class: mage
        grants: 18 to all healing and damage spells, 8 spell hit rating
        slot: a leg or head slot item
        displaces_on_legs: Runic Spellthread, 35 spell damage and healing and 20 stamina
        net_trade: minus 17 spell damage and minus 20 stamina, for 8 spell hit
        source: Zanza the Restless in Zul'Gurub. Same gating as Falcon's Call.
    head_slot_note: >-
      Head and legs are separate enchant slots, so a hunter can hold Glyph of
      Ferocity on head and Falcon's Call on legs at once. But both ZG enchants
      are strictly dominated in the head slot: Glyph of Ferocity beats Falcon's
      Call on attack power and on hit, and Glyph of Power beats Presence of
      Sight on spell damage and on spell hit. The only sane configuration is
      the Glyph on head and the ZG enchant on legs.
    verdict: >-
      Both are losing trades on raw throughput and are correct only where the
      last fraction of a percent crosses a hard cap. This bears most on
      arcane_mage, which is called short here and has no spell hit consumable
      of any kind, so Presence of Sight is the only lever that spec has beyond
      gems and enchants.
    confidence: good

# Level 70 attacker against a level 73 raid boss. Verified 8 August 2026 against
# Warcraft Wiki, Wowhead TBC Classic and Icy Veins TBC Classic. These are TBC
# figures. The rating denominators differ in Wrath and every one of these
# numbers is wrong at level 80.
conversions:
  melee_ranged_hit_rating_per_percent: 15.77
  spell_hit_rating_per_percent: 12.62
  expertise_rating_per_skill_point: 3.94
  defense_rating_per_skill_point: 2.37
  expertise_percent_per_skill_point: 0.25
  rounding: >-
    A percent figure converted to rating in this file is rounded UP to the
    next whole point, because rating is carried in whole points and rounding
    down would print a figure that falls short of the percent it stands for.
    So the 3 percent of Improved Faerie Fire is credited at 48 rating, from 3
    times 15.77 equals 47.31, and every net target below is the ceiling of
    its arithmetic: 95 is 6 times 15.77 equals 94.62 rounded up, 165 is 13
    times 12.62 equals 164.06 rounded up. The rounding was previously applied
    without being stated anywhere, and one figure, the Protection Paladin
    spell target, had been rounded down instead; it is corrected in place
    with the old figure recorded beside it. haste.yaml states its own
    treatment of the one figure, the 788 global cooldown floor, that does not
    follow this rule.

raw_caps:
  melee_special:
    percent: 9
    rating: 142
    note: >-
      Applies to yellow attacks and to white swings with a single weapon. Base
      miss itself is not this file's figure: it lives in crit.yaml under
      attack_table.entries.miss_single_weapon, measured at 8.0 percent, and
      the first percent of hit is suppressed, per
      attack_table.entries.hit_cap_versus_miss there, which is why nine
      percent of hit is what removes an 8.0 percent miss. Until 9 August 2026
      this note asserted "true base miss is 8.6 percent", a wiki-era figure
      crit.yaml measures against and rejects. Nine percent is the figure every
      TBC guide gears to and it is what the workbook's second column is built
      against; no target in this file moves.
    confidence: high

  melee_white_dual_wield:
    percent: 28
    rating: 442
    note: >-
      Nine percent base plus the nineteen percent dual-wield penalty. It is not
      a gearing target: no TBC gear set reaches it, so dual-wielders stop at the
      special-attack cap. It is recorded because it is the reason the hit-capped
      column overstates the case for a dual-wielder. See
      open_questions.dual_wield_column_overstatement.
    confidence: good
    evidence: corroborated_secondhand

  ranged:
    percent: 9
    rating: 142
    note: Same table as melee special attacks. Hunters gear to this.
    confidence: high

  spell:
    percent: 16
    rating: 202
    note: >-
      Base spell miss against a level 73 target is seventeen percent, and one
      percent is unavoidable, so sixteen percent is the reachable floor. The 202
      figure already accounts for that floor.
    confidence: high

  # TWO EXPERTISE FIELDS, AND THEY ARE NOT ADDED TOGETHER BY ANY TOOL.
  #
  # `supplied_expertise` on a spec is what the GREEDY WORKBOOK SET collects,
  # which is gear and nothing else. It shares its lineage with
  # `supplied_at_p3_entry`, and the Retribution note in this file describes it
  # in exactly those terms: "the greedy set collects 73 expertise and only 71
  # hit". Talent expertise has never been inside it.
  #
  # `talent_expertise` is what the build supplies before any gear. It is
  # recorded separately rather than folded in, because folding it in would put
  # two different measurements behind one number, and a reader asking why a
  # figure changed would get "the gear moved" and "we credited a talent" at
  # once. This project has already been bitten by that shape of error, when one
  # card carried two different entry percentages from two different rules.
  #
  # ADD THEM YOURSELF when you want a total against the thresholds below, and
  # say which you did. Nothing in the toolchain consumes either field today.
  expertise_removes_dodge:
    skill: 26
    rating: 103
    note: Boss dodge is 6.5 percent; one expertise skill point removes 0.25 percent.
    confidence: high

  expertise_removes_parry:
    skill: 56
    rating: 221
    note: >-
      Boss parry is 14 percent, and it applies only from the front, so this
      threshold is a tank concern and is dead value for every spec attacking
      from behind. Expertise rating converts in whole skill points and rounds
      down, so partial rating is wasted.
    confidence: high

# Which specs fight with two weapons. It decides whether the dual-wield white
# cap in raw_caps applies to a spec, which is the difference between hit above
# the special-attack cap being dead weight and it still buying accuracy on every
# swing. Three specs in this roster, and no build choice changes the list.
dual_wield_specs: [combat_rogue, fury_warrior, enhancement_shaman]

# What the roster's group assignments actually supply. This is a short list.
group_buffs:
  - name: Totem of Wrath
    supplies: spell_hit
    percent: 3
    rating_equivalent: 38
    also_supplies: 3 percent spell crit
    scope: party, 20 yards
    applies_to: [affliction_warlock, destruction_warlock, elemental_shaman,
                 balance_druid]
    note: >-
      CORRECTED 9 August 2026 FOR THE BALANCE DRUID. roster.yaml g3 holds three
      warlocks, the Elemental Shaman and the Balance Druid, so all of them
      receive this and the shaman drops it for itself. The wording here excluded
      the druid, and it was written before the groups were filled in. The Arcane
      Mages and the Shadow Priest sit in g4, whose shaman is a Restoration
      Shaman and drops no Totem of Wrath, so they receive nothing. This is the
      single largest caster-side consequence of the roster's group assignments.
      PARTY ONLY, and the beneficiary must stand within 20 yards of the totem.
      Raid-wide totems are a Wrath change. A model that treats this as raid-wide
      would hand the Arcane Mages 38 rating they do not have, and the mages are
      one of the two specs called short in this file.
    confidence: high

# Named so that nobody reintroduces them by accident.
assumed_buffs:
  - name: Improved Faerie Fire
    supplies: melee_and_ranged_hit
    percent: 3
    rating_equivalent: 48
    source: Balance tree, tier 7, 3 ranks. Target debuff, benefits the whole raid.
    ruling: >-
      ASSUMED, by the guild lead on 8 August 2026, and recorded in roster.yaml.
      Crediting it moves retribution_paladin, beast_mastery_hunter and
      protection_warrior from short to full.
    correction_that_travels_with_it: >-
      In TBC this talent grants melee and ranged hit ONLY. It does not grant
      spell hit until patch 3.0.2, so arcane_mage gets nothing from it and
      remains short. Any model crediting casters with it is applying a Wrath
      behavior to 2.4.3.
    confidence: good
    evidence: two_independent_sources

not_assumed:
  - name: Heroic Presence
    supplies: physical_hit
    percent: 1
    scope: party, 30 yards
    held_by: Draenei Warriors, Paladins and Hunters
    reason: >-
      Racial. Excluded by the guild lead's ruling. Melee and ranged hit only; it
      grants no spell hit in TBC.
    confidence: high

  - name: Inspiring Presence
    supplies: spell_hit
    percent: 1
    scope: party, 30 yards
    held_by: Draenei Priests, Shamans and Mages
    reason: >-
      Racial. Excluded by the guild lead's ruling.
      VERIFIED TO EXIST, at the spell-data level rather than on trust: Heroic
      Presence and Inspiring Presence are two distinct TBC Draenei party auras
      held by different classes. The two were merged into one racial in patch
      3.0.2 and the TBC spell id is reused under the other name in the Wrath
      database, which is a trap that makes Inspiring Presence look like it
      never existed.
    confidence: high

  - name: Misery
    supplies: nothing
    reason: >-
      The TBC version increases spell damage taken by five percent at rank 5. It
      grants no spell hit. The three percent spell hit version is patch 3.0.2.
      Checked at the spell-data level: the TBC spell carries no hit-chance aura.
      Recorded so it is never credited here. The Shadow Priest IS rostered, so
      this one matters. Misery is a five percent spell DAMAGE amplifier in
      2.4.3, not a hit debuff. It does nothing for arcane_mage, which stays the
      only caster short of its spell hit cap. Verified at all five ranks,
      spells 33191 to 33195, each reading "cause the target to take an
      additional N% spell damage" with no hit component.
    confidence: high

  - name: Spicy Hot Talbuk
    supplies: physical_hit
    rating: 20
    reason: >-
      Consumable, not a buff, and consumables are not assumed. Recorded because
      of an asymmetry the two short calls in this file turn on: TBC has a food
      granting 20 physical hit rating, and it has NO spell hit consumable at
      all. Hit rating and spell hit rating are separate item stats until patch
      3.0.2. So retribution_paladin can close most of its 24-rating gap by
      eating, and arcane_mage has no equivalent route and must gem for it.
    confidence: good

  - name: any expertise buff, debuff or consumable
    supplies: nothing
    reason: >-
      None exists in TBC. Boss dodge and parry are countered by expertise on
      gear alone. Recorded so that no future model looks for one.
    confidence: good

# How supplied_at_p3_entry was produced. Read this before trusting a figure.
method:
  supplied_hit_source: >-
    The workbook ladders DO carry a per-item hit rating column, reliably, on all
    eighteen non-healer tabs. The four healer tabs carry no hit column, which is
    correct because healing spells cannot miss. So supplied hit is determinable
    from this source and no figure below is invented.
  gear_set_rule: >-
    Reproduces every supplied_at_p3_entry figure below. It was re-derived and
    re-verified on 8 August 2026 against all eighteen non-healer tabs. Season 3
    is excluded by date. Season 2 is included because it is obtainable in launch
    week, per the framework's launch-week PvP baseline.
    STEP 1, READ THE TAB. Column positions are not fixed and must be discovered.
    Row 2 carries the labels Item, EPV, If Hit Capped, Location and Phase. EPV
    and If Hit Capped stand directly above their data. The Phase data sits one
    column to the RIGHT of the Phase label, because the boss column between
    Location and Phase carries no label. The four healer tabs have no If Hit
    Capped column, so every column after EPV shifts one to the left there.
    STEP 2, READ EACH SECTION HEADER. A section header row carries the slot name
    in column 2 and nothing else through column 10. The stat labels for that
    section, hit among them, start at column 11 or 12 of the SAME row. The stat
    columns are defined PER SECTION, not per tab. A parser that fixes one hit
    column for a whole tab reads the weapon sections wrong, because the weapon
    sections carry a different stat list from the armor sections. This is the
    single fact that makes the figures below reproducible.
    STEP 3, SELECT ELIGIBLE ROWS. A row is an item if it carries a name in
    column 2 and a quality in column 4. It is eligible if its Phase cell reads
    1 or 2. Do NOT require a rank number: the Ranged section of the Arms tab and
    the tail of the Two Hand section on the Owl and Shadow tabs carry items with
    an empty rank cell, and dropping them is silent data loss.
    STEP 4, BUILD THE SET. Take the highest-EPV eligible item in each of Head,
    Neck, Shoulders, Back, Chest, Wrist, Hands, Waist, Legs and Feet. Take the
    two highest in Ring. Take the two highest in Trinket. Take the highest in
    Ranged where the tab has a Ranged section.
    STEP 5, RESOLVE THE HANDS. This is what "a weapon set matched to the spec"
    means, stated so that two people get the same answer. Build every hand
    configuration the tab supports and keep the one with the greatest total EPV.
    The configurations are: best Main Hand plus best Off Hand, where the tab has
    a Main Hand section; best One Hand plus best Off Hand, where the tab has
    both; the two highest One Hand items, ONLY where the tab has no Off Hand
    section; and best Two Hand. A caster never takes two One Hand items, because
    no caster dual wields, and the Off Hand section on those tabs is the held
    off-hand rather than a weapon.
    STEP 6. Sum the hit column of the chosen items. That is
    supplied_at_p3_entry.
  tier_anchor_rule_is_RETIRED: >-
    RETIRED 9 August 2026. Every supplied_at_tier_anchor figure below was
    produced by tier_anchor_rule, which swaps in all five Tier 6 pieces. The
    guild lead ruled that no spec wears five Tier 6 pieces four to six weeks
    into the phase, and data/facts/progression.yaml now records why: shoulder,
    legs and chest sit behind Mother Shahraz, the Illidari Council and Illidan,
    none of which are reachable in that window.
    THE FIGURES BELOW ARE KEPT, NOT DELETED, and they are not wrong for what
    they measure. The rule is a controlled comparison: hold every other slot
    still and change only the tier set, so the movement is attributable to the
    tier set and nothing else. That question is still worth an answer, and the
    answer is still reproducible from the workbook. What the figures may NOT be
    read as is what a spec wears.
    WHAT A SPEC WEARS IS NOW CAPTURED PER SPEC, from published gear lists
    downgraded to the four-to-six-week window, in
    data/facts/sim-profiles/hit-capture, rolled up by
    tools/extract_hit_captures.py into data/facts/hit-captured.yaml. That file
    carries three figures per spec rather than one, because the head token sits
    behind Archimonde and its availability cannot be assumed either way.
    THE CORRECTIONS ARE LARGE AND THEY RUN BOTH WAYS, and this block no longer
    quotes them. It used to, and every captured figure it quoted went stale
    within the day: protection_warrior was written as rising to 192 and now
    reads 156, protection_paladin as rising to 81 and now 42. Neither was wrong
    when written. The captures behind them were repaired repeatedly, for a tank
    set that turned out to be a damage set, a shoulder priced for the wrong
    class, gear unreachable at the anchor wearing it, and a head slot the
    workbook ranks first and a parser note taught everyone to skip.
    A FIGURE COPIED HERE IS A SECOND COPY, AND THE SECOND COPY GOES WRONG.
    data/facts/hit-captured.yaml is the one place the captured figures live,
    per spec and per anchor, and just check verifies it against the captures it
    was built from. docs/framework.md took this same fix for the same reason.
    What is stable and worth stating is the SHAPE: the retired rule has
    protection_warrior and protection_paladin collapsing, and the captured sets
    have both RISING, because the rule admitted no Phase 3 off-piece and a real
    set is mostly off-pieces.
    NO RECORDED MOVEMENT SURVIVED, and beast_mastery_hunter is the reason to
    say it plainly. Both this file and the captures had it falling from full to
    short between the anchors, agreeing for the reason the retired rule
    identified: Gronnstalker's Armor carries no hit on any piece, which is true
    and was verified piece by piece.
    THE MECHANISM WAS REAL AND THE CONSEQUENCE WAS NOT. The capture had also
    taken a neck and a waist carrying no hit where the workbook ranked
    hit-bearing alternatives above them, and the two together made a tier set
    with no hit look like a tier set that could not reach the cap. Corrected on
    9 August 2026, the spec reads full at every anchor.
    A true mechanism is not a finding until the set it acts on is right.
  tier_anchor_rule_RETIRED: >-
    RETIRED. See tier_anchor_rule_is_RETIRED above for why, and read this only
    to reproduce the figures it produced.
    Produces every supplied_at_tier_anchor figure below. It is the second of
    the two gear anchors the framework defines, and it isolates what the tier
    set alone does to a cap position.
    STEP 1. Build the Entry set exactly as gear_set_rule above builds it, on
    the same tab, with the same per-section stat columns and the same hand
    resolution. Every step of that rule applies unchanged.
    STEP 2. Read the spec's Tier 6 set from data/facts/tokens.yaml, block
    spec_to_set, key 6, then read that set's five piece ids from the sets block
    of the same file. The five slots are head, shoulder, chest, hands and legs.
    STEP 3. REPLACE the Entry item in each of Head, Shoulders, Chest, Hands and
    Legs with the tier piece for that slot, matched in the ladder by the item
    id in its Wowhead link rather than by name, because names repeat across
    tiers. Every tier piece carries Phase 3 in the ladder. All ninety pieces
    resolve on the tabs, so no figure below rests on an absent row.
    STEP 4. Leave EVERY other slot at its Entry item. No off-piece from Mount
    Hyjal or Black Temple enters this set, by design: a hit-bearing off-piece
    would mask the movement the anchor exists to expose. The neck, back, wrist,
    waist, feet, rings, trinkets, ranged slot and weapons are therefore the
    same items at both anchors, and every difference between the two figures is
    the tier set and nothing else.
    STEP 5. Sum the hit column of the chosen items, at each section's own hit
    column. That is supplied_at_tier_anchor. For protection_paladin the spell
    hit column of the Tank tab is summed the same way and recorded separately
    as supplied_spell_hit_at_tier_anchor, exactly as at Entry.
    STEP 6. Compare against the SAME net_target_rating as at Entry. The target
    does not move between anchors; only supply moves. Improved Faerie Fire is
    credited on the physical specs at both anchors, per the ruling in
    assumptions, and is credited on no caster.
  tier_anchor_set_bonuses: >-
    NO Tier 6 set bonus supplies hit, on any set any rostered spec wears. Every
    2-piece and 4-piece string in data/facts/tokens.yaml was read for the
    thirteen Tier 6 sets used here, and each one is a mana cost, a resource
    gain, a duration, a threat figure or a damage or healing percentage. So
    every difference between the two anchors below is item hit rating and
    nothing else, and no figure hides a bonus inside it. The nearest case is
    Skyshatter Regalia, whose 2-piece bonus supplies spell critical strike
    rating and spell damage while the totems are up. It supplies no hit and is
    not counted.
  tier_set_hit_totals: >-
    The hit carried by each spec's own Tier 6 set, summed over its five Phase 3
    pieces at that spec's tab. This is the hit-heavy against hit-light axis,
    and it is what decides which specs move.
    Skyshatter Harness 80, Malefic Raiment 95, Thunderheart Regalia 76,
    Skyshatter Regalia 67, Tempest Regalia 66, Absolution Regalia 51,
    Slayer's Armor 48, Onslaught Battlegear 30, Thunderheart Harness 27,
    Lightbringer Battlegear 21, Gronnstalker's Armor 0, Onslaught Armor 0 and
    Lightbringer Armor 0.
    Three sets carry NO hit at all, and all three are worn by specs whose
    state or margin turns on it: Gronnstalker's Armor by both hunters,
    Onslaught Armor by protection_warrior and Lightbringer Armor by
    protection_paladin.
  gear_set_rule_addenda: >-
    Two things a reader must add to gear_set_rule above to reproduce the
    figures. Both were found while computing the Tier anchor, and both were
    confirmed by re-running the rule against all eighteen non-healer tabs,
    which then returns every supplied_at_p3_entry figure exactly.
    FIRST, a section header row also has an EMPTY rank cell in column 1. Step 2
    identifies a header by a name in column 2 with nothing through column 10,
    and three rows in the Head block of the Cat tab match that test as well:
    the quarantined "Yes, its that good." row, the "0" row below it, and the
    blank row after those. A parser that treats them as headers loses the whole
    Head section of that tab and returns 171 instead of 182. Test the rank cell
    as well as the name.
    SECOND, the file names of two tabs invert the reading a name suggests.
    Prot.csv is the PROTECTION WARRIOR tab and Tank.csv is the PROTECTION
    PALADIN tab. Prot.csv ladders Destroyer pieces, which are Warrior Tier 5,
    and Tank.csv ladders Crystalforge pieces, which are Paladin Tier 5, and the
    row counts match the ladder_second_column_coverage denominators already
    recorded on those two entries, 225 and 210. Reading them the other way
    round swaps both specs' figures.
  workbook_annotations_found_2026_08_09: >-
    Two things the workbook says about itself, found by an off-piece audit and
    easy to miss because both sit in cells a parser is taught to skip.
    FIRST, A THIRD PARSER TRAP. The Off Hand section header on Rog.csv carries
    "offhand hit value wrong, will fix soon" in column 6. That defeats the
    header test in gear_set_rule STEP 2, which identifies a header by a name in
    column 2 with nothing through column 10, so a parser loses the whole Off
    Hand section of the Rogue tab. It is the same shape as the "Yes, its that
    good." trap already recorded below.
    It is ALSO a source caveat, and a narrow one. It marks the workbook's own
    off-hand HIT column as wrong, so any EPV comparison between two off-hands
    on that tab is unreliable. It does NOT touch any supplied figure in this
    repository, because the captures read hit from data/facts/items.csv by item
    id and never from the workbook.
    SECOND, ONE TRINKET IS PRICED AS A RAID BUFF. Solarian's Sapphire is
    written on the Arms tab as "Solarian's Sapphire (Group AP Buff)" and scores
    159.08. That figure prices what the trinket gives the GROUP, not what it
    gives the wearer, so ranking it against a personal trinket compares two
    different quantities. Any slot where a group-buff row outranks a personal
    one needs reading rather than sorting.
    MEASURED 2026-08-09, so this is no longer an inference. The workbook attack
    power cell on that row reads 350, which is exactly 5 times the 70 of
    Improved Battle Shout, and the item's only static stat in items.csv is 30
    stamina. A five-man total is sitting in a per-wearer ranked column. A sweep
    of all eighteen tabs found 24 such rows and only four such items: Solarian's
    Sapphire (30446) and the three Jewelcrafting necks Braided Eternium Chain
    (24114), Eye of the Night (24116) and Chain of the Twilight Owl (24121).
    None appears on the Bear tab, the Tank tab or the four healer tabs. The
    three necks are priced per member and counted once, which is a different
    convention again, so they are not settled by this measurement.
  known_weakness: >-
    A greedy-EPV set is a proxy for realistic gear, not a statement of it, and
    it is a biased proxy in a specific direction: the primary EPV column already
    values hit, so gearing greedily by that column over-collects hit relative to
    a player who is at cap. Where a tab prices hit low, as the Arcane and
    Retribution tabs do, the greedy set under-collects it. Treat every supplied
    figure as plus or minus one percent.
  parser_note: >-
    Seven traps in the workbook tabs are now recorded, four of which had to be
    worked around to produce these figures. Any parser reading these tabs hits
    all of them. See
    open_questions.workbook_parsing_traps.

