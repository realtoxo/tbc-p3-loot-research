open_questions:


  protection_paladin_ability_hit_tables:
    blocks: Nothing today. It sharpens one number.
    detail: >-
      Paladin Precision is verified to grant melee AND spell hit in 2.4.3, so
      both of this tank's threat floors are quantified. What remains open is
      which of Holy Shield, Consecration, Avenger's Shield and Judgement resolve
      against the spell table and which against the melee table. The two floors
      are therefore recorded separately rather than merged into one figure. The
      spec is short on both, by a wide margin, so the answer changes no state.

  dual_wield_column_overstatement:
    blocks: Nothing today, but it biases three specs' priorities
    detail: >-
      combat_rogue, fury_warrior and enhancement_shaman are classified full
      against the 142 special-attack cap, which is correct, but the hit-capped
      column prices hit at zero and hit retains real value for them against the
      442 dual-wield white cap. Their hit-bearing off-piece priorities are therefore
      biased low. The two-state model cannot express this; a note on those three
      spec pages can.

  supply_figures_reproducible:
    status: RESOLVED on 8 August 2026. Kept for the audit trail.
    blocks: Nothing. It previously blocked any audit of a state and the Tier anchor.
    detail: >-
      This entry recorded that method.gear_set_rule reproduced only eight of the
      seventeen supplied_at_p3_entry figures, and that five gaps of 18 or 19
      rating had no explanation at all. Both findings were artifacts of how the
      tabs were being read, not defects in the figures.
      TWO CAUSES, both now fixed in method.gear_set_rule.
      FIRST, the stat columns are defined PER SECTION, not per tab. Every
      section header row carries its own stat labels from column 11 or 12
      onward, and the weapon sections use a different stat list from the armor
      sections. Reading one hit column for a whole tab therefore reads every
      weapon section wrong. That is why a fixed column index from 11 to 23
      reproduced nothing: no fixed index CAN be right, because the correct index
      changes within a single tab. This one fact accounts for all five of the
      18 and 19 rating gaps.
      The Bear is the proof. Its Two Hand section labels hit at column 17, while
      its armor sections label hit at column 16. Read at column 17, the best
      Phase 1 or 2 two-hander, Merciless Gladiator's Maul (Feral), item 32014,
      Season 2, carries 18 hit. The zero came from reading the armor column,
      and the 42 seen on the Cat tab is that item's strength, not its hit. The
      entry's own note was right about the cause and wrong only in calling the
      item a staff: it is a mace.
      SECOND, the rule did not say which slots "a weapon set matched to the
      spec" means. It is now stated as an explicit configuration choice by total
      EPV, in method.gear_set_rule step 5, plus the Ranged slot in step 4.
      A third trap was found while doing this and is recorded under
      workbook_parsing_traps: some item rows carry an empty rank cell.
    outcome: >-
      The corrected rule reproduces seventeen of the eighteen non-healer tabs
      EXACTLY, including the unrostered fire_mage at 216: combat_rogue 201,
      arms_warrior 155, fury_warrior 142, feral_cat 182, retribution_paladin 71,
      enhancement_shaman 129, beast_mastery_hunter 106, survival_hunter 110,
      feral_bear 60, protection_paladin 0, protection_warrior 120,
      affliction_warlock 242, destruction_warlock 200, arcane_mage 53,
      balance_druid 217, elemental_shaman 121 and fire_mage 216.
      One figure did not reproduce and was CORRECTED rather than explained:
      shadow_priest, recorded 154, rule returns 162. See that spec's
      correction_note. No coherent variant of the rule returns 154, and fitting
      one to a single number would be worse than naming the error, so it is
      named. The state does not change.
    consequence: >-
      Every supply figure in this file is now audit-proof and re-derivable by
      someone checking our work. No state changed, in either direction. The Tier
      anchor is unblocked, because the Entry anchor now reproduces.

  workbook_parsing_traps:
    blocks: The claim table, not this file
    detail: >-
      Seven traps in the workbook tabs, all reproducible, that any parser of
      these tabs must handle. Recorded here because the figures above were
      produced in spite of them.
      First, workbook scores of 1000 or more carry a thousands separator, so
      float() raises and the row is silently skipped. 171 ladder rows are lost
      this way across five tabs, the highest score surviving is 997.48, and 10
      raid drops lose at least one claim, including Warglaive of Azzinoth,
      Pillar of Ferocity and Cataclysm's Edge. The Fury tab alone loses 89 rows.
      Second, "Main Hand" is absent from the SLOTS set, so every main-hand weapon
      on the Rogue, Fury and Protection Warrior tabs inherits the Ranged section
      above it and is priced against the wrong alternative ladder.
      Third, and the worst of the four, the stat columns are defined PER SECTION
      rather than per tab. Each section header row repeats its own stat labels
      from column 11 or 12 onward, and the weapon sections list a different set
      of stats from the armor sections on the same tab. On the Bear tab hit
      sits at column 16 in the armor sections and at column 17 in Two Hand. On
      the Cat tab it sits at 15 and 17. A parser that fixes one hit column per
      tab reads every weapon row wrong and does so silently, returning either a
      blank, which reads as zero, or the value of a neighboring stat. This trap
      alone produced the whole of the former
      supply_figures_not_reproducible entry.
      Fourth, some item rows carry an empty rank cell. The entire Ranged section
      of the Arms tab is unranked, as is the tail of the Two Hand section on the
      Owl and Shadow tabs. A parser that requires a rank number drops those rows
      without a message. Test on name plus quality instead.
      Fifth, a section header can carry text beyond its own name, which breaks
      the header test above. The Rog tab Off Hand header carries the workbook
      author's note, "offhand hit value wrong, will fix soon", in column 6, so a
      parser testing for nothing through column 10 does not see a header there
      and merges the whole Off Hand section into Main Hand. The note is also a
      statement about the data: every off-hand score on that tab is provisional
      by its author's own admission.
      Sixth, the two dual-wield melee tabs price off hands by DIFFERENT
      conventions, so no off-hand score is comparable across tabs without
      knowing which. The Fury tab repeats each item's Main Hand score unchanged
      in its Off Hand section, so Syphon of the Nathrezim reads 1,737.75 in
      both. The Rog tab reprices its Off Hand section to a scale roughly six
      times smaller, 97 to 227 against 850 to 1,100 in Main Hand, and then its
      hit-capped column returns to the MAIN HAND scale, so Swiftsteel Bludgeon
      reads 204.0 in EPV and 949.23 capped.
      Seventh, weapon sections do not encode hand restrictions, and the same
      item can appear in both the Main Hand and the Off Hand section of one tab.
      Two failures follow, and both were observed. Per-slot independent
      maximization assigns ONE physical drop to TWO slots, which is what
      Syphon of the Nathrezim at Fury main hand rank 2 and off hand rank 1
      produced. It also assigns a main-hand-only weapon to an off hand, which is
      what Talon of the Phoenix, "Main Hand, Fist" in items.csv, produced. Join
      hand legality from items.csv and resolve the PAIR jointly, as step 5 of
      the gear set rule above already does.
