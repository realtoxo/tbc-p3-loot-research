meta:
  captured: 2026-08-13
  source: Wowhead TBC Classic class guides, read in a browser
  why_a_browser: >-
    Wowhead answers a non-browser client with 403 on its loot pages and renders
    the talent calculator client-side on its guides, so neither a plain fetch nor
    a crawler returns the build. The encoded strings below were read from the
    rendered page.
  why_these_builds: >-
    The four healer specs have no usable build in the vendored wowsims checkout:
    the Holy Paladin preset carries an empty talent string, the Priest has no
    healer preset at all, and the Restoration Druid and Restoration Shaman
    presets carry commented-out strings that spend 26 or 27 talents in a tree
    holding 20, so they belong to a later talent revision. These are published
    builds, not this roster's builds. Read them as what a guide recommends until
    the guild lead states what the four healers actually run.
  a_wrong_url_returns_a_wrong_expansion: >-
    /tbc/guide/classes/priest/holy/healer-talent-builds-pve redirects to the
    Mists of Pandaria guide rather than answering 404, and that page renders a
    full set of talents that are not 2.4.3 at all. Every capture below was
    checked by reading the page title for "TBC Classic" before its build was
    taken.
  verified: >-
    Every string was decoded against ui/core/talents/trees/<class>.json in the
    vendored wowsims checkout, and the points it spends per tree reproduce the
    spread the guide states in its own heading.

