the_restoration_druid_answer_depends_on_the_build: >-
  The two Restoration Druid builds disagree completely, and the disagreement is
  the whole question. Tree of Life, which the guide calls the one most commonly
  seen and which spends every point in Restoration, takes NO Lunar Guidance, so
  intellect converts into no spell power at all for that druid. Dreamstate goes
  33 points into Balance specifically to reach Lunar Guidance and Dreamstate,
  and takes it 3 of 3. So a Restoration Druid either converts 25 percent of
  intellect into spell power or none of it, with nothing in between, and which
  one is a fact about the player rather than about the spec. The guild lead has
  to say which this roster's druid runs.
