armor_debuffs_this_raid_supplies:
  note: >-
    Recorded once rather than per boss. These are subtracted from the base armor
    above, and the result is floored at zero, which is why every one of them was
    worth EXACTLY nothing while the boss had no armor.
  sunder_armor_five_stacks: -2600
  faerie_fire: -610
  curse_of_recklessness: -800
  total: -4010
  source: EJ-DAYVE, contemporaneous with the boss measurements
  verified_in_the_simulator: >-
    Confirmed by a clamp sweep on the Retribution Paladin, which self-applies no
    armor debuff: damage is flat as boss armor rises to 4010 and breaks away at
    4020. The three use three separate exclusive-effect categories, so they are
    additive and none double counts. Improved Faerie Fire contributes NO armor in
    2.4.3; it is 3 percent physical hit, and the simulator models exactly that.

sources:
  EJ-DAYWE_TYPO_GUARD: The citation key is EJ-DAYVE. Recorded because a
    transposed spelling would break a reader's search.
  EJ-DAYVE: >-
    Elitist Jerks forum, "[RAID] Boss armor values", thread f31/t16629, post 8 by
    Dayve, Dwarf Warrior of Eternity, Gorgonnash. The boss table was complete for
    Black Temple and Mount Hyjal by 19 October 2007 per the thread's own edit
    stamp. Measured in game by parsing improved Thunder Clap damage, author
    stated accuracy plus or minus 30. Retrieved from
    http://web.archive.org/web/20080728074357/http://elitistjerks.com/f31/t16629-raid_boss_armor_values/
    observed 2026-08-15. It reports 6200 and 7700, which are the class table
    values rounded to two significant figures.
  TBCDB-CLS: >-
    TBC-DB/Database, Archived_Releases/1.4.0/Updates/1.4.3_Updates/003_TBC_ClassLevelStats.sql,
    table creature_template_classlevelstats, column BaseArmor. Level 73: class 1
    is 7684, class 2 is 6194, class 8 is 3878. Retrieved from
    https://raw.githubusercontent.com/TBC-DB/Database/master/Archived_Releases/1.4.0/Updates/1.4.3_Updates/003_TBC_ClassLevelStats.sql
    observed 2026-08-15.
  WOWSIMS-BT: >-
    wowsims/tbc, sim/encounters/black_temple.go at commit
    3301fca59306a747e521274c36e073e69acc7b77 dated 2026-08-06, cited per line as
    WOWSIMS-BT:<line>. All fifteen target definitions carry Level 73. Retrieved
    from https://raw.githubusercontent.com/wowsims/tbc/master/sim/encounters/black_temple.go
    observed 2026-08-15. THIS IS THE LEGACY REPOSITORY, not the simulator this
    project vendors. See cautions.our_simulator_cannot_produce_these_numbers.
  WOWWIKI-DR: >-
    WoWWiki "Damage reduction", revision 509013, 21 February 2007: "For level 70
    enemies, this simplifies to %Reduction = (Armor / (Armor + 10557.5)) * 100."
    https://wowwiki-archive.fandom.com/wiki/Damage_reduction?oldid=509013
    Revision 1489385 of 3 July 2008 adds the warning that the constant derives
    from the attacker's level rather than the target's.
  WT-COUNCIL: >-
    Warcraft Tavern, Illidari Council guide: "He has an extremely low amount of
    armor (~146) and thus will take the most damage out of any target."
    https://www.warcrafttavern.com/tbc/guides/illidari-council/ A modern guide
    rather than an era source, used for magnitude only.

the_strongest_corroboration:
  what: >-
    Dayve's 2007 in-game measurements against the emulator class table he could
    not have seen. Every measured value falls inside his stated plus or minus 30,
    at four levels and both classes.
  table: >-
    Level 70 measured 5475 against class 2 at 5474, and 6800 against class 1 at
    6792. Level 71: 5700 against 5714, and 7100 against 7089. Level 72: 5950
    against 5954, and 7400 against 7387. Level 73: 6200 against 6194, and 7700
    against 7684.
  what_it_means: Independent observation and the emulator table are describing
    the same underlying data. This is as close to settled as the question gets.

cautions:
  the_6600_transcription_error: >-
    Elitist Jerks thread t25877, the armor penetration spreadsheet thread of May
    2008, states that bosses have approximately 6600 or 7700 armor, and the
    documentation for Landsoul's spreadsheet repeats it. The source thread says
    6200. ANY 6600 ENCOUNTERED ANYWHERE IS THIS TRANSCRIPTION ERROR PROPAGATING,
    not a measurement.
  our_simulator_cannot_produce_these_numbers: >-
    The vendored wowsimcli, VERSION v0.0.116 built from wowsims/tbc-new, ships
    encounter presets only for Magtheridon's Lair and Serpent Shrine Cavern. It
    has NO Mount Hyjal and NO Black Temple encounter, so left to itself every
    Phase 3 simulation silently uses the generic level 73 Raid Target at 7685 and
    overstates mitigation by about 5.15 percentage points across the entire 6193
    tier: all five Mount Hyjal bosses, Teron Gorefiend, Mother Shahraz and three
    Illidari Council members. tools/run_sims.py sets the armor itself from this
    file for that reason.
  no_boss_deviates_from_its_class_curve_IN_PHASE_3: >-
    An empirical finding rather than a structural guarantee. The mechanism to
    override a boss's armor exists and was used elsewhere in TBC: Void Reaver
    carries a deliberate ArmorMultiplier of 1.4217, giving 8806 and 45.5 percent.
    No Phase 3 boss does.
