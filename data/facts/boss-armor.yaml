# Base armor for every Phase 3 boss, and the mitigation it applies.
#
# HOLDS   What each boss's armor is, pre-debuff, with the source per row.
# NOT HERE  What a debuff removes from it, which is recorded once at the bottom
#   rather than per boss, and what any spec measures against it, which is
#   data/facts/sim-figures.yaml.
#
# WHY THIS FILE EXISTS AT ALL. Until 15 August 2026 tools/run_sims.py sent the
# target a stats array of forty-eight zeros, so EVERY SIMULATION THIS PROJECT
# HAS EVER RUN WAS AGAINST A BOSS WITH NO ARMOR. Physical specs were inflated
# between 17 and 23 percent, every armor debuff the raid supplies was worth
# exactly nothing, and armor penetration on an item was worth exactly nothing.
# Ruled by the guild lead the same day: model armor PER BOSS, and look the value
# up rather than copy one.

meta:
  ruled: '2026-08-15'
  by: the guild lead
  verbatim: Per boss but we should look up the armor on each boss
  convention: >-
    7684 and 6193, the wowsims convention, and every number below is in it. It
    is preferred over the community 7700 and 6200 because it matches the
    simulator this project vendors, so a sim result and this table cannot
    silently disagree, and because the values are exact integers from the game's
    own class table rather than era measurements rounded to two significant
    figures. The two conventions describe the same data and differ by 0.05
    percentage points of mitigation, which is far below anything that could
    reorder a loot decision. A reader meeting 7700 elsewhere is meeting the same
    fact reported coarsely.
  the_raw_class_value_is_6194: >-
    The class table's level 73 class-2 entry is 6194, and some emulator
    databases yield 6194 for Kaz'rogal and Teron Gorefiend through ArmorMultiplier
    rounding while others yield 6193. The difference is 0.005 percent mitigation.
    6193 is used uniformly here for consistency, and the discrepancy is recorded
    rather than hidden.
  mitigation_formula: >-
    mitigation = armor / (armor + 10557.5), where the constant is
    467.5 times ATTACKER level minus 22167.5, at attacker level 70. THE LEVEL IS
    THE ATTACKER'S, NOT THE TARGET'S. The common error is to use 11960, which is
    the level 73 constant and governs damage the boss deals to a player rather
    than damage a player deals to the boss.
  unit_class_is_inferred: >-
    The class TABLE was verified directly, level 73 class 1 at 7684 and class 2
    at 6194. Twenty individual creature_template rows were NOT read. Each boss's
    class below is inferred backwards from which bucket its measured armor falls
    in, and it says so in its own column rather than presenting an inference as a
    lookup.
  all_figures_are_pre_debuff: Base armor. What the raid's debuffs remove is at
    the bottom of this file, once.

