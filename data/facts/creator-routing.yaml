meta:
  what: Which specs each captured creator remark sends an item TO and which it sends it
    AWAY FROM, read out of the remark rather than inferred from its stance.
  why: 'A stance says whether a creator likes an item. A council needs to know where they
    think it should go, and those are different questions: a remark can speak well of
    an item and still argue three of the four specs that could take it would waste it.'
  produced: '2026-08-13'
  method: A workflow of Sonnet subagents, 40 remarks each, reading only the paraphrase
    already captured in creator-stances.yaml. No transcript was re-read and no new source
    was consulted.
  constraint: An agent could only use the spec strings the remark already named. This
    file rejects any row that names one it did not, so a destination cannot be invented.
  keyed_by: item id, creator and timestamp, never the row number
  time_conditional_remarks_are_left_unrouted: 'A remark that puts an item on a spec now
    and takes it off later routes in both directions, and this file records direction
    rather than timing. One remark does it and it is listed under `rejected`. Ruled 13
    August 2026: it stays unrouted rather than be flattened to one half.'
  remarks: 578
  routed_to_someone: 405
  routed_away_from_someone: 141
  both_directions: 53
  no_routing_stated: 80
  rejected:
  - 'remark 533 routes [''Arms Warrior''] both to and away at once, so it is left unrouted:
    the claim is time-conditional and this file records direction, not timing'
