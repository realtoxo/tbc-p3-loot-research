# How supplied_crit_rating_at_p3_entry was produced. Read this before trusting a
# figure. The method deliberately matches hit.yaml so the two are comparable.
method:
  supplied_crit_source: >-
    The workbook ladders carry a per-item crit rating column on every damage tab
    and on three of the four healer tabs. Two tabs carry no crit column at all
    in their armor sections and those are recorded per spec below rather than
    silently zeroed.
  gear_set_rule: >-
    Highest-EPV item per slot restricted to items whose workbook Phase column is
    1 or 2, two rings, two trinkets, and the weapon set the tab prices. Identical
    to hit.yaml's rule, so the two files describe the same hypothetical player.
  what_the_figure_is_not: >-
    IT IS NOT TOTAL CRIT. It is crit RATING from gear only. It excludes class
    base crit, crit from agility or intellect, crit from talents, crit from
    buffs, and crit from gems, enchants and consumables. Every per-spec entry
    below therefore also records the greedy set's agility or intellect, so that
    a reader does not mistake a low rating figure for a low crit chance. The
    Combat Rogue is the clearest case: 118 crit rating looks thin until the 333
    agility beside it is read, which is another 8.3 percent.
  parser_note: >-
    The workbook's section header rows are truncated when trailing stat columns
    are empty, and three tabs carry item rows with no rank number. A parser that
    keys sections on the rank column or on header length silently misreads them,
    which produced two wrong Arms Warrior figures before the discriminator was
    changed to the presence of a Wowhead URL on the row. Recorded so the defect
    is not rediscovered.
  known_weakness: >-
    A greedy-EPV set is a proxy for realistic gear and it is biased: a tab that
    prices crit highly over-collects it and a tab that prices crit low
    under-collects it. Treat every supplied figure as plus or minus 50 rating.
    No conclusion in this file turns on the third significant figure, because
    every distance to every cap is measured in tens of percentage points.

specs:

  # ---- Melee damage -------------------------------------------------------

  - id: combat_rogue
    role: melee_dps
    weapon_configuration: dual_wield
    cap: melee_white_dual_wield
    white_cap_percent_at_special_hit_cap: 50.5
