# How crit's value moves. Mechanics only. This section states what makes a point
# of crit worth more or less to a spec; it assigns no priority to any spec and
# ranks nothing.
valuation_mechanics:

  approaching_a_cap:
    melee_white: >-
      Value falls to zero at the cap, discontinuously, not gradually. Below the
      white cap a point of crit is worth its full linear value. At the cap the
      next point of crit is worth exactly nothing on white swings. There is no
      taper. None of the four simulated specs is inside 18 points of its white
      cap at Phase 3 gear on the basis stated under simulated_figures; the
      other melee specs have no simulated figure, so no distance is stated for
      them. This is recorded as the mechanism rather than as a live condition
      on anybody. This sentence
      used to say "no rostered spec is inside eleven percentage points", a
      figure that matched neither comparison basis; see
      correction_9_august_2026 under simulated_figures.
    partial_exposure: >-
      A dual-wielder at the white cap still gains full value from crit on every
      yellow attack, so the added value of crit falls by the white share of
      damage rather than to zero. The white share is the quantity that decides
      how much is lost and it is not computed in this repository.
    hit_and_expertise_interaction: >-
      Hit rating and expertise both RAISE the crit cap, because both remove
      entries that sit above crit on the table. A spec at its white cap gains
      crit cap headroom from hit and expertise it would otherwise call dead.
      This is the mechanical reason hit.yaml holds three dual-wield specs at
      Conservative confidence rather than calling their surplus hit worthless.
    spell_and_ranged: >-
      No cap exists for spells and none exists for ranged, because both resolve
      on two rolls. Crit value is linear across the whole range for those specs
      and no threshold effect can arise.

  what_raises_crits_value_for_a_spec:
    - >-
      A crit-damage multiplier talent. Ruin doubles Destruction crit damage and
      Vengeance doubles Balance crit damage, so a point of crit buys twice the
      damage for those specs that it buys for a spec with no multiplier.
      Predatory Instincts, Impale and Lethality are the physical equivalents.
    - >-
      A proc that keys off crit. Every crit becomes a second effect as well as a
      damage event. Illumination returns mana on a Holy Paladin's critical heal;
      Seal Fate converts a Rogue's critical strike into an extra combo point;
      Primal Fury converts a Bear's critical strike into rage and a Cat's into a
      combo point; Flurry keys off crit for Warriors and Shamans; Deep Wounds
      keys off crit for Warriors; Improved Shadow Bolt keys off a Warlock's
      Shadow Bolt crit; Rampage cannot even be started without a crit. For these
      specs crit carries resource generation, haste or a raid debuff on top of
      damage.
    - >-
      A rotation dominated by attacks the cap does not touch. A spec whose
      damage is mostly yellow is unaffected by the white cap.

  what_lowers_crits_value_for_a_spec:
    - >-
      Damage that cannot crit. Periodic damage over time ticks CANNOT crit in
      TBC. This is the largest single crit-value fact in the file for the
      Affliction Warlock, whose damage is mostly DoTs, and for the Restoration
      Druid, whose healing is mostly heal over time. Marked NOT VERIFIED below
      per spec, because the list of exceptions was not checked spell by spell.
    - >-
      Proximity to a cap, which in TBC applies only to white melee swings and
      applies to no rostered spec at Phase 3 gear. Recorded as a mechanism
      rather than as a live condition.
    - >-
      Absence of any crit-keyed proc or crit-damage talent, which leaves crit
      worth exactly its linear damage contribution and no more.

  dot_and_hot_crit:
    can_periodic_ticks_crit_in_tbc: false
    status: verified
    rule: >-
      Periodic damage and periodic healing CANNOT critically strike in 2.4.3.
      A spell carrying both a direct and a periodic component crits on the
      DIRECT component only. That covers Moonfire, Immolate, Flame Shock, Rake,
      Lacerate, Regrowth and Holy Fire.
    evidence: >-
      A 2008 capture of the WoWWiki damage over time article states it directly.
      Patch 3.0.2 then proves it retroactively by announcing "Mind Flay can now
      periodically critically hit" and "Prayer of Mending: This spell can now
      critically hit", which are only news if they could not before.
    exceptions_that_matter_here:
      - name: Arcane Missiles
        spec: arcane_mage
        detail: >-
          EACH MISSILE ROLLS CRIT INDIVIDUALLY. The missiles are flagged as
          direct damage rather than as periodic ticks, so Arcane Missiles is
          fully exposed to crit despite looking like a channelled periodic
          effect. Confirmed in a 2008 WoWWiki capture and in the wowsims TBC
          implementation.
      - name: Seed of Corruption detonation
        spec: affliction_warlock
        detail: >-
          The explosion CAN crit, at the 1.5 spell multiplier. Ruin does not
          apply to it. The seed's own periodic component cannot crit.
      - name: Chain Lightning and Chain Heal
        spec: [elemental_shaman, restoration_shaman]
        detail: Each bounce rolls crit independently.
      - name: Extra-attack procs
        detail: >-
          Windfury and Sword Specialization extra swings roll crit normally and
          a Windfury proc that crits triggers Flurry. Paladin Reckoning is NOT
          VERIFIED and is inferred only.
    other_things_that_cannot_crit:
      - Consecration and Holy Shield, which is why the Protection Paladin tab prices no crit
      - Lightning Shield orbs, despite being direct damage
      - Prayer of Mending and the Power Word Shield absorb
      - Blizzard, Volley, Rain of Fire, Hellfire, Hurricane and Tranquility
      - Mind Flay, Devouring Plague and Shadow Word Pain
      - Serpent Sting, which is why hunter crit does not reach it
      - Rogue Rupture and Garrote, and Deep Wounds itself for warriors
    poison_and_school_traps:
      - >-
        Rogue Instant Poison and Wound Poison CAN crit, but they roll against
        SPELL crit at the 1.5 multiplier. A rogue has effectively no spell crit,
        so melee crit rating does nothing for them. Envenom is the exception and
        crits off melee crit at 2.0.
      - >-
        Warrior Thunder Clap rolls against SPELL crit. A warrior has no spell
        crit, so it effectively never crits.
    confidence: good

