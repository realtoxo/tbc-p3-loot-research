# The defensive side. This is a different mechanic from everything above: it is
# the boss critically striking the TANK, not the tank critically striking the
# boss. It was recorded nowhere in this repository as data until now.
tank_defensive_thresholds:

  boss_base_crit_chance_against_a_level_70_tank:
    percent: 5.6
    derivation: >-
      5 percent base against an equal-level target, plus 0.2 percent for each
      level the attacker is above the defender. A level 73 boss against a level
      70 player is 5 plus three times 0.2, which is 5.6.
    confidence: high

  crit_reduction_per_defense_skill_point: 0.04
  crit_reduction_note: >-
    Each point of defense skill above the attacker's weapon skill reduces the
    chance to be critically struck by 0.04 percent. Base defense skill is five
    times the player's level, so 350 at level 70.

  plate:
    applies_to: [protection_paladin, protection_warrior]
    defense_skill_required: 490
    defense_skill_from_base: 350
    defense_skill_from_talent: 20
    defense_skill_from_gear: 120
    defense_rating_required: 284
    defense_rating_required_untalented: 332
    derivation: >-
      5.6 percent of crit to remove, divided by 0.04 percent per defense skill
      point, is 140 skill points. 350 base plus 140 is 490, and that figure does
      not move.
      WHAT MOVES IS HOW MUCH OF IT GEAR HAS TO CARRY. Anticipation supplies 20
      defense SKILL, so the gap gear must close is 490 minus 350 minus 20, which
      is 120 skill points rather than 140. At the exact conversion of 2.365384
      rating per skill point that is 283.85, so 284 rating.
      UNTALENTED THE FIGURE IS 332, from the full 140 points. The 48 rating
      between the two is a little under two thirds of what a Tier 6 helm carries,
      so it is not a rounding difference and it decides whether a tank has to
      spend an item slot on defense.
    rounding_caveat: >-
      This is the second place in this file where the rounded 2.37 changes the
      answer, exactly as the bear threshold below warns. 284 divided by 2.365384
      is 120.06, which floors to 120 and passes. 284 divided by the rounded 2.37
      is 119.83, which floors to 119 and would FAIL. 283 fails on either figure.
      So 284 is correct and it clears the line by six hundredths of a skill
      point. A tank who wants no argument about the conversion carries 285.
    crit_reduction_talent: none
    crit_reduction_talent_note: >-
      Neither spec has a talent that reduces the chance to BE CRITICALLY HIT, the
      way Survival of the Fittest does for the bear. The stance and presence
      based crit immunities that plate tanks receive in later expansions arrive
      in patch 4.0.1 and do not exist in 2.4.3. So the 490 threshold itself is
      untouched, and this entry stays `none`. Anticipation below is a different
      mechanism and the two must not be added together.
    defense_skill_talent:
      name: Anticipation
      grants: defense skill
      ranks: 5
      skill_per_rank: 4
      skill_at_max_rank: 20
      protection_warrior:
        tree: Protection
        tier: 1
        spell_ids_by_rank: [12297, 12750, 12751, 12752, 12753]
      protection_paladin:
        tree: Protection
        tier: 3
        spell_ids_by_rank: [20096, 20097, 20098, 20099, 20100]
      tooltip: >
        > "Increases your Defense skill by 20."
      verified: >-
        Read at every rank from the 2.4.3 tooltip endpoint for both classes, and
        corroborated in the simulator source, where both classes run the same
        line: AddStat(stats.Defense, DefenseRatingPerDefense * 4 * ranks).
      both_classes_have_it: >-
        THE PALADIN HAS THIS TALENT TOO. The brief that commissioned this check
        assumed Anticipation was a Warrior talent and asked what the Paladin had
        instead. It has the same talent, with the same five ranks and the same 20
        skill, differing only in tier, so both plate tanks land on 284 and
        neither has an advantage over the other here.
      other_protection_paladin_talents_checked: >-
        Toughness is armor from items, Sacred Duty is stamina and cooldowns,
        Ardent Defender is a damage reduction below 35 percent health, Holy
        Shield is block chance, and Blessing of Sanctuary is damage reduction and
        retaliation. NONE of the five touches defense skill, defense rating or
        the chance to be critically hit.
      not_the_rogue_talent: >-
        A talent named Anticipation exists for the Rogue in Mists of Pandaria,
        where it banks combo points. It DOES NOT EXIST IN 2.4.3 in any form and
        has nothing to do with defense. A source describing a rogue Anticipation
        is describing a later expansion.
    roster_application: >-
      The Paladin off-tank and the Warrior fourth tank. Both need 490 defense
      skill, and both reach 370 of it from base and talent alone, so gear carries
      120 skill and 284 rating.
    caveat: >-
      The talent must actually be taken at 5 ranks, the same condition the bear
      threshold below places on Survival of the Fittest. Every published
      Protection build for both classes takes it at 5, because it is cheap and
      sits low in the tree, but how many ranks a given player holds is a
      per-player fact this repository does not hold. At 4 ranks the requirement
      is 124 skill and 294 rating; untalented it is 332.
    consumable_route: >-
      Flask of Fortification, item 22851, supplies 10 defense rating and
      persists through death. It is the only defense rating consumable in TBC
      and hit.yaml already records it. Insane Strength Potion, item 22828,
      REMOVES 75 defense rating for 15 seconds and can break crit immunity.
    confidence: high

  bear:
    applies_to: [feral_bear]
    defense_skill_required: 415
    defense_skill_from_gear: 65
    defense_rating_required: 154
    crit_reduction_talent:
      name: Survival of the Fittest
      tree: Feral
      ranks: 3
      percent_per_rank: 1
      percent_at_max_rank: 3
      spell_id: 33856
      tooltip: >
        > "Increases all attributes by 3% and reduces the chance you'll be critically hit by melee attacks by 3%."
      verified: >-
        Read directly from the 2.4.3 tooltip endpoint at all three ranks, 33853,
        33855 and 33856, because this is exactly the number a wiki gets wrong.
        The Warcraft Wiki Defense article states that Survival of the Fittest
        "reduces the inbound crit rate by 6%". THAT IS THE WRATH VALUE and it is
        wrong for 2.4.3. If 6 percent were correct a bear would be crit immune
        with no defense at all, which would delete this whole threshold. It is 3
        percent.
    derivation: >-
      5.6 percent of boss crit minus 3 percent from the talent leaves 2.6
      percent to remove from gear. 2.6 divided by 0.04 is 65 defense skill
      points. 350 base plus 65 is 415. The exact conversion is 2.365384 rating
      per skill point, so 65 points is 153.75, and the minimum is 154 rating.
      This is one of the few places where the rounded 2.37 changes the answer:
      154 divided by 2.37 is 64.98, which floors to 64 skill and would fail,
      while 154 divided by 2.365384 is 65.10 and passes. 153 fails on either
      figure. Use 154, and use the exact conversion when a threshold is close.
    roster_application: >-
      The Druid main tank and the Druid third tank. Both need 415 defense skill
      rather than 490, which is 177 fewer defense rating than a plate tank, and
      docs/framework.md already states this. It is the single largest
      consequence of running a Bear main tank.
    caveat: >-
      The talent must actually be taken at 3 ranks. A bear at 2 ranks needs 3.6
      percent from gear, which is 90 defense skill and 415 becomes 440. Whether
      both druid tanks hold 3 ranks is a per-player fact this repository does not
      hold.
    confidence: high

  resilience_route:
    percent_required: 5.6
    resilience_rating_required: 221
    note: >-
      Crit immunity can also be reached through resilience, and defense and
      resilience stack toward the same 5.6 percent. Recorded for completeness.
      It is not a route this roster should be expected to take, because
      resilience supplies none of the dodge, parry, block or miss that defense
      rating also supplies.
    confidence: good

  uncrushable:
    threshold_percent: 102.4
    what_sums: character sheet miss plus dodge plus parry plus block chance
    derivation: >-
      Crushing blows sit second from the bottom of the boss's attack table
      against the tank, above ordinary hit. To push crushing blows off that
      table the entries above them must reach 100 percent of the roll. Against a
      level 73 attacker each of the tank's four avoidance entries is 0.6 percent
      lower than the character sheet shows, and there are four of them, so the
      sheet total must reach 100 plus four times 0.6, which is 102.4 percent.
      This assumes the tank is already crit immune, so that the crit entry
      contributes nothing.
    disputed_alternative: >-
      The Warcraft Wiki Defense article states the requirement as combined miss,
      dodge, parry and block "exceeding 85%". 85 percent is the point at which
      ordinary hits disappear and crushing blows fill the remainder of the
      table, not the point at which crushing blows are removed. Both are
      recorded; 102.4 is the figure docs/framework.md already uses and it is the
      one consistent with the single-roll table.
      102.4 is CORROBORATED. Two distinct TBC-era articles each state that a
      level 73 attacker makes every one of the tank's four entries 0.6 percent
      lower than the character sheet shows, which is where 4 times 0.6 comes
      from: WoWWiki "Attack table" and WoWWiki "Crushing blow", both archived
      May 2008. The Attack table article carries a worked Protection Paladin
      example whose numbers reconcile exactly, a sheet total of 88.10 percent
      becoming an actual 85.70, a gap of 2.40. A third article, WoWWiki "Miss",
      claims 0.02 percent per point in the attacker's favor, which would give
      102.1. It is judged wrong for TBC: it is contradicted by both articles
      above and by a second table in the Attack table article showing a level 70
      tank at 350 defense being missed 4.40 percent of the time, which is the
      5 percent base less 0.6. The 102.5 figure that circulates is a typo,
      contradicted by six sources including the same site's own paladin guide.
    who_can_reach_it: >-
      Plate tanks with a shield, and nobody else. Only they hold all four
      entries, and both have an on-demand block cooldown that supplies the last
      stretch: Holy Shield gives plus 30 percent block, spell 27179, and Shield
      Block is the Warrior equivalent.
      A BEAR CANNOT PARRY AND CANNOT BLOCK, so it holds two of the four entries
      and has no block cooldown at all. Corroborated by four sources, including
      both modern feral guides, which enumerate defense's benefit for a bear as
      miss, crit and dodge only and never mention parry or block.
      Two TBC-era articles record that a bear can be pushed over 102.4 percent
      on miss and dodge alone, so the accurate statement is not sustainably
      uncrushable rather than cannot. Both describe it as a novelty requiring
      extreme Black Temple and Hyjal itemization, or a few seconds of a
      long-cooldown trinket. In normal raid gearing a bear is always crushable,
      which is why bears carry high armor and health instead.
      THIS BEARS DIRECTLY ON OUR ROSTER. The main tank and the third tank are
      both Druids, so the uncrushable threshold is not a gearing target for
      either of them, and an item is never worth more to them for closing a gap
      to 102.4. It is a target for the Paladin off-tank and the Warrior fourth
      tank only.
    crushing_blows_exist_in_tbc: true
    crushing_blows_note: >-
      In TBC a creature three or more levels above the player can land crushing
      blows, so a level 73 boss crushes a level 70 tank. Patch 3.0 raises that
      to four levels, which is why every Wrath-era source says bosses cannot
      crush. Do not carry that statement back into 2.4.3.
    by_class:
      protection_paladin:
        reachable: true
        mechanism: >-
          Holy Shield supplies a large block chance on top of gear block, and
          the paladin's block is continuous rather than on a short duration.
          This is the tank most able to reach 102.4 in TBC.
      protection_warrior:
        reachable: true
        mechanism: >-
          Shield Block supplies a large block chance, but on a duration and a
          cooldown rather than continuously, so the warrior is uncrushable
          during Shield Block and crushable between uses without very high gear
          block.
        status: NOT VERIFIED whether continuous coverage is achievable at Phase 3 gear
      feral_bear:
        reachable: false
        mechanism: >-
          A bear CANNOT BLOCK. Block is one of the four terms in the 102.4
          percent sum and a bear contributes zero to it, so a bear cannot reach
          the threshold through any amount of gear. A bear takes crushing blows
          and answers them with armor and health rather than by removing them.
        status: >-
          The mechanism is certain. Marked as stated rather than NOT VERIFIED
          because it follows from bears having no shield and no block chance,
          which is not in dispute.
    roster_application: >-
      Of the four tanks, the two Druids cannot become uncrushable at all, the
      Paladin off-tank can, and the Warrior fourth tank can during Shield Block.
      This is a structural property of the tank corps and it does not change
      with loot.
    confidence: conservative

open_questions:

  tank_defense_falls_across_the_tier:
    blocks: >-
      Whether a tank can accept its Tier 6 tokens without re-gemming for
      defense. Nothing today depends on the answer, because no priority is set,
      but this is the largest movement the captured sets show.
    detail: >-
      FOUND 9 August 2026 by totalling data/facts/set-stats.yaml, which joins
      the captured gear sets to items.csv. Defense rating on ITEMS falls sharply
      for all three tanks between the entry set and the tier set, against the
      284 and 154 thresholds above.
      protection_paladin goes 305 to 264, crossing from above the plate
      threshold to 20 below it. protection_warrior goes 257 to 195, and was
      already 27 below at entry. feral_bear goes 43 to 24 against a threshold of
      154.
      THIS IS NOT A CLAIM THAT A TANK LOSES CRIT IMMUNITY. Gems and enchants are
      excluded from every figure in set-stats.yaml, exactly as they are from the
      hit figures, and a tank gems and enchants for defense more than any other
      role. enchants-gems.yaml records the routes: a bracer enchant at 12, a
      head glyph at 16, shoulder inscriptions at 10 to 15, Thick Lionseye at 10
      a socket, the Tenacious Earthstorm Diamond meta at 12, Vindicator's Armor
      Kit at 8, and Flask of Fortification at 10. The Paladin's 20 closes on two
      gems. The Warrior's 89 is a real gearing problem rather than a rounding
      one.
      THE BEAR FIGURE SHOULD BE CHECKED BEFORE IT IS USED. 43 defense rating on
      a main tank's entry set is implausibly low, and that capture records that
      PvP armor exclusions forced substitutions in four slots. The number may be
      describing a set the tank would not wear rather than a real shortfall.
      Also note Enchant Chest - Defense, one of the larger routes at 15, is
      marked phase_3_available false in enchants-gems.yaml, so it is not
      available to close this gap at Phase 3.

  improved_seal_of_the_crusader:
    blocks: 3 percent crit for every attacker in the raid
    detail: >-
      Whether the rostered Retribution Paladin takes Improved Seal of the
      Crusader at 3 ranks, and whether the raid accepts Judgement of the
      Crusader on the boss instead of Judgement of Wisdom. If yes, every physical
      attacker and possibly every caster gains 3 percent crit, worth 66 crit
      rating, which exceeds the entire realistic gem and enchant budget for
      crit.
      This is the crit analog of improved_faerie_fire in hit.yaml and it has
      the same shape: the effect is not in doubt, the roster entry is missing.
      The difference is that Improved Faerie Fire costs the Balance Druid a
      global cooldown and Improved Seal of the Crusader costs the raid a
      judgement slot, so the second decision has a price attached and the first
      does not.
    recommendation: >-
      Record the answer in roster.yaml alongside the buff policy and the
      improved_faerie_fire entry, since it is a composition decision rather than
      a gearing one.

  moonkin_aura_party:
    blocks: 5 percent spell crit for one caster party
    detail: >-
      roster.yaml records a warlock group with the Elemental Shaman in it and a
      mage group with no shaman, but it does not record which group the Balance
      Druid sits in. Moonkin Aura is a PARTY buff at 30 yards, so exactly one
      caster party receives 5 percent spell crit and this file cannot say which.
      If the Balance Druid sits with the mages, the Arcane Mages gain 5 percent
      spell crit and partially offset having no Totem of Wrath. If it sits with
      the warlocks, the warlocks reach 8 percent from buffs alone and the mages
      have none.
    recommendation: >-
      Add the Balance Druid to a named group in roster.yaml. The same field also
      resolves who receives Improved Faerie Fire's group-independent debuff,
      which is already open in hit.yaml.

  tank_party_assignments:
    blocks: Whether two of the four tanks receive Leader of the Pack
    detail: >-
      roster.yaml names two groups and neither contains the Protection Paladin
      or the Protection Warrior. Leader of the Pack is a party buff, so whether
      those two tanks receive 5 percent melee crit is unknown. It is threat only
      and it crosses no threshold, so nothing in this file changes either way.

  simulated_per_spec_crit_figures:
    blocks: Nothing today. It is the evidential basis of the headline answer.
    detail: >-
      The four Phase 3 crit percentages under reachability_at_phase_3 come from
      ONE source, a wowsims TBC engine run against its own committed Phase 3
      presets. No published TBC guide states a raid-buffed crit percentage for
      any spec, so there is nothing to corroborate them against. They are
      reproducible, and they were produced with a harness validated against the
      project's own committed regression result, which is why they are recorded
      rather than omitted.
      Nothing turns on their precision. For the FOUR SIMULATED SPECS the
      headroom is 18.9 to 33.7 points on the basis stated under
      reachability_at_phase_3.simulated_figures, and the conclusion survives
      an error of several points in either direction. The other rostered specs
      were never simulated, so no headroom figure exists for them; the
      reachability entries for those groups rest on cap arithmetic and gear
      crit supply, not on these figures. This entry used to say "the headroom
      is 11 to 26 points" as if it covered the roster; the range covered only
      the four simulated specs and the endpoints matched neither comparison
      basis, see correction_9_august_2026 under simulated_figures. Do not
      quote them as measured figures.

  crit_suppression_component_split:
    blocks: Nothing. It sharpens one number.
    detail: >-
      The 4.8 percent total crit suppression has two independent sources. Its
      split into 3.0 percent on all crit and a further 1.8 percent on
      aura-sourced crit only, sparing agility-sourced crit, rests on one
      derivation. A spec whose crit comes mostly from agility loses slightly
      less than 4.8 percent. Verify before any document applies the split per
      spec rather than the 4.8 total.

  periodic_crit_residuals:
    blocks: Nothing structural. It sharpens per-spec crit exposure.
    detail: >-
      The general rule is now settled and sourced: periodic damage and periodic
      healing cannot crit in 2.4.3, and a spell with both components crits on
      the direct part only. See valuation_mechanics.dot_and_hot_crit.
      What remains open is a short list of individual spells with no period
      source either way, none of which changes a conclusion here. Druid
      Lifebloom's final bloom and Swiftmend; Priest Holy Nova and Binding Heal;
      Paladin Avenger's Shield and Retribution Aura; Hunter Explosive Trap's
      initial damage; Rogue Anesthetic Poison; and whether Paladin Reckoning
      extra attacks can crit, which is currently a high-confidence inference
      only.
      Also open: whether Impale's crit damage bonus feeds the Deep Wounds tick
      amount. The evidence leans toward no.

  agility_denominator_conflict:
    blocks: Nothing. It is recorded so the correction is not undone.
    detail: >-
      Two sources give incompatible agility to crit conversions at level 70. The
      modern Warcraft Wiki gives 40 for Druid, Rogue, Hunter and Shaman alike,
      and lists Monk. A 2008 capture of the WoWWiki agility article gives Rogue
      40, Hunter 40, Warrior 33 and everyone else 25. This file uses the 2008
      table, because the presence of a Mists of Pandaria class in the other one
      dates it beyond doubt.
      The consequence is large enough to name. Under the rejected table a Feral
      Cat's 276 agility is worth 6.9 percent crit; under the accepted one it is
      worth 11.0. Anyone recomputing this file should reconfirm before changing
      it back.

  improved_seal_of_the_crusader_school:
    blocks: Whether casters may be credited with the raid crit debuff
    detail: >-
      Improved Seal of the Crusader reads "the critical strike chance of all
      attacks made against that target". Whether that includes SPELL critical
      strikes is NOT VERIFIED. TBC simulators model it as covering both. No
      2.4.3 source was found that disambiguates it explicitly. Until one is,
      credit it to physical attackers only and leave the caster half open.

  shadow_priest_party:
    blocks: Between 0 and 8 percent spell crit for the Shadow Priest
    detail: >-
      roster.yaml lists the Shadow Priest under casters and gives it no party.
      Both caster crit buffs are party-scoped, so the answer moves by 8 points.
      Sitting with the warlocks supplies Totem of Wrath at 3 percent, and 5
      percent more if the Balance Druid sits there too. Sitting with the mages
      supplies nothing today, because roster.yaml does not fix the mage party's
      shaman as Elemental. This is the same missing field that
      moonkin_aura_party turns on, and one edit to roster.yaml closes both.
    recommendation: >-
      Add the Shadow Priest and the Balance Druid to named caster groups in
      roster.yaml, and fix the spec of the shaman sitting with the mages.

  supplied_crit_for_the_promoted_specs:
    blocks: The gear crit rating figures for shadow_priest and elemental_shaman
    detail: >-
      Every other spec in this file carries supplied_crit_rating_at_p3_entry.
      The two specs promoted on 8 August 2026 do not, because the rule recorded
      in method.gear_set_rule does not reproduce the figures already recorded.
      Re-running that rule returns 259 crit rating for the Destruction Warlock
      against the 301 recorded, and 319 for the Arcane Mage against the 370
      recorded, so a term is missing from the written rule rather than from the
      tabs. Under the same rule the Shad tab returns 125 over 17 slots and the
      Ele tab returns 308 over 16 slots.
      Those two numbers are recorded here rather than in the spec entries
      because they are not comparable with the entries beside them. A reader
      comparing 125 against the Affliction Warlock's 262 would read a crit
      shortage that the method created.
      Nothing in this file turns on them. No caster has a crit cap, so no
      supplied figure crosses a threshold, and method.known_weakness already
      holds every such figure at plus or minus 50 rating.
    recommendation: >-
      Recover the script that produced the recorded figures, or restate
      method.gear_set_rule so it reproduces them, then compute both specs the
      same way and move the numbers into their entries.

  lightning_overload_crit_roll:
    blocks: Nothing structural. It sharpens one spec's crit exposure.
    detail: >-
      Lightning Overload gives an Elemental Shaman's Lightning Bolt and Chain
      Lightning a 20 percent chance at 5 ranks to cast a free half-damage copy,
      spell 30681, verified at the tooltip endpoint. Whether that copy rolls its
      own critical strike is NOT VERIFIED at the spell-data level, and it decides
      whether a point of crit reaches roughly a fifth more casts than the
      rotation shows. The tooltip calls the copy a second, similar spell, which
      leans toward yes, and leaning is not verification.

  workbook_crit_gaps:
    blocks: The supplied figures for two tanks
    detail: >-
      The Feral Bear tab carries no crit column in any armor section, only in
      its weapon sections, so its 42 rating figure is weapon-only and
      understates the real supply. The Protection Paladin tab carries no crit
      column anywhere, so its zero is the workbook declining to price crit
      rather than a statement about the spec. Neither gap changes a conclusion,
      because crit is a threat stat for both tanks and neither is near any cap,
      but neither figure should be quoted as a total.
