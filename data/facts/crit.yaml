    supplied_agility_at_p3_entry: 333
    crit_percent_from_that_agility: 8.3
    agility_denominator: 40 agility per percent, the rogue figure, the worst in the game
    talents_granting_crit:
      - {name: Malice, tree: Assassination, tier: 1, ranks: 5, percent: 5, spell_id: 14142,
         applies_to: all attacks}
