# Critical strike, per spec, and the tank defensive thresholds. Hand-authored.
#
# HOLDS   The melee attack table and the crit cap it produces, the spell and
#         ranged cases, rating conversions, what supplies or scales crit per
#         spec, and crit immunity and uncrushable for tanks.
# NOT HERE  Hit and expertise are in hit.yaml. Haste is in haste.yaml.
#
# BEFORE YOU USE A FIGURE
#   ONLY the white auto-attack swing has a crit cap. Everything else resolves on
#   two rolls, so crit cannot be displaced. Do not apply a cap to yellow
#   attacks, spells or ranged.
#   Agility to crit differs by class: 40 per percent for Rogue and Hunter, 25
#   for Druid, Paladin and Shaman. Modern tables give 40 for all and are wrong.
#   Uncrushable at 102.4 needs all four table entries. A Bear has two and cannot
#   reach it in normal gearing, so it does not apply to our main or third tank.
#
# SOURCE  Talents read rank by rank from the 2.4.3 tooltip endpoint at
#   nether.wowhead.com, since rank 1 and rank 4 values are the common error in
#   published tables. Attack table, crushing blow window and the 102.4
#   derivation from archived TBC-era articles, corroborated across separate
#   articles and reconciled against a worked example. Conflicting readings are
#   kept as rejected_reading. What is not settled is in open_questions.
meta:
  authored: 2026-08-08
  anchor: phase_3_entry
  patch: 2.4.3
  sibling_files:
    - data/facts/hit.yaml
    - data/facts/roster.yaml
    - data/facts/enchants-gems.yaml
  supersedes: >-
    Nothing. This is the first crit file in the repository. The 490, 415 and
    102.4 figures quoted in docs/framework.md are reproduced and derived here,
    and they agree.

assumptions:
  racials_assumed: false
  group_buffs_assumed: true
  consumables_assumed: false
  gems_and_enchants_counted: false
  target: level 73 raid boss
  attacker: level 70 player, weapon skill 350, from behind unless stated
  note: >-
    The same assumption set as hit.yaml, so the two files can be read together.
    Consumables and gems are excluded from every supplied figure and are
    quantified separately under discretionary_crit_budget.

# Level 70. Verified 8 August 2026 against the Warcraft Wiki per-level rating
# table, which is indexed by level and therefore does not drift between eras the
# way its prose does, and against the 2.4.3 spell tooltip endpoint for every
# talent value in this file.
conversions:
  melee_crit_rating_per_percent: 22.08
  ranged_crit_rating_per_percent: 22.08
  spell_crit_rating_per_percent: 22.08
  one_denominator_note: >-
    All three schools share the 22.08 denominator at level 70. Crit rating and
    spell crit rating are separate ITEM stats in TBC, exactly as hit rating and
    spell hit rating are, but they convert at the same rate. Do not carry the
    level 80 figure of 45.91 into any TBC calculation.
  confidence: high

  # READ THE WARNING BEFORE USING THIS TABLE. It is not uniform and the modern
  # wiki gets it wrong.
  agility_per_percent_crit_level_70:
    rogue: 40
    hunter: 40
    warrior: 33
    druid: 25
    paladin: 25
    shaman: 25
    mage_priest_warlock: 25
    warning: >-
      COUNTERINTUITIVE AND CORRECT. Rogues and Hunters have the WORST agility to
      crit conversion in TBC, at 40 agility per percent, and Druids, Paladins
      and Shamans have the best at 25. Do not take 40 for Druid or Shaman. That
      figure comes from the modern Warcraft Wiki crit article, which lists 40 at
      level 70 for Druid, Rogue, Hunter AND Shaman
      and also includes Monk, a Mists of Pandaria class. It is drifted, and its
      inclusion of Monk is the tell.
      The table above is quoted from a 2008 capture of the WoWWiki agility
      article, which is contemporaneous with 2.4.x.
      The correction is not cosmetic. It nearly doubles the crit that agility
      buys a Feral Cat and an Enhancement Shaman, which are the two specs whose
      workbook ladders buy crit through agility rather than through crit rating.
    confidence: good
    evidence: period_source_that_contradicts_the_modern_one

  intellect_per_percent_spell_crit_level_70:
    warlock: 81.92
    paladin: 80.05
    druid: 80
    shaman: 80
    mage: 80
    priest: 80
    working_figure: 80
    note: >-
      Roughly 80 intellect per 1 percent of spell crit for every caster, which
      is close enough to uniform that a single figure is safe. Quoted from a
      2008 capture of the WoWWiki spell critical strike article. The per-class
      base constants that produce these numbers are available only on the modern
      wiki and are NOT VERIFIED for 2.4.3, but the level 70 outputs above are
      period-sourced.
      No conclusion in this file depends on it, because spell crit has no cap
      and therefore no threshold an intellect figure could cross. It is recorded
      because it prices the intellect on a caster item.
    confidence: good

  # What a critical strike is actually worth. This is not uniform either, and
  # the difference between the physical and the magical multiplier is the
  # largest single reason a point of crit is not the same stat for a melee spec
  # and for a caster or healer.
  crit_multipliers:
    physical_melee_and_ranged: 2.0
    spell_damage: 1.5
    healing: 1.5
    healing_warning: >-
      HEALING CRITS ARE 1.5 TIMES IN TBC, NOT 2. The modern Warcraft Wiki spell
      critical strike page states 200 percent. That is a Wrath value and it
      overstates every healer's crit value by a third. The period source is
      explicit: "Spell critical heals will only heal for 150% of their normal
      amount."
    talents_that_raise_the_spell_multiplier_to_2:
      - {name: Ruin, class: warlock, tree: Destruction, applies_to: Destruction spells}
      - {name: Vengeance, class: druid, tree: Balance, applies_to: "Starfire, Moonfire and Wrath"}
      - {name: Elemental Fury, class: shaman, tree: Elemental, applies_to: "Fire, Frost and Nature spells and fire totems"}
      - {name: Ice Shards, class: mage, tree: Frost, applies_to: Frost spells}
    partial_multiplier_talents:
      - {name: Spell Power, class: mage, tree: Arcane, tier: 7, ranks: 2,
         effect: "raises the crit damage bonus of ALL the mage's spells to 1.75 times"}
    note: >-
      No talent raises the HEALING multiplier above 1.5 for anybody. Healers buy
      crit for what it triggers, not for what it multiplies.
    confidence: good

  defense_rating_per_skill_point: 2.37
  defense_rating_variant: 2.36
  defense_rating_note: >-
    Two values circulate, 2.36 and 2.37, and they are the same underlying figure
    of about 2.3654 rounded and truncated. hit.yaml already records 2.37 and
    this file keeps it. The difference moves the plate tank requirement by one
    rating point and crosses no threshold.

  resilience_rating_per_percent_level_70: 39.4
  resilience_note: >-
    Resilience reduces the chance to be critically hit and is therefore a second
    route to crit immunity. 5.6 percent of resilience needs 221 resilience
    rating at level 70. Recorded for completeness. It is not a tanking route the
    council should expect to see, because resilience carries none of the dodge,
    parry, block or miss that defense rating also supplies.
  confidence: good

# The mechanic the melee crit cap comes from. Melee and ranged attacks resolve
# on a SINGLE server-side roll against one ordered table. Everything above crit
# in that table consumes probability space, and once the space above crit
# reaches 100 percent, crit is pushed off and further crit rating does nothing.
attack_table:
  resolution: single_roll
  order:
    - miss
    - dodge
    - parry
    - glancing
    - block
    - critical strike
    - crushing blow
    - ordinary hit
  order_note: >-
    Precedence runs top to bottom. Crit sits second from the bottom for a player
    attacking a creature, above ordinary hit and below block, which is why crit
    is the entry that gets displaced.

  # Level 70 attacker, weapon skill 350, against a level 73 boss with defense
  # 365. Every entry below is corroborated three ways: an empirical BCC beta
  # measurement over 105,405 logged swings at zero hit and zero expertise, the
  # constants committed in the wowsims TBC reimplementation, and the 2008-era
  # wiki articles. Where the wiki disagrees it is recorded and rejected, with
  # the reason.
  entries:
    miss_single_weapon:
      percent: 8.0
      measured: 7.95 plus or minus 0.16
      formula: 5 plus the skill difference times 0.2, for a difference above 10
      rejected_alternative: 8.6
      rejected_reason: >-
        The 8.6 figure came from hit.yaml's prose; on 9 August 2026 that prose
        was corrected to point here, so this entry is now the figure's one
        home. The measurement and the sim constant both give 8.0. hit.yaml is
        not wrong where it matters: see hit_cap_versus_miss below.
    hit_cap_versus_miss:
      miss_percent: 8.0
      hit_needed_percent: 9.0
      suppression_percent: 1.0
      note: >-
        THE FIRST 1 PERCENT OF HIT RATING IS DEAD against a target three levels
        up. Miss is 8 percent but 9 percent of hit is needed to remove it. This
        reconciles the 8.0 measured miss above with the 9 percent hit cap
        hit.yaml gears to, and the two files agree. The same suppression makes
        the dual-wield white hit cap 28 percent, which is the figure hit.yaml
        already records.
    miss_dual_wield:
      percent: 27.0
      formula: single weapon miss plus a FLAT 19 percent dual-wield penalty
      rejected_alternative: 27.6
      note: >-
        The penalty is a flat addition, not the multiplicative vanilla rule. It
        applies to white swings with BOTH hands, main hand and off hand alike,
        so a rogue's off hand has the same cap as its main hand. It does NOT
        apply to yellow attacks.
    dodge:
      percent: 6.5
      measured: 6.48 plus or minus 0.15
      note: >-
        Agrees with hit.yaml, which derives its 26-point expertise threshold
        from the same 6.5. Bosses DO dodge attacks made from behind, so this
        entry stays live for every damage spec. Expertise removes it and
        therefore RAISES the white crit cap.
    parry:
      percent: 14
      measured: 14.12 plus or minus 0.21
      applies: front only
      note: >-
        A boss cannot parry an attack made from behind, confirmed in two
        independent 2.4.3 server emulators and in the wiki. Dead for every
        damage spec and live for every tank. Parry haste is also live in TBC and
        is the other reason melee stand behind.
    block:
      percent: 5
      measured: 5.06 plus or minus 0.13
      applies: front only
      note: >-
        A creature blocks at most 5 percent regardless of rating and can block
        without a shield. Creatures lost the ability to block from behind in
        patch 1.3.0.
    glancing:
      percent: 24
      measured: 24.22 plus or minus 0.26
      applies: white melee swings only
      formula: 6 plus the skill difference times 1.2, so 6 plus 18
      rejected_alternative: 25
      rejected_reason: >-
        The 25 figure comes from the older formula, 10 plus target defense minus
        attacker weapon skill. That formula is still printed on the Warcraft
        Wiki and is hardcoded in both 2.4.3 server emulators, so it looks well
        supported. It predicts 10 percent glancing against an equal-level target
        and the measurement is 6.07 percent, so it is falsified at the point
        where the two formulas differ most. An Elitist Jerks retest also
        concludes that 24 percent has held since patch 2.1.
        This is the single largest correction on this file's second pass. It
        moves every white cap by one point. It is recorded rather than silently
        applied because two emulators reproducing the same wrong constant is
        exactly the trap that makes code alone insufficient.
      note: >-
        This entry is the ONLY reason a crit cap exists anywhere in TBC. It
        cannot be reduced by weapon skill, by gear or by anything else, because
        weapon skill is hard capped at level times five.
    crushing_blow:
      applies: creature attacking a player, not a player attacking a creature
      note: >-
        Irrelevant to a damage spec's crit cap. It is central to the tank side
        and is handled under tank_defensive_thresholds.
  confidence: high
  evidence: empirical_measurement_plus_sim_source_plus_period_wiki

glancing_blows:
  chance_percent: 24
  applies_to: white melee swings only
  does_not_apply_to:
    - yellow, meaning instant and on-next-swing special attacks
    - ranged weapon attacks of every kind
    - spells
    - player against player
  can_a_glancing_blow_crit: false
  can_crit_note: >-
    Glancing sits above crit in the precedence order, so the two outcomes are
    mutually exclusive by construction rather than by a rule.
  damage_factor_low: 0.65
  damage_factor_high: 0.85
  damage_factor_formula: >-
    For a skill difference of 11 or more, low equals 1.4 minus 0.05 times the
    difference and high equals 1.3 minus 0.03 times the difference, where the
    difference is target defense minus attacker weapon skill capped at level
    times five, so 15 here. The realized factor is rolled uniformly between the
    two.
  average_damage_factor: 0.75
  average_penalty_percent: 25
  rejected_alternative:
    low: 0.55
    high: 0.75
    average_penalty_percent: 35
    reason: >-
      THAT IS THE VANILLA FORMULA, with base constants of 1.3 and 1.2 rather
      than 1.4 and 1.3. TBC added 0.10 to both, which is exactly what turns a 55
      to 85 range into 65 to 85. Both 2.4.3 server emulators carry the vanilla
      figures, which is why this error is easy to make and why emulator source
      was not treated as decisive here.
  corroboration: >-
    Three ways. A BCC beta measurement of 25.19 percent average reduction over
    9,403 glancing hits; the wowsims TBC glance multiplier of 0.75, whose own
    code comment records the 65 to 85 range; and a reconstruction of roughly
    30,000 swings from original 2007 and 2008 raid logs giving an average
    glance to hit ratio of about 0.75.
  two_hand_versus_one_hand:
    differs: false
    verified: true
    note: >-
      No handedness term exists anywhere in TBC: not in the chance formula, not
      in the damage formula, not in the sim's attack table, which is a function
      of defender level only, and not in either emulator. Patch 2.0.1 removed
      weapon skill's effect on the glancing penalty and weapon skill is hard
      capped at level times five, so every level 70 melee sits at a skill
      difference of exactly 15 regardless of what they hold.
      A vanilla-era two-hand difference is still repeated. It came from
      weapon-type-specific skill bonuses that no longer exist in TBC, and from a
      separate caster-class rather than weapon-class split in the low-end
      constant. Neither applies here.
  confidence: high

# The caps themselves. Every figure is for an attacker behind the target, which
# removes parry and block, except where stated. Two columns are given because
# hit rating buys crit cap: every point of miss removed is a point of table
# space returned to crit.
raw_caps:

  formula: >-
    CritCap_white equals 100 minus miss minus dodge minus parry minus block
    minus glancing, where miss is the base miss reduced by hit above the first
    suppressed percent, dodge and parry are each reduced by 0.25 percent per
    point of expertise skill, parry and block are zero from behind, and glancing
    is a fixed and irreducible 24. Compare it against EFFECTIVE crit, which is
    sheet crit minus the 4.8 percent suppression recorded below.

  melee_white_two_hand_or_single_one_hand:
    cap_at_zero_hit: 61.5
    cap_at_special_hit_cap: 69.5
    cap_at_special_hit_cap_and_26_expertise: 76.0
    sheet_crit_equivalent_at_zero_hit: 66.3
    applies_to: [arms_warrior, retribution_paladin, feral_cat, feral_bear]
    one_hand_equals_two_hand: >-
      Identical. No one-hand or two-hand term exists anywhere in the TBC attack
      table. Feral Cat and Feral Bear swing a single weapon in form and sit here
      as well.
    absolute_ceiling: >-
      76.0 percent is the highest white crit cap obtainable in TBC by anybody,
      because the 24 percent glancing share can never be removed.
    from_the_front: 42.5
    from_the_front_note: >-
      Tanks attack from the front, so they carry parry at 14 and block at 5 and
      their white cap is 19 points lower. It binds on nobody, because no tank is
      near 42 percent crit.
    confidence: high

  melee_white_dual_wield:
    cap_at_zero_hit: 42.5
    cap_at_special_hit_cap: 50.5
    cap_at_full_dual_wield_white_hit_cap: 69.5
    sheet_crit_equivalent_at_zero_hit: 47.3
    applies_to: [combat_rogue, fury_warrior, enhancement_shaman]
    from_the_front: 23.5
    note: >-
      19 points lower than the single-weapon cap at zero hit, purely because of
      the flat 19 percent dual-wield miss penalty. Every point of hit raises it
      one for one, all the way to 69.5 at the 28 percent dual-wield white hit
      cap, so this cap converges on the single-weapon cap rather than staying
      below it.
      THE SPEC AT RISK IS A LOW-HIT DUAL-WIELDER, and this roster has none.
      hit.yaml puts all three of these specs at or above the special-attack hit
      cap, which lifts their white cap to 50.5 percent or higher before any
      expertise is counted. That is why the period warnings about dual-wielders
      and the crit cap are real and do not bind here.
    period_corroboration: >-
      A 2008 wiki passage computes 49.5 percent for a talented dual-wielder from
      behind and warns that melee above 40 percent crit should watch the cap. It
      uses the older 25 percent glancing and 28 percent dual-wield miss
      constants, which is why it lands 1 to 2 points below the figures here.
    confidence: high

  melee_special_yellow:
    exists: false
    resolution: two_roll
    headline: >-
      NO YELLOW CRIT CAP EXISTS. Two independent mechanics remove it. First,
      special attacks never glance and never take the 19 percent dual-wield miss
      penalty. Second, and decisively, they resolve on TWO rolls: avoidance is
      settled on one roll and crit on a separate one, so crit never competes for
      table space at all.
    evidence: >-
      The wowsims TBC melee special path calls a separate-roll crit function
      that draws a fresh random number, where the white path chains against one
      shared roll. A 2008 wiki article states directly that added crit rating
      beyond the white crit cap will still improve critical hit chance on yellow
      attacks, and documents two-roll Backstab data.
    rejected_reading: >-
      Yellow attacks are sometimes given a cap of 93.5 percent, computed as 100
      minus miss minus dodge. That number is the non-avoided share of attacks,
      not a cap on crit chance, and it should not be quoted.
    note: >-
      This is why the white cap would not make crit worthless even for a spec
      that reached it: Sinister Strike, Bloodthirst, Stormstrike, Mangle,
      Shred and every other special keeps scaling with crit without limit.
    confidence: high

  ranged:
    exists: false
    resolution: two_roll
    headline: >-
      NO RANGED CRIT CAP EXISTS IN TBC. Hunter shots resolve on two rolls, a hit
      roll and then a separate crit roll, the same way spells do and unlike
      melee. Auto Shot and the ranged specials both behave this way.
    evidence: >-
      Three independent legs, one of them period.
      First, an archived Elitist Jerks post from 31 January 2008 by Lactose
      reports 35.83 percent crit against 32.04 percent adjusted hit, which is
      crit ABOVE hit. A single-roll table in that state permits only misses and
      critical strikes, and the log nonetheless shows ordinary non-crit hits
      from Auto Shot and from Multi-Shot. The stated conclusion is that hunter
      shots are two-roll for both auto shots and specials.
      Second, a 2008 WoWWiki article relaying the same finding.
      Third, the wowsims TBC reimplementation resolves the ranged path through a
      separate crit roll while the melee white path accumulates crit into the
      shared single-roll total. That is an independent implementation rather
      than a period source.
    rejected_reading: >-
      The Warcraft Wiki attack table article says that ranged attacks use the
      melee table with zero parry, glance and block, which would leave a
      single-roll table with miss and dodge above crit and a cap near 91
      percent. That reading is recorded because it is what a reader will find
      first, and it is superseded by the evidence above.
    can_be_dodged: false
    dodge_evidence: >-
      Ranged dodge was ADDED in patch 5.0.4. Its absence in 2.4.3 follows
      negatively from that, and it explains why hunter practice treats expertise
      as worthless. The 6.5 percent dodge figure recorded in attack_table is a
      melee value and never applied to ranged attacks.
    can_be_blocked: true
    block_detail: >-
      A creature blocks at most 5 percent regardless of rating and can block
      without a shield, and block applies only from the target's frontal arc. A
      hunter shooting from behind or beside the boss faces zero block. On the
      ranged path block does not displace crit in any case: it is applied after
      the crit roll as a flat damage subtraction.
    glancing_confirmed_absent: true
    glancing_evidence: >-
      Confirmed twice in the same source family: "Ranged weapon attacks (Bows,
      guns and crossbows) do not have glancing blows at all", and the attack
      table article's statement that ranged rows carry zero glance.
    note: >-
      Answer the hunters plainly: there is no ranged crit cap, and crit scales
      linearly to 100 percent. Under the superseded single-roll reading the cap
      would be about 91.4 percent, which no hunter reaches either, so the
      conclusion is the same under both readings and nothing downstream depends
      on the resolution.
    confidence: good
    evidence_grade: three_independent_sources_one_period

# Crit chance shown on the character sheet is NOT the crit chance landed on a
# level 73 boss. A fixed suppression is applied for attacking above your level,
# and its size is disputed. This applies to melee and to ranged. It was missed
# on the first pass of this file and it matters more than any cap here does,
# because it moves every supplied figure in the specs block downward.
crit_suppression:
  applies_to: [melee, ranged]
  applies_to_spells: unverified
  total_percent: 4.8
  components:
    from_level_difference: 3.0
    from_level_difference_applies_to: all crit, from every source
    additional_on_aura_crit: 1.8
    additional_applies_to: >-
      crit granted by auras, meaning talents, equip effects on items, Leader of
      the Pack, Songflower and elixirs. It does NOT apply to crit gained from
      agility.
  detail: >-
    A level 70 attacking a level 73 loses 3.0 percent crit from the skill
    difference, and loses a further 1.8 percent from the aura-sourced portion of
    its crit, for 4.8 percent in the normal case where a spec has both. The
    split is derived from BCC beta testing and the 4.8 total is the constant the
    wowsims TBC reimplementation applies for a target three levels up, so the
    figure has two independent sources.
    A 2008 wiki article gives 3.0 as the whole answer and self-flags the section
    as unsure whether it is correct. That is the 3.0 component alone, not a
    competing total.
  effect_on_this_file: >-
    Every crit percentage in the specs block below is a SHEET figure and every
    cap in raw_caps is an EFFECTIVE figure. Subtract 4.8 before comparing them,
    or add 4.8 to the cap, which is what the sheet_crit_equivalent fields do.
    Applying it widens every distance to every cap, so no conclusion here
    reverses.
  confidence: good

  spell:
    exists: false
    resolution: two_roll
    mechanic: >-
      A damaging spell is resolved by a hit roll first. If the spell lands, a
      SECOND and independent roll decides whether it is a critical strike.
      Because the crit roll is separate, nothing above crit on any table can
      consume its probability space, so there is no ceiling and no displacement.
      Spells cannot be dodged, parried, blocked or glanced.
    note: >-
      State this plainly to anyone who asks. A spell crit cap does not exist in
      TBC. Resistance and partial resists reduce damage but they do not sit on a
      crit table. The practical ceiling on a caster's crit is the gear, not the
      mechanic.
    confidence: high

# The answer the lead asked for, per spec, in one place.
reachability_at_phase_3:
  headline: >-
    NO ROSTERED SPEC IS CRIT CAPPED AT PHASE 3, AND NONE IS CLOSE. The nearest
    of the four simulated specs, Fury, is about 19 points short on the
    effective basis stated under simulated_figures, and that gap is on white
    swings only. This headline used to say "roughly eleven percentage points";
    see correction_9_august_2026 below for why that figure was wrong. Crit is a
    linear stat for every spec in the roster for the whole tier.

  simulated_figures:
    source: >-
      Produced by running the wowsims TBC engine against its own committed Phase
      3 Black Temple and Hyjal gear presets with full raid buffs, with the
      harness validated against the project's own committed regression result.
    status: >-
      SINGLE SOURCE. No published TBC guide quotes a raid-buffed crit percentage
      for any spec, so these four figures are reproducible but uncorroborated.
      They are recorded as the best available answer and flagged rather than
      presented as settled. Every number is a SHEET figure.
    table:
      - {spec: fury_warrior, sheet_crit: 41.5, hit_percent: 12.5, white_cap: 55.6, headroom: 18.9}
      - {spec: combat_rogue, sheet_crit: 41.6, hit_percent: 23.7, white_cap: 70.5, headroom: 33.7}
      - {spec: feral_cat, sheet_crit: 53.4, hit_percent: 6.1, white_cap: 68.2, headroom: 19.6}
      - {spec: enhancement_shaman, sheet_crit: 42.7, hit_percent: 16.7, white_cap: 59.8, headroom: 21.9}
    reading_note: >-
      The white_cap column already includes each spec's own hit and expertise,
      which is why the four caps differ. BASIS: sheet_crit is a SHEET figure and
      white_cap is an EFFECTIVE figure, so per the crit_suppression rule above,
      headroom = white_cap minus (sheet_crit minus 4.8). The sheet basis,
      (white_cap plus 4.8) minus sheet_crit, gives the identical number, so the
      headroom column is the same on either basis once one side is adjusted.
    correction_9_august_2026: >-
      THIS COLUMN USED TO PRINT 11, 26, 12 and 14. Those figures matched
      neither basis: they sit about 3 points BELOW the raw cap-minus-sheet
      gap, so the suppression was subtracted from the headroom instead of
      widening it, and at the 3.0 component rather than the 4.8 total. The
      file's own rule says applying suppression widens every distance to
      every cap. The corrected column applies the 4.8 total; the reachability
      conclusion does not change, every gap grows.

  why_nobody_reaches_it:
    detail: >-
      Hit rating and expertise RAISE the crit cap one point for one point,
      because both remove entries that sit above crit on the table. That inverts
      the intuition a Wrath-era player brings. The spec at risk of capping is a
      LOW-HIT dual-wielder, and hit.yaml puts all three of this roster's
      dual-wielders at or above the special-attack hit cap. Combat Rogue carries
      the most hit of any spec and is consequently the furthest from its cap,
      by 33.7 points on the basis stated under simulated_figures. This entry
      used to say 26 points, the same defective figure the headroom column
      printed; see correction_9_august_2026.
      The cap is therefore out of reach here because of how the raid is geared,
      not because the mechanic is absent. A period 2.4.3 source works an example
      of an Enhancement Shaman reaching the cap at 26.11 percent gear crit, and
      that example assumes ZERO hit rating.

  two_hand_and_single_wield:
    verdict: not reachable
    detail: >-
      The cap is 69.5 percent at the special hit cap and 76 percent with
      expertise as well. The largest gear crit supply on any two-hand or
      single-wield tab is arms_warrior at 362 rating, which is 16.4 percent, and
      the simulated Feral Cat sits at 53.4 percent sheet crit against a 68.2
      percent cap, which is the closest of the two-hand and single-wield group.
  dual_wield:
    verdict: not reachable at Phase 3, and reachable in principle
    detail: >-
      The cap is 50.5 percent at the special hit cap and rises to 69.5 percent
      at the full 28 percent dual-wield white hit cap. The simulated figures put
      Fury at 41.5 against 55.6 and Enhancement at 42.7 against 59.8, so on
      the basis stated under simulated_figures the two are 18.9 and 21.9
      points short. This entry used to say "11 to 14 points short", figures
      that matched neither basis; see correction_9_august_2026 under
      simulated_figures. The mechanic is live and the period sources are
      right to warn about it. It does not bind on this roster.
  hunters:
    verdict: no cap exists
    detail: >-
      Ranged attacks resolve on two rolls in TBC, so there is no ranged crit cap
      at all. Even under the superseded single-roll reading the cap would be
      about 91 percent and neither hunter reaches a third of it.
  casters_and_healers:
    verdict: no cap exists
    detail: >-
      Two-roll resolution. Crit scales linearly to 100 percent for every caster
      and healer in the roster, so no crit item is ever devalued by a ceiling.

