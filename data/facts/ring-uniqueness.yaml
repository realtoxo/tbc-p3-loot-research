meta:
  what: Whether each ring in the variant rounds' pools can be worn in both
    slots at once. A ring marked unique cannot, and a doubled row for it is
    a measurement of a state the game does not allow.
  source: Wowhead TBC tooltips, nether.wowhead.com/tbc/tooltip/item/<id>,
    observed 2026-08-22. Unique or Unique-Equipped in the tooltip is the
    claim, and the two are one constraint here, since neither allows a
    second copy worn. Ring of the Overseer says Unique-Equipped where the
    rest say Unique.
  why_this_file_exists: The ring rounds read uniqueness from the wowsims
    database, which carries no unique flag on 27 of the 28 unique rings
    here, so the enumerator generated a doubled row for nearly every ring
    and four of those rows led their profiles' audits. The guild lead
    caught it on the first one, the doubled Stormrage Signet Ring. Wowhead
    marks every ring in the pools Unique except three Ashtongue
    Deathsworn vendor rings. This file is the authority the enumerator
    reads; the database's limitCategory families, which it does carry,
    remain read from it.
  maintenance: Hand-maintained, not regenerated. A ring added to any
    ring_pool must be added here first with its tooltip checked, and the
    runner refuses a pool ring this file does not list.
