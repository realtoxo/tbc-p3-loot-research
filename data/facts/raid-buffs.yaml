# Which buffs and debuffs THIS raid actually supplies, and to whom.
#
# WHY THIS IS DERIVED AND NOT ASSUMED. A sim profile with idealised raid buffs
# overstates every spec, and one with none understates every spec. The guild
# lead ruled on 10 August 2026 that the profiles carry full buffs and debuffs
# "per our comp", which makes roster.yaml the source and this file the working.
#
# PARTY SCOPE IS THE WHOLE DIFFICULTY. In 2.4.3 a totem, an aura and a shout
# reach the caster's PARTY and not the raid. Raid-wide totems are a Wrath
# change. This project has already published a wrong figure by forgetting that
# once, when a note said the Balance Druid sits away from Totem of Wrath and
# roster.yaml said otherwise, so every party-scoped entry below names the party
# it reaches and the spec that supplies it.
#
# THE PARTIES, from roster.yaml, which the guild lead dictated:
#   g1  combat_rogue, arms_warrior, feral_cat, retribution_paladin, enhancement_shaman
#   g2  enhancement_shaman, beast_mastery_hunter, survival_hunter, fury_warrior, feral_bear
#   g3  affliction_warlock, destruction_warlock x2, elemental_shaman, balance_druid
#   g4  arcane_mage x2, shadow_priest, restoration_shaman, protection_paladin
#   g5  holy_paladin, priest_healer x2, restoration_druid, restoration_shaman
#
# Field names below are the wowsims proto fields, from proto/common.proto
# messages RaidBuffs, PartyBuffs, IndividualBuffs and Debuffs, so they can be
# written into a profile without translation.

meta:
  derived: 2026-08-10
  from: data/facts/roster.yaml
  scope: >-
    The fourteen DPS specs. Tanks and healers are out of the sim by ruling, but
    they are IN the raid and they supply buffs, so they appear here as sources.
  confidence: >-
    The class-to-buff mapping is ordinary 2.4.3 knowledge and is not separately
    sourced here. Where a buff depends on a TALENT rather than merely on a class
    being present, that is called out, because a talent audit already exists in
    talents.yaml and can settle it.

# Everything below reaches every player in the raid.
raid_wide:
  arcane_brilliance:
    from: arcane_mage, g4
  power_word_fortitude:
    from: priest_healer, g5
  shadow_protection:
    from: priest_healer, g5
  divine_spirit:
    from: priest_healer, g5
    note: >-
      Discipline talent. Both g5 priests are healers, and at least one being
      Discipline is likely rather than established. Flagged, not assumed.
    confidence: medium
  gift_of_the_wild:
    from: restoration_druid, g5
  bloodlust:
    from: any of the four shamans
    note: >-
      Heroism for Alliance. RAID WIDE ON THIS BUILD, and the reason recorded
      elsewhere for it is wrong. proto/common.proto marks the field
      `bool bloodlust = 7; // TBC ANNI - Lust is now raid wide`, so the
      Anniversary client made it raid-wide. roster.yaml justifies its
      shaman-in-every-party rule partly on Bloodlust being party-scoped, which
      is true of original 2.4.3 and not of the build being simulated. The
      output is unaffected, because a raid-wide buff reaches everyone either
      way; the published REASON was wrong and is corrected here.
    found_by: an adversarial review on 10 August 2026

# Everything below reaches one party only. A DPS spec gets the entry for ITS
# party and nothing from another.
party:
  g1:
    drums: {from: "a leatherworker, per roster.yaml leatherworker_in_every_party"}
    windfury_totem: {from: enhancement_shaman}
    strength_of_earth_totem: {from: enhancement_shaman}
    grace_of_air_totem: {from: enhancement_shaman}
    leader_of_the_pack: {from: feral_cat}
    sanctity_aura: {from: retribution_paladin}
    battle_shout: {from: arms_warrior}
  g2:
    drums: {from: "a leatherworker, per roster.yaml leatherworker_in_every_party"}
    windfury_totem: {from: enhancement_shaman}
    strength_of_earth_totem: {from: enhancement_shaman}
    grace_of_air_totem: {from: enhancement_shaman}
    leader_of_the_pack: {from: feral_bear}
    ferocious_inspiration: {from: beast_mastery_hunter}
    battle_shout: {from: fury_warrior}
  g3:
    drums: {from: "a leatherworker, per roster.yaml leatherworker_in_every_party"}
    totem_of_wrath: {from: elemental_shaman}
    wrath_of_air_totem: {from: elemental_shaman}
    mana_spring_totem: {from: elemental_shaman}
    moonkin_aura: {from: balance_druid}
    blood_pact: {from: "warlock imp, any of the three warlocks"}
  g4:
    mana_tide_totems:
      from: restoration_shaman
      note: >-
        ADDED 10 August 2026. g4's shaman is the Restoration one, and Mana Tide
        is the deep Restoration talent a raid healer takes. It was omitted, and
        the two Arcane Mages and the Shadow Priest lost it.
    drums: {from: "a leatherworker, per roster.yaml leatherworker_in_every_party"}
    wrath_of_air_totem: {from: restoration_shaman}
    mana_spring_totem: {from: restoration_shaman}
    devotion_aura: {from: protection_paladin}
  g5:
    mana_spring_totem: {from: restoration_shaman}
    note: g5 is all healers and no DPS spec sits in it, so nothing here reaches a profile.

# Per player rather than per party. WHICH BLESSING EACH SPEC TAKES IS A
# JUDGMENT and now lives at data/judgments/capture-fidelity.yaml under
# sim_profile_scope.blessings, because this block said in its own words that it
# was a raid decision and then made it, which is what AGENTS.md forbids. What
# stays here is only what the raid can supply.
individual:
  # WHAT THE RAID CAN SUPPLY. Which blessing each spec actually takes is a
  # JUDGMENT and lives at data/judgments/capture-fidelity.yaml under
  # sim_profile_scope.blessings. It was COPIED there rather than moved on the
  # first attempt, so both files decided it for an hour; a second review caught
  # that the block here was byte-identical to before the move.
  paladins_available: [retribution_paladin (g1), protection_paladin (g4), holy_paladin (g5)]
  blessings_each_paladin_can_maintain: 1
  unleashed_rage:
    to: every physical spec in g1 and g2
    from: enhancement_shaman
    note: An Enhancement talent, party-scoped, so it is really a party buff.
  shadow_priest_dps:
    to: g4 only
    from: shadow_priest
    note: >-
      NOT A HEADCOUNT. The simulator reads this field as the donor priest's DPS
      and grants a quarter of it as mana per five, so a value of 1 buys almost
      nothing. It was set to 1 as though it counted priests. It now carries
      1150, this project's own mean Shadow Priest figure across its three
      buffed anchors, so the number is ours rather than invented.


# On the boss. Every one of these reaches every attacker regardless of party.
debuffs:
  judgement_of_wisdom: {from: retribution_paladin or protection_paladin}
  misery: {from: shadow_priest, note: 5 percent increased spell damage taken}
  curse_of_elements: {from: "one of the three warlocks in g3"}
  curse_of_recklessness:
    from: warlock
    note: >-
      MUTUALLY EXCLUSIVE WITH curse_of_elements on the same target. Three
      warlocks means both can run, one each, and the third takes a damage curse.
    confidence: medium
  isb_uptime:
    from: destruction_warlock
    NOT_SENT: >-
      Improved Shadow Bolt. The proto types this as a DOUBLE, an uptime
      fraction, and an uptime is a rotation outcome rather than a setting, so
      the runner leaves it unset rather than inventing one. It is listed here
      because the raid does supply it, and it is marked because a reader would
      otherwise assume the profiles carry it. A second review pointed out that
      the earlier note read as though they did.
  faerie_fire:
    from: balance_druid
    note: >-
      IMPROVED Faerie Fire is the version this project models, and it is already
      credited in hit.yaml as 3 percent melee and ranged hit. It supplies NO
      spell hit in 2.4.3, which this project verified against the spell data.
  sunder_armor: {from: "the warriors, maintained by whoever is tanking"}
  blood_frenzy:
    from: arms_warrior
    note: >-
      TAKEN, AND THIS FILE SAID OTHERWISE. It was listed as not provided, on the
      reasoning that it needs 31 Arms points against a recorded 33/28/0 and so
      "MAY be available". It is not a may. The talent sits at rowIdx 6, the
      30-point tier, and the Arms talent string in talents.yaml decodes to
      bloodFrenzy 2 of 2. It is 4 percent physical damage taken by the boss,
      reaching all eight physical DPS specs, and it was the single largest
      omission an adversarial review found on 10 August 2026.
  expose_weakness_uptime:
    from: survival_hunter
    value: 0.98, measured rather than the preset's 0.9
    ruled_in: >-
      SENT FROM 15 August 2026, by the guild lead: "we must absolutely have
      expose weakness". It is worth 98.6 to 130.7 DPS to every physical spec in
      the raid except the Survival Hunter itself, which self-applies.
    previously_claimed: >-
      Until 15 August 2026 this key carried NOT_SENT, reading: "Also a double,
      and the same reasoning. It depends on the hunter's agility AND on how much
      of the fight the debuff is up, and the second half is a rotation outcome
      this project has not measured." The reason no longer holds, because the
      simulator ships a phase-specific answer at ui/core/proto_utils/utils.ts,
      Phase 3 being an uptime of 0.9 with a hunter agility of 1210.
    it_was_also_UNSENDABLE_not_merely_unsent: >-
      tools/run_sims.py::typed returned None for every field the proto types as
      a double, so this key could not have reached the simulator whatever this
      file said. A declined value and an impossible one looked identical from
      here. Both are fixed together.
    the_survival_hunter_gets_nothing_from_it_and_that_is_correct: >-
      sim/hunter/hunter.go zeroes the raid debuff for any hunter holding the
      talent, because that hunter applies it itself. It measures exactly 0.0 for
      this spec and every other physical spec gains.
  expose_weakness_hunter_agility:
    from: survival_hunter
    value: measured per anchor, 1119 entry, 1105 tier, 1152 best in slot
    ADDED: >-
      15 August 2026, WITH the uptime above and never without it.
      sim/core/debuffs.go gates the effect on uptime greater than zero and then
      derives the attack power as agility times 0.25, so an uptime sent alone
      buys EXACTLY NOTHING. This file named only the uptime, so patching the
      runner alone would have looked like a fix and delivered no damage.
    confidence: Good
    previously_claimed: >-
      1210 for a few hours on 15 August 2026, which is the simulator's own Phase
      3 figure at ui/core/proto_utils/utils.ts and was recorded at the time as
      an assumption rather than our hunter's agility. It is 5 to 9 percent high
      for this roster, and because the effect is exactly linear that is a direct
      over-credit to every physical spec.
    how_it_was_measured: >-
      BY BISECTION, because it cannot be read out of a run: wowsimcli has no
      stats subcommand, exposes no final player stats, and its target auras carry
      uptime and procs but no stacks. sim/hunter/hunter.go zeroes BOTH debuff
      fields for a hunter holding the talent, which is why our Survival Hunter is
      immune to the external value at any size, verified at 20000 agility for
      exactly 0.0. Removing the talent from its string lifts that immunity, so
      the external agility that reproduces the hunter's own self-applied result
      is its agility. Nine steps at 10000 iterations, per anchor.
    cross_checked_by_hand: >-
      Independently, sharing no step with the bisection: base 151 plus 4 for
      Night Elf, item and gem and enchant agility from the gear files, plus 20
      scroll and 20 food, plus Gift of the Wild at 14 times 1.35 and Grace of Air
      at 77 times 1.15, all multiplied by 1.1 for Blessing of Kings and 1.15 for
      Lightning Reflexes 5 of 5. That gives 1131 at best in slot against the
      measured 1152, agreement to 1.8 percent.
    the_uptime_and_the_agility_are_calibrated_TOGETHER: >-
      Each agility was solved with the uptime held at 0.98, which is itself
      measured: the hunter's own Expose Weakness debuff sits on the target for
      147.0 seconds of 150. The preset assumes 0.9. THE TWO MUST BE CHANGED
      TOGETHER OR NOT AT ALL, because only the pair reproduces what the hunter
      actually delivers.
    why_it_is_per_anchor: >-
      The hunter supplying the debuff is at the same gear anchor as everyone
      receiving it, so its agility moves with the anchor. tools/run_sims.py picks
      the figure from the anchor it is running.
  hunters_mark: {from: either hunter}
  improved_seal_of_the_crusader:
    from: retribution_paladin
    note: >-
      ADDED 10 August 2026 by a SECOND review, after the first found fifteen
      other things and missed this one. The Retribution string decodes
      improvedSealOfTheCrusader 3 of 3, and sim/core/debuffs.go applies it as 3
      percent increased crit taken by the boss for every attacker plus holy
      damage. Three paladins can hold Judgement of the Crusader beside the
      Judgement of Wisdom already credited, so it costs nothing to have.
      It reaches all thirteen simulated specs and is larger than several of the
      fifteen findings that preceded it.
  shadow_weaving:
    from: shadow_priest
    over_credited_slightly: >-
      The talent decodes 4 of 5, which is 8 percent, and the proto types this as
      a BOOL that applies the full five stacks at 10 percent. A bool cannot
      express a rank, so the profiles carry about 2 percent more shadow damage
      taken than this roster earns. Recorded rather than corrected, because the
      only alternative is to drop the debuff entirely and lose 8 percent to save
      2.
    note: >-
      REACHES EVERY CASTER, not only the priest. This was filed as not provided
      on the reasoning that the Shadow Priest maintains it inside its own
      rotation, which is true FOR THE PRIEST and false for the warlocks and the
      mages, who receive the shadow damage debuff without doing anything. The
      talent string decodes to shadowWeaving 4 of 5, not the five stacks the
      earlier note claimed.
  demoralizing_shout: {from: the warriors}
  thunder_clap: {from: the warriors}
  mangle:
    from: feral_bear
    note: >-
      MUTUALLY EXCLUSIVE with Trauma, which does not exist in TBC, so it simply
      runs. The Bear is in g2 and is a tank, so it is present in the raid even
      though it is out of the sim.

# Named so that their absence is deliberate rather than forgotten.
not_provided_by_this_roster:
  trueshot_aura: >-
    Needs 31 points in Marksmanship. talents.yaml records Beast Mastery at
    41/20/0 and Survival at 7/20/34, so neither hunter reaches it.
  improved_scorch: no Fire Mage. Both mages are Arcane.
  winters_chill: no Frost Mage.
  gift_of_arthas: a consumable, and consumables are not assumed.

  atiesh_any: level-60 raid loot, ruled out of scope.
  braided_eternium_chain: >-
    A group-buff item this project already ruled cross-scale and excluded from
    every baseline. Nobody in the roster is recorded wearing one.

