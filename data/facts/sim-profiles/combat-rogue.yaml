# What each reachable token replaces and what it costs. No priority is stated
# here; that is the council's call.
token_arithmetic:
  head_archimonde:
    piece: Slayer's Helm 31027
    replaces: Deathmantle Helm 30146
    bonus_gained: none alone; with the hands it makes the Slayer's 2-piece
    bonus_broken: none alone
  hands_azgalor:
    piece: Slayer's Handguards 31026
    replaces: Deathmantle Handguards 30145
    bonus_gained: none alone; with the head it makes the Slayer's 2-piece
    bonus_broken: >-
      Taking BOTH drops Deathmantle to two pieces, which keeps its 2-piece.
      Taking both while also wanting the Deathmantle 4-piece is impossible.
  note: >-
    This is one of the two specs in the roster where both early tokens are a
    clean gain rather than a trade, because the Tier 5 bonuses it keeps and the
    Tier 6 bonus it gains are all live for the spec.

# Slots the source published as full-clear picks and that were downgraded to fit
# the window, with what replaced them.
derived_slots:
  head: Cursed Vision of Sargeras 32235, Illidan, downgraded to Slayer's Helm
  shoulder: Slayer's Shoulderpads 31030, Mother Shahraz, kept Deathmantle
  chest: Slayer's Chestguard 31028, Illidan, downgraded to Midnight Chestguard
  wrist: Insidious Bands 32324, Teron Gorefiend, downgraded to Deadly Cuffs
  legs: Slayer's Legguards 31029, Illidari Council, kept Deathmantle
  feet: Shadowmaster's Boots 32366, Mother Shahraz, kept Edgewalker Longboots
  ring_1: Stormrage Signet Ring 32497, Illidan, kept Band of the Ranger-General
  ring_2: >-
    Band of the Eternal Champion 29301, Scale of the Sands Exalted, which four to
    six weeks does not reliably reach. Swap it in the moment the reputation
    lands; it is the better ring.
  weapons: >-
    Warglaive of Azzinoth 32837 and 32838, both Illidan. The listed pair is what
    a rogue actually holds. The other fallbacks the source names, Vengeful
    Gladiator's Slicer 33762 and Quickblade 33734, are Arena Season 3 and open
    five days after the phase.

notes:
  hit: >-
    The source states a 28% hit target, which is the dual-wield white cap, and
    says a raid without Improved Faerie Fire needs more hit gems. This guild
    rules Improved Faerie Fire assumed.
  routing: >-
    Warp-Spring Coil is rogue-only and draws almost no competition, while
    Dragonspine Trophy is contested across the whole melee camp.
  access: >-
    Merciless Gladiator's Quickblade is Arena Season 2, so a rogue who does not
    play arena runs Latro's Shifting Sword and loses a little.
