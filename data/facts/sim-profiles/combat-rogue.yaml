# THE WEAKEST DATA HERE. The guide publishes a gemming POLICY, never a per-slot
# map: agility in red, hit in yellow, Shifting in blue, and the meta needs two
# red, two yellow and two blue. Every gem below was assigned by applying that
# policy to socket colors read from data/facts/items.csv.
gems_derived: true

talents:
  entry: 20/41/0 Combat Swords
  entry_url: https://www.wowhead.com/tbc/talent-calc/rogue/0053201252-023305102005015002321051
  tier: 19/42/0 Combat Swords
  note: >-
    A mace main hand moves this to 16/45/0, per the same source.

consumables:
  flask: Flask of Relentless Assault
  elixirs_instead: Elixir of Major Agility plus Swiftness of Zanza
  against_demons: >-
    Elixir of Demonslaying, which the source calls more than twice as strong as
    the flask against demons. Almost every boss in Mount Hyjal and Black Temple
    is a demon or undead, so this is a tier-wide consumable rather than a niche
    one.
  food: Spicy Hot Talbuk for hit, or Warp Burger and Grilled Mudfish for agility
  weapon_main_hand: >-
    Windfury Totem where a shaman is in party, otherwise Adamantite Sharpening
    Stone
  weapon_off_hand: >-
    Deadly Poison VII on fights over thirty seconds, Adamantite Sharpening Stone
    on shorter ones
  scrolls: Scroll of Agility V, Scroll of Strength V
  potions: Haste Potion, Free Action Potion on stun fights, Super Healing Potion

