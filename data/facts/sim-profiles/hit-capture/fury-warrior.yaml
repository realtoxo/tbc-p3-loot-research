notes_from_the_previous_construction:
  READ_THIS_FIRST: 'THESE NOTES WERE WRITTEN FOR A TIER SET BUILT A DIFFERENT WAY, and are
    kept because the reasoning in them outlives the set. Read nothing here as describing the
    tier anchor as it now stands.

    The tier set was rebuilt on 14 August 2026 from the entry set plus the tokens the spec''s
    Phase 3 best-in-slot list actually wears, per the rule in tools/rebuild_tier_sets.py.
    Every construction note below predates that and several are now false against the file
    they sit in: one said a shoulder token ''is not available, so Voidheart Mantle is carried
    forward'' beside a file holding that token.

    THE ENTRY ANCHOR DID NOT CHANGE, so a note about entry gear, an availability correction
    or a random-suffix ruling still holds. A note about the TIER anchor does not. The anchor''s
    own `rebuilt` field is the authority on how it was made.'
  world_boss_ruling_2026_08_09: The guild lead ruled on 9 August 2026 that this guild does
    not run outdoor world bosses, so no Doom Lord Kazzak or Doomwalker drop may appear at
    any anchor. See data/judgments/capture-fidelity.yaml. Each replacement is the highest-EPV
    item in that slot's section of this spec's own workbook tab that is legal at the anchor.
    The blocklist is enforced at tools/check_capture_availability.py WORLD_BOSS_LOOT, which
    names both loot tables in full, because drops.csv covers the seven instanced zones only
    and carries neither boss. That blindness is why these slots passed every check until now.
    The ranged slot at both tier anchors goes from Barrel-Blade Longrifle (30724, Doomwalker)
    to Serpent Spine Longbow (30105, Lady Vashj, 33.23). Neither carries hit, so no total
    and no state moves.
  downgraded_slots: 'Against the full-clear Phase 3 list: head (Cursed Vision of Sargeras,
    Illidan, Black Temple boss 9) is not reachable, so tier_hands_only keeps the Entry Destroyer
    Battle-Helm and only tier_hands_and_head takes the Archimonde token. Shoulder (Onslaught
    Shoulderblades, Mother Shahraz, Black Temple boss 7) and chest (Onslaught Breastplate,
    Illidan, Black Temple boss 9) are not reachable at either tier state, so both keep the
    Entry Destroyer pieces throughout. Ring 1 (Stormrage Signet Ring, Illidan, Black Temple
    boss 9) is not reachable, so it keeps the Entry Band of the Ranger-General. Both weapons
    (Warglaive of Azzinoth pair, Illidan, Black Temple boss 9) are not reachable; no reachable
    early-tier weapon upgrade is named in the source guide for either hand, so both tier states
    keep the Entry Dragonstrike and Talon of Azshara. Hands: the full-clear guide''s own pick
    for this slot is Grips of Silent Justice (Shade of Akama, Black Temple boss 3), not the
    Onslaught token, but both tier states force the Azgalor Onslaught Gauntlets in because
    this file models the token being held, per the anchor definition. Six slots take a reachable
    full-clear pick unchanged, because their boss is within the reliably-dead set (early Mount
    Hyjal: Rage Winterchill, Azgalor; early Black Temple: Naj''entus through Reliquary of
    Souls, bosses 1 through 6): neck (Choker of Endless Nightmares, Supremus), back (Shadowmoon
    Destroyer''s Drape, Teron Gorefiend), wrist (Deadly Cuffs, Rage Winterchill), legs (Leggings
    of Divine Retribution, Gurtogg Bloodboil), feet (Dreadboots of the Legion, off an add
    at Reliquary of Souls) and ring 2 (Unstoppable Aggressor''s Ring, Gurtogg Bloodboil).
    Ranged (Barrel-Blade Longrifle, Doomwalker) is a world-boss drop, not gated by Mount Hyjal
    or Black Temple progression at all; it replaces the Entry ranged item at both tier states.
    Waist, both trinkets and both tier5_pieces_held slots are unchanged from Entry.'
  uncertain: Deadly Cuffs (wrist, hit 12) replaces Bracers of Eradication (hit 17) in the
    tier state even though it carries LESS hit, because that is what the sourced full-clear
    guide picks for the slot; the guide is followed as read rather than re-optimized for hit.
    Whether a raider four to six weeks in has actually killed Doomwalker for the Barrel-Blade
    Longrifle is not verified; it does not change the hit total either way, since both the
    entry ranged item and this one carry 0 hit. Grips of Silent Justice's own hit rating was
    not looked up, since it is not used in any state here. Vengeance Wrap's printed tooltip
    carries 0 hit; its red socket's +2 hit bonus is a gem-contingent socket bonus and is excluded
    per the counting rule that gems are not counted.
