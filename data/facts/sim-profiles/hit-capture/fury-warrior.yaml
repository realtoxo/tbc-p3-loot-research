# Fury Warrior. Item hit rating only, at two gear anchors. Collected 9 August 2026.
#
# COUNTING RULES applied throughout: item hit rating only, no gems, no
# enchants, no consumables, no talents, no racials, no raid buffs. No PvP
# armor (PvP weapons allowed). No Phase 4 content. Cap is melee_special, raw
# 142 rating; this spec dual-wields. Every hit: value, including 0, is the
# number printed on that item's own tooltip, read from the Wowhead TBC
# Classic item XML endpoint (https://www.wowhead.com/tbc/item=<id>&xml),
# never inferred and never a socket-bonus or gem figure.
#
# This file does NOT reproduce the 142 / 124 figures previously recorded in
# data/facts/hit.yaml. Those came from a greedy-EPV workbook selection and
# from a rule that swapped in all five Tier 6 pieces. Neither method is used
# here. See hit.yaml's tier_anchor_assumption_is_provisional for why that
# rule was retired.

