      note: The published Phase 3 list's pick is the one recorded in hit_by_slot for both
        tier anchors. The EPV workbook ranks the Entry-anchor belt higher and gives no reason
        to swap off it, since it is craftable and always available. Not resolved here; both
        are named so the disagreement stays visible.
  uncertain: 'Confidence in the Entry set is LOW to MODERATE. Wowhead''s own BiS guide pages
    returned only page chrome when fetched (the gear tables render client-side and were not
    retrievable), so every item and slot selection was taken from a single secondary compiled
    source instead: https://tbc-bis-guide.com/warlock/affliction/phase-2 (Entry) and https://tbc-bis-guide.com/warlock/affliction/phase-3
    (Tier). That source was not cross-checked against a second independent BiS list, only
    against this project''s own data/research/epv-workbook/Aff.csv for hit values on the items
    it named. A large part of the 55-point gap to the retired supplied_at_p3_entry figure
    (242) is expected, since that figure came from a rule that greedily gears by a workbook
    column already weighting hit; but the remainder is not fully explained, and given the
    single-source basis for item selection, the Entry total_item_hit of 187 should be treated
    as a reasonable estimate, not a verified figure, until it is checked against Wowhead directly
    or a second independent guide. BOTH FIGURES IN THIS PARAGRAPH WERE WRONG WHEN WRITTEN.
    It said a 102-point gap against an entry total of 176. The total was 176 at the time and
    is 187 since the Wand of the Forgotten Star was corrected from 0 to its real 11 spell
    hit, and the gap to 242 was never 102 on either reading. Corrected 9 August 2026. Waist
    at the Tier anchor is a genuine conflict between sources: see notes.contested_slots. Back
    (Nethervoid Cloak, Hyjal trash) and Ring2 (Ring of Ancient Knowledge, Black Temple trash)
    are trash drops rather than boss drops; both are treated as available as soon as the raid
    enters the zone, since trash precedes every boss, but this was not checked against a specific
    week-4-to-6 trash-clear state.'
