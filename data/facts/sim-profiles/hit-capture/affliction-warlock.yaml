notes:
  neck_changed_against_the_workbook: 'CHANGED 9 August 2026 at both tier anchors, following
    data/research/epv-workbook/Aff.csv. The published Phase 3 list''s neck, The Sun King''s
    Talisman (30015: 41 spell damage, 24 spell crit, 0 spell hit per data/facts/items.csv),
    was replaced with Translucent Spellthread Necklace (32349, Reliquary of Souls: 46 spell
    damage, 24 spell crit, 15 spell hit), which the workbook ranks 21.43 higher (79.03 against
    57.60). The swap is mechanically one-sided: the replacement carries at least as much of
    every stat this spec uses plus 15 spell hit toward the spell cap, and the capture sat
    5 rating SHORT of its 165 net target at tier_hands_only before the swap. Reliquary of
    Souls is position 5 in Black Temple, inside the reliably-down set per data/facts/progression.yaml,
    and the Destruction and Shadow captures already wear this necklace at the same anchors.
    No set bonus rides on the slot. tier_hands_only total_item_hit rises from 160 to 175 and
    tier_hands_and_head from 174 to 189. Entry is untouched; the necklace is a Phase 3 drop.'
  hands_held_against_the_workbook: 'CHECKED 9 August 2026 against data/research/epv-workbook/Aff.csv
    and LEFT AS PUBLISHED. The workbook ranks Anger-Spark Gloves (30725, Doomwalker world
    boss, Phase 1, 20 spell hit) first at 97.73 and Voidheart Gloves (28968) thirteenth at
    54.44, a 43.29 gap, and the entry set wears the Voidheart pair anyway. The reason is a
    set bonus the workbook cannot see: the entry set wears Voidheart Mantle (28967) AND Voidheart
    Gloves (28968), which per data/facts/tokens.yaml are two pieces of Voidheart Raiment and
    hold its 2-piece bonus, and the workbook''s own Intro states that set bonuses are not
    included in any item value. Swapping the gloves to Anger-Spark would leave one Voidheart
    piece and drop the bonus. This capture previously recorded set_bonuses_held as empty at
    entry, which was wrong; the bonus was held all along and is now recorded. No total moves,
    since the pick is unchanged. Whether the 2-piece proc outweighs the 43.29 EPV gap plus
    20 spell hit is not decided here; both sides are stated so the council can weigh them.'
  availability_corrections: 'Entry ring2: Band of Eternity (friendly) (29302) is a Scale of
    the Sands reputation reward, and Scale of the Sands is the Mount Hyjal faction, so it
    cannot be held before Phase 3 opens. Replaced with Band of Crimson Fury (28793, Magtheridon''s
    Lair, Phase 1, 16 spell hit), the top-ranked prephase Finger item in the ladder not already
    held in ring1 (Ring of Endless Coils). Entry total_item_hit rises from 187 to 203.'
  downgraded_slots: 'Weapon (Entry and tier_hands_only): the source guide''s listed pick,
    Atiesh, Greatstaff of the Guardian, is not a realistic hold and was replaced. Atiesh is
    assembled from 40 Splinters of Atiesh, a drop from the 40-player Vanilla Naxxramas raid,
    and data/research/epv-workbook/Aff.csv itself tags the item''s source as "Classic" (phase
    0), separate from every Phase 1 to 3 raid tier this project covers. Available searches
    did not settle the exact patch-level history of Naxxramas access during the original Burning
    Crusade (one source found says the old raid was not closed until Wrath of the Lich King''s
    release, which would mean it was technically enterable throughout Burning Crusade), and
    no source confirms whether the current TBC Anniversary realms carry old Naxxramas forward
    at all. That uncertainty does not change the conclusion: a 45-week-old vanilla raid requiring
    a coordinated 40-player clear and a guild-wide splinter turn-in is not a realistic Phase
    3 hold for this fact table regardless of the exact toggle, so it is replaced with the
    best Phase 1/2 main-hand-plus-off-hand pair the workbook ladder supports: Merciless Gladiator''s
    Spellblade (main hand, Season 2 PvP, 15 hit) plus Jewel of Infinite Possibilities (off
    hand, Karazhan, Netherspite, 21 hit). Combined EPV (290.85) beats the best Phase 1/2 two-hand
    staff (Merciless Gladiator''s War Staff, 280.53), so this is not a hit-driven pick. Head:
    Hood of the Malefic (Archimonde) is unavailable in hands_only, so the Entry pick Destruction
    Holo-gogs (0 hit) is carried forward; the Malefic head slots in once hands_and_head applies.
    Shoulder: Mantle of the Malefic (Mother Shahraz, late Black Temple) is not available in
    either tier state, so the Entry piece Voidheart Mantle (Gruul''s Lair, 14 hit) is carried
    forward at both. Legs: Leggings of the Malefic (Illidari Council, late Black Temple) is
    not available in either tier state, so the Tier 5 piece Leggings of the Corruptor (24
    hit), already worn at Entry, is kept at both. Chest stays Vestments of the Sea-Witch (Tier
    5 era, Serpentshrine Cavern) at all three anchors; the source list itself never upgrades
    this slot to Robe of the Malefic. Trinket1: The Skull of Gul''dan (Illidan, last Black
    Temple boss) is not available in either tier state, so the Entry set''s other trinket,
    Icon of the Silver Crescent, is swapped into trinket1 (0 hit either way) to avoid holding
    Quagmirran''s Eye in both trinket slots at once. Off hand (hands_and_head): Tempest of
    Chaos and its Chronicle of Dark Secrets off-hand pairing both require the Hyjal progression
    this state assumes, so they replace the Phase 1/2 main-hand/off-hand pair used at the
    other two anchors (17 hit each instead of 15 and 21).'
