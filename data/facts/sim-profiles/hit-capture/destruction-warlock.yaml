# Destruction Warlock item hit rating, ENTRY and TIER anchors.
#
# COLLECTS FACTS ONLY. No priority, ranking or recommendation is made or
# implied by this file. Per-item raw hit rating, summed, with provenance.
#
# CAP  Destruction Warlock caps on SPELL hit, raw 202 rating (16%), per
#      data/facts/hit.yaml. Spell hit and melee hit are different stats on
#      2.4.3 items; every figure below is SPELL hit only. Where an item
#      carries no hit rating at all, its row still reports hit: 0 so the sum
#      stays checkable.
#
# NOT COUNTED  Gems, enchants, sockets, talents, racials, consumables and raid
#      buffs. Improved Faerie Fire grants melee and ranged hit only in 2.4.3
#      and is not credited to any caster, this spec included.

