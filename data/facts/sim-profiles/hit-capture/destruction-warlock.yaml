notes:
  world_boss_ruling_2026_08_09: >-
    The guild lead ruled on 9 August 2026 that this guild does not run outdoor
    world bosses, so no Doom Lord Kazzak or Doomwalker drop may appear at any
    anchor. See data/judgments/capture-fidelity.yaml. Each replacement is the
    highest-EPV item in that slot's section of this spec's own workbook tab
    that is legal at the anchor. The blocklist is enforced at
    tools/check_capture_availability.py WORLD_BOSS_LOOT, which names both loot
    tables in full, because drops.csv covers the seven instanced zones only and
    carries neither boss. That blindness is why these slots passed every check
    until now.
    The entry hands slot goes from Anger-Spark Gloves (30725, Doomwalker, 20
    spell hit) to Spellfire Gloves (21847, Tailoring, 110.35, no hit). The
    workbook labels that row "(Fire/Arcane)", which is a school-scoring variant
    and not a group-buff row.
    Entry total_item_hit falls from 190 to 170, against a 165 target, so this
    spec stays at its cap on items alone with 5 rating to spare. It was 25.
  availability_corrections: >-
    Entry ring_2: Band of Eternity (friendly) (29302) is a Scale of the Sands
    reputation reward, and Scale of the Sands is the Mount Hyjal faction, so
    it cannot be held before Phase 3 opens. Replaced with Band of Crimson
    Fury (28793, Magtheridon's Lair, Phase 1, 16 spell hit), the top-ranked
    prephase Finger item in the ladder not already held in ring_1 (Ring of
    Endless Coils). Entry total_item_hit rises from 174 to 190.
  downgraded_slots: >-
    Against the full-clear Phase 3 list: head is Hood of the Corruptor (T5,
    carried from entry) in hands_only, moving to Hood of the Malefic (T6,
    Archimonde) only in hands_and_head. Shoulder drops the T6 token (Mantle
    of the Malefic, Mother Shahraz, late Black Temple) for Blood-cursed
    Shoulderpads (Gurtogg Bloodboil, early Black Temple) in both tier states.
    Legs drops the T6 token (Leggings of the Malefic, Illidari Council, late
    Black Temple) for Leggings of Channeled Elements (Kaz'rogal, Mount Hyjal,
    early) in both tier states. Chest never takes the T6 token at all: Robe
    of the Malefic needs Illidan (late Black Temple) and Vestments of the
    Sea-Witch (Serpentshrine Cavern, Phase 2) outranks it anyway per the
    source workbook's EPV column, so this is not a forced downgrade. Trinket
    drops The Skull of Gul'dan, the guide's stated top pick, entirely: its
    source is Illidan Stormrage, late Black Temple, unavailable in both tier
    states, so Sextant of Unstable Currents (Phase 2) is carried forward
    instead. Main hand only reaches Tempest of Chaos (Archimonde) in
    hands_and_head; hands_only uses The Maelstrom's Fury (Naj'entus, early
    Black Temple) instead.
  uncertain: >-
    (1) The neck pick at both tier states, Translucent Spellthread Necklace,
    is sourced by the reference workbook to a Black Temple boss it names
    "Devourer of Souls." That name could not be matched against the standard
    nine-boss Black Temple kill order (Naj'entus, Supremus, Shade of Akama,
    Teron Gorefiend, Gurtogg Bloodboil, Reliquary of Souls, Mother Shahraz,
    Illidari Council, Illidan Stormrage) and was not independently verified
    this session; if it is in fact a late-Black-Temple source, drop 15 hit
    from both tier totals. (2) "Early Black Temple" was read as the first six
    bosses in that order, since the brief names only the last three (Mother
    Shahraz, Illidari Council, Illidan) as unavailable; crediting Gurtogg
    Bloodboil and Reliquary-of-Souls-adjacent drops is this session's
    inference, not a brief-stated boundary. (3) Both Wowhead guide pages
    render their gear tables client-side and could not be fetched directly
    this session (browser automation tool disconnected); slot and boss
    assignments were cross-checked through a third-party text-extraction
    proxy for corroboration only, while every hit number and item id comes
    from the in-repo epv-workbook. (4) Per-slot picks follow the workbook's
    EPV ranking strictly, including where it favors a zero-hit item over a
    same-slot alternative carrying hit (for example off-hand at entry,
    Flametongue Seal over Jewel of Infinite Possibilities); this is a
    mechanical application of the source's own ranking, not a hit-maximizing
    choice. (5) Main hand plus off-hand was chosen over a two-handed staff at
    both anchors because the combined EPV of the two best one-hand items
    exceeds the best available two-handed staff at every anchor checked; this
    combined-value comparison is this session's arithmetic on the workbook's
    numbers, not a stated guide recommendation.
