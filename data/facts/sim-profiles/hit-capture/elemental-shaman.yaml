notes_from_the_previous_construction:
  READ_THIS_FIRST: 'THESE NOTES WERE WRITTEN FOR A TIER SET BUILT A DIFFERENT WAY, and are
    kept because the reasoning in them outlives the set. Read nothing here as describing the
    tier anchor as it now stands.

    The tier set was rebuilt on 14 August 2026 from the entry set plus the tokens the spec''s
    Phase 3 best-in-slot list actually wears, per the rule in tools/rebuild_tier_sets.py.
    Every construction note below predates that and several are now false against the file
    they sit in: one said a shoulder token ''is not available, so Voidheart Mantle is carried
    forward'' beside a file holding that token.

    THE ENTRY ANCHOR DID NOT CHANGE, so a note about entry gear, an availability correction
    or a random-suffix ruling still holds. A note about the TIER anchor does not. The anchor''s
    own `rebuilt` field is the authority on how it was made.'
  world_boss_ruling_2026_08_09: 'The guild lead ruled on 9 August 2026 that this guild does
    not run outdoor world bosses, so no Doom Lord Kazzak or Doomwalker drop may appear at
    any anchor. See data/judgments/capture-fidelity.yaml. Each replacement is the highest-EPV
    item in that slot''s section of this spec''s own workbook tab that is legal at the anchor.
    The blocklist is enforced at tools/check_capture_availability.py WORLD_BOSS_LOOT, which
    names both loot tables in full, because drops.csv covers the seven instanced zones only
    and carries neither boss. That blindness is why these slots passed every check until now.
    Two slots moved. The entry main hand goes from Talon of the Tempest (30723, Doomwalker,
    9 spell hit) to Merciless Gladiator''s Spellblade (32053, Season 2 arena, 235.32, 15 spell
    hit). PvP WEAPONS are allowed at every anchor and PvP armor is not. Merciless Gladiator''s
    Gavel (32963) ties it exactly on EPV and on hit, so either yields the same totals. The
    back slot at both tier anchors goes to Brute Cloak of the Ogre-Magi (28797, High King
    Maulgar, 51.74), which carries no hit either way. Entry total_item_hit RISES from 46 to
    52, because the replacement carries more hit than the world-boss weapon did. THIS SENTENCE
    USED TO END "the state does not change: this spec is short of 89 at entry before and after",
    and it was overtaken the same day. The target is 51 rating, not 89, because Nature''s
    Guidance was credited after this note was written, and 52 clears it. This anchor is FULL.
    See hit.yaml elemental_shaman.additional_talents. Kept rather than silently rewritten,
    because the swap above did move the figure and the reason it no longer decides anything
    is worth reading.'
  availability_corrections: 'Entry ring_2: Band of Eternity (friendly) (29302) is a Scale
    of the Sands reputation reward, and Scale of the Sands is the Mount Hyjal faction, so
    it cannot be held before Phase 3 opens. Replaced with Ring of Endless Coils (30109, Serpentshrine
    Cavern, Phase 2), the ladder''s next-ranked prephase Finger item after Ring of Unrelenting
    Storms, which ring_1 already holds. Both items carry 0 hit, so total_item_hit is unchanged.'
  downgraded_slots: 'Both tier states start from the published Phase 3 full-clear list and
    downgrade every slot the published list fills from a late Black Temple boss (Illidan,
    Illidari Council, Mother Shahraz) or that carries no non-late alternative. Head: the published
    Skyshatter Headguard (Archimonde) is held only in tier_hands_and_head; tier_hands_only
    at first reverted to the Entry head, Cyclone Faceguard, and was then corrected to Cataclysm
    Headpiece — see notes.off_piece_corrections_2026_08_09. Shoulder: the published Skyshatter
    Mantle (Mother Shahraz) is replaced by the crafted Mantle of Nimble Thought in both tier
    states. Back: the published Cloak of the Illidari Council (Illidari Council) is replaced,
    in both tier states, by Brute Cloak of the Ogre-Magi from High King Maulgar. This sentence
    named Ancient Spellcloak of the Highborne until 9 August 2026 and argued for it precisely
    BECAUSE it was an outdoor world-boss drop with no raid-lockout gate; the ruling that day
    made that the reason it is out. Chest: the published Skyshatter Breastplate (Illidan)
    is replaced by Chestguard of Relentless Storms, a Mount Hyjal trash drop, in both tier
    states; this also outranks holding the Entry Cataclysm Chestpiece (Tier 5 token), so no
    Tier 5 chest is kept. Legs and hands need no downgrade: Leggings of Channeled Elements
    drops from Kaz''rogal (early Mount Hyjal) and Skyshatter Gauntlets from Azgalor (early
    Mount Hyjal, the Tier 6 hands token), both reliably dead per the brief. Because the legs
    upgrade already drops the second Cataclysm Regalia token, no Tier 5 set bonus is held
    at either tier state; the one Tier 5 piece at tier_hands_only is the corrected head (see
    notes.off_piece_corrections_2026_08_09), which alone carries no bonus. Ring 1 (Ring of
    Ancient Knowledge, Black Temple trash) and ring 2 (Band of the Eternal Sage, a Tanaris
    reputation reward) needed no downgrade; neither depends on a late boss. Off-hand: the
    published Antonidas''s Aegis of Rapt Concentration (Archimonde) is replaced by Chronicle
    of Dark Secrets, a Rage Winterchill (early Mount Hyjal) drop, in both tier states, since
    it is available earlier and carries more item hit (17 vs. 0) than the published pick.
    Waist (Flashfire Girdle, Shade of Akama) and feet (Slippers of the Seacaller, High Warlord
    Naj''entus) and the relic (Totem of Ancestral Guidance, Teron Gorefiend) are all early
    Black Temple drops and needed no downgrade, per the brief''s ruling that Black Temple
    bosses before Mother Shahraz are reliably dead by week four to six.'
  uncertain: 'The published Phase 2 and Phase 3 guides both build around a two-hand staff
    (The Nexus Key at Entry, Zhar''doom, Greatstaff of the Devourer at full Phase 3 clear)
    with no off-hand item equipped alongside it, confirmed by direct tooltip lookup on both
    items. That contradicts this task''s stated build (main hand plus a shield or off-hand
    item). This file therefore substitutes the highest-EPV one-hand weapon available at each
    anchor from data/research/epv-workbook/Ele.csv instead of the guides'' own main-hand pick:
    Talon of the Tempest at Entry, The Maelstrom''s Fury at both tier states. The published
    off-hand choices (Fathomstone at Entry, Antonidas''s Aegis of Rapt Concentration in the
    full Phase 3 clear) are kept or substituted as noted above. Ring 2 at the tier anchor,
    Band of the Eternal Sage, requires Sage''s Covenant reputation; how much grind that takes
    to reach by week four to six was not independently verified. The Lightning Capacitor trinket
    and both totems (Totem of the Void, Totem of Ancestral Guidance) carry no hit rating on
    their Wowhead tooltips, verified directly rather than assumed. Per-item hit values were
    cross-checked against data/research/epv-workbook/Ele.csv''s stat columns and, for the
    Skyshatter and Cataclysm tier pieces, against the item-set pages directly; both sources
    agree everywhere checked. Item hit totals differ between the two tier states (72 at tier_hands_only,
    54 at tier_hands_and_head) because the corrected hands_only head, Cataclysm Headpiece,
    carries 18 spell hit while the Skyshatter Headguard token carries 0: on this tab, clearing
    Archimonde COSTS 18 item hit at the head slot. See notes.off_piece_corrections_2026_08_09.'
  off_piece_corrections_2026_08_09: 'ADDED 9 August 2026, resolving entries in data/facts/sim-profiles/hit-capture-review/open-divergences.yaml.
    HEAD, tier_hands_only only: Cyclone Faceguard (29035, Tier 4, 0 spell hit) is replaced
    by Cataclysm Headpiece (30171, the Tier 5 head from Lady Vashj, Phase 2, 18 spell hit,
    Ele.csv 136.91 against 116.01, and still ahead at 130.79 on the tab''s own If-Hit-Capped
    column). At this anchor the Cyclone shoulder is already replaced by Mantle of Nimble Thought,
    so no Cyclone 2-piece covers the hold, and the spec is 35 rating short of its spell hit
    cap, so the 18 hit is real, not surplus. Total rises 54 to 72. The SAME item at ENTRY
    is deliberately NOT swapped: there the capture wears Cyclone head plus Cyclone shoulder,
    which is a held Tier 4 2-piece (now recorded in entry set_bonuses_held) that the workbook''s
    per-item score cannot see, and breaking a held bonus on a score the bonus is invisible
    to would substitute one uncited reading for another. The audit''s claim that "both heads
    carry 0 spell hit" was itself wrong: items.csv gives Cataclysm Headpiece 18 spell hit,
    so the entry hold costs 18 hit on a spec 43 short at entry — recorded as the figure the
    council reads when pricing the Cyclone 2-piece. The trinket_2 divergence (Icon of the
    Silver Crescent against Sextant of Unstable Currents, all three anchors) was reviewed
    and left: neither trinket carries hit or a stat the spec cannot use, so no mechanic separates
    them, and the 21.2 delta is proc valuation the two sources price differently; a sim or
    the guide''s stated trinket reasoning would settle it.'
