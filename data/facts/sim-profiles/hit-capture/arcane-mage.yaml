notes:
  downgraded_slots: >-
    Back: Cloak of the Illidari Council (Illidari Council, late Black Temple)
    has no reachable named alternative in the guide, so the Entry piece
    (Royal Cloak of the Sunstriders) is kept in both tier states. Chest:
    Robes of the Tempest (Illidan, late Black Temple) is not used; the guide
    calls Robes of Tirisfal best in slot in most sets on its own merits, so
    it is kept in both tier states regardless of Illidan access. Legs:
    Leggings of the Tempest (Illidari Council token) is unreachable;
    Leggings of Channeled Elements (Kaz'rogal, Mount Hyjal, reachable before
    Azgalor) is the guide's other named BiS pick for this slot and is used in
    both tier states. Hands: the Azgalor token, Gloves of the Tempest, is
    used in both tier states per the brief. Head: the Archimonde token, Cowl
    of the Tempest, is available in tier_hands_and_head but not equipped; see
    notes.uncertain. Trinket 1: The Skull of Gul'dan (Illidan) has no
    reachable named alternative, so the Entry piece (Serpent-Coil Braid,
    itself still called a top pick by the guide) is kept. Weapon: Zhar'doom,
    Greatstaff of the Devourer (Illidan) is never reachable at this anchor.
    Tempest of Chaos (Archimonde) is reachable only in tier_hands_and_head,
    where it replaces the two-hand Nexus Key and pulls in Chronicle of Dark
    Secrets (Rage Winterchill, reachable in both states but only useful
    paired with a one-hand main hand) as an off-hand.
  uncertain: >-
    Head in tier_hands_and_head: the guide states, unconditionally, that Cowl
    of Tirisfal is "the uncontested winner for this slot... it provides
    synergy for the set bonus from Tirisfal Regalia, which more than makes up
    the difference" over Cowl of the Tempest (+13 spell hit). That statement
    is followed literally here. But the guide's own full-clear single-target
    set reaches this conclusion while also holding Leggings of Tirisfal, for
    a genuine 4-piece bonus; at this anchor, legs has already moved to
    Leggings of Channeled Elements for a reachable spell hit gain, so only
    three Tirisfal pieces are held (head, shoulder, chest) and the 4-piece
    bonus is NOT active, only the 2-piece is. Whether the council still
    prefers keeping the head in Tirisfal for a 2-piece-only bonus, or would
    rather wear Cowl of the Tempest for the token grant plus 13 more item
    hit, is not settled by any source and no simulation has been run. If the
    token is worn instead, tier_hands_and_head's total_item_hit rises from 84
    to 97 and set_bonuses_held becomes empty.
    Trinket 2 at both tier states is reported as the Entry piece, Icon of the
    Silver Crescent, rather than the full-clear pick, Ashtongue Talisman of
    Insight, which requires Exalted with the Ashtongue Deathsworn. Whether
    Exalted is reachable by week four to six could not be verified against
    any source, so it was not assumed. Its tooltip carries no hit rating
    regardless (a spell-crit-triggered haste proc), so total_item_hit is
    unaffected either way.
    Waist: Anetheron's Noose was picked over the equally-ranked Waistwrap of
    Infinity with no stated reason beyond guide ordering; both carry 0 hit,
    so totals are unaffected by which is actually held.
    Weapon, both tier states: Vengeful Gladiator's Battle Staff (Season 3
    arena points) is a legal PvP weapon per the brief and is named by the
    guide as a lesser option below both raid picks. It was not modeled
    because reaching the required arena rating within four to six weeks is
    not verifiable from any source here, and the guide itself ranks it below
    the raid options used above.
    Entry figure corroboration: this capture's entry total_item_hit was 62
    (matching the "62 item spell hit" figure the task brief attributes to a
    previous capture, against this repository's currently recorded 53) before
    ring_1 was corrected from Band of Eternity (29302, a Scale of the Sands
    reward) to Ashyen's Gift (29172, Cenarion Expedition, Phase <=2, 21 spell
    hit), which is the entry anchor's own Band of Eternity being unreachable
    before Mount Hyjal opens; that correction raises the figure to 83. Both
    the earlier 62/53 pair and the corrected 83 leave this spec short of its
    stated 76-rating net target at the entry anchor; this capture cannot say
    which of 62 or 53 was right for the previously recorded fact, only that
    the sourced entry set here now sums to 83.
  availability_corrections: >-
    Entry ring_1: Band of Eternity (29302) is a Scale of the Sands reputation
    reward, and Scale of the Sands is the Mount Hyjal faction, so it cannot be
    held before Phase 3 opens. Replaced with Ashyen's Gift (29172, Cenarion
    Expedition, Phase <=2 drop, 21 spell hit), the next-ranked prephase Finger
    item in the ladder after Band of Eternity itself; ring_2 already holds the
    ladder's other prephase candidate, Violet Signet of the Archmage. Entry
    total_item_hit rises from 62 to 83.
