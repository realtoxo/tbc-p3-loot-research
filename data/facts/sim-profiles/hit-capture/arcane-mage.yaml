# Arcane Mage hit capture. Collected 9 August 2026.
#
# Cap: spell, raw 202 rating (16%), net target after talents 76 rating (per the
# task brief; not reproduced here). Weapon is a two-hand staff (The Nexus Key)
# at Entry and at tier_hands_only, dropped for a one-hand main hand plus
# off-hand at tier_hands_and_head (Tempest of Chaos plus Chronicle of Dark
# Secrets), so main_hand and off_hand are reported as separate keys. Ranged
# slot carries a wand throughout.
# Improved Faerie Fire is melee and ranged hit only in 2.4.3 and grants this
# spec no spell hit, so it is not credited anywhere below.
#
# Every hit value below is the "Improves spell hit rating by N" equip line
# read directly from each item's nether.wowhead.com (2.4.3) tooltip via the
# item page, cross-checked against the guide's own item choice and boss
# source. Socket-bonus hit (e.g. Cowl of Tirisfal's +4 if the socket is filled
# right) is NOT included, matching the convention used throughout this file
# set: the bonus is conditional on gem choice, not printed unconditionally.

