  tier:
    url: https://web.archive.org/web/20220530151300/https://tbc.wowhead.com/guides/shadow-priest-dps-bt-hyjal-phase-3-best-in-slot-gear-burning-crusade
    title: Burning Crusade Classic Shadow Priest DPS Best in Slot (BiS) Phase 3 Gear Guide
      - Wowhead (attempted, did not resolve)
    observed: 2026-08-09
    note: 'This archive snapshot did NOT carry the Phase 3 tables: its embedded payload resolved
      to the Pre-Raid BiS guide''s text instead, an apparent caching mismatch at capture time.
      No other accessible rendering of the live Phase 3 guide could be produced. The TIER
      anchor below is therefore built from data/research/epv-workbook/Shad.csv (the in-repo
      captured EPV ladder, itself sourced from Wowhead item data plus a shadowpriest.com Phase
      3 sim doc; see that file''s own credit line and data/research/epv-workbook/PROVENANCE.md)
      rather than from a directly read Wowhead Phase 3 guide page. Selection rule: for each
      slot, start from the ENTRY pick and only replace it with a Phase 3 item if that item
      outranks it in the ladder''s own EPV ordering AND the item''s boss is not one of the
      excluded late-Black-Temple bosses (Illidan Stormrage, the Illidari Council, Mother Shahraz)
      and, for Archimonde specifically, only in the hands_and_head state. Hands and Head are
      additionally force-set to the Absolution Regalia tokens (Handguards of Absolution, Hood
      of Absolution) per state, because that forcing is the entire content of the hands_only
      / hands_and_head distinction the brief asks for, not a ladder-rank outcome.'
