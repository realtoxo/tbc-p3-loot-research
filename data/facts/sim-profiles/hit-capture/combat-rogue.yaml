notes_from_the_previous_construction:
  READ_THIS_FIRST: 'THESE NOTES WERE WRITTEN FOR A TIER SET BUILT A DIFFERENT WAY, and are
    kept because the reasoning in them outlives the set. Read nothing here as describing the
    tier anchor as it now stands.

    The tier set was rebuilt on 14 August 2026 from the entry set plus the tokens the spec''s
    Phase 3 best-in-slot list actually wears, per the rule in tools/rebuild_tier_sets.py.
    Every construction note below predates that and several are now false against the file
    they sit in: one said a shoulder token ''is not available, so Voidheart Mantle is carried
    forward'' beside a file holding that token.

    THE ENTRY ANCHOR DID NOT CHANGE, so a note about entry gear, an availability correction
    or a random-suffix ruling still holds. A note about the TIER anchor does not. The anchor''s
    own `rebuilt` field is the authority on how it was made.'
  availability_corrections: 'tier_hands_only chest: Midnight Chestguard (30905) drops from
    Archimonde, and tier_hands_only is defined as Archimonde not being down. Replaced with
    Nether Shadow Tunic (32252, Black Temple, Supremus, 35 melee hit), the next-ranked Phase
    3 leather chest item in the ladder, legal because Supremus is an early Black Temple boss
    well inside the four-to-six-week window. Midnight Chestguard is left unchanged in tier_hands_and_head,
    where Archimonde is down and the item is legitimate. tier_hands_only total_item_hit rises
    from 217 to 223.'
  downgraded_slots: 'Both tier states start from the same Phase 3 downgrade already recorded
    in data/facts/sim-profiles/combat-rogue.yaml (head, chest, wrist, ring_2 and the weapons
    swapped from the published full-clear list to what is reachable four to six weeks in).
    tier_hands_only applies one further downgrade beyond that file: the head reverts from
    Slayer''s Helm 31027 (Archimonde) back to Deathmantle Helm 30146, since this state assumes
    only the Azgalor hands token is in hand. Everything else in tier_hands_only matches tier_hands_and_head
    except chest, which is Nether Shadow Tunic in tier_hands_only and Midnight Chestguard
    in tier_hands_and_head — see notes.availability_corrections.'
  uncertain: 'Every hit value above is the base "Improves hit rating by N" equip effect read
    from each item''s Wowhead tooltip. Socket bonuses that grant hit (Slayer''s Helm +4 if
    the socket is filled correctly, Edgewalker Longboots +3) are NOT included, on the same
    reasoning the brief uses to exclude gems: the bonus is conditional on gem choice, not
    printed unconditionally on the item. If the council wants socket-bonus hit counted, hands_only
    and tier_hands_and_head both undercount by 3 (boots) and tier_hands_and_head undercounts
    by an additional 4 (helm) when the sockets are filled to meet the bonus. Also unresolved,
    and inherited from the source profile: whether a rogue at the tier anchor actually holds
    Slayer''s 2-piece plus Deathmantle 2-piece (as modeled in tier_hands_and_head) or instead
    keeps the Deathmantle 4-piece and wears only one Tier 6 item. Wowhead and Warcraft Tavern
    disagree and no simulation has been run, so this remains open; see the "contested" note
    in combat-rogue.yaml.'
