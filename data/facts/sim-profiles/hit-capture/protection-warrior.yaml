notes:
  tank_rebuild: >-
    An audit found this set optimised for hit at the cost of the stat that
    defines the role: data/facts/crit.yaml requires 284 defense rating from
    gear for a plate tank to be crit-immune (Anticipation, 5 ranks), and this
    capture carried only 257 at entry and 189-195 at the tier anchors, about
    90 rating short at tier. The audit traced this to four slots that swapped
    a defensive item for a higher-hit damage item (legs, feet, wrist, ring_1)
    and three slots holding items a plate tank could legally wear but would
    not (waist: Belt of One-Hundred Deaths, leather, no defensive stats;
    ring_1: Shapeshifter's Signet, a feral druid ring; back at entry only:
    Thalassian Wildercloak, an agility cloak). All were rebuilt in the stated
    priority: defense rating first, then armor/stamina/dodge/parry/block,
    then threat stats. RESULT — defense rating from gear now reads 303 at
    entry, 338 at tier_hands_only and 344 at tier_hands_and_head, all above
    the 284 requirement, so this tank DOES reach crit immunity from items
    alone once itemized correctly; the prior shortfall was a itemization
    defect, not a gearing ceiling. Per-slot: back (entry only) Thalassian
    Wildercloak to Gilded Thorium Cloak (Karazhan, Terestian Illhoof, def 24);
    waist (all anchors) Belt of One-Hundred Deaths to Crimson Girdle of the
    Indomitable at entry (Karazhan, Moroes, def 24) and Girdle of Mighty
    Resolve at both tier anchors (Black Temple, Gurtogg Bloodboil position 6,
    def 26); ring_1 (all anchors) Shapeshifter's Signet to Shermanar
    Great-Ring at entry (Karazhan, Shade of Aran, def 23) and Band of the
    Abyssal Lord at both tier anchors (Black Temple, Supremus position 2, def
    27, and 21 hit; itself later displaced by Band of the Eternal Defender,
    see notes.eternal_defender_correction); wrist (tier anchors only — entry already held the
    defensive Vambraces of Courage) Bracers of Eradication to Eternium Shell
    Bracers (Black Temple, High Warlord Naj'entus position 1, def 24); legs
    (tier anchors only — entry already held T5) Destroyer Legguards
    reverted to the T5 Destroyer Legguards (def 39), because no reachable
    Phase 3 legs item, token or off-piece, carries any defense at all — the
    Tier 6 legs token is the Illidari Council drop and unreachable, and every
    off-piece legs item surveyed (Leggings of Divine Retribution, Praetorian's
    Legguards) itemizes for offense only; feet (tier anchors only — entry
    already held the defensive Boots of the Resilient) Dreadboots of the
    Legion to Myrmidon's Treads (Black Temple, Shade of Akama position 3, def
    30, and still 17 hit, an improvement on every stat over the item it
    replaces). Back at the tier anchors (Pepe's Shroud of Pacification) and
    ring_2 at the tier anchors (Ring of Deceitful Intent) were left
    unchanged: no reachable Phase 3 item in either slot carries any defense
    at all, so ring_1 and the other defense-bearing slots are what closes the
    gap instead, per the stated priority order. Entry ring_2 (Band of the
    Ranger-General) was already fixed by a concurrent agent for the separate
    Scale of the Sands defect and is left as found.
  eternal_defender_correction: >-
    CORRECTED 9 August 2026, after a workbook audit. Both tier anchors wore
    Band of the Abyssal Lord (32261) in ring_1 while skipping Band of the
    Eternal Defender (29297), which data/research/epv-workbook/Prot.csv ranks
    above it (84.32 against 80.50) and which carries more defense (30 against
    27). The Eternal Defender is the Scale of the Sands Exalted ring, and
    data/facts/progression.yaml records the guild lead's ruling that Scale of
    the Sands rewards ARE allowed at the tier anchors, including at
    tier_hands_only, and barred only at entry; the earlier tank_rebuild pass
    predates that ruling and never harvested the tier-side allowance, which
    is why the Supremus ring was chosen then. Swapping ring_1 at both tier
    anchors costs 21 item hit, taking each tier total from 177 to 156, and
    raises defense rating from items by 3, to 338 at tier_hands_only and 344
    at tier_hands_and_head against the 284 requirement. The two rings'
    remaining differences (stamina, block value against hit) are in
    items.csv; no priority between hit and defense is stated here.
  availability_corrections: >-
    Entry ring_2: Band of Eternity (29294) is a Scale of the Sands
    reputation reward, and Scale of the Sands is the Mount Hyjal faction, so
    it cannot be held before Phase 3 opens. Replaced with Band of the
    Ranger-General (29997, Tempest Keep, Phase 2, 18 melee hit), the
    top-ranked prephase Finger item in the ladder not already held in ring_1
    (Shapeshifter's Signet). Entry total_item_hit rises from 87 to 105.
  downgraded_slots: >-
    Relative to the published Phase 3 full-clear BiS list: head holds the T5
    Destroyer Greathelm at hands_only (Archimonde, the head token's boss, is
    not down yet) and only swaps to the T6 Onslaught Greathelm at
    hands_and_head. Shoulder, chest and legs never take a T6 piece in either
    state, because their tokens drop from Mother Shahraz, Illidan and the
    Illidari Council respectively, all late Black Temple and not reliably
    dead 4-6 weeks in. Shoulder and chest hold their T5 Destroyer pieces
    throughout, per the Phase 3 guide's own text calling both still
    competitive. Legs do not hold T5: the Phase 3 guide does not list the T5
    legs as an option at all and instead names Destroyer Legguards (Shade
    of Akama, early Black Temple) as superior to even the T6 legs, so that
    replaces the T5 piece in both tier states. Every other slot (neck, back,
    wrist, waist, feet, rings, trinkets, ranged, weapon, shield) was rebuilt
    from the Phase 3 guide's own recommended picks, filtered to exclude PvP
    armor (rule 2), late Black Temple bosses (Illidan, Illidari Council,
    Mother Shahraz) and Phase 4 content, keeping Phase 1/2 items, early
    Hyjal/Black Temple drops, one Badge of Justice vendor trinket, and one
    crafted/engineered item (the Entry ranged weapon) where nothing early
    outranked it on hit. Neck and feet take the guide's own Best Overall and
    Best Threat picks, Pendant of Titans and Myrmidon's Treads, both
    from Reliquary of Souls: confirmed the fifth of nine Black Temple
    encounters in data/facts/progression.yaml, and sourced to that encounter
    in data/facts/drops.csv, so both are reliably dead well inside the 4-6
    week window and were not downgraded.
  zero_hit_verification: >-
    VERIFIED. Onslaught Handguards (item 30970, the only Tier 6 piece
    reachable at hands_only) and Onslaught Greathelm (item 30974, the second
    piece reachable at hands_and_head) both carry a blank melee_hit field in
    data/facts/items.csv, i.e. zero. Checked directly against the generated
    item table rather than trusted from prior notes. The claim in
    data/facts/hit.yaml that "Onslaught Armor carries ZERO hit on all five
    pieces" holds for both pieces this spec can actually reach in the 4-6
    week window; the other three pieces (shoulder, chest, legs) were not
    re-checked here because this spec never wears them at either tier state.
  direction_of_movement: >-
    Total item hit RISES across both anchors: 105 at Entry, 156 at both
    tier_hands_only and tier_hands_and_head. This is the opposite direction
    from the retired five-piece rule's collapse. The figures moved from an
    earlier draft (87 at Entry, 192 at tier) after the tank_rebuild note's
    defense-first pass: entry gained the availability-corrected ring_2 (+18)
    with the rest of its rebuilt slots hit-neutral; the tier anchors gave up
    hit at legs (-18), wrist (-17) and feet (-1) to restore defense, and
    gained it back at ring_1 (+21), for a net -15 relative to the
    hit-optimised draft; the ring_1 hit was then given back again when the
    Eternal Defender correction displaced Band of the Abyssal Lord — see
    notes.eternal_defender_correction. This still reads well above the retired
    rule's figures, from off-piece upgrades it did not admit, and the set now
    also clears the 284 defense-rating requirement at every anchor — see
    notes.tank_rebuild.
  tier_states_identical: >-
    tier_hands_only and tier_hands_and_head both total 156, with no change
    at all between them. This is not a coincidence of rounding: the only
    slot that moves when the Archimonde head token is added is head itself,
    and Destroyer Greathelm (T5, the item it replaces) and Onslaught
    Greathelm (T6, the item it becomes) both carry zero item hit, verified
    against items.csv. So the head token displaces no hit, and its only
    effect is on which tier set bonuses are held, Destroyer 2pc plus
    Onslaught 2pc replacing Destroyer 2pc plus 3 T5 pieces. This differs from
    arms_warrior in hit.yaml, where the Tier 6 token DOES displace a
    hit-bearing item and the total falls when it is worn.
  uncertain: >-
    Ring_2 at both tier states (Ring of Deceitful Intent, item 32266) and
    legs (Destroyer Legguards, item 30111) both drop from Shade of Akama,
    an early Black Temple boss; this is asserted reliably dead per the
    brief's ruling, not independently re-verified against a kill log.
    Neck (Pendant of Titans, item 32362) and feet (Myrmidon's Treads,
    item 32268) both drop from Reliquary of Souls, specifically its third
    phase, Essence of Anger; this was initially misread as a separate Black
    Temple trash mob of uncertain position and both items were wrongly
    excluded in an earlier draft of this file. Corrected per the coordinator:
    Reliquary of Souls is the fifth of nine Black Temple encounters per
    data/facts/progression.yaml, and data/facts/drops.csv sources both items
    to it directly, so both are reliably dead in the 4-6 week window and are
    now included at full value.
    Trinket 29387 (Gnomeregan Auto-Blocker 600) is the Badge of Justice
    vendor item the task brief flagged as newly present in the item table;
    it carries zero hit and does not change either total, but its presence
    here is the confirmation the badge vendor is now resolvable.

  notes_reconciled: >-
    CORRECTED 9 August 2026. Three note blocks in this file still described the
    set as it was BEFORE the defense-first rebuild, naming Praetorian's
    Legguards at legs and Dreadboots of the Legion at feet where the rows hold
    Destroyer Legguards and Myrmidon's Treads, and stating 328 defense rating
    at entry where the rows give 303. The 25-point difference was Band of
    Eternity, which a separate pass removed as a Mount Hyjal reputation reward
    at a pre-Phase-3 anchor; the two passes were never reconciled.
    The figures in the rows and in set-stats.yaml were right throughout. The
    account of how they were reached was not, which is its own defect: a note
    naming two items the set does not hold sends the next reader to verify a
    set that does not exist.
