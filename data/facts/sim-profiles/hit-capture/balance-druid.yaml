# Balance Druid hit capture. Collected 9 August 2026.
#
# Cap: spell, raw 202 rating (16%). Weapon is a two-hand staff (The Nexus Key)
# at Entry, dropped for a one-hand main hand plus off-hand at Tier (Maelstrom's
# Fury plus Chronicle of Dark Secrets), so main_hand and off_hand are reported
# as separate keys instead of a single weapon key. No wand, no ranged slot.
# Improved Faerie Fire is melee and ranged hit only in 2.4.3 and grants this
# spec no spell hit, so it is not credited anywhere below.
#
# Every hit value below was cross-checked against this repository's own
# data/facts/items.csv, which is generated from the nether.wowhead.com 2.4.3
# tooltip endpoint per data/facts/PROVENANCE.md. The two guide sources below
# supplied item choice and boss source; they did not supply the numbers.

