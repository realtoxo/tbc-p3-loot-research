    note: 'Publishes a FULL-CLEAR Phase 3 list. The tier anchor below downgrades it to the
      four-to-six-week window: any slot whose full-clear pick comes from Illidan, the Illidari
      Council or Mother Shahraz (late Black Temple) is replaced with the guide''s own next-named
      alternative if that alternative is itself reachable (early Hyjal, early Black Temple
      bosses one through six, Black Temple trash, crafted, badge vendor or quest reward);
      if no reachable alternative is named, the Entry-anchor item is kept. See notes.downgraded_slots
      for every slot that changed and why. The Ring 2 pick follows the guide''s "without Totem
      of Wrath" branch, matching data/facts/hit.yaml, which credits balance_druid no Totem
      of Wrath (group_buff_percent: 0).'
