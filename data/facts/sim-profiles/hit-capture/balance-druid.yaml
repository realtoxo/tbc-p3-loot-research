notes_from_the_previous_construction:
  READ_THIS_FIRST: 'THESE NOTES WERE WRITTEN FOR A TIER SET BUILT A DIFFERENT WAY, and are
    kept because the reasoning in them outlives the set. Read nothing here as describing the
    tier anchor as it now stands.

    The tier set was rebuilt on 14 August 2026 from the entry set plus the tokens the spec''s
    Phase 3 best-in-slot list actually wears, per the rule in tools/rebuild_tier_sets.py.
    Every construction note below predates that and several are now false against the file
    they sit in: one said a shoulder token ''is not available, so Voidheart Mantle is carried
    forward'' beside a file holding that token.

    THE ENTRY ANCHOR DID NOT CHANGE, so a note about entry gear, an availability correction
    or a random-suffix ruling still holds. A note about the TIER anchor does not. The anchor''s
    own `rebuilt` field is the authority on how it was made.'
  two_configurations: 'REBUILT 9 August 2026. This capture records TWO configurations at each
    tier state instead of one, because for this spec the arithmetic does not settle whether
    a reachable token should be worn. data/facts/sim-profiles/token-arithmetic.yaml records
    that both tokens are raw EPV gains on the Owl tab (Thunderheart Headguard 162.88 against
    Nordrassil Headpiece 146.00, plus 16.88; Thunderheart Handguards 103.88 against Nordrassil
    Gauntlets 73.48, plus 30.40), and that EITHER token breaks the Nordrassil four-piece,
    whose slots (head, shoulder, chest, hands) are exactly the four this capture''s entry
    set holds. The collision is the BONUS, not the items. NO SOURCE PRICES A SET BONUS: the
    workbook excludes set bonuses from every item value, and no simulation has been run here.
    What would decide between the configurations is a price for "Nordrassil 4-piece: +10%
    Starfire damage against targets afflicted with Moonfire or Insect Swarm" against "Thunderheart
    2-piece: +3 seconds of Moonfire duration" plus the raw EPV the token configuration gains.
    Until one exists, both configurations are recorded with their totals, and neither is a
    recommendation. ITEM HIT TOTALS AT EACH STATE: tier_hands_only 95 wearing the hands token
    against 98 holding the four-piece; tier_hands_and_head 106 wearing both tokens against
    98 holding the four-piece. The four-piece configuration is gear-identical at both states,
    because the four pinned Nordrassil slots are the only slots Archimonde''s fall would have
    changed. The token-wearing blocks keep the names the checkers expect (tier_hands_only,
    tier_hands_and_head); the alternatives sit beside them with _alternative_hold_tier5_four_piece
    appended.'
  availability_corrections: 'Entry ring_2: Band of Eternity (29304) is a Scale of the Sands
    reputation reward, and Scale of the Sands is the Mount Hyjal faction, so it cannot be
    held before Phase 3 opens. Replaced with Ring of Unrelenting Storms (30667, Karazhan,
    Phase 1), the top-ranked prephase Finger item in the ladder not already held in ring_1
    (Ring of Recurrence). Both items carry 0 hit, so total_item_hit is unchanged.'
  downgraded_slots: 'Six slots changed from the Phase 3 full-clear list because their published
    pick is late Black Temple (Illidan, the Illidari Council or Mother Shahraz). Shoulder:
    Thunderheart Shoulderpads (Mother Shahraz) replaced by Hatefury Mantle (Anetheron), in
    both tier states. Chest: Thunderheart Vest (Illidan) replaced by Robes of Rhonin (Archimonde)
    in hands_and_head only, kept as Nordrassil Chestpiece in hands_only since Archimonde is
    not yet down. Head: Thunderheart Headguard (Archimonde) is the token itself, so it only
    appears in hands_and_head; hands_only keeps Nordrassil Headpiece. Back: Cloak of the Illidari
    Council (Illidari Council) has no reachable named alternative, so the Entry piece (Brute
    Cloak of the Ogre-Magi) is kept in both tier states. Trinket 1: The Skull of Gul''dan
    (Illidan) has no reachable named alternative, so the Entry piece (Icon of the Silver Crescent)
    is kept. Weapon: Zhar''doom, Greatstaff of the Devourer (Illidan) replaced by The Maelstrom''s
    Fury (High Warlord Naj''entus, main hand) plus Chronicle of Dark Secrets (Rage Winterchill,
    off hand), splitting the single Entry staff slot into two slots.'
  uncertain: Trinket 2 at both tier states is reported as the Entry piece, Quagmirran's Eye,
    rather than the full-clear pick, Ashtongue Talisman of Equilibrium. That trinket requires
    Exalted with the Ashtongue Deathsworn, a Black Temple reputation grind rather than a boss
    kill, and whether Exalted is reached by week four to six could not be verified against
    any source, so it was not assumed. Its tooltip (nether.wowhead.com/tbc/tooltip/item/32486)
    carries no hit rating regardless, so the total_item_hit figures are unaffected either
    way. Band of Eternity (Entry, ring 2) is issued in several stat variants under the same
    name from the same quest; id 29304 (the intellect and spell damage variant) was used,
    and none of the variants carry hit rating, so total_item_hit is unaffected by which variant
    a given druid actually holds. Whether Hatefury Mantle or Blood-cursed Shoulderpads (Gurtogg
    Bloodboil) is the better-attended shoulder alternative was not settled; both are named
    by the source and Gurtogg Bloodboil is not in the boss list this brief marks unreachable,
    so either is defensible. Hatefury Mantle was used because the source lists it first; it
    carries 0 hit either way, so the totals would not change if Blood-cursed Shoulderpads
    were used instead.
