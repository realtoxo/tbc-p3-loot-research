method_note: 'Wowhead''s own Phase 2 and Phase 3 Protection Paladin BiS guide pages could
  not be read: they are client-rendered, and every fetch of wowhead.com/tbc/guide/... returned
  only page chrome, no gear table. The item lists above come from wowsims''s community-maintained
  TBC Classic sim, which publishes its own BiS presets per phase and is the same generation
  of reference data this project already treats as authoritative for gear (data/research/epv-workbook).
  EVERY item id below was then independently verified stat-by-stat against Wowhead''s own
  live tooltip data at https://nether.wowhead.com/tbc/tooltip/item/<id>, the endpoint this
  repository''s other fact tables already cite (see data/facts/PROVENANCE.md). Every drop
  source named below was cross-checked against this repo''s own data/facts/drops.csv, not
  asserted from memory.'
