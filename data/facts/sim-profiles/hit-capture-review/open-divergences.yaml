# Off-piece picks that diverge from the workbook ranking with no stated reason.
#
# NOT AN ERROR LIST. The captures were built from published gear guides; this
# compares them against the EP Workbook. A guide optimizes holistically,
# including set bonuses and stats the workbook weights differently, so a
# divergence means two sources disagree. Preferring the workbook wholesale
# would substitute one uncited source for another.
#
# Each entry records what would SETTLE it, which is the thing a later reader
# needs and the thing a summary loses.
#
# NOT A CAPTURE, and it lives outside hit-capture/ for that reason: every
# extractor globs that directory and reads each file as a gear set, so a
# review file sitting beside the captures broke `just regen` the moment it
# was written.

meta:
  audited: 2026-08-09
  method: Every slot at every anchor, per spec, against that spec's tab in data/research/epv-workbook,
    with legality from data/facts/progression.yaml.
  already_resolved: The Arms shoulder and the Shadow Priest entry random-suffix
    slots were corrected on the day; they are not listed here.
  what_this_file_is_worth: >-
    MEASURED 2026-08-09, and it is the fact that sizes every remaining row.
    Each open divergence was re-tested by asking the only question these
    captures exist to answer: does taking the higher-ranked item move the
    anchor's hit state? Sixty-one rows change the hit total at all. Counting
    the assumed raid debuff, which is the step whose omission would have
    understated every physical spec by 48 rating, exactly ONE row moves a
    state, and that row does not survive reading either: protection_paladin at
    tier_hands_only carries two floors, and its capture total of 42 is melee
    against a published melee supply of 0, so the two disagree before any swap.
    So no open row in this file changes a state the compendium prints.
    That does not make them wrong. The workbook genuinely ranks the named item
    higher in 28 of the 32 weapon rows, verified section by section. It makes
    them a question about what a capture IS: a record of a published guide, or
    a set rebuilt to the workbook.
    RULED 2026-08-09, guide-faithful. See data/judgments/capture-fidelity.yaml,
    which is where the reasoning lives. Every row still open in this file is
    therefore RECORDED AND EXPLAINED rather than pending. A future audit of the
    same kind should run the state-movement measurement above FIRST and file
    only what survives it.
  do_not_compare_captures_to_supplied_figures: >-
    The supplied_at_p3_entry and supplied_at_tier_anchor figures in hit.yaml
    are a GREEDY-EPV PROXY SET, documented as such at method.known_weakness,
    and the captures are realistic sets. They are two different measurements
    and they disagree on many specs by design. check_hit_capture.py prints the
    movement between them rather than failing on it. Do not read a difference
    there as a defect in either one.
patterns:
  anger_spark_gloves: >-
    SETTLED 2026-08-09, and the source recorded here was wrong. Anger-Spark
    Gloves (30725, 20 spell hit) drops from DOOMWALKER, not from Doom Lord
    Kazzak as this entry first said. Kazzak drops Ripfiend Shoulderplates
    (30740), Ancient Spellcloak of the Highborne (30735) and Leggings of the
    Seventh Circle (30734); Doomwalker drops 30725, Barrel-Blade Longrifle
    (30724), Talon of the Tempest (30723) and Black-Iron Battlecloak (30729).
    Sources: Icy Veins TBC world-boss loot table, updated 12 January 2026, and
    Wowpedia, both observed 9 August 2026. The Destruction capture and the
    Affliction note say Doomwalker and were right all along.
    Both bosses have been live since TBC Phase 1 on 5 February 2026, so their
    drops are legitimately part of an entry set (onlyfarms.gg TBC Anniversary
    world-boss guide, published 22 January 2026, observed 9 August 2026). They
    are open-world, first-tag, no-lockout bosses on a two to four day respawn,
    so access is contested. Anger-Spark Gloves is Bind on Equip, which turns
    that contest from an access question into a gold-cost one (Wowpedia,
    observed 9 August 2026).
    RULED 2026-08-09, AND RULED THE OTHER WAY. This guild does not run outdoor
    world bosses, so no drop from either boss appears in any capture at any
    anchor. See data/judgments/capture-fidelity.yaml, and note what the entry
    below gets wrong: what looked like an implicit ruling in favor was an
    unexamined assumption inherited from the published guides, and nothing
    could see it because drops.csv carries neither npc. Eleven slots across
    four captures were replaced, and the blocklist now lives in
    check_capture_availability.py WORLD_BOSS_LOOT.
    WHAT WAS TRUE BEFORE THE RULING. Five of the seventeen
    captures wear world-boss loot across seven slots: arms_warrior wears
    Ripfiend (30740) and Black-Iron (30729) at entry and Barrel-Blade (30724)
    at all three anchors, fury_warrior wears Barrel-Blade at both tier anchors,
    destruction_warlock wears Anger-Spark at entry, and elemental_shaman wears
    Talon of the Tempest (30723) at entry and Ancient Spellcloak (30735) at
    both tier anchors. Only the Shadow Priest and Elemental hands slots do not
    follow it.
    NOTHING IS LEFT TO RULE HERE. The Bind on Equip question is moot: the
    ruling is about whether the raid goes, not about whether the item binds.
  cloak_of_the_illidari_council_sourcing: >-
    TRAP FOR THE NEXT AUDITOR, AND ALREADY DEFENDED. The workbook sources Cloak
    of the Illidari Council (32331) to "High Nethermancer Zerevor", a MEMBER of
    the Illidari Council encounter, so a legality check keyed on the workbook
    boss strings would call it legal at the tier anchors. It is not.
    check_capture_availability.py joins through drops.csv (npc 23426, The
    Illidari Council) rather than trusting workbook strings, and no capture
    wears 32331 at any anchor. Verified 9 August 2026. Recorded so that a
    future check written against workbook strings does not reintroduce it.
  set_bonus_bookkeeping_gap: >-
    SETTLED 2026-08-09. A capture can wear two pieces of one set while
    recording no bonus, which hides the likely reason for both picks. All
    seventeen captures were swept against the set_name column of items.csv.
    The Affliction Voidheart case and the Elemental Cyclone Regalia case named
    here were both closed on the day. One holding remained, and it turned out
    to be correct rather than an omission: the Shadow Priest entry anchor wears
    two of the three Frozen Shadoweave pieces, and Wowhead item-set 553,
    Shadow's Embrace, carries a bonus at three pieces and at no other count, so
    two pieces convey nothing there is to record. That bonus is also not
    damage; it heals the wearer for 2 percent of Frost and Shadow damage dealt.
    See hit-capture/shadow-priest.yaml notes.frozen_shadoweave_two_of_three.
  siblings_disagree_silently: >-
    LARGELY CLOSED BY THE TOKEN REBUILD, and this entry was written before that
    landed. Re-derived against the captures as they now stand on 9 August 2026:
    Translucent Spellthread Necklace (32349) is worn by three casters at both
    tier anchors, Leggings of Channeled Elements (30916) by five, Bracers of
    Nimble Thought (32586) by five, and Hammer of Judgement (34009) by nobody.
    Two items are still worn by one capture alone: Blood-cursed Shoulderpads
    (32338, Gurtogg Bloodboil) and Sextant of Unstable Currents (30626,
    Fathom-Lord Karathress), both only by the Destruction Warlock. Those two
    are the remaining cases; the rest converged.
  vanilla_naxxramas_items: >-
    SETTLED 2026-08-09, and one claim here was wrong. Eye of the Night (24116)
    is NOT vanilla. It is a TBC Jewelcrafting 360 crafted item, Bind on Equip,
    with a use effect granting 34 spell power to the party for 30 minutes, and
    items.csv already records it as crafted (Wowpedia and Wowhead, observed
    9 August 2026). The Affliction and Destruction split over it is therefore a
    group-buff valuation question, not an old-world one, and it belongs with
    buff_rows_are_priced_on_a_different_scale below.
    On the genuinely level-60 items: Naxxramas at level 60 shipped on
    Anniversary realms on 2 October 2025 with the Atiesh questline (Blizzard
    news 24229247, observed 9 August 2026), and in TBC Classic in 2021 the
    level-60 raid stayed enterable and Atiesh completable (warcraft.wiki.gg,
    observed 9 August 2026). Cost separates them into three classes: Band of
    the Inevitable (23031) is an ordinary farmable drop from Noth the
    Plaguebringer, Mark of the Champion (23207) is a Bind on Pickup quest
    reward for one Kel'Thuzad kill, and Atiesh needs 40 splinters across
    thirteen of fifteen Naxxramas bosses plus a base from C'Thun in AQ40.
    Mark of the Champion is not the narrow trinket its target condition
    suggests. It gives 85 spell damage against Undead and Demons, and all five
    Mount Hyjal bosses plus at least four of the nine Black Temple bosses are
    one or the other (tbcdb.com 2.4.3, observed 9 August 2026).
    THE CAPTURES ARE ALREADY UNANIMOUS. Not one of the seventeen wears any
    level-60 item at any anchor. Only the Affliction capture states why.
    RULED 2026-08-09: level-60 raid loot is out of scope at every anchor,
    because this guild does not run it. No capture changed, because none wore
    one. See data/judgments/capture-fidelity.yaml.
  guide_sourced_versus_workbook_sourced: The two warrior captures and the rogue
    capture were built from Wowhead guides; the Feral Cat and Retribution captures
    were built from the workbook itself. Every unexplained divergence above 10 EPV
    in this file's five specs sits in a guide-sourced capture, and in three cases
    (Shadowmoon Destroyer's Drape, Insidious Bands, Midnight Chestguard) the skipped
    item is worn by a neighbouring workbook-sourced capture at the same anchor.
    The two source families disagree systematically, not slot by slot.
  rog_offhand_header_caveat: 'The Rog.csv Off Hand section header carries the author''s
    own note, "offhand hit value wrong, will fix soon", in column 6. Two consequences:
    every off-hand EPV on that tab is provisional by its author''s admission, and
    the note breaks the documented section-header test in data/facts/hit.yaml (name
    in column 2 with nothing through column 10), which silently merges the Off Hand
    section into Main Hand. This is a fifth parser trap beyond the four hit.yaml
    records.'
  shoulderpads_of_the_stranger_30055: 'Leather, 33 agility. The workbook prices
    agility per spec exactly as data/facts/attack-power.yaml says it should: Retribution
    rank 1 (69.08, worn, correct), Feral Cat rank 3 (280.42, worn, correct, since
    ranks 1 and 2 are Mother Shahraz and Season 3), Fury rank 5 (92.94, correctly
    NOT worn over tier-held shoulders at entry), Arms rank 5 (87.03, worn at every
    anchor over legal higher-ranked items until corrected). The workbook was right
    in all four places; only the Arms capture ignored it. Of the four Arms items
    ranked above it: Onslaught Shoulderblades (101.87) is the Mother Shahraz Tier
    6 token, out of the window at every anchor; Blood-stained Pauldrons (92.08,
    id 30866, Rage Winterchill) is legal at both tier anchors and is now the corrected
    tier pick; Ripfiend Shoulderplates (88.08, id 30740, Doom Lord Kazzak, Phase
    1) is legal at every anchor including entry and is now the corrected entry pick;
    Mantle of Darkness (88.04, Naj''entus) is legal at tier only.'
  solarians_sapphire_group_buff_rows: 'Both warrior tabs rank rows whose EPV prices
    a raid buff rather than the wearer''s own output: Solarian''s Sapphire "(Group
    AP Buff)" at trinket rank 1-2 (159.08 Arms, 155.75 Fury, Warrior-only per items.csv)
    and Braided Eternium Chain "(GROUP BUFF)" at neck rank 2-3 on four of the five
    tabs audited. Every capture skips them without a note. The greedy per-slot reading
    cannot own a group buff''s value, so these skips are probably right for the
    wrong reason; the workbook''s convention for buff rows is the fact to pin down
    before treating any of them as a missed pick.'
  bear_tab_is_a_damage_ladder: 'data/facts/crit.yaml records that Bear.csv carries
    no crit column in any armor section: it is a Cat damage ladder, and ranking
    a tank on it is what produced the original bad Bear set. A low EPV rank on that
    tab is weak evidence of an error for feral_bear BY DESIGN, and the capture''s
    stated defense-then-armor-then-stamina priority governs instead. Under that
    priority the current feral_bear capture is clean: every skipped higher-EPV item
    carries zero defense against 19-42 on the item held, except the two trades the
    capture''s own notes already argue (Pendant of Titans and Band of the Abyssal
    Lord).'
  bear_two_hand_rank_epv_retraction: 'An earlier pass of this audit reported the
    Bear.csv Two Hand section ranking level-60 PvP mauls (EPV 907.35) above its
    rank 1. That was the audit''s own parser artifact, not a workbook defect: EPV
    cells at or above 1,000 carry a thousands separator ("2,023.12"), a naive float
    parse drops those rows silently, and the section is consistently ranked once
    they are read. Pillar of Ferocity is its rank 2 behind an illegal Season 3 staff.
    Recorded so nobody chases the phantom, and as a fifth parsing trap to add to
    the four in data/facts/hit.yaml open_questions.workbook_parsing_traps.'
  guide_over_ladder_in_both_hunter_captures: 'Both hunter captures copied slot picks
    from the published guide that the spec''s own tab outranks among items legal
    at the anchor, with no reason stated: the waist (Don Alejandro''s Money Belt
    over Boneweave Girdle, both tabs), the survival ranged slot at all three anchors,
    and the beast mastery neck, back, legs and main hand at the tier anchors. Legionkiller
    is the sharpest case: rank 1 on SV.csv and skipped by the Survival capture,
    while the Protection Warrior capture wears it.'
  smith_gated_entry_weapon_without_note: The Protection Warrior entry main hand,
    Dragonstrike (28439), requires Master Hammersmith to equip and is unranked on
    Prot.csv, and the capture carries no note of the profession assumption. This
    is the same gating class the workbook already records against engineer goggles.
    The entry ranged slot is the same gate but at least noted as "engineered".
  tsunami_talisman_vs_bloodlust_brooch: 'Three captures (enhancement_shaman, beast_mastery_hunter,
    survival_hunter) wear Bloodlust Brooch in trinket 2 at every anchor while each
    spec''s own tab ranks Tsunami Talisman (30627, Serpentshrine Cavern, Leotheras
    the Blind, Phase 2) above it by 17-22 EPV, with no note anywhere. Only the Enhancement
    capture states a reason for skipping a higher-ranked trinket, and that reason
    covers Darkmoon Card: Crusade only. Mark of the Champion ranks higher still
    on all three tabs but is target-conditional (undead/demon) and from level-60
    Naxxramas, so it is not the clean comparison; Tsunami Talisman is.'
  buff_rows_are_priced_on_a_different_scale: >-
    SETTLED 2026-08-09, and it closes every buff-row skip at once. Twenty-four
    rows across fifteen tabs carry a buff label in the name column, and they
    are four items: Solarian's Sapphire (30446, Warrior-only, trinket, "(Group
    AP Buff)") at rank 1 on Arms and Prot and rank 2 on Fury, and three
    Jewelcrafting necks marked "(GROUP BUFF)", Braided Eternium Chain (24114)
    on eight tabs, Eye of the Night (24116) on seven, and Chain of the Twilight
    Owl (24121) on six. No buff-like parenthetical exists anywhere else, and
    none of the four appears on Bear, on Tank or on the four healer tabs.
    The workbook states no convention for them, so it was read off the stat
    cells, and it is NOT one convention.
    Solarian's Sapphire is priced at the FIVE-MAN TOTAL. Its attack power cell
    reads 350, which is 5 times the 70 of Improved Battle Shout (item-effects
    buff 37536), and the item's only static stat in items.csv is 30 stamina. A
    five-man total sitting in a per-wearer ranked column, above Dragonspine
    Trophy at 88.38, is a cross-scale comparison. So a greedy per-slot reading
    cannot use these rows, and rank 1 there does not mean best trinket for the
    wearer. Every capture skips it, and every capture is right to.
    The three necks are priced at per-member value counted once, beside real
    personal stats, so they are not obviously cross-scale in the same way.
    UNDETERMINED: whether a wearer receives their own party aura. That one fact
    settles whether the neck rows are comparable, and it is recorded nowhere in
    this repository.
    UNDETERMINED: the workbook attack power cell of 40 on Braided Eternium
    Chain matches neither items.csv nor item-effects.csv. One Wowhead fetch of
    24114 settles it.
  capped_column_collapses_the_trinket_gap: >-
    SETTLED 2026-08-09. Three captures (enhancement_shaman,
    beast_mastery_hunter, survival_hunter) wear Bloodlust Brooch (29383) in
    trinket 2 at every anchor while each spec's tab ranks Tsunami Talisman
    (30627) above it by 17 to 22 EPV. The gap is almost entirely Tsunami's 10
    melee hit priced at full value. All three specs read the hit-capped column,
    where the gap is 0.40 on Enhancement, 2.72 on Beast Mastery and 6.52 on
    Survival. Tsunami is legal at all three anchors (drops.csv, Serpentshrine
    Cavern, Leotheras the Blind, Phase 2), so legality was never the issue.
    The workbook enters the Brooch as a flat 118 attack power, being its 72
    static plus its on-use averaged out, so the on-use effect's controllability
    is unpriced by construction. That is an observation about the scoring, not
    an argument for the Brooch: no source in this repository makes that
    argument, and no simulation has been run against these anchors.
    WHAT IS LEFT TO RULE: whether these slots are read in the base column or
    the capped one, which is the same as asking whether surplus hit is priced
    at zero.
  weapon_sections_carry_two_offhand_conventions: >-
    A SIXTH PARSER TRAP, found on this pass. It is recorded in full where the
    other six live, at hit.yaml open_questions.workbook_parsing_traps, and is
    not restated here. In short: the Fury tab and the Rog tab price off hands
    on different scales, and the Rog hit-capped column returns to the main-hand
    scale.
  weapon_sections_do_not_encode_hand_restrictions: >-
    A SEVENTH PARSER TRAP, found on this pass, and it produced two filed
    divergences that were not real. Recorded in full at hit.yaml
    open_questions.workbook_parsing_traps. In short: per-slot maximization
    assigned Syphon of the Nathrezim to both of the Fury weapon slots, and
    assigned Talon of the Phoenix, which is main-hand only, to an off hand.
  the_delta_20_break_is_a_units_artifact: >-
    RECORDED SO IT IS NOT CHASED AGAIN. Every open divergence at or above a
    delta of 20 is a weapon slot, and no non-weapon divergence reaches 18.45.
    That clean break looks like a measurement artifact and is not one. Weapons
    carry the largest per-slot EPVs on every tab, so an equal RELATIVE
    disagreement prints a larger absolute delta: the rogue main hand at 22.53
    is 2.3 percent of the item, while the Affliction trinket at 15.9 is 25
    percent. Absolute delta is not comparable across slots, and 29 of the 32
    weapon rows survived verification.
