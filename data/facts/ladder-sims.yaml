meta:
  what: 'The slot ladders: each single-item slot''s workbook candidates measured
    as variants of the spec''s TIER profile, one slot replaced per run, everything
    else held still. The worn item reproduces the tier figure in sim-figures.yaml,
    so every row is directly comparable with it and with the other rows of its slot.
    Replacements arrive dressed per data/judgments/sim-context.yaml: the slot keeps
    its enchant, a candidate a profile of this spec wears arrives with that profile''s
    gems, and any other candidate carries the spec''s standard gem in each socket.'
  why: 'The derived-orderings ruling, data/judgments/derived-orderings.yaml: the
    item pages sort a slot''s candidates by measured delta and read a denial cost
    as this item minus the next best available, and both need the ladder measured
    rather than scored. The field is the top of the spec''s EP Workbook ladder for
    the slot, already cross-armor, plus the worn item.'
  boss_armor: 7684
  iterations: 10000
  seed: 1
  encounter_seconds: 150
  ladder_depth: 8
  GENERATED: BY tools/run_ladder_sims.py, which runs the simulator. Rebuilt by `just
    sim` and `just sim-ladders`, not by `just regen`. DO NOT EDIT.
