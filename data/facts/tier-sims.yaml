meta:
  what: The tier rounds, two per simmable spec, every row the spec's ENTRY profile
    with a subset of slots replaced and the entry anchor's own consumables, buffs
    and seed held still. The old-bonus round replaces subsets of the entry set's
    bonus-carrying slots with what the best-in-slot profile wears there, the chase
    targets, so the table holds at what point breaking the old bonus pays. The tier-six
    round replaces subsets of the token slots with the tier anchor's pieces, so
    it prices the Tier 6 two-piece and four-piece thresholds and the chase order.
    A replaced slot keeps its enchant and a replacement arrives ungemmed, the same
    rule as variant-sims.yaml.
  read_this_first: 'Every row is directly comparable with the spec''s entry figure
    in sim-figures.yaml, because it is the same request with only the named slots
    changed, and the empty subset IS the entry profile. `pieces_left` counts, per
    watched set, the pieces the row still wears: two turns the two-piece bonus on
    and four the four-piece. The plus or minus is ONE STANDARD ERROR, not a confidence
    interval. NOT A RULING. In what order the council routes the pieces is the council''s
    call.'
