# What creators say about specific Phase 3 items, with a timestamp for each.
#
# HOW THIS WAS MADE, because the method decides how far to trust a row. Every
# row began as a NAME MATCH in data/facts/transcript-mentions.csv. An agent then
# read the passage in the transcript and recorded the creator's stance and a
# paraphrase. A second agent, told to REFUTE and to default to overturning where
# unsure, read the same passage independently. A human spot-checked a sample
# against the transcripts by hand.
#
# THIS IS NOT MANUAL CAPTURE AND DOES NOT CLAIM TO BE. The paraphrases are
# machine written from machine transcribed captions. What makes a row checkable
# is the url: it opens the recording at the second the remark was heard, so any
# claim here can be confirmed or refuted in about fifteen seconds.
#
# WHAT A ROW IS. `stance` is what the CREATOR expressed, never what this project
# concludes. `mentions_only` means the item was named with no view attached and
# is a correct and common answer. Nothing here is a priority, a score or a
# ranking, per the first Critical Rule in AGENTS.md.
#
# DISAGREEMENT IS RECORDED, NEVER RESOLVED. Twenty-two items carry both a
# `favours` and an `against` row from different creators. That conflict is the
# useful part and it is left standing.
#
# BEFORE YOU CITE A ROW
#   Open the url and listen. That is the whole point of the timestamp.
#   `confidence: low` or `caption_quality: garbled` means the captions were hard
#   to read, not that the creator was uncertain.
#   `client_dependent` marks a claim resting on a rule that differs between
#   original TBC Classic and the Anniversary client. Forty-two of the sixty-seven
#   recordings predate Anniversary.
#   A claim flattering the author's own spec needs a second source before it
#   travels, per the framework.
#
# NOT REGENERABLE. `just regen` does not rebuild this, because an agent pass is
# not a deterministic transform. Regenerating means re-running the workflow.

