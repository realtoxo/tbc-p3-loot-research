# WHICH SET EACH ROSTERED SPEC WEARS, in each of the three tiers.
#
# The sets block above lists every set of a rostered class. The lines block
# above maps a token to CLASSES, which is what the token tooltip states. Neither
# says which set a spec takes, so for the five classes with more than one set
# the piece a token becomes was undefined. This block closes that gap. It is a
# fact about the itemization of the sets, not a judgment about who should get a
# drop.
#
#   Sets per class: Paladin 3, Druid 3, Shaman 3, Priest 2, Warrior 2,
#   Hunter 1, Rogue 1, Mage 1, Warlock 1. The count is the same in all three
#   tiers, and the suffix pattern is the same in all three tiers as well.
#
# HOW A SET WAS IDENTIFIED. Each mapping below names the stat line that settles
# it, read from the chest piece of that set at the 2.4.3 tooltip endpoint, with
# the item id given so the reading can be repeated. The three signatures are:
#   healing set        healing done by up to N, and mana per 5 sec or spirit
#   tank set           defense rating, with shield block, block value or parry
#   caster damage set  spell damage, with spell hit or spell critical strike
#   melee damage set   strength or agility, with hit and critical strike rating
#                      and no defense rating
# The set name suffix is consistent across the tiers, Battlegear and Harness for
# melee, Armor for tank, Raiment for healing, Regalia for caster damage, but the
# suffix is a naming pattern and not evidence, so it is not relied on here.
#
# CORROBORATION. The Warcraft Wiki Tier 4, Tier 5 and Tier 6 overview pages
# label each set with a talent tree. Those labels agree with every mapping
# below and are quoted in wiki_label. They are corroboration only. The stat
# line is the evidence.
#
# TWO SPECS SHARE ONE SET IN TWO PLACES.
#   feral_bear and feral_cat both wear the Druid feral set. Its 2-piece and
#   4-piece bonuses name Bear Form and Cat Form together, and no second feral
#   set exists in any tier. So one Vanquisher token, or one Defender token in
#   Tier 4 and Tier 5, serves both specs, and the two contest it directly.
#   arms_warrior and fury_warrior both wear the Warrior damage set, for the
#   same reason: Warrior has two sets, one tank and one damage, and no split
#   between Arms and Fury exists.
#
# The other two-spec cases are not shared sets. beast_mastery_hunter and
# survival_hunter share the Hunter set because Hunter has only one set, and
# affliction_warlock and destruction_warlock share the Warlock set for the same
# reason. priest_healer is one claiming spec covering Holy and Discipline, per
# data/facts/roster.yaml, and takes the Priest healing set.
#
# Twenty-one rostered specs, each mapped in all three tiers. fire_mage is held
# but not rostered, per roster.yaml, and is not mapped here.
spec_to_set:

  # ---- Paladin. Three sets. -----------------------------------------------

  holy_paladin:
    class: Paladin
    4: Justicar Raiment
    5: Crystalforge Raiment
    6: Lightbringer Raiment
    wiki_label: Holy
    identified_by: >-
      The healing set. Justicar Chestpiece 29062 carries "Increases healing done
      by up to 90" and "Restores 6 mana per 5 sec". Crystalforge Chestpiece
      30134 carries healing up to 103. Lightbringer Chestpiece 30992 carries
      healing up to 117 and "Restores 11 mana per 5 sec". None of the three
      carries defense rating. Healing with mana per five settles it.
    confidence: high

  protection_paladin:
    class: Paladin
    4: Justicar Armor
    5: Crystalforge Armor
    6: Lightbringer Armor
    wiki_label: Protection
    identified_by: >-
      The tank set. Justicar Chestguard 29066 carries defense rating 23 and
      shield block rating 23. Crystalforge Chestguard 30123 carries defense
      rating 28 and shield block value 51. Lightbringer Chestguard 30991 carries
      defense rating 31, shield block rating 23 and block value 47. Defense
      rating with shield block settles it.
    confidence: high

  retribution_paladin:
    class: Paladin
    4: Justicar Battlegear
    5: Crystalforge Battlegear
    6: Lightbringer Battlegear
    wiki_label: Retribution
    identified_by: >-
      The melee damage set. Justicar Breastplate 29071 carries +42 Strength and
      critical strike rating 25. Crystalforge Breastplate 30129 carries +56
      Strength, hit rating 23 and critical strike rating 21. Lightbringer
      Breastplate 30990 carries +56 Strength, hit rating 21 and critical strike
      rating 31. Strength with hit and critical strike rating, and no defense
      rating and no healing line, settles it against the other two Paladin sets.
    confidence: high

  # ---- Druid. Three sets, and one of them serves two specs. ----------------

  feral_bear:
    class: Druid
    4: Malorne Harness
    5: Nordrassil Harness
    6: Thunderheart Harness
    wiki_label: Feral Combat
    shares_set_with: feral_cat
    identified_by: >-
      The feral set, and the only Druid set with no spell stat at all.
      Breastplate of Malorne 29096 carries +33 Strength, +34 Agility and +36
      Stamina. Nordrassil Chestplate 30222 carries +46 Strength and +30 Agility.
      Thunderheart Chestguard 31042 carries +53 Strength and +36 Agility. The
      absence of a spell damage or healing line separates it from the other two
      Druid sets, which both carry one.
    confidence: high

  feral_cat:
    class: Druid
    4: Malorne Harness
    5: Nordrassil Harness
    6: Thunderheart Harness
    wiki_label: Feral Combat
    shares_set_with: feral_bear
