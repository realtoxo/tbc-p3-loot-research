# Where a Tier 4 or Tier 5 token is exchanged for the armor piece. Recorded
# because it is a step the token entries alone do not state. Source: the
# Warcraft Wiki item pages, action=raw, read 8 August 2026. The equivalent fact
# for Tier 6 was not captured and is listed under open_questions.
token_exchange:
  4:
    vendors: [Asuur, Arodis Sunblade]
    locations: [Aldor Rise Shattrath, Scryer's Tier Shattrath]
    source: https://warcraft.wiki.gg/wiki/Chestguard_of_the_Fallen_Champion
  5:
    vendors: [Kalara, Veynna Dawnstar]
    locations: [Aldor Rise Shattrath, Scryer's Tier Shattrath]
    source: https://warcraft.wiki.gg/wiki/Gloves_of_the_Vanquished_Champion
  6:
    vendors: [Tydormu]
    locations: [Hyjal Summit entrance, Caverns of Time]
    source: https://warcraft.wiki.gg/wiki/Chestguard_of_the_Forgotten_Conqueror
    pvp_alternative: >-
      A Tier 6 token may instead be exchanged with Soryn on the Isle of
      Quel'Danas for a Season 2 PvP piece of the same slot, the Tier 6
      equivalent of the note below. The PvP pieces are out of scope for this
      file.
  the_holder_chooses_the_set: true
  the_holder_chooses_the_set_evidence: >-
    SETTLED. A token is not bound to one of its class's sets. The vendor offers
    one piece per set for that slot, and the player picks at turn-in.
    Chestguard of the Forgotten Conqueror, item 31089, is listed on the
    Warcraft Wiki as exchangeable at Tydormu for six chest pieces:
    Lightbringer Breastplate, Lightbringer Chestguard and Lightbringer
    Chestpiece for Paladin, which is all three Paladin sets; Vestments of
    Absolution and Shroud of Absolution for Priest, which is both Priest sets;
    and Robe of the Malefic for Warlock, which is the one Warlock set. Helm of
    the Forgotten Vanquisher, item 31096, is listed as exchangeable for
    Thunderheart Cover, Thunderheart Headguard and Thunderheart Helmet for
    Druid, which is all three Druid sets, plus one Rogue helm and one Mage
    helm. The Tydormu vendor page lists the same offers as a sell list, one row
    per piece, each priced at one token of the matching slot and line, and it
    carries no restriction by set.
    The same holds in Tier 4 and Tier 5. Helm of the Fallen Champion, item
    29760, is listed as exchangeable at Asuur or Arodis Sunblade for Justicar
    Crown, Justicar Diadem and Justicar Faceguard for Paladin, all three
    Paladin sets, plus Cyclone Faceguard, Cyclone Headdress and Cyclone Helm
    for Shaman, all three Shaman sets, plus one Rogue helm.
    CONSEQUENCE. A spec that changes which set it wants is not blocked by an
    earlier token award of a different slot, because no earlier turn-in binds a
    later token to a set. Which pieces a player already holds still decides
    which 2-piece and 4-piece bonuses are reachable.
  the_holder_chooses_the_set_source: >-
    Warcraft Wiki item and vendor pages, action=raw, read 8 August 2026:
    Chestguard_of_the_Forgotten_Conqueror, Helm_of_the_Forgotten_Vanquisher,
    Tydormu and Helm_of_the_Fallen_Champion. Wowhead was not usable for this
    fact, because the token item tooltip at the 2.4.3 endpoint names the
    classes and carries no vendor exchange list. The wiki Itemtip blocks on
    those pages carry a modern retail use string, "Create a class set item
    appropriate for your loot specialization", which is NOT the 2.4.3 behavior
    and is not relied on here. The exchange lists themselves are.
  note: >-
    From patch 2.4.0 a Tier 4 or Tier 5 token may instead be exchanged on the
    Isle of Quel'Danas for a Season 1 or Season 2 PvP piece of the same slot.
    The vendors named on the wiki are Karynna for Tier 4 and Olus for Tier 5.
    The PvP pieces themselves are out of scope for this file.

