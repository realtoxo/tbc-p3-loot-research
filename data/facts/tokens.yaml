# Tier 4, Tier 5 and Tier 6 tokens, tier pieces and set bonuses. Hand-authored.
#
# HOLDS   45 tokens, 15 per tier, five slots each. Every set belonging to a
#         rostered class, with 2-piece and 4-piece bonus text quoted verbatim.
#         Which classes share a token line in each tier, and which boss drops
#         which token.
# NOT HERE  No evaluation. Nothing here says a bonus is good or a token should
#         be routed anywhere.
#
# BEFORE YOU USE A FIGURE
#   THE CLASS GROUPINGS CHANGE AT TIER 6. Tier 4 and Tier 5 share one grouping;
#   Tier 6 uses another, and no class keeps a Tier 5 token partner. See
#   class_to_line_by_tier. This is what decides which Tier 5 set a player breaks
#   when a Tier 6 token is routed to them.
#   Token names repeat across tiers and lines and differ by one word. An id that
#   resolves is not evidence it is the right id.
#   Drop counts per kill are recorded in boss_by_tier_and_slot, with the
#   mechanics and sources in drop_counts. They are the 2.4.3 figures; whether
#   the Anniversary realm opens Phase 3 on them is an open question.
#
# SOURCE  Every id fetched on its own from the 2.4.3 tooltip endpoint at
#   nether.wowhead.com and asserted against the name, slot, armor type and
#   class the entry claims. Bonus text quoted from the item-set endpoint, never
#   paraphrased. Boss attribution from the item source blocks, with the wiki
#   used only where a source block carries no npc id. Those six cases and
#   everything else unsettled are in open_questions.
meta:
  captured: 2026-08-08
  phase: 3
  content: Mount Hyjal and Black Temple
  patch: 2.4.3 content, TBC Anniversary Edition
  source: Wowhead TBC Classic
  token_count: 15                 # Tier 6 only. See token_count_by_tier.
  slots_dropping_in_phase_3: [head, shoulder, chest, hands, legs]
  tiers_recorded: [4, 5, 6]
  token_count_by_tier:
    4: 15
    5: 15
    6: 15
  set_count_by_tier:
    4: 17
    5: 17
    6: 17
  content_by_tier:
    4: Karazhan, Gruul's Lair and Magtheridon's Lair
    5: Serpentshrine Cavern and Tempest Keep
    6: Mount Hyjal and Black Temple
  slots_by_tier:
    4: [head, shoulder, chest, hands, legs]
    5: [head, shoulder, chest, hands, legs]
    6: [head, shoulder, chest, hands, legs]

