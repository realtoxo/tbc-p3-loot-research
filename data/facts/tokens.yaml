# THE HEADLINE FACT OF THIS FILE.
#
# Which token line each class uses in each tier, side by side. Tier 4 and Tier 5
# group the nine classes identically. Tier 6 regroups all nine, and no class
# keeps a single one of its Tier 4 and Tier 5 token partners.
#
#   Line member classes, by tier:
#     Tier 4 Champion   Paladin, Rogue,  Shaman     Tier 5 Champion   same
#     Tier 4 Defender   Warrior, Priest, Druid      Tier 5 Defender   same
#     Tier 4 Hero       Hunter,  Mage,   Warlock    Tier 5 Hero       same
#     Tier 6 Conqueror  Paladin, Priest, Warlock
#     Tier 6 Protector  Warrior, Hunter, Shaman
#     Tier 6 Vanquisher Rogue,   Mage,   Druid
#
#   Read down a class to see the regrouping:
#     Paladin  Champion -> Champion -> Conqueror
#     Priest   Defender -> Defender -> Conqueror
#     Warlock  Hero     -> Hero     -> Conqueror
#     Warrior  Defender -> Defender -> Protector
#     Hunter   Hero     -> Hero     -> Protector
#     Shaman   Champion -> Champion -> Protector
#     Rogue    Champion -> Champion -> Vanquisher
#     Mage     Hero     -> Hero     -> Vanquisher
#     Druid    Defender -> Defender -> Vanquisher
#
# Each Tier 6 line takes exactly one class from each Tier 5 line. So a Tier 6
# token contest never repeats a Tier 5 token contest, and the three Tier 5 sets
# a Tier 6 line's members are wearing are always three different sets.
class_to_line_by_tier:
  Paladin:
    4: fallen_champion
    5: vanquished_champion
    6: forgotten_conqueror
  Priest:
    4: fallen_defender
    5: vanquished_defender
    6: forgotten_conqueror
  Warlock:
    4: fallen_hero
    5: vanquished_hero
    6: forgotten_conqueror
  Warrior:
    4: fallen_defender
    5: vanquished_defender
    6: forgotten_protector
  Hunter:
    4: fallen_hero
    5: vanquished_hero
    6: forgotten_protector
  Shaman:
    4: fallen_champion
    5: vanquished_champion
    6: forgotten_protector
  Rogue:
    4: fallen_champion
