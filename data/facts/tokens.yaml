# How many tokens a kill yields, and on what evidence. The per-kill figures
# themselves live in boss_by_tier_and_slot above, where the reader meets each
# boss; this block holds the mechanics behind them, the sources, and the one
# caveat that keeps the Phase 3 opening count from being flatly settled.
drop_counts:
  verified: true
  verified_scope: >-
    Verified means verified against the 2.4.3 loot templates named under
    source below, for all fifteen token drops across the three tiers. Which
    tuning the Anniversary realm runs when Phase 3 opens is a separate
    question and is NOT settled; see anniversary_opening_count under
    open_questions.
  mechanics: >-
    Each token boss's loot template invokes a per-slot reference table a fixed
    number of times per kill, and that number is the tokens_per_kill figure in
    boss_by_tier_and_slot. The reference table holds the three lines of its
    slot as an equal-chance group, so each invocation draws one line,
    uniformly and independently of the other invocations. The lines are
    therefore drawn WITH repetition: one kill can yield three Protector
    gloves, a line can be absent from a kill entirely, and over many kills
    each line expects one third of the slot's tokens. No boss invokes more
    than one slot's table, so no boss drops tokens for two slots.
  illidari_council_split: >-
    The three leggings tokens per clear are not one boss's roll of three.
    Gathios the Shatterer, Lady Malande and Veras Darkshadow each invoke the
    leggings table once, and High Nethermancer Zerevor invokes it zero times.
    One clear of the encounter therefore yields three leggings tokens, one per
    named corpse, and the Wowhead attribution recorded under
    leggings_boss_attribution, which names those three and omits Zerevor,
    matches the loot data exactly.
  source: >-
    cmangos tbc-db, the community reconstruction of the 2.4.3 server database,
    file Full_DB/TBCDB_1.11.0_Vengeance_One_A_Cmangos_Story.sql.gz at
    https://github.com/cmangos/tbc-db, read 9 August 2026. The
    creature_loot_template rows for the Tier 6 bosses invoke per-slot
    reference tables 36108 hands, 36111 head, 36134 shoulder, 36136 legs and
    36139 chest, with maxcount 3 on Azgalor, Archimonde, Mother Shahraz and
    Illidan Stormrage and maxcount 1 on each of the three Council members
    named above. The Tier 5 bosses invoke tables 36026 head, 36021 hands,
    36004 shoulder, 36023 legs and 36010 chest, each with maxcount 3. The
    Tier 4 bosses invoke tables 40225 head, 40213 hands, 40300 shoulder,
    40302 legs and 40400 chest, with maxcount 1, 1, 3, 3 and 3. Each table
    holds exactly the three tokens of its slot at equal chance. This is a
    reconstruction and not Blizzard's own files, and it is the only loot
    template source consulted.
  patch_history: >-
    The 2.4.0 patch notes state, under Items: "All 25-player raid bosses that
    drop set tokens will now drop an additional token!" So every 25-player
    figure above is the from-2.4.0 count, and each was one lower before that
    patch: two per kill for every Tier 5 and Tier 6 token boss, and for Gruul,
    Maulgar and Magtheridon. Karazhan is a 10-player raid and sits outside
    the note. Source: the Patch 2.4.0 page at https://warcraft.wiki.gg, read
    9 August 2026.
  observed_data: >-
    Wowhead's community-reported drop rates, read in a browser on 8 August 2026,
    are consistent across all four boss pages that name an npc. Each of the
    three token lines sits between 52 and 56 percent, and each non-token gear
    item sits between 14 and 17 percent.
      Archimonde:       Conqueror 53, Protector 52, Vanquisher 52, out of 5,526
      Azgalor:          Conqueror 54, Protector 53, Vanquisher 54, out of 6,838
      Mother Shahraz:   Conqueror 54, Protector 54, Vanquisher 56, out of 9,357
      Illidan Stormrage: Conqueror 54, Protector 55, Vanquisher 54, out of 9,773
    The Illidari Council leggings are split across three npc entries and are not
    comparable to the four figures above.
    These are community submissions with an unknown denominator relationship to
    actual kills. Read against the mechanics above they carry one signal: at
    three independent invocations a line is present on about 70 percent of
    kills, at two invocations on about 56 percent, and the observed 52 to 56
    sits on the two-invocation figure. That suggests the data was collected
    under the pre-2.4.0 two-token count, on the named evidence of those four
    pages, and it is the observation behind anniversary_opening_count below.
    No count is derived from these figures here.

open_questions:

  anniversary_opening_count:
    blocks: >-
      Every funnel duration estimate. Three tokens per kill against two is a
      50 percent difference in a line's supply, and every wait-time argument
      built on token flow scales with it.
    detail: >-
      The 2.4.3 loot templates recorded under drop_counts say three tokens per
      25-player kill, and the 2.4.0 patch note recorded there says the count
      was two before that patch. The Wowhead community drop rates under
      drop_counts.observed_data sit on the two-invocation figure rather than
      the three, which suggests they were collected under the pre-2.4.0 count
      on TBC Classic. Whether the Anniversary realm opens Phase 3 on the
      two-token tuning or the three-token tuning is NOT VERIFIED. It is
      settled by counting the tokens on the first Phase 3 kills, or by a
      first-party statement naming which patch tuning Phase 3 runs.

  leggings_boss_attribution:
    blocks: Nothing today. The zone and the encounter are both settled.
    detail: >-
      Wowhead attributes the three Leggings tokens to Gathios the Shatterer,
      Lady Malande and Veras Darkshadow, and not to High Nethermancer Zerevor.
      All four are the Illidari Council encounter. drops.csv models the
      encounter as one npc, 23426. Whether the omission of Zerevor is a data
      artifact or a real attribution is NOT VERIFIED, and it changes nothing,
      because the four npcs are one encounter and one loot event.

  set_bonus_second_source:
    blocks: Nothing today.
    detail: >-
      Every bonus string above is single-sourced to a Wowhead set page. A second
      database or an in-game tooltip would raise confidence from good to high.

  lightbringer_battlegear_2pc_wording:
    blocks: Nothing today. The effect is the same in both renderings.
    detail: >-
      The set page states "Your melee attacks have a chance to grant you 50
      mana." The item tooltips append "(Proc chance: 20%)". Which the 2.4.3
      client displays is NOT VERIFIED. Both are recorded.

  six_piece_bonuses:
    blocks: Nothing today.
    detail: >-
      All seventeen set pages state that the set has bonuses at 2 and 4 pieces
      and list no third tier. No 6-piece bonus was found for any Tier 6 set.
      This was read from the set pages and was not checked against the spell
      data. Tier 4 and Tier 5 sets are five pieces, so a 6-piece bonus is not
      reachable for either and none is recorded.

  tier_4_and_5_chest_and_glove_boss_source:
    blocks: Nothing today. The zone is settled from Wowhead in all six cases.
    detail: >-
      Six tokens carry a Wowhead source block with a zone and no npc id: the
      three Tier 4 chest tokens, zone 3836 Magtheridon's Lair, and the three
      Tier 5 glove tokens, zone 3607 Serpentshrine Cavern. Their boss is taken
      from the Warcraft Wiki, which names Magtheridon and Leotheras the Blind
      respectively, and which repeats the same attribution on its Tier 4 and
      Tier 5 overview pages. Magtheridon is the only boss in Magtheridon's Lair,
      so that half is settled by elimination as well. Leotheras the Blind
      rested on the wiki alone until 9 August 2026, when the 2.4.3 loot
      templates recorded under drop_counts corroborated both attributions:
      creature 17257, Magtheridon, invokes the Tier 4 chest token table, and
      creature 21215, Leotheras the Blind, invokes the Tier 5 glove token
      table.

  tier_4_and_5_set_bonus_second_source:
    blocks: Nothing today.
    detail: >-
      Every Tier 4 and Tier 5 bonus string above is single-sourced to a Wowhead
      set page, the same standard as Tier 6. A second database or an in-game
      tooltip would raise confidence from good to high.

  justicar_armor_2pc_bracket_notation:
    blocks: Nothing today.
    detail: >-
      The Justicar Armor 2-piece bonus is printed as "Increases the damage dealt
      by your Seal of Righteousness, Seal of Vengeance, or Seal of [Blood][the
      Martyr] by 10%." Seal of Blood is the Horde paladin seal and Seal of the
      Martyr is the Alliance one, so the bracket pair reads as a faction
      substitution. Whether the 2.4.3 client resolves it to one seal name is
      NOT VERIFIED. The string is recorded exactly as printed.

# Questions that were open and are now settled. Moved out of open_questions on
# 9 August 2026 so that block holds only what is actually open; each entry is
# kept whole, including the detail that records what was open before.
resolved_questions:

  tier_6_token_exchange_step:
    resolved: >-
      RESOLVED 8 August 2026. The Tier 6 vendor is Tydormu, at the Hyjal Summit
      entrance in the Caverns of Time, and he offers one piece per set for the
      slot, so the token holder picks the set at turn-in. See token_exchange
      key 6 and the_holder_chooses_the_set above. The detail below is kept as
      the record of what was open before.
    blocks: Nothing today.
    detail: >-
      The token_exchange block above names the Tier 4 and Tier 5 vendors. The
      equivalent Tier 6 vendors were not captured, because the Tier 6 capture
      recorded the drop and the piece and did not follow the exchange step.

  set_to_spec_labelling:
    superseded_by: spec_to_set
    superseded_note: >-
      SUPERSEDED 8 August 2026 by the spec_to_set block above, which maps all
      twenty-one rostered specs to a set in each of the three tiers and states
      the stat line that identifies each non-trivial case. The detail below is
      kept as the record of the earlier position. Two things separate the new
      block from what the detail below declined to record. First, the evidence
      is the itemization of the set, read from the chest piece at the 2.4.3
      tooltip endpoint, and the wiki talent tree label is corroboration only,
      so the mapping now rests on the same standard as the rest of this file
      and is available for all three tiers rather than two. Second, which set a
      spec wears is a property of the set, not a council judgment. What remains
      out of scope, per AGENTS.md, is who should be awarded a token.
    blocks: Nothing today, and it is deliberate.
    detail: >-
      The Warcraft Wiki Tier 4 and Tier 5 pages label each set with a talent
      tree, for example Malorne Harness as Feral Combat. That labeling is not
      recorded in this file, because the Tier 6 entries carry no such labeling
      and one standard across the three tiers is worth more here than an extra
      column on two of them. Which spec takes which set is a council judgment
      and is out of scope, per AGENTS.md.
