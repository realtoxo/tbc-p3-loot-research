        alternatives_named: []
        prose: Flask of Relentless Assault — the default choice for Arms Warrior DPS in Phase
          3/Anniversary content; lasts 2 hours and survives death.
      food_id:
        name: Roasted Clefthoof
        id: 27658
        from: food
        position: first named in the field the captured facts allow
        alternatives_named:
        - Spicy Hot Talbuk
        prose: Roasted Clefthoof, for +20 Strength. Spicy Hot Talbuk (+20 Hit Rating, ~1.27%
          hit) is the standard swap when the raider is short of the hit cap instead.
      pot_id:
        name: Haste Potion
        id: 22838
        from: potions
        position: first named in the field the captured facts allow
        alternatives_named:
        - Insane Strength Potion
        - Mighty Rage Potion
        prose: Haste Potion is the primary on-cooldown combat potion (400 Haste Rating for
          15s, best popped alongside other cooldowns/Bloodlust). Insane Strength Potion and
          Mighty Rage Potion are cited as alternative/situational combat potions.
      mhImbue_id:
        name: Adamantite Sharpening Stone
        id: 29453
        from: weapon_main_hand
        position: first named in the field the captured facts allow
        alternatives_named:
        - Adamantite Weightstone
        prose: Adamantite Sharpening Stone (sharp 2H weapons) or Adamantite Weightstone (blunt
          2H weapons), UNLESS the warrior is already receiving Windfury Totem — the stone
          should not be applied to a weapon that is meant to benefit from Windfury, since
          the two do not stack favorably.
