meta:
  what: The simulator id behind every consumable name this project sends, and which name each
    spec sends for which ConsumesSpec field.
  generated_by: tools/extract_consumable_ids.py
  do_not_edit: A hand edit is lost on the next `just regen`, and `just check` fails the build
    by regenerating and diffing. Fix the prose or the transform.
  prose_from:
  - data/facts/consumables.yaml
  - data/facts/sim-profiles/combat-rogue.yaml
  ids_from:
    flasks, food and potions: the `consumables` array of assets/database/db.json in the vendored
      wowsims-tbc-new checkout
    weapon imbues: ui/core/components/inputs/consumables.ts, checked against the switch in
      sim/core/consumes.go and the poison ids in sim/rogue/poisons.go. Imbues are NOT in db.json;
      they are spell ids
  rule: 'The guides lead with the pick, so the first catalog name in a field is taken and
    every later one is written out under alternatives_named. Nothing is chosen for being cheaper.
    A name the prose QUALIFIES is passed over when the captured fact rules it out: a stone
    shows only on a blunt or on a sharp weapon, and a food conditional on the hit cap is read
    against gap_after_gems.'
  conditions_read_from:
    the weapon a spec carries: data/sim/gear, typed by data/facts/items.csv and split blunt
      from sharp by ui/core/proto_utils/utils.ts
    whether a spec is hit-capped: data/facts/hit-captured.yaml, gap_after_gems at every anchor
  main_hand_imbues_are_gated: data/facts/weapon-imbue-gating.yaml. sim/core/consumes.go applies
    a main-hand imbue only where the party has no Windfury Totem, so a pick carrying `gate`
    is sent and dropped and is worth 0.0 DPS. Off-hand imbues are not gated.
  specs: 17
