declined:
  elixirs_instead:
    why: A flask counts as both a battle and a guardian elixir in 2.4.3, and this field names
      what to drink INSTEAD of the flask. Wiring both would stack two things the game does
      not stack.
    specs:
    - affliction_warlock
    - arcane_mage
    - arms_warrior
    - balance_druid
    - beast_mastery_hunter
    - combat_rogue
    - destruction_warlock
    - elemental_shaman
    - enhancement_shaman
    - feral_bear
    - feral_cat
    - fury_warrior
    - protection_paladin
    - protection_warrior
    - retribution_paladin
    - shadow_priest
    - survival_hunter
  scrolls:
    why: Several specs name a scroll in the same sentence that rejects it, so matching on
      the name would switch on a scroll the source turned down. A scroll is 20 points of one
      stat; a wrong one is a wrong number.
    specs:
    - affliction_warlock
    - arcane_mage
    - arms_warrior
    - balance_druid
    - beast_mastery_hunter
    - combat_rogue
    - destruction_warlock
    - elemental_shaman
    - enhancement_shaman
    - feral_bear
    - feral_cat
    - fury_warrior
    - protection_paladin
    - protection_warrior
    - retribution_paladin
    - shadow_priest
    - survival_hunter
  other:
    why: Runes, ammunition, sapper charges and seeds, mixed with prose about which raider
      brings them. No single ConsumesSpec field answers it.
    specs:
    - affliction_warlock
    - arcane_mage
    - arms_warrior
    - balance_druid
    - beast_mastery_hunter
    - destruction_warlock
    - elemental_shaman
    - enhancement_shaman
    - feral_bear
    - feral_cat
    - fury_warrior
    - protection_paladin
    - protection_warrior
    - retribution_paladin
    - shadow_priest
    - survival_hunter
  against_demons:
    why: Elixir of Demonslaying replaces the battle elixir against demons only. The encounter
      these runs use is a generic level 73 target, so a demon-only elixir would be credited
      against a target that is not one.
    specs:
    - combat_rogue
