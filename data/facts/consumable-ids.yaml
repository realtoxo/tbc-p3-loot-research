          Dark Rune (BoE drop) or Demonic Rune (BoP drop) used as a secondary mana potion
          on longer fights, since even Beast Mastery Hunters manage mana via Aspect of the
          Viper between Rune uses — per Warcraft Tavern's table, echoed by Icy Veins ('Demonic
