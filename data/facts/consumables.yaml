meta:
  what: The raid consumable set each spec runs, for the simulator runs. Flask or elixir pair,
    food, weapon enhancement, potions and anything else standard.
  collected: '2026-08-14'
  method: Sixteen parallel Sonnet agents, one per spec, reading published Burning Crusade
    Classic guides. Every agent was required to return exact in-game names, cite the pages
    it used, and put anything it could not source under `uncertain` rather than guess it from
    class intuition.
  why_exact_names: These become simulator inputs. An approximate name is worse than an absent
    one, because it fails at the point where a run is already underway.
  the_expansion_trap: Wowhead serves later-expansion guides at nearly identical URLs, so an
    agent that does not check the page can return a Wrath consumable that reads perfectly
    plausible. Each agent was told to confirm the expansion, and several recorded doubt about
    a page's client version under `uncertain` rather than resolving it silently.
  not_simmed_yet: Nothing here has been through a simulator. wowsimcli is not installed on
    this machine, so these are collected inputs and not results.
  combat_rogue_lives_elsewhere: Collected on 9 August and left in data/facts/sim-profiles/combat-rogue.yaml,
    which holds its gear, talents and gems beside it. Not copied here, because a second copy
    is what goes stale.
  specs: 16
specs:
  affliction_warlock:
    consumables:
      flask: 'Flask of Pure Death (2 hours, +80 Shadow/Fire/Frost spell damage). Cheaper alternative:
        Flask of Supreme Power (+70 spell damage, all schools).'
      elixirs_instead: 'Where the flask is not affordable: Elixir of Major Shadow Power (Battle
        Elixir) paired with Elixir of Draenic Wisdom (Guardian Elixir, +30 Intellect and Spirit).
        Elixir of Major Firepower is the Fire-school equivalent if the raid is fighting fire-vulnerable
        targets instead; both sources agree the flask beats this pairing because elixirs commit
        to a single school while the flask covers Shadow, Fire and Frost together.'
      food: Poached Bluefish, Blackened Basilisk, or Crunchy Serpent — all identical, +23
        Spell Power and +20 Spirit; pick whichever is cheapest. Wowhead additionally lists
        Oronok's Tuber of Spell Power as an equal-stat option.
      weapon_main_hand: 'Brilliant Wizard Oil (+36 spell power, +14 spell critical strike
        rating). Cheaper alternative with no crit: Superior Wizard Oil (+42 spell power only).'
      scrolls: 'Situational only, per Wowhead: Scroll of Intellect V if the raid is missing
        Arcane Intellect/Brilliance entirely; Scroll of Protection V occasionally for the
        extra armor. Neither is standard when a Mage is present.'
      potions: Destruction Potion (+120 spell power, +2% spell crit for 15 sec) used on cooldown
        alongside other damage cooldowns when mana allows. Super Mana Potion instead on longer
        fights or heavy AoE, when it saves more DPS than a Life Tap would cost.
      other: Dark Rune or Demonic Rune for mana instead of Life Tap (Demonic Rune is BoP,
        Dark Rune is BoE; both share a cooldown with Healthstones). Drums of Battle from a
        Leatherworker in the group, usually provided by someone else, not the warlock. Greater
        Rune of Warding as a chestplate imbue (25% chance to absorb 400 physical damage) is
        the only temporary chest enhancement Wowhead lists for the spec. Free Action Potion
        is situational (e.g. movement-impairing mechanics like Kael'thas), not a per-pull
        staple.
    sources:
    - url: https://www.icy-veins.com/tbc-classic/affliction-warlock-dps-pve-enchants-consumables
      title: TBC Classic Affliction Warlock Enchants and Consumables - Icy Veins (updated
        for TBC Anniversary/Phase 3, 12 Jan 2026)
    - url: https://www.wowhead.com/tbc/guide/classes/warlock/dps-consumables-raid-buffs-pve
      title: TBC Warlock DPS Buffs & Consumables Guide - Wowhead (updated 10 Feb 2026, labeled
        client 2.5.1 — the Anniversary-era Burning Crusade Classic client, same Phase 3 content
        window as this project's 2.4.3 reference)
    - url: file:///Users/davidking/src/github.com/realtoxo/tbc-p3-loot-research/data/facts/enchants-gems.yaml
      title: 'This repo''s own gating fact file — used to confirm Flask of Pure Death (item
        22866), Elixir of Draenic Wisdom (item 32067), Brilliant/Superior Wizard Oil (items
        20749/22522) and Scroll of Intellect V (item 27499) carry no phase_3_available: false
        flag'
    uncertain:
    - Which of Elixir of Major Shadow Power vs. Elixir of Major Firepower is the 'go-to' Battle
      Elixir depends on encounter school mix; neither source gives a per-boss breakdown for
      Mount Hyjal/Black Temple specifically, so this is stated as a general Shadow-first choice
      for an Affliction Warlock rather than a per-fight recommendation.
    - The Wowhead guide's URL/page renders as client version 2.5.1 rather than 2.4.3. Content
      (Phase 3, Black Temple/Hyjal-era raid buff list, Fel Lotus-tier flasks) matches this
      project's Phase 3 window and agrees closely with the Icy Veins TBC Classic page, so
      it was used, but the exact patch-numbering correspondence to this project's 2.4.3 convention
      was not independently verified.
    - Neither source states whether Affliction specifically (vs. Destruction) changes potion
      or flask choice at all -- both guides treat 'Warlock DPS' as a single spec-agnostic
      set. No affliction-specific divergence was found; if one exists it is not covered by
      these sources.
    - Whether Drums of Battle is genuinely 'standard' for this spec, or just generic raid-wide
      utility unrelated to Warlock choice, was not verified beyond Wowhead listing it as a
      checklist item conditioned on 'if Leatherworker' being present in party.
    notes: 'Both Icy Veins and Wowhead agree closely on the core kit: Flask of Pure Death
      > elixir pair, Brilliant Wizard Oil, Destruction Potion / Super Mana Potion, and the
      same three-food tier. Flame Cap and fire-specific items were omitted since those apply
      to a Destruction (fire) build, not Affliction (shadow). Greater Rune of Warding (chest
      imbue) only appears on Wowhead, not Icy Veins, but is uncontested and sourced.'
  arcane_mage:
    consumables:
      flask: Flask of Blinding Light (80 Arcane/Holy/Nature Spell Damage). Used instead of
        the Adept's Elixir + Elixir of Draenic Wisdom pair specifically when the mage's mana
        support is strong enough that they never run out of mana during a fight, and is also
        favored on AoE fights. Flask of Supreme Power (70 Spell Damage) is a close second
        choice with the same upsides/downsides; Flask of Distilled Wisdom (65 Intellect) is
        generally passed over in favor of the elixir pair.
      elixirs_instead: 'Adept''s Elixir (Battle Elixir: 24 Spell Damage, 24 Spell Critical
        Strike Rating) + Elixir of Draenic Wisdom (Guardian Elixir: 30 Intellect, 30 Spirit).
        Per Icy Veins this pair is the strongest overall consumable combination for an Arcane
        Mage, and is the DEFAULT choice unless the mage never runs out of mana in the given
        raid environment, in which case Flask of Blinding Light is used instead. This is the
        reverse of a typical flask-first setup: the elixir pair, not the flask, is the primary
        recommendation here.'
      food: 'Spell Power food: Blackened Basilisk, Poached Bluefish, or Crunchy Serpent —
        all three give the identical buff (23 Spell Power, 20 Spirit) and are interchangeable;
        used for sustained spell damage plus mana regen support.'
      weapon_main_hand: Brilliant Wizard Oil (36 Spell Damage, 14 Spell Critical Strike Rating)
        on the staff. Superior Wizard Oil (42 Spell Damage, no crit) is the budget alternative,
        used only when Brilliant Wizard Oil is unavailable.
      scrolls: None found. TBC Classic's consumable scroll line (Scroll of Agility V, Scroll
        of Strength V per the Warcraft Tavern consumables list) covers only Agility/Strength;
        no Intellect or Spirit scroll is listed for the patch, so none applies to an Arcane
        Mage. Left blank rather than guessed — see uncertain.
      potions: Super Mana Potion (1800–3000 Mana) on cooldown — the standard, cheaper choice.
        Destruction Potion (120 Spell Damage, 2% Spell Critical for 15 sec) is used instead
        specifically when the mage's mana support is strong enough to never run oom; it is
        also good on AoE fights but costs more than Super Mana Potion.
      other: Kreeg's Stout Beatdown (25 Spirit, -5 Intellect, 15 min, stacks with everything)
        is called out by Icy Veins as a niche extra for mana-constrained fights, but it requires
        access to a Dire Maul North Tribute Run vendor, so it is not something every raid
        can reliably supply — treat as optional, not standard. Faction-specific 30-min spell-damage-vs-undead/int
        buffs exist (Scourgebane Infusion for Horde, Crystal of Insight for Alliance) but
        are one-time quest rewards, not repeatable raid consumables, so they are not included
        as a standing loadout item.
    sources:
    - title: TBC Classic Arcane Mage Enchants and Consumables - Icy Veins
      url: https://www.icy-veins.com/tbc-classic/arcane-mage-dps-pve-enchants-consumables
    - title: TBC Classic Consumables List - Warcraft Tavern
      url: https://www.warcrafttavern.com/tbc/tools/consumables/
    - title: Arcane Mage PvE Phase 3 Best-in-Slot (BiS) - TBC Classic - Warcraft Tavern
      url: https://www.warcrafttavern.com/tbc/guides/arcane-mage-pve-phase-3-best-in-slot-bis/
    uncertain:
    - 'Scrolls: no Intellect/Spirit scroll was found in the sourced 2.4.3 consumable list
      (only Scroll of Agility V and Scroll of Strength V exist), so no scroll entry is given
      for this spec rather than guessing one from Classic-era memory.'
    - 'Drums (Drums of War: 60 AP, 30 Spell Damage to the party) benefit an Arcane Mage but
      are a raid-wide Leatherworking consumable someone else in the raid brings, not a personal
      loadout item for the mage; not included as ''other'' because no Arcane-Mage-specific
      source called it out as something the mage personally carries.'
    - Icy Veins' page carries a 'last updated Jan 12, 2026' and a 'Updated for TBC Anniversary
      — 24 Jul 2025' changelog entry and explicitly states it covers Phase 3, which is why
      it was trusted for 2.4.3; it does not print a literal '2.4.3' patch string, so this
      is an inference from its changelog and content, not a directly quoted patch number.
    - Wowhead's own 'TBC Mage DPS Buffs & Consumables Guide' was found but its page header
      states patch 2.5.1/2.5.5, which is later than this project's 2.4.3, so it was deliberately
      excluded rather than used as a source, per the wrong-expansion/wrong-patch caution in
      the task instructions.
    notes: 'Field mapping note: the project''s `flask` field is filled with Flask of Blinding
      Light, but per the primary source (Icy Veins) the elixir pair in `elixirs_instead` is
      actually the stronger DEFAULT recommendation, not the fallback — the flask is the situational/alternative
      pick here (used only when mana is a non-issue), the reverse of the field''s usual polarity.
      Called out explicitly in both fields'' text so the simulator-run consumer doesn''t silently
      treat `flask` as the primary choice.


      Arcane Mage''s 2H staff means no off-hand weapon slot for oils/stones, so weapon_off_hand
      is left empty per the task''s own omission rule.'
  arms_warrior:
    consumables:
      flask: Flask of Relentless Assault — the default choice for Arms Warrior DPS in Phase
        3/Anniversary content; lasts 2 hours and survives death.
      elixirs_instead: 'Not the default (the flask is the standard play), but the cheaper
        elixir route is Battle: Elixir of Major Agility (or Elixir of the Mongoose, roughly
        equal/slightly better crit, cost-dependent) + Guardian: Elixir of Major Fortitude.
        Separately, Elixir of Demonslaying is a situational swap for the battle-elixir slot
        (or in place of the flask) specifically against demon bosses — it out-damages the
        flask by about 2% but only lasts 5 minutes against the flask''s 2 hours, so it is
        used per-pull, not raid-wide.'
      food: Roasted Clefthoof, for +20 Strength. Spicy Hot Talbuk (+20 Hit Rating, ~1.27%
        hit) is the standard swap when the raider is short of the hit cap instead.
      weapon_main_hand: Adamantite Sharpening Stone (sharp 2H weapons) or Adamantite Weightstone
        (blunt 2H weapons), UNLESS the warrior is already receiving Windfury Totem — the stone
        should not be applied to a weapon that is meant to benefit from Windfury, since the
        two do not stack favorably.
      scrolls: Scroll of Strength V and Scroll of Agility V, used together — they do not compete
        with any raid buff and stack freely with elixirs/flask.
      potions: Haste Potion is the primary on-cooldown combat potion (400 Haste Rating for
        15s, best popped alongside other cooldowns/Bloodlust). Insane Strength Potion and
        Mighty Rage Potion are cited as alternative/situational combat potions.
      other: Flame Cap (Herbalism) is listed as a low-priority secondary damage consumable
        — rare/expensive relative to its payoff, so not a strong standard pick. Free Action
        Potion is carried defensively (not a DPS cooldown) for stun/slow-immunity mechanics.
    sources:
    - title: TBC Classic Arms Warrior Enchants and Consumables - Icy Veins
      url: https://www.icy-veins.com/tbc-classic/arms-warrior-dps-pve-enchants-consumables
    - title: Arms Warrior PvE Gems, Enchants & Consumables - TBC Classic - Warcraft Tavern
      url: https://www.warcrafttavern.com/tbc/guides/pve-arms-warrior-gems-enchants-consumables/
    - title: TBC Warrior DPS Buffs & Consumables Guide - Burning Crusade Classic - Wowhead
      url: https://www.wowhead.com/tbc/guide/classes/warrior/dps-consumables-raid-buffs-pve
    uncertain:
    - 'weapon_off_hand: Arms Warrior in TBC is conventionally a single two-hand weapon spec,
      so no off-hand oil/stone applies. Warcraft Tavern''s enchant table does list an ''Off
      Hand'' row (Mongoose/Potency) in its Arms Warrior page, but this looks like a shared
      class-guide template rather than an Arms-specific recommendation — Icy Veins'' Arms-specific
      page lists only a single ''Weapon'' enchant slot. Left blank rather than guessed; flag
      if this project''s Arms build is confirmed to dual-wield.'
    - 'Drums (e.g. Drums of Battle/War): not listed as something the Arms Warrior personally
      carries in any of the three sources consulted — Wowhead''s raid-group section frames
      drums as something the raid''s Leatherworker (often the shaman) provides to the group,
      not a per-warrior consumable. Omitted from ''other'' rather than guessed as standard.'
    - 'Scroll of Protection V: mentioned in Wowhead''s general Warrior DPS consumables checklist
      alongside Scroll of Strength V / Agility V, but not present in either Arms-specific
      source (Icy Veins, Warcraft Tavern). Left out of the scrolls answer since it isn''t
      corroborated for Arms specifically.'
    - The Wowhead source's own page title reads 'Burning Crusade Classic 2.5.1,' a later original-timeline
      patch than 2.4.3/Phase 3. Its item-level content (Flask of Relentless Assault, Haste
      Potion, Adamantite stones, Windfury interaction) matches the Anniversary-updated Icy
      Veins/Warcraft Tavern pages and was only used for corroboration, not as a standalone
      source, given the patch-mismatch risk called out in the task instructions.
    - 'Elixir of the Mongoose vs. Elixir of Major Agility as the battle-elixir alternative:
      sources disagree slightly on which is marginally better (price-dependent), so both are
      named rather than picking one.'
    notes: Icy Veins (updated 31 Dec 2025 'for TBC Anniversary') and Warcraft Tavern (image
      path dated March 2026, Anniversary branding) were treated as the primary, spec-specific,
      patch-current sources. Wowhead's general Warrior DPS page was used only to corroborate
      details already present in the other two, because its own title strings the page to
      patch 2.5.1 rather than 2.4.3.
  balance_druid:
    consumables:
      flask: Flask of Blinding Light — primary raid flask for Balance Druid DPS, per Icy Veins
        and Warcraft Tavern.
      elixirs_instead: Adept's Elixir (battle elixir) plus Elixir of Draenic Wisdom or Elixir
        of Major Mageblood (guardian elixir), per Icy Veins. Icy Veins states this pairing
        is on par with the flask in raw output but cheaper for progression pulls since elixirs
        are lost on death and the flask is not — so the flask is the standard pick and this
        pair is the fallback when mana, not damage, is the binding constraint.
      food: Blackened Basilisk, Crunchy Serpent, or Poached Bluefish — all grant Spell Damage
        and are listed as equally best by both Icy Veins and Warcraft Tavern; no source ranks
        one above the others.
      weapon_main_hand: Brilliant Wizard Oil, per both sources. Icy Veins also lists Superior
        Wizard Oil as an alternative; Warcraft Tavern names only Brilliant Wizard Oil.
      scrolls: Not found as a standard item in either spec-specific guide (Icy Veins, Warcraft
        Tavern). Not asserting one.
      potions: Destruction Potion on cooldown as the standard combat potion (both sources).
        Super Mana Potion is the substitute when mana, not damage, is the fight's constraint
        (both sources).
      other: Dark Rune or Demonic Rune as a secondary mana potion, per both sources. Icy Veins
        additionally notes Drums of Battle (Spell Haste) as standard if the Balance Druid
        is also a Leatherworker — conditional on that profession, not a general raid pick.
    sources:
    - url: https://www.icy-veins.com/tbc-classic/balance-druid-dps-pve-enchants-consumables
      title: TBC Classic Balance Druid Enchants and Consumables — Icy Veins (updated Jan 12,
        2026, for Phase 3)
    - url: https://www.warcrafttavern.com/tbc/guides/pve-balance-druid-boomkin-gems-enchants-consumables/
      title: Balance Druid Boomkin PvE Gems, Enchants & Consumables — TBC Classic Anniversary
        Edition, Warcraft Tavern
    uncertain:
    - Wowhead's own spec-specific consumables guide (https://www.wowhead.com/tbc/guide/classes/druid/balance/dps-consumables-raid-buffs-pve)
      returned no usable prose — it is a client-side-rendered table page and additionally
      headers itself 'Patch 2.5.5', a version past 2.4.3, so it was not used as a source here
      even though it appeared in search results.
    - 'Scrolls of Intellect/Spirit: neither spec guide lists a scroll as a standard Balance
      Druid consumable. This is plausibly because raid Arcane Intellect and Spirit buffs from
      other classes already exceed the scroll''s value, but neither source states that reasoning
      explicitly, so no scroll is being asserted and no reason is being invented.'
    - Warcraft Tavern's page also lists Kreeg's Stout Beatdown and Purified Draenic Water
      under 'Other' with no explanation of their function or why they are standard for this
      spec; they are left out of the answer because their relevance to a Balance Druid DPS
      profile could not be confirmed.
    - Whether Elixir of Draenic Wisdom or Elixir of Major Mageblood is the better guardian-elixir
      choice between the two is not resolved by Icy Veins — it names both as co-best without
      a tiebreaker.
    notes: Icy Veins and Warcraft Tavern agree on every consumable slot they both cover (flask,
      food, oil, combat potion, secondary potion, secondary mana source). No conflict between
      sources was found for this spec, so no disagreement needed to be flagged beyond what's
      in `uncertain`.
  beast_mastery_hunter:
    consumables:
      flask: Flask of Relentless Assault
      elixirs_instead: 'Elixir of Major Agility (battle) + Elixir of Major Mageblood (guardian)
        — Icy Veins states this pair out-performs Flask of Relentless Assault ''in most situations,''
        with the caveat that elixirs are lost on death (making them costlier across wipes)
        while a flask survives death. Condition: against a Demon-type target (e.g. Magtheridon),
        swap the battle elixir for Elixir of Demonslaying instead of Major Agility — both
        sources agree Demonslaying is ''significantly stronger'' there.'
      food: 'Sources disagree and the choice is stat-dependent, so both are reported rather
        than picked silently: Icy Veins recommends Spicy Hot Talbuk (Attack Power) if not
        yet hit-capped, or Grilled Mudfish (Agility) once hit-capped. Warcraft Tavern''s table
        instead lists Warp Burger with Grilled Mudfish as an alternate. Grilled Mudfish is
        the one point of agreement between the two.'
      weapon_main_hand: 'Mana Oil on both melee weapons, RULED by the guild lead on 20 August
        2026, "hunter will run applicable weapon oils", and no agility imbue exists in 2.4.3
        or in the simulator, so the mana oil is the applicable one; see
        data/judgments/weapon-imbues.yaml. OVERRIDDEN GUIDE ADVICE, kept for the record: the
        guides named Adamantite stones by weapon class, per Warcraft Tavern and confirmed by
        Icy Veins ("Weapon stones are also incredibly important for Hunters"). The ruling
        governs what this raid runs.'
      scrolls: Scroll of Agility V (world drop), per Warcraft Tavern's consumables table;
        Icy Veins corroborates only in general terms ('Any Scrolls of Agility/Intellect are
        also nice buffs and worth using') without singling out the Roman-numeral tier. Warcraft
        Tavern's table also lists Scroll of Strength V and Scroll of Protection V, but neither
        Strength nor Armor/Defense serves a BM Hunter DPS's stat priority, so only the Agility
        scroll is reported as standard.
      potions: Haste Potion (Alchemy) as the combat cooldown potion — agreed by both sources.
        Dark Rune (BoE drop) or Demonic Rune (BoP drop) used as a secondary mana potion on
        longer fights, since even Beast Mastery Hunters manage mana via Aspect of the Viper
        between Rune uses — per Warcraft Tavern's table, echoed by Icy Veins ('Demonic Runes
        and Dark Runes both grant Mana... allow more casts before needing to swap to Aspect
        of the Viper on longer encounters').
      other: 'Ammo (functionally mandatory for a Hunter, reported under ''other'' since the
        requested shape has no ammo field): Warden''s Arrow (Cenarion Expedition — Revered)
        as the general-purpose choice, or Hellfire Shot / Felbane Slugs (Thrallmar/Honor Hold
        — Revered) as reputation-gated alternates, per Warcraft Tavern. Kibler''s Bits (Cooking)
        is also listed there as standard pet food for the Hunter''s pet.'
    sources:
    - title: Beast Mastery Hunter PvE Gems, Enchants & Consumables - TBC Classic - Warcraft
        Tavern
      url: https://www.warcrafttavern.com/tbc/guides/pve-beast-mastery-hunter-gems-enchants-consumables/
    - title: TBC Classic Beast Mastery Hunter Enchants and Consumables - Icy Veins
      url: https://www.icy-veins.com/tbc-classic/beast-mastery-hunter-dps-pve-enchants-consumables
    uncertain:
    - 'Food buff: the two sourced guides disagree (Spicy Hot Talbuk vs Warp Burger as the
      primary AP food), and neither confirms this against a hit-cap threshold specific to
      a Phase 3 raid comp — resolve by checking the raid''s actual buff/debuff coverage before
      locking a simulator input.'
    - Whether 'Elixir of Major Agility' and 'Elixir of Major Mageblood' are respectively the
      Battle and Guardian elixir slots is stated from general TBC elixir-category knowledge,
      not an explicit label in either fetched source — worth confirming against Wowhead's
      item tooltip before treating as sourced.
    - The Wowhead TBC Hunter DPS Consumables guide (a natural third corroborating source)
      returned a CDN error on fetch and could not be checked; only two independent sources
      back this answer instead of three.
    - No wowsims/simc-style simulated consumable comparison exists in this repository's data
      for Beast Mastery Hunter — per project rules, only the four crit.yaml figures qualify
      as 'our own simulation,' and this consumable set is not among them.
    notes: 'Both sourced guides are explicitly TBC Classic / TBC Classic Anniversary content
      (Warcraft Tavern''s page targets ''TBC Classic Anniversary Edition''; Icy Veins'' page
      carries a changelog entry ''14 Jan. 2022: Updated for Phase 3'' and a further ''31 Dec.
      2025: Reviewed and Updated for TBC Anniversary Realms'' revision), so neither is a later-expansion
      page mistakenly served at a TBC-shaped URL. Hunter has no off-hand weapon slot to enchant
      (Hunters do not dual-wield in TBC; they carry one melee weapon plus a ranged weapon),
      so weapon_off_hand is left empty rather than guessed. Ammo (Warden''s Arrow / Hellfire
      Shot / Felbane Slugs) does not fit any of the requested field names cleanly and was
      placed under ''other'' rather than omitted, since ammo is a genuinely standard Hunter
      consumable.'
  destruction_warlock:
    consumables:
      flask: 'Flask of Pure Death (+80 Spell Power for 2 hours). Cheaper alternative: Flask
        of Supreme Power (+70 Spell Power).'
      elixirs_instead: Elixir of Major Shadow Power or Elixir of Major Firepower (Battle Elixir,
        pick per spell school used) paired with Elixir of Draenic Wisdom (Guardian Elixir).
        Used only when the flask is unaffordable or not farmed; the flask is the stronger
        and generally recommended option since it covers both fire and shadow damage where
        an elixir covers only one school.
      food: Poached Bluefish, Blackened Basilisk, or Crunchy Serpent (+23 Spell Power, +20
        Spirit) -- all three give identical stats, pick the cheapest available.
      weapon_main_hand: Brilliant Wizard Oil (+36 Spell Power, +14 Crit Rating). Superior
        Wizard Oil is inferior (Spell Power only, no crit) so Brilliant remains preferred.
      scrolls: Not standard. Scroll of Intellect V is a fallback only if the raid is missing
        Arcane Brilliance/Intellect entirely; Scroll of Protection V is an occasional extra-armor
        option. Neither is a default part of the set.
      potions: Destruction Potion (+120 Spell Power, +2% Spell Crit for 15 sec) used on cooldown
        alongside other cooldowns (e.g. Bloodlust/Blood Fury/on-use trinkets). Super Mana
        Potion is used instead on longer fights or heavy-AoE phases where it saves more DPS
        by avoiding Life Tap than the damage potion would provide.
      other: Dark Rune or Demonic Rune for burst mana without Life Tapping (shares cooldown
        with Healthstone and Flame Cap). Flame Cap (+80 Fire spell damage, 1 min, 3 min cooldown)
        only for a Fire-build Destruction Warlock -- shares cooldown with the Runes, so it
        is a choice between Flame Cap and Rune use on cooldown, not both. Drums of Battle
        -- typically brought by a party Leatherworker rather than the Warlock themself, so
        it is a raid-provided buff rather than a personal consumable.
    sources:
    - title: TBC Classic Destruction Warlock Enchants and Consumables - Icy Veins
      url: https://www.icy-veins.com/tbc-classic/destruction-warlock-dps-pve-enchants-consumables
    - title: Destruction Warlock Gems, Enchants & Consumables - Warcraft Tavern
      url: https://www.warcrafttavern.com/tbc/guides/pve-destruction-warlock-gems-enchants-consumables/
    - title: TBC Warlock DPS Buffs & Consumables Guide - Wowhead
      url: https://www.wowhead.com/tbc/guide/classes/warlock/dps-consumables-raid-buffs-pve
    uncertain:
    - Whether Destruction Warlock dual-wields is not applicable -- Warlocks are single main-hand
      casters, so weapon_off_hand is correctly omitted, not unsourced.
    - None of the three sources explicitly restate that Flask of Pure Death and Destruction
      Potion are Black Temple/Phase 3 Alchemy recipes rather than earlier-phase items; this
