        thread notes Mongoose edges out Major Agility slightly on crit but with more RNG variance).
        Guardian — Elixir of Major Fortitude. Icy-Veins and Warcraft Tavern both list Elixir
        of Major Agility/Mongoose plus Major Fortitude as the elixir pair; Wowhead frames
        Demonslaying as strictly a vs-demons swap-in over the flask.'
      food: Roasted Clefthoof for +20 Strength (the default). Spicy Hot Talbuk (+20 Hit Rating
        / ~1.27% hit) is the situational swap when the raider needs help reaching the hit
        cap instead of raw Strength — all three sources state this condition explicitly.
      weapon_main_hand: 'Condition-dependent, not a purchasable oil/stone: if the raid has
        an Enhancement Shaman running Windfury Totem, leave the main-hand weapon bare so Windfury
        can proc on it — Wowhead states this is the single best main-hand enhancement and
        stones should not be applied there. Only if no Windfury Totem is present should Adamantite
        Sharpening Stone (sharp weapons) or Adamantite Weightstone (blunt weapons) go on the
        main hand instead.'
      weapon_off_hand: Adamantite Sharpening Stone (sharp weapons) or Adamantite Weightstone
        (blunt weapons) — used regardless of Windfury Totem presence, since Windfury does
        not benefit from an off-hand stone the same way. Wowhead specifically credits Adamantite
        Sharpening Stone as ~1% stronger than Elemental Sharpening Stone for this slot.
      scrolls: Scroll of Strength V and Scroll of Agility V, used together (Icy-Veins, Warcraft
        Tavern). Wowhead's checklist also adds Scroll of Protection V to the trio, noting
        scrolls don't compete with the Battle/Guardian elixir slots or the raid-buff stacking
        rules, so all three can be run alongside a flask or elixir pair for free.
      potions: 'Haste Potion is the primary on-cooldown combat potion, ideally popped alongside
        Bloodlust/other cooldowns (all three sources). Situational/secondary options named
        by Icy-Veins and Wowhead: Insane Strength Potion (burst Strength), Mighty Rage Potion
        (trash rage burst), Free Action Potion (stun/slow immunity on relevant fights), Swiftness
        Potion (high-movement fights).'
      other: 'Drums of Battle — a Leatherworking-crafted party buff Wowhead calls out as standard
        for one player per party (usually the raid''s shaman) to bring, distinct from a warrior''s
        own personal consumables but part of the expected raid setup. Engineering-only burst
        options if the player has the profession: Super Sapper Charge (5-min CD AoE burst,
        primary), backed up by Adamantite Grenade (1-min CD) between Sapper charges — Wowhead''s
        checklist and Icy-Veins both list this pairing, but it is profession-gated, not universal.
        Flame Cap (Herbalism) is named by all three sources as a low-priority, marginal-DPS
        option due to rarity/cost of its Fel Lotus-line reagent — optional rather than standard.'
