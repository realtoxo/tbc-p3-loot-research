  fury_warrior:
    consumables:
      flask: Flask of Relentless Assault — the standard 2-hour flask for Fury Warrior DPS,
        lasts through death. All three sources agree this is the default pick against non-demon
        bosses.
      elixirs_instead: 'Used only when not flasking (budget reasons) or against demons: Battle
        — Elixir of Demonslaying (demon fights only, +2% damage over the flask but only 5-minute
        duration, so it is reapplied per-pull rather than worn continuously) or, as a general-purpose
