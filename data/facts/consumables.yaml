  protection_warrior:
    consumables:
      flask: Flask of Fortification (Alchemy; the standard tank stamina/defense flask). Flask
        of Chromatic Wonder is the swap on fights with heavy elemental/magic damage.
      elixirs_instead: 'Both sources say Protection Warriors more commonly run the battle+guardian
        elixir pair rather than a flask (cheaper per raid night, and the pair beats one flask
        on stats even though it does not survive death). Battle Elixir: Elixir of Major Agility
        as the default, or Elixir of Demonslaying specifically against demon bosses (relevant
        across Black Temple''s demon encounters — Illidari Council, Illidan, Reliquary of
        Souls, etc.). Guardian Elixir: Elixir of Major Fortitude as the default; Elixir of
        Major Defense is the stronger pick on fights that are purely physical damage; Elixir
        of Ironskin is used if the tank is not yet crit-immune.'
      food: Fisherman's Feast (Cooking) is the recommended food buff. Spicy Crawdad is the
        fallback. Spicy Hot Talbuk is used instead when the tank still needs help reaching
        the hit cap or wants extra threat.
      weapon_main_hand: 'Adamantite Sharpening Stone (sharp/edged weapons) or Adamantite Weightstone
        (blunt weapons), from Blacksmithing. Condition: skip the stone if an Enhancement Shaman
        in the party is already providing Windfury Totem — the temporary weapon enchant and
        the stone occupy the same slot, so the stone would just be wasted or would override
        the totem''s proc weapon.'
      scrolls: Scroll of Strength V, Scroll of Protection V, and Scroll of Agility V — used
        together when available cheaply on the auction house or from a Field Repair Bot 110G
        vendor.
      potions: Mighty Rage Potion, used liberally on trash. Haste Potion, used on boss pulls
        for threat. Ironshield Potion, used as the survivability potion when incoming damage
        spikes. Free Action Potion is situational, for fights with stuns/slows to dodge.
      other: Nightmare Seed (Herbalism only) is called out as a low-cooldown mini Last Stand
        worth always carrying, but it is profession-gated, not something every tank has access
        to. Super Sapper Charge / Adamantite Grenade (Engineering only) are AoE-threat tools
        on trash, also profession-gated rather than a universal standard.
