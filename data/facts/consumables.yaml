        want (Spirit feeds the mana-heavy powershifting rotation).
      weapon_main_hand: Adamantite Weightstone, applied to the equipped weapon. In late TBC
        this buff was updated to keep functioning through Cat Form's weapon-hidden shapeshift,
        so it stays active in combat.
      scrolls: Scroll of Agility V and Scroll of Strength V — scrolls are not elixirs so they
        stack freely alongside the flask/elixir choice above.
      potions: Fel Mana Potion is the primary DPS potion on cooldown (its spell-damage-taken
        penalty is irrelevant to a physical-damage cat); Super Mana Potion is the budget substitute.
        On fights short enough that mana is not a concern, Haste Potion replaces it for more
        raw damage.
      other: Dark Rune or Demonic Rune as extra mana restoration (both are vanilla-sourced
        items still farmed and used in TBC). Drums of Battle from a raid Leatherworker for
