      Classic page by its own header.
    notes: 'Cross-checked two independent BC-Classic-specific sources (Icy Veins, updated
      Jan 2026; Warcraft Tavern) that agree on structure: Protection Paladin threat is spell-driven,
      so weapon oil and food/flask choices split along a survivability-vs-threat axis rather
      than having one unconditional answer. Flask of Fortification and stamina food (Fisherman''s
