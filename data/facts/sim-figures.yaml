meta:
  generated_by: tools/run_sims.py
  simulator: v0.0.116
  iterations: 10000
  seed: 1
  encounter_seconds: 150
  boss_armor_source: data/facts/boss-armor.yaml, one row per boss with a source
    each. Phase 3 spans two tiers and a figure at one is NOT comparable with a figure
    at the other.
  targets: 1
  target_level: 73
  interval: '`standard_error` is ONE standard error on the mean, stdev over the
    square root of 10000. It covers about 68 percent, NOT 95. Ruled by the guild
    lead on 15 August 2026, shown both options. Do not relabel it as a confidence
    interval.'
  default_tier: '7684, the highest tier, ruled by the guild lead on 20 August 2026:
    decisions assume the hardest target. Ten of the fourteen Phase 3 bosses sit
    at 6193, and the per-tier rows keep every figure.'
  the_zero_tier_is_one_target: Essence of Suffering alone, plus Veras Darkshadow,
    whose armor is near-zero with the digits unestablished. Run because the guild
    lead ruled per boss, and a target with no armor is a real part of two encounters.
  expose_weakness: The Survival Hunter's agility is MEASURED per anchor by bisection,
    1119 entry, 1105 tier, 1152 best in slot, with the uptime measured at 0.98.
    See data/facts/raid-buffs.yaml. It was the simulator's generic 1210 for a few
    hours on 15 August 2026 and that was 5 to 9 percent high for this roster.
  armor_tiers_run:
    7684:
    - Essence of Anger
    - Essence of Desire
    - Flame of Azzinoth
    - Gurtogg Bloodboil
    - High Warlord Naj'entus
    - Illidan Stormrage
    - Shade of Akama
    - Supremus
    6193:
    - Anetheron
    - Archimonde
    - Azgalor
    - Gathios the Shatterer
    - High Nethermancer Zerevor
    - Kaz'rogal
    - Lady Malande
    - Mother Shahraz
    - Rage Winterchill
    - Teron Gorefiend
    0:
    - Essence of Suffering
  the_no_glaive_anchor: fury_warrior and combat_rogue each carry a second best-in-slot
    profile, bis_no_glaives, identical in every slot except the two weapons. Both
    specs' published Phase 3 lists rank the Warglaives of Azzinoth and the raid
    holds one pair, so at most one of them can be the `bis` row and the other is
    this one. The replacement weapons were found by running all 33 candidates Phase
    3 can supply, not chosen.
