# Simulator profiles, one per rostered spec. Hand-authored.
#
# HOLDS   The SHAPE a hand-collected profile would take: the gear, enchants and
#         gems per anchor, and the talent build and rotation the run assumes.
# NOT HERE  Buffs are in roster.yaml, cap positions in hit.yaml, crit.yaml and
#         haste.yaml, and the items themselves in items.csv.
#
# BEFORE YOU USE A FIGURE
#   THIS FILE IS NOT WHERE THE RUNS COME FROM, and it never became that. It
#   describes a HAND-COLLECTED profile, one spec at a time, and the shape was
#   agreed before anyone started collecting. Nobody ever did.
#   WHAT HAPPENED INSTEAD, on 15 August 2026: the profiles are GENERATED. The
#   gear comes from the captures under sim-profiles/hit-capture and
#   sim-profiles/bis-capture, tools/export_sim_profiles.py assigns the enchants
#   and gems, and tools/run_sims.py assembles the buffs, consumables, talents
#   and rotation at run time from the fact files. The result is data/sim/gear,
#   and that is what a run reads.
#   SO EVERY `not_collected` BELOW IS ACCURATE AND ALSO IRRELEVANT. It records
#   that this hand-collection route was not taken. It does NOT mean no figure
#   exists: data/facts/sim-figures.yaml holds 13 specs across three anchors.
#   THE FILE IS KEPT rather than deleted because the schema states what a
#   profile has to pin down, and the generated route has to satisfy the same
#   list. Its `slots` block and its `schema` block are still the checklist.
#   A run is only comparable with another run if both were configured the same
#   way. A figure produced from an ad hoc profile is not comparable with
#   anything and must not be recorded beside one that was.
#   Consumables ARE assumed in a run, per the framework, and are NOT counted in
#   hit.yaml cap states. The two settings answer different questions and must
#   not be reconciled by changing either one.
#
# SOURCE  Hand-authored per spec. Gear is named by item id so it resolves
#   against items.csv. Enchants and gems are named by item or spell id so they
#   resolve against enchants-gems.yaml. A slot filled by anything not in either
#   file is recorded with its source, because an unsourced entry cannot be
#   rebuilt by someone checking the run.

meta:
  status: superseded_by_the_generated_route
  specs_defined: 21
  specs_hand_collected: 0
  previously_claimed: >-
    Until 15 August 2026 this block said NO SIMULATION HAS BEEN RUN AT THESE
    ANCHORS. That was true when written and is now false. Runs at our anchors
    exist for 13 specs at three anchors, in data/facts/sim-figures.yaml, and
    what they mean is in data/facts/sim-results.yaml. The quoted claim is kept
    because AGENTS.md cited it for a week and a reader meeting the old sentence
    elsewhere should be able to find where it was retracted.
  what_that_does_and_does_not_mean: >-
    `specs_hand_collected: 0` counts the route this file describes, and it is
    still zero because that route was never taken. The runs are configured from
    generated profiles instead. What remains genuinely unmeasured is a PRICE FOR
    A SET BONUS in general: sim-results.yaml prices three of them by measurement,
    the Fury Destroyer four-piece, the Rogue Slayer four-piece and the single
    token valleys, and no other set bonus in the repository has a figure.
  anchors: [entry, tier, bis]
  note: >-
    Two anchors were RULED on 9 August 2026 and a third was added on 15 August
    2026. All three describe gear a real player has.
    BIS is the full Phase 3 best-in-slot set, built from the Wowhead captures in
    data/research/wowhead-phase3-bis-full/ with the guild lead's weapon routing
    applied. It exists because ENTRY and TIER share every weapon and trinket, so
    neither answers what a Phase 3 geared spec does.
    ENTRY is the spec's Tier 5 best-in-slot set: what a raider walks into Phase
    3 wearing. Season 2 is in, Season 3 is out, because Season 3 arrives five
    days after the phase opens.
    TIER is NOT a Phase 3 best-in-slot list. A full-clear list assumes the
    hardest drops in the tier and describes almost nobody. The Tier anchor is
    what a player could plausibly be wearing FOUR TO SIX WEEKS INTO Mount Hyjal
    and Black Temple: the Tier 6 token pieces the spec actually runs, usually a
    two-piece or a four-piece rather than five, with every other slot filled by
    what that player realistically holds by then, which is Phase 2 gear, early
    Hyjal and Black Temple off-pieces, badge rewards and crafted items.
    KEEPING A PREVIOUS TIER'S SET BONUS IS PART OF THE ANSWER, not a
    complication. Where it is optimal the spec holds a Tier 5 two-piece beside a
    Tier 6 two-piece, and which bonuses a configuration holds is the single most
    important thing a profile records.
  split_combinations: >-
    A configuration mixing two tiers, such as two Tier 6 pieces beside two Tier
    5 pieces, is supported by this schema because a slot names its own item and
    its own tier.
    ONE IS NOW CONFIRMED. The Arcane Mage best-in-slot capture holds four Tier 5
    pieces beside one Tier 6, which is the first split this project has met in a
    published list. It needed no schema change, which is what this paragraph
    was written to guarantee.

# The fields every spec entry carries, so a collection session has a checklist
# and two people collecting separately produce the same shape.
schema:
  spec: The rostered spec id, matching hit.yaml.
  talent_build: Link to the build, and the count. The tree split changes caps.
  rotation: What the simulator is told to cast, and where that came from.
  anchors:
    entry:
      gear: One entry per slot, item id and name, with the source of each.
      enchants: One entry per enchantable slot, by id.
      gems: One entry per socket, by id, with the socket color and whether the
        socket bonus is met.
      consumables: Flask or elixir pair, food, weapon enhancement, scrolls.
    tier:
      gear: >-
        The same shape, holding THE PIECES THE SPEC ACTUALLY WEARS four to six
        weeks in. Not five tier pieces, and not a full-clear best-in-slot list:
        the first describes gear nobody runs and the second describes gear
        almost nobody has yet. Most specs run a two-piece or a four-piece, the
        remaining slots hold Phase 2 gear, early Hyjal and Black Temple
        off-pieces, badge rewards and crafted items, and a spec may keep pieces
        of Tier 5 to hold a Tier 5 bonus alongside a Tier 6 one. Name every
        slot's item by id, whichever tier it comes from, so the profile states
        the configuration rather than implying it.
      enchants: The same.
      gems: The same, since a tier piece changes the sockets available.
      consumables: The same.
      bonuses_held: >-
        Which set bonuses this configuration actually holds, named, one per set.
        A four-piece Tier 6 holds its two-piece as well. A two plus two holds
        one bonus from each set. This is what the configuration was chosen FOR,
        so it is stated rather than left to be counted from the slot list.
  composition_source: >-
    Where the configuration came from. Which pieces a spec runs is a fact about
    what that class does, established by its community, not a choice we make, so
    it carries a source the same way a stat line does. Where no reliable source
    exists and we worked it out ourselves, say so: a composition we derived is a
    weaker fact than one the class agrees on.
  collected_on: Date the profile was filled in.
  collected_by: Who filled it in.
  verified_against: What the resulting figures were checked against, if anything.

# Slots a profile must fill, so a half-filled profile is visible as half-filled.
slots:
  armor: [head, neck, shoulder, back, chest, wrist, hands, waist, legs, feet]
  jewelry: [ring_1, ring_2, trinket_1, trinket_2]
  weapons: >-
    Spec-dependent. Main hand and off hand for a dual-wielder, two hand for a
    two-hander, plus ranged or a relic where the class carries one. The EP
    Workbook tabs differ here, and a Fury Warrior tab has no two-hand section
    at all.

# Every rostered spec, empty. Fill one and set its status to collected.
