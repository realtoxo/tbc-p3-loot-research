# NOTHING BELOW IS OPEN. All three were settled on 15 August 2026 by the
# generated route taking over, and they are kept because the reasoning is the
# useful part and because one of them turned out to be the sharpest constraint
# on how these figures may be read.
settled_questions:

  collection_order:
    settled: Moot. Nothing is hand-collected in the order this describes, because
      nothing is hand-collected. The generated route produces every spec at once.
    was_blocking: Every throughput figure the compendium would quote.
    detail: >-
      Nothing is collected. Order by what a figure would decide. The three specs
      hit.yaml records as short come first, feral_bear, protection_paladin and
      arcane_mage, because a short state is the only cap state that creates a
      claim on loot. Then the two that change state between anchors,
      beast_mastery_hunter and protection_warrior, since their tier sets carry
      no hit and that movement is already recorded but not measured. Then the
      contested pairs, the two ferals and the two warriors, who share a set and
      contest the same pieces.

  gear_for_the_entry_anchor:
    settled: >-
      Answered a different way than this anticipated. The entry gear never came
      from extract_ladder.py and was never assembled by hand from the workbook.
      It comes from the per-spec captures under sim-profiles/hit-capture, which
      record published gear lists, and tools/export_sim_profiles.py turns those
      into data/sim/gear. So the entry profile does NOT follow the workbook
      greedy rule and is not expected to agree with the supply figures; the two
      rules are named and separated in hit-captured.yaml.
    was_blocking: The entry profile for every spec.
    detail: >-
      The entry gear set is currently computed inside tools/extract_ladder.py to
      derive a supply figure and then discarded, so there is no list to copy
      into a profile. Publishing it is a separate deferred task. Until then an
      entry profile has to be assembled by hand from the EP Workbook, which is
      slower and will not agree with the supply figures unless the same rule is
      followed.

  rotation_source:
    settled: >-
      DECIDED, and it is the same choice for every spec: the action priority
      list the simulator itself ships, at ui/<class>/<spec>/apls/. Writing our
      own would be a modelling choice we could not defend and taking a community
      one carries that source's assumptions, so the engine's own list is the
      only option that is both uniform and citable. tools/run_sims.py::APL names
      the file per spec and STOPS rather than falling back, because the fallback
      rotation returns 0.0 for every caster and a plausible smaller number for
      every physical spec.
    the_concern_it_raised_still_stands: >-
      THIS IS WHY docs/sims.md REFUSES TO RANK SPECS. Choosing one source
      uniformly makes the choice defensible; it does not make rotation quality
      equal between specs. It is not, and it distorts absolute damage far more
      than it distorts what a stat is worth inside one spec. So a figure is
      comparable with the same spec at another anchor and with nothing else,
      which the page states in its own words.
    was_blocking: Comparability between specs.
    detail: >-
      Rotation quality varies sharply between specs in a simulator and distorts
      absolute damage far more than it distorts what one point of a stat is
      worth within a spec. A rotation copied from a community source carries that
      source's assumptions. Whether a rotation is taken from the simulator's
      default, from a community guide, or written here, is not decided, and it
      has to be the same choice across specs or cross-spec figures are not
      comparable.
