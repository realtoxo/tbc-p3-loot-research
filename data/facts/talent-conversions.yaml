meta:
  what: The talents that turn a stat into spell power, the percentage at every rank, and
    the rank each rostered spec's own build takes.
  percentages_from: the Wowhead tooltip text captured under data/research/wowhead-talents/,
    read out of the sentence rather than transcribed
  ranks_from: 'data/facts/talents.yaml :: wowsims_talent_strings, decoded against the
    vendored talent trees and checked against the point spread already recorded for each
    spec'
  no_build_recorded:
  - Holy Paladin / Divine Intellect
  - Holy Paladin / Holy Guidance
  - Priest Healer / Spiritual Guidance
  - Restoration Druid / Living Spirit
  - Restoration Druid / Lunar Guidance
  - Restoration Shaman / Nature's Blessing
  why_some_are_null: wowsims TBC ships no healer simulation, so no preset build exists
    for the Holy Paladin, the Priest Healer, the Restoration Shaman or the Restoration
    Druid. Those are the specs these talents matter most to. A rank of null is a gap this
    project has not filled, not a talent that does not apply.
