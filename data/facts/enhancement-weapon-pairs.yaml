meta:
  what: Every matched-speed Enhancement weapon pair, simulated on the best-in-slot
    profile with only the two weapon slots replaced, plus the two mismatched pairs
    the captures wore, as references. Produced by tools/run_weapon_pair_sims.py
    under the 20 August 2026 ruling in data/judgments/enhancement-weapon-rules.yaml.
  read_this_first: EVERY PAIR RUNS BARE, with no weapon enchant and no gems, so
    these figures compare with EACH OTHER and never with the enchanted anchor figures
    in sim-figures.yaml. The plus or minus is ONE STANDARD ERROR, not a confidence
    interval. NOT A RULING. Which pair each anchor wears is the council's call.
  base_profile: enhancement-shaman.bis
  race: Draenei
  weapons_unsynced: No syncType is sent, per the 15 August 2026 ruling that the
    weapons run unsynced. A matched pair is where the simulator's Auto mode would
    begin delaying the off hand, so the absence is load-bearing here and is stated.
