  arcane_mage:
    why: 'An Arcane Mage can carry a staff or a one-hander with a held frill, and
      both styles run in the same table, so a row below is either a single staff
      with the off hand empty or a main hand with an off-hand frill that is not
      a weapon. Each row is THIS PROFILE with only the weapon slots changed: the
      main hand keeps its Sunfire, which a staff row inherits because the enchant
      belongs to the slot, and the consumables, buffs and seed hold still, so every
      figure is directly comparable with the one at the top of this page. The Brilliant
      Wizard Oil applies to any weapon, staff and sword alike, and a frill takes
      no imbue, so nothing about the consumables varies across the rows. The candidates
      are the top of the EP Workbook''s Two Hand, One Hand and Off Hand ladders
      for this spec, and no candidate carries a socket. Zhar''doom is a row even
      though it goes to the warlocks, the Balance Druid, the Elemental Shaman and
      the Shadow Priest, with the Arcane Mage taking Tempest of Chaos first, so
      this spec''s best-in-slot set wears the one-hander with a frill rather than
      the staff. The staff is measured anyway, and the preference stays with the
      council. The table therefore carries every half of the Tempest question: the
      warlock rounds measure what other specs lose while the mage holds it, and
      this table measures what the mage loses if it concedes it, and what the routed
      staff would be worth here.'
