  shadow_priest:
    why: 'A Shadow Priest can carry a staff or a one-hander with a held frill, and
      both styles run in the same table, so a row below is either a single staff
      with the off hand empty or a main hand with an off-hand frill that is not
      a weapon. Each row is THIS PROFILE with only the weapon slots changed: the
      main hand keeps its Soulfrost, which a staff row inherits because the enchant
      belongs to the slot, and the consumables, buffs and seed hold still, so every
      figure is directly comparable with the one at the top of this page. The Superior
      Wizard Oil applies to any weapon, staff and mace alike, and a frill takes
      no imbue, so nothing about the consumables varies across the rows. The candidates
      are the top of the EP Workbook''s Two Hand, One Hand and Off Hand ladders
      for this spec, and no candidate carries a socket. A priest wields daggers,
      one- hand maces and staves and holds any frill, and cannot wield swords, so
      Tempest of Chaos, the sword the warlock and mage rounds price, is not a row
      here: the warlocks hold it in principle and concede it to the Arcane Mage,
      where this spec cannot equip it at all, so its one-hand rows draw on maces
      and daggers instead. Zhar''doom goes to the warlocks, the Balance Druid, the
      Elemental Shaman and the Shadow Priest, and its wearers hold no off hand,
      which is why the best-in-slot anchor wears it with the off-hand slot empty.'
