    trinkets_why: 'A trinket is worth one thing beside a steady spell damage partner
      and another beside an on-use haste one, so the two slots are measured together:
      every row below is THIS PROFILE with only the two trinket ids replaced, and
      a trinket carries no enchant and no gem, so the consumables, buffs and seed
      hold still and every figure is directly comparable with the one at the top
      of this page. The candidates are every max-level trinket on the EP Workbook''s
      Trinket ladder for this spec, from Karazhan, Magtheridon''s Lair, the raids
      above them, the badge vendor, the Darkmoon Faire and one reputation, and every
      pair from that pool was measured, so the table is an enumeration rather than
      a selection; the ten best appear below, with the worn pair beside them. Four
      candidates carry an on-use effect and Arcane Power is an on-use cooldown,
      and the simulator schedules every activation itself, so how a trinket burst
      lines up with Arcane Power is the engine''s scheduling rather than an assumption.
      Darkmoon Card: Crusade carries no worn statistics, so everything its rows
      measure is the simulator''s pricing of its stacking proc. Eye of Magtheridon
      procs when a spell is resisted, so its rows price its worn spell damage and
      a proc a hit-capped set rarely triggers. The Serpent-Coil Braid improves the
      mana gem the rotation already uses, and the Pendant of the Violet Eye restores
      mana on use, so what their rows price beyond their worn statistics is mana,
      which becomes damage only when the set runs dry.'
