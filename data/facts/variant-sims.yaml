      rather than a selection; the ten best appear below, with the worn pair beside
      them. An on-use trinket is activated on the simulator''s own schedule. Warp-Spring
      Coil and Madness of the Betrayer carry armor penetration, which moves with
      the boss''s armor, and these figures are at the armor tier ten of the fourteen
      bosses sit in.'
