    trinkets_why: 'A trinket is worth one thing beside an attack power partner and
      another beside an armor penetration one, so the two slots are measured together:
      every row below is THIS PROFILE with only the two trinket ids replaced, and
      a trinket carries no enchant and no gem, so the consumables, buffs and seed
      hold still and every figure is directly comparable with the one at the top
      of this page. The candidates are every max-level trinket on the EP Workbook''s
      Trinket ladder for this spec, from Karazhan, the raids above it, the badge
      vendor and one max-level quest, and every pair from that pool was measured,
      so the table is an enumeration rather than a selection; the ten best appear
      below, with the worn pair beside them. An on-use trinket is activated on the
      simulator''s own schedule. Madness of the Betrayer carries armor penetration,
      which moves with the boss''s armor, and these figures are at the armor tier
      ten of the fourteen bosses sit in.'
