  combat_rogue:
    why: 'A Combat Rogue carries two one-handers, so every row below is a main hand
      with an off hand and no row is a two- hander. Each row is THIS PROFILE with
      only the two weapon ids replaced: each slot keeps its Mongoose, and the consumables,
      buffs and seed hold still, so every figure is directly comparable with the
      one at the top of this page. The build is Combat Swords and the rotation is
      built on Sinister Strike, so no dagger is a row, because a dagger main hand
      changes the rotation entirely rather than the weapon alone, and the fist and
      mace rows carry a stated caveat: the build''s Sword Specialization talent
      procs only on sword strikes and does not benefit them. The candidates are
      the top of the EP Workbook''s Main Hand and Off Hand ladders for this spec.
      A row of two copies of one item needs both copies before it is wearable. The
      Warglaives of Azzinoth are ranked first by this spec''s published Phase 3
      list and by the Fury Warrior''s, the raid holds one pair, and which of the
      two receives it is open council business, which is why this spec carries a
      best-in-slot set both with and without them.'
