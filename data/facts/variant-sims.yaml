    trinkets_why: 'A trinket is worth one thing beside a steady spell damage partner
      and another beside an on-use haste one, so the two slots are measured together:
      every row below is THIS PROFILE with only the two trinket ids replaced, and
      a trinket carries no enchant and no gem, so the consumables, buffs and seed
      hold still and every figure is directly comparable with the one at the top
      of this page. The candidates are every max-level trinket on the EP Workbook''s
      Trinket ladder for this spec, from Magtheridon''s Lair, the raids above it,
      the badge vendor, the Darkmoon Faire and one reputation, plus The Lightning
      Capacitor, which the ladder does not rank and which every one of the three
      sets wears, and every pair from that pool was measured, so the table is an
      enumeration rather than a selection; the ten best appear below, with the worn
      pair beside them. What The Lightning Capacitor is worth beyond an empty slot
      is entirely the simulator''s pricing of its charge-and-discharge proc, because
      it carries no worn statistics, and the same holds for Darkmoon Card: Crusade
      and its stacking proc. An on-use trinket is activated on the simulator''s
      own schedule, which is how The Skull of Gul''dan''s haste burst meets the
      casting rotation. Eye of Magtheridon procs when a spell is resisted, so what
      its rows price beyond its worn spell damage moves with each anchor''s distance
      from the hit target.'
