      both styles run in the same table, so a row below is either a main hand with
      an off hand or a single two-hander with the off hand empty. These slots are
      stat sticks: the ranged weapon does the damage and no row here touches it.
      Each row is THIS PROFILE with only the weapon ids replaced: a filled slot
      keeps its enchant, and the consumables, buffs and seed hold still, so every
      figure is directly comparable with the one at the top of this page. Holding
      the consumables still includes the weapon stones, which the hunters choose
      by the WORN weapon''s class, so a candidate whose class differs from the worn
      weapon runs under the capture''s stone rather than its own. The candidates
      are the top of the EP Workbook''s One Hand and Two Hand ladders for this spec,
      kept to the weapon classes a hunter wields, and the 41/20/0 build carries
