      weapons of the same speed, and wants them slow. The set above wears the pair
      its published source ranked, so each row below is THIS PROFILE with only the
      two weapon ids replaced: the slot keeps its Mongoose. The table is an enumeration:
      every matched-speed pairing the slow one-hand field supports, and the field
      is the spec''s shortlist together with every weapon an anchor wears. The character
      is a Draenei, so no row inherits the Orc axe privilege the published lists
      assume. The weapons run unsynced.'
