  elemental_shaman:
    why: 'An Elemental Shaman can carry a staff or a one-hander with a held off
      hand, and both styles run in the same table, so a row below is either a single
      staff with the off hand empty or a main hand with an off-hand item that is
      not a weapon. Each row is THIS PROFILE with only the weapon slots changed:
      the main hand keeps its Major Spellpower, which a staff row inherits because
      the enchant belongs to the slot, and the consumables, buffs and seed hold
      still, so every figure is directly comparable with the one at the top of this
      page. The Brilliant Wizard Oil applies to any weapon, staff and mace alike,
      and a frill or a shield takes no imbue, so nothing about the consumables varies
      across the rows. The candidates are the top of the EP Workbook''s Two Hand,
      One Hand and Off Hand ladders for this spec, and no candidate carries a socket.
      A shaman wields maces, axes, staves, daggers and fist weapons and cannot wield
      swords, so Tempest of Chaos, the sword the warlock and mage rounds price,
      is not a row here. A shaman can also carry a shield in the off hand, alone
      among the five Zhar''doom wearers, and the workbook''s rank-two off hand for
      this spec, Antonidas''s Aegis of Rapt Concentration from Archimonde, is a
      shield, so one row prices it against the held frills. Zhar''doom goes to the
      warlocks, the Balance Druid, the Elemental Shaman and the Shadow Priest, and
      its wearers hold no off hand, which is why the best-in-slot anchor wears it
      with the off-hand slot empty.'
