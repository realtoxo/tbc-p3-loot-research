      below is a main hand with an off hand and no row is a two-hander. Each row
      is THIS PROFILE with only the two weapon ids replaced: each slot keeps its
      Mongoose, and the consumables, buffs and seed hold still, so every figure
      is directly comparable with the one at the top of this page. The candidates
      are the top of the EP Workbook''s Main Hand and Off Hand ladders for this
      spec, kept to the weapon classes a warrior dual-wields. A row of two copies
      of one item needs both copies before it is wearable. The Warglaives of Azzinoth
      are ranked first by this spec''s published Phase 3 list and by the Combat
