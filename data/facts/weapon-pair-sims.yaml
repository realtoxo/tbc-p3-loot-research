  arcane_mage:
    why: 'An Arcane Mage can carry a staff or a one-hander with a held frill, and
      the guild lead ruled on 20 August 2026 in data/judgments/weapon-styles.yaml
      that both styles run in the same table, so a row below is either a single
      staff with the off hand empty or a main hand with an off-hand frill that is
      not a weapon. Each row is THIS PROFILE with only the weapon slots changed:
      the main hand keeps its Sunfire, which a staff row inherits because the enchant
      belongs to the slot, and the consumables, buffs and seed hold still, so every
      figure is directly comparable with the one at the top of this page. The Brilliant
      Wizard Oil applies to any weapon, staff and sword alike, and a frill takes
      no imbue, so nothing about the consumables varies across the rows. The candidates
      are the top of the EP Workbook''s Two Hand, One Hand and Off Hand ladders
      for this spec, and no candidate carries a socket. Zhar''doom IS a row, and
      it is marked: the guild lead routed it to the warlocks, the Balance Druid,
      the Elemental Shaman and the Shadow Priest, and ruled that the Arcane Mage
      takes Tempest of Chaos first, per data/judgments/weapon-routing.yaml, so this
      spec''s best-in-slot set wears the one-hander with a frill rather than the
      staff. A routing never excludes a candidate from a round, per the same-day
      ruling in data/judgments/weapon-styles.yaml, so the staff is measured and
      the preference stays with the council. The table therefore carries every half
      of the Tempest question: the warlock rounds measure what other specs lose
      while the mage holds it, and this table measures what the mage loses if it
      concedes it, and what the routed staff would be worth here.'
