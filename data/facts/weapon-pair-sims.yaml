meta:
  what: 'Weapon rounds, one per spec in the registry of tools/run_weapon_pair_sims.py,
    each combination run as a VARIANT of that spec''s anchor profiles: the exported
    gear with only the weapon slots changed, a filled slot keeping its enchant and
    a two-hander row running the off hand EMPTY, the anchor''s own consumables,
    buffs and seed held still. Which styles each spec''s table holds is ruled in
    data/judgments/weapon-styles.yaml, and the Enhancement round is further ruled
    in data/judgments/enhancement-weapon-rules.yaml.'
  read_this_first: Every variant is directly comparable with its anchor's figure
    in sim-figures.yaml, because it is the same request with two item ids changed,
    and the anchor figure IS the captured pair. The plus or minus is ONE STANDARD
    ERROR, not a confidence interval. NOT A RULING. Which pair each anchor wears
    is the council's call.
  entry_scope: The entry anchor is worn before Phase 3, so its variants hold no
    Black Temple drop and no Season 3 weapon. The tier and best-in-slot anchors
    take the whole field, because the tier anchor is not constrained by progression,
    per the 14 August 2026 ruling.
  weapons_unsynced: The Enhancement runs send no syncType, per the 15 August 2026
    ruling that its weapons run unsynced. A matched pair is where the simulator's
    Auto mode would begin delaying the off hand, so the absence is load-bearing
    here and is stated.
  iterations: 10000
  seed: 1
  boss_armor: 6193
  encounter_seconds: 150
