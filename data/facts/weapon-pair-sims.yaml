  affliction_warlock:
    why: 'An Affliction Warlock can carry a staff or a one-hander with a held frill,
      and the guild lead ruled on 20 August 2026 in data/judgments/weapon-styles.yaml
      that both styles run in the same table, so a row below is either a single
      staff with the off hand empty or a main hand with an off-hand frill that is
      not a weapon. Each row is THIS PROFILE with only the weapon slots changed:
      the main hand keeps its Soulfrost, which a staff row inherits because the
      enchant belongs to the slot, and the consumables, buffs and seed hold still,
      so every figure is directly comparable with the one at the top of this page.
      The Brilliant Wizard Oil applies to any weapon, staff and dagger alike, and
      a frill takes no imbue, so nothing about the consumables varies across the
      rows. The candidates are the top of the EP Workbook''s Two Hand, One Hand
      and Off Hand ladders for this spec, and no candidate carries a socket. Zhar''doom
      goes to the warlocks, the Balance Druid, the Elemental Shaman and the Shadow
      Priest, and its wearers hold no off hand, per data/judgments/weapon-routing.yaml,
      which is why the best-in-slot anchor wears it with the off-hand slot empty.
      Tempest of Chaos is taken first by the Arcane Mage, per the same file, and
      first is an ordering rather than an exclusion: the warlocks'' lists rank it
      too, so its rows measure what this spec holds once the mage is served.'
