# ---------------------------------------------------------------------------
# ENCHANT SUMMARY: EVERY HIT AND EXPERTISE ROUTE
# ---------------------------------------------------------------------------
#
# This is the complete enchant-side answer to the question hit.yaml asks. It is
# built by enumerating each slot and reading each entry, not by a filtered query.

enchant_hit_and_expertise:
  expertise: >-
    NONE. No enchant, armor kit, leg armor, spellthread, scope, weapon chain or
    shield spike in 2.4.3 supplies expertise rating. Expertise was introduced in
    patch 2.3.0 and no enchant provides it. This confirms hit.yaml.
  melee_and_ranged_hit:
    - {name: Glyph of Ferocity, item_id: 29192, slot: head, rating: 16, gate: Cenarion Expedition Revered}
    - {name: Enchant Boots - Surefooted, item_id: 22545, slot: feet, rating: 10, gate: formula drop, Karazhan}
    - {name: Falcon's Call, item_id: 19785, slot: head_or_legs, rating: 10, gate: Zul'Gurub, Hunter only, NOT IN hit.yaml}
    - {name: Biznicks 247x128 Accurascope, item_id: 18283, slot: ranged, rating: 30, gate: Engineering 300, ranged hit only, hunters and any bow or gun user}
  spell_hit:
    - {name: Glyph of Power, item_id: 29191, slot: head, rating: 14, gate: The Sha'tar Revered}
    - {name: Enchant Gloves - Spell Strike, item_id: 28271, slot: hands, rating: 15, gate: Cenarion Expedition Revered}
    - {name: Presence of Sight, item_id: 19787, slot: head_or_legs, rating: 8, gate: Zul'Gurub, Mage only, NOT IN hit.yaml}
  totals_against_caps_yaml:
    caps_yaml_physical_enchant_total: 26
    this_capture_physical_general: 26
    this_capture_physical_hunter: 56
    this_capture_physical_hunter_note: >-
      Glyph of Ferocity 16, Surefooted 10, and Falcon's Call 10 on the LEGS so it
      does not compete with the head glyph, plus the Accurascope 30 on the ranged
      weapon, which hit.yaml already accounts separately. The 56 figure counts
      the three armor enchants only.
    caps_yaml_spell_enchant_total: 29
    this_capture_spell_general: 29
    this_capture_spell_mage: 37
    this_capture_spell_mage_note: >-
      Glyph of Power 14 on the head, Spell Strike 15 on the gloves, and Presence
      of Sight 8 on the LEGS. If Presence of Sight is applied to the head instead
      it displaces Glyph of Power and the total falls to 23.
  confidence: good
  completeness_confidence: >-
    Conservative on completeness. The individual entries are verified against
    TBC-era tooltips. The claim that no further hit-bearing enchant exists rests
    on slot-by-slot enumeration rather than an authoritative filtered list,
    because Wowhead's filtered pages render client-side and return nothing
    server-side.

# ---------------------------------------------------------------------------
# GEMS
# ---------------------------------------------------------------------------

gems:

  # ---- Meta gems ----------------------------------------------------------
  #
  # ALL EIGHTEEN. The activation requirement is the field that makes a socket
  # configuration legal or not, and it is the field most often wrong in guides,
  # because patch 3.0.2 changed several of them. Every requirement below was read
  # from the TBC Classic tooltip endpoint.
  #
  # A worked example of the trap: warcraft.wiki.gg states that Relentless
  # Earthstorm Diamond requires three red gems. That is the WRATH value. The TBC
  # requirement is two red, two yellow and two blue.
  meta:
    item_level: 70
    socket_text: "Only fits in a meta gem slot."
    requires_level: none
    supplies_hit: false
