# ---------------------------------------------------------------------------
# CONSUMABLES, CAP-RELEVANT ONLY
# ---------------------------------------------------------------------------
#
# This is NOT a consumables catalog. Only items supplying hit rating, spell hit
# rating, expertise rating or defense rating are recorded. Everything else was
# read and rejected, and the rejections are recorded as negative claims below
# because hit.yaml depends on them.

consumables:
  scope: hit, spell hit, expertise, defense
  categories_swept: food and drink, battle elixirs, guardian elixirs, flasks, scrolls, weapon oils, sharpening stones, weightstones, weapon coatings, potions
  verified: true

  supplies_a_cap_relevant_stat:

    - name: Spicy Hot Talbuk
      item_id: 33872
      category: food
      supplies: [melee_hit, ranged_hit]
      hit_rating: 20
      use_text: "Restores 7500 health over 30 sec. Must remain seated while eating. If you spend at least 10 seconds eating you will become well fed and gain 20 Hit Rating and Spirit for 30 min."
      buff_text: "Hit Rating and Spirit increased by 20."
      buff_spell_id: 43764
      food_spell_id: 43763
      duration: 30 minutes
      item_level: 75
      requires_level: 65
      source: >-
        Cooking. Recipe: Spicy Hot Talbuk, item 33873, binds when picked up,
        requires Cooking 325, teaches spell 43765. Reagents Talbuk Venison (27682)
        and Hot Spices (2692). The recipe comes from a reward container from The
        Rokk's daily cooking quests in Lower City, Shattrath City.
      patch: 2.3.0
      phase_3_available: true
      persists_through_death: unverified
      verified: true
      spell_hit_coverage: false
      spell_hit_evidence: >-
        Spell 43764 lists Effect #1 as "Apply Aura: Mod Rating (Hit Chance) Value:
        20" and Effect #2 as "Apply Aura: Mod Stat - Flat (Spirit) Value: 20".
        Only one rating label is present and it carries no spell qualifier. The
        same dataset labels spell-school ratings explicitly elsewhere: Skullfish
        Soup renders as "Spell Critical Strike Rating". Plain "Hit Rating"
        therefore denotes the physical rating. The simulator database
        independently assigns MeleeHit 20 with no SpellHit component.
      ranged_coverage: unverified
      ranged_note: >-
        Whether the aura's rating mask covers only the melee hit index or both the
        melee and ranged hit indices was not established. Aowow does not display
        the raw misc value for spell 43764 and the tooltip JSON does not expose
        effect misc values. hit.yaml records this as melee and ranged. Nothing
        found contradicts that; nothing found confirms the ranged half either.
      flag: >-
        This is the 20 rating hit.yaml prices. Confirmed by two independent
        sources: the TBC tooltip, and the simulator consumables table, in which
        it is the ONLY entry of 105 carrying hit rating.

    - name: Flask of Fortification
      item_id: 22851
      category: flask
      supplies: [defense, health]
      defense_rating: 10
      effect: "Increases maximum health by 500 and defense rating by 10 for 2 hrs. Counts as both a Battle and Guardian elixir. This effect persists through death."
      duration: 2 hours
      persists_through_death: true
      requires_level: 65
      source: >-
        Alchemy. Learned by discovery while making potions, and must be created at
        an Alchemy Lab. Reagents: 1 Fel Lotus, 3 Mana Thistle, 7 Ancient Lichen, 1
        Crystal Vial.
      phase_3_available: true
      verified: true
      flag: >-
        NOT IN hit.yaml. hit.yaml's consumables block records that TBC has a
        food granting 20 physical hit and no spell hit consumable at all, and says
        nothing about defense. This flask supplies 10 defense rating, which is a
        cap-relevant stat for feral_bear, protection_paladin and
        protection_warrior against the crit-immunity threshold. It is the only
        flask that supplies one.

    - name: Insane Strength Potion
      item_id: 22828
      category: potion
      supplies: [strength, defense_penalty]
      defense_rating: -75
      effect: "Increases your Strength by 120 and decreases your defense rating by 75 for 15 sec."
      cooldown: 2 minutes
      duration: 15 seconds
      requires_level: 50
      source: Alchemy 320, spell 28494, reagents 3 Terocone and 1 Crystal Vial
      phase_3_available: true
      verified: true
      flag: >-
        Recorded because it is the only defense-rating interaction in the whole
        consumable set and it runs in the NEGATIVE direction. A tank at exactly
        the crit-immunity threshold loses it for 15 seconds while this is active.

  negative_claims:
    #
    # These are the claims hit.yaml rests on. Each was tested by enumerating the
    # category item by item, because filtered database queries render
    # client-side and return nothing server-side.
    #
    - claim: No TBC food, elixir, flask, potion, scroll, oil or stone grants SPELL HIT RATING.
      verdict: CONFIRMED
      basis: >-
        Hit rating and spell hit rating are separate item stats through the whole
        of TBC. The merge happened in patch 3.0.2, whose notes read, verbatim:
        "Hit Rating, Critical Strike Rating, and Haste Rating now modify both
        melee attacks and spells." Item-level confirmation across all categories:
        the only rating-type effects on TBC food are Hit Rating on Spicy Hot
        Talbuk and Spell Critical Strike Rating on Skullfish Soup. The simulator
        consumables table contains no SpellHit assignment on any consumable.
      confidence: good
      flag: CONFIRMS hit.yaml, including the asymmetry it flags for arcane_mage.

    - claim: No TBC consumable grants EXPERTISE.
      verdict: CONFIRMED
      basis: >-
        Expertise was introduced in patch 2.3.0. Its sources are gear, gems,
        enchantments, racial traits and talents. No consumable grants it. The
        simulator consumables table contains no Expertise assignment anywhere.
      scope_caveat: >-
        Confirmed for CONSUMABLES. Raid buffs and boss debuffs were not separately
        enumerated in this capture, so the broader "no buff or debuff" half of the
        hit.yaml claim is not re-tested here. hit.yaml already records it.
      confidence: good

    - claim: The six named elixirs carry no hit rating.
      verdict: CONFIRMED
      detail:
        - {name: Elixir of Draenic Wisdom, item_id: 32067, effect: "Increases Intellect and Spirit by 30 for 1 hour. Guardian Elixir.", hit: none}
        - {name: Elixir of Major Agility, item_id: 22831, effect: "Increases your Agility by 35 and your critical strike rating by 20 for 1 hour. Battle Elixir.", hit: none}
        - {name: Elixir of Demonslaying, item_id: 9224, effect: "Increases attack power by 265 against demons. Lasts 5 min. Battle Elixir.", hit: none}
        - {name: Adept's Elixir, item_id: 28103, effect: "Increases spell damage and healing by up to 24 and spell critical strike rating by 24 for 1 hour. Battle Elixir.", hit: none}
        - {name: Elixir of Mastery, item_id: 28104, effect: "Increases all Stats by 15 for 1 hour. Battle Elixir.", hit: none}
        - {name: Elixir of the Mongoose, item_id: 13452, effect: "Increases Agility by 25 and critical strike rating by 28 for 1 hour. Battle Elixir.", hit: none}
      note: >-
        Their secondary stat is critical strike rating, never hit rating. Also
        recorded: Elixir of Major Defense, item 22834, grants ARMOR of 550, not
        defense rating. The name is misleading and is a common source of error.
      confidence: good

    - claim: Weapon oils, sharpening stones and weightstones grant no hit, expertise or weapon skill.
      verdict: CONFIRMED
      detail:
        - {name: Superior Wizard Oil, item_id: 22522, effect: "While applied to target weapon it increases spell damage by up to 42. Lasts for 1 hour."}
        - {name: Superior Mana Oil, item_id: 22521, effect: "While applied to target weapon it restores 14 mana to the caster every 5 seconds. Lasts for 1 hour."}
        - {name: Brilliant Wizard Oil, item_id: 20749, effect: "While applied to target weapon it increases spell damage by up to 36 and increases spell critical strike rating by 14. Lasts for 1 hour."}
        - {name: Brilliant Mana Oil, item_id: 20748, effect: "While applied to target weapon it restores 12 mana to the caster every 5 seconds and increases the effect of healing spells by up to 25. Lasts for 1 hour."}
        - {name: Adamantite Sharpening Stone, item_id: 23529, effect: "Increase sharp weapon damage by 12 and add 14 melee critical strike rating for 1 hour.", source: "Blacksmithing 350, plans require Cenarion Expedition Honored, Fedryen Swiftspear, 6 gold"}
        - {name: Adamantite Weightstone, item_id: 28421, effect: "Increase blunt weapon damage by 12 and add 14 critical hit rating for 1 hour.", source: "Blacksmithing 350, plans require Cenarion Expedition Honored"}
        - {name: Fel Sharpening Stone, item_id: 23528, effect: "Increase sharp weapon damage by 12 for 1 hour.", source: "Blacksmithing 300, trainer"}
        - {name: Fel Weightstone, item_id: 28420, effect: "Increase blunt weapon damage by 12 for 1 hour.", source: "Blacksmithing 300, trainer"}
        - {name: Elemental Sharpening Stone, item_id: 18262, effect: "Increase the critical strike rating on a melee weapon by 28 for 1 hour.", source: "Blacksmithing 300"}
      weapon_skill_note: >-
        The vanilla weapon-skill stones were converted to flat weapon damage in
        TBC. Dense Sharpening Stone, item 12404, reads "Increase sharp weapon
        damage by 8 for 1 hour" and serves as the control confirming the
        conversion. Zero weapon skill on any of them.
      confidence: good

    - claim: Scrolls grant no hit.
      verdict: CONFIRMED
      detail:
        - {name: Scroll of Strength V, item_id: 27503, effect: "Increases the target's Strength by 20 for 30 min."}
        - {name: Scroll of Agility V, item_id: 27498, effect: "Increases the target's Agility by 20 for 30 min."}
        - {name: Scroll of Intellect V, item_id: 27499, effect: "Increases the target's Intellect by 20 for 30 min."}
        - {name: Scroll of Spirit V, item_id: 27501, effect: "Increases the target's Spirit by 30 for 30 min."}
        - {name: Scroll of Stamina V, item_id: 27502, effect: "Increases the target's Stamina by 20 for 30 min."}
        - {name: Scroll of Protection V, item_id: 27500, effect: "Increases the target's Armor by 300 for 30 min."}
      id_correction: >-
        27501 is Spirit and 27502 is Stamina. The alphabetical assumption is
        wrong.
      note: >-
        Scroll of Protection V grants flat ARMOR, not defense rating. In 2.4.3
        these carry no Battle Elixir or Guardian Elixir classification, so they do
        not occupy an elixir slot. Inscription did not exist in 2.4.3, so any
        source citing an Inscription origin is post-TBC.
      confidence: good

    - claim: No TBC food other than Spicy Hot Talbuk grants hit, and no TBC food grants defense rating.
      verdict: CONFIRMED
      surveyed_count: 25
      representative:
        - {name: Spicy Crawdad, item_id: 27667, grants: "30 Stamina and 20 Spirit"}
        - {name: Blackened Sporefish, item_id: 27663, grants: "20 Stamina and 8 mana every 5 seconds"}
        - {name: Fisherman's Feast, item_id: 33052, grants: "30 Stamina and 20 Spirit"}
        - {name: Roasted Clefthoof, item_id: 27658, grants: "20 Strength and 20 Spirit"}
        - {name: Warp Burger, item_id: 27659, grants: "20 Agility and 20 Spirit"}
        - {name: Grilled Mudfish, item_id: 27664, grants: "20 Agility and 20 Spirit"}
        - {name: Ravager Dog, item_id: 27655, grants: "40 attack power and 20 Spirit"}
        - {name: Talbuk Steak, item_id: 27660, grants: "20 Stamina and 20 Spirit"}
        - {name: Skullfish Soup, item_id: 33825, grants: "20 Spell Critical Strike Rating and 20 Spirit"}
        - {name: Golden Fish Sticks, item_id: 27666, grants: "44 healing and 20 Spirit"}
      note: >-
        Skullfish Soup applies a buff named Enlightened, not Well Fed. Hot
        Buttered Trout is item 33053, not 33825, and has no Well Fed buff in TBC.
        Stormchops in TBC is item 33866; the Wrath id 43015 does not exist in the
        TBC dataset.
      confidence: good

    - claim: No flask other than Flask of Fortification supplies a cap-relevant stat.
      verdict: CONFIRMED
      detail:
        - {name: Flask of Relentless Assault, item_id: 22854, effect: "Increases attack power by 120 for 2 hrs. Counts as both a Battle and Guardian elixir. This effect persists through death."}
        - {name: Flask of Blinding Light, item_id: 22861, effect: "Increases spell damage caused by Arcane, Holy and Nature spells by up to 80 for 2 hrs. Counts as both a Battle and Guardian elixir. This effect persists through death."}
        - {name: Flask of Pure Death, item_id: 22866, effect: "Increases spell damage caused by Shadow, Fire and Frost spells by up to 80 for 2 hrs. Counts as both a Battle and Guardian elixir. This effect persists through death."}
        - {name: Flask of Mighty Restoration, item_id: 22853, effect: "Increases mana regeneration by 25 mana per 5 seconds for 2 hrs. Counts as both a Battle and Guardian elixir. This effect persists through death."}
        - {name: Flask of Chromatic Wonder, item_id: 33208, effect: "Increases resistance to all schools of magic by 35 and all stats by 18 for 2 hrs. Counts as both a Battle and Guardian elixir. This effect persists through death."}
      shattrath_flask_correction: >-
        The flasks referred to as "Shattrath flasks" are the UNSTABLE FLASK line,
        items 32596 through 32601, and they are not from Shattrath. They are made
        at the Fel Crystalforge in Blade's Edge Mountains for 10 Apexis Shards
        each, and they function ONLY in the Blade's Edge Mountains Plateaus and
        Gruul's Lair. None supplies hit, expertise or defense. They are therefore
        irrelevant to a Hyjal or Black Temple raid.
      confidence: good

    - claim: Phase 3 introduces no new cap-relevant consumable.
      verdict: CONFIRMED_WITH_CAVEAT
      basis: >-
        Neither Black Temple nor Battle for Mount Hyjal drops any consumable,
        weapon oil, stone, coating, or alchemy or cooking recipe.
      caveat: >-
        The negative rests on the published loot lists for both zones showing no
        consumables. No exhaustive Phase 3 consumable list was retrievable, so the
        absence is inferred rather than proven.
      confidence: conservative

  phase_note_on_spicy_hot_talbuk: >-
    Spicy Hot Talbuk was added in patch 2.3.0, which is the Zul'Aman content
    patch, and Zul'Aman is Anniversary Phase 3.5. Its recipe source is The Rokk's
    daily cooking quests in Shattrath, which are not gated on Zul'Aman. Whether
    the Anniversary build ships that recipe at Phase 3 or holds it to Phase 3.5 is
    UNVERIFIED and matters, because hit.yaml names this food as the fallback that
    lets retribution_paladin close most of its 24-rating gap by eating.

# ---------------------------------------------------------------------------
# WRATH-ERA TRAPS
# ---------------------------------------------------------------------------
#
# Entries that appear in guides and do NOT exist in 2.4.3, or that exist with
# different values. Each was tested, not assumed.

wrath_era_traps:

  - name: Enchant Gloves - Precision
    spell_id: 44488
    verdict: DOES NOT EXIST IN TBC
    evidence: >-
      Three independent strands. First, the TBC tooltip endpoint returns HTTP 404
      for spell 44488, and the TBC XML endpoint returns HTTP 404. Both are
      TBC-era requests. Second, the retail page for the same spell returns HTTP
      200 with the acquisition line "Profession Trainer: Northrend Enchanting
      (35)" and reagents Greater Cosmic Essence and Lesser Cosmic Essence, all of
      which is Wrath content. Third, an exhaustive enumeration of the twelve glove
      enchant spells that resolve on the TBC subsite finds none granting melee hit
      or expertise.
    confirms: hit.yaml, which already records this correction.
    confidence: high

  - name: A melee hit glove enchant of any name
    verdict: DOES NOT EXIST IN TBC
    evidence: The twelve-spell enumeration above. The only hit-flavoured glove enchant is Spell Strike, and it is spell hit only.
    confidence: high

  - name: Eternal Belt Buckle, and any means of adding a socket
    verdict: DOES NOT EXIST IN TBC
    evidence: >-
      Introduced in patch 3.0.2 together with the Blacksmithing self-only bracer
      and glove socket additions. A name scan of all 8,254 items in the TBC
      simulator database returns no belt buckle of any kind.
    confirms: hit.yaml
    confidence: high

  - name: Relentless Earthstorm Diamond, three-red activation
    item_id: 32409
    verdict: WRONG FOR TBC
    correct_tbc_activation: "Requires at least 2 Red Gems / Requires at least 2 Yellow Gems / Requires at least 2 Blue Gems"
    note: The three-red requirement is the Wrath value. A guide quoting it is describing a different patch.
    confidence: high

  - name: Self-only leg armors and spellthreads
    verdict: DOES NOT EXIST IN TBC
    evidence: >-
      Not one of the eight TBC leg enhancements carries a "Requires Leatherworking
      (nnn)" or "Requires Tailoring (nnn)" line. The self-only pattern belongs to
      Wrath, where Icescale and Frosthide Leg Armor read "Requires Leatherworking
      (400)".
    confidence: high

  - name: Self-only armor kits
    verdict: DOES NOT EXIST IN TBC
    evidence: Each armor kit use-effect spell states only "Requires level 25" plus the slot list. Leatherworking is required to craft, not to apply.
    confidence: high

  - name: Percentage wording on dodge, hit or crit in enchant text
    verdict: NOT A 2.4.3 RENDER
    examples:
      - "Death's Embrace rendered as +28 attack power and 1% dodge. The 2.4.3 value is 12 dodge rating."
      - "Falcon's Call rendered as 1% chance to hit. The 2.4.3 value is 10 hit rating."
      - "Presence of Might rendered as 10 dodge rating and 10 parry rating. The 2.4.3 value is 10 Stamina, 10 defense rating and 15 shield block value."
      - "Glyph of the Defender served under its retail name Arcanum of the Defender with parry substituted for defense."
    note: >-
      TBC expresses these as rating. A source reading in percentages is pre-3.0 or
      post-3.0, not 2.4.3. This is the fastest single tell for era drift.
    confidence: high

  - name: Enchant Ring - Healing Power rendered as spell power
    item_id: 22537
    verdict: NOT A 2.4.3 RENDER
    correct_tbc_text: "Permanently enchant a ring to increase healing spells by up to 20 and damage spells by up to 7."
    note: The single spell power figure is the post-3.0 consolidation.
    confidence: high

  - name: Enchant Boots - Vitality at 5 mana per 5 seconds
    item_id: 22542
    verdict: WRONG FOR TBC
    correct_tbc_value: 4 health and 4 mana every 5 seconds
    confidence: good

  - name: Enchant Bracer - Superior Stamina at 12 Stamina
    verdict: WRONG FOR TBC
    correct_tbc_value: 9 Stamina
    confidence: good

  - name: Adamantite Sharpening Stone at +4 damage and +4 crit
    item_id: 23529
    verdict: WRONG FOR TBC
    correct_tbc_text: "Increase sharp weapon damage by 12 and add 14 melee critical strike rating for 1 hour."
    confidence: good

  - name: Scroll of X V at +15 stats and +60 armor
    verdict: WRONG FOR TBC
    correct_tbc_values: 20 for Strength, Agility, Intellect and Stamina, 30 for Spirit, 300 armor for Protection
    note: The wiki also classifies these as Battle or Guardian Elixirs. The 2.4.3 items carry no such classification.
    confidence: good

  - name: Spicy Hot Talbuk requiring level 26 and Outland Cooking 25
    item_id: 33872
    verdict: WRONG FOR TBC
    correct_tbc_values: Requires Level 65, Cooking 325
    note: The wiki also omits Hot Spices as a reagent, which patch 3.1.0 removed.
    confidence: good

# ---------------------------------------------------------------------------
# ERRORS FOUND IN THE WOWSIMS DATABASE
# ---------------------------------------------------------------------------
#
# AGENTS.md already records two traps in this database, being the unreliable
# phase field and the absent tier tokens. These are further ones, found while
# using it as a lead list for this capture. None is fixed there.

wowsims_db_errors:

  - id: spell_id_column_is_not_the_recipe
    severity: high
    detail: >-
      The enchants[].spellId column is not the recipe spell in nearly every case.
      It is the applied aura or proc row, which is a separate database record.
      Confirmed wrong on Glyph of Ferocity (listed 15806, actual 35452), Glyph of
      Renewal (18029 / 35445), Glyph of Power (15714 / 35447), Glyph of Chromatic
      Warding (37890 / 37889), Presence of Might (24148 / 24149), Presence of
      Sight (24156 / 24164), and on every entry in the wrist, feet, hands, weapon
      and shield blocks. CITE ITEM IDS, NOT DB SPELL IDS.

  - id: retired_glyph_of_the_wild
    severity: high
    detail: >-
      Item 29188 is named zzoldGlyph of the Wild in the 2.4.3 data and has no
      vendor and no source. The database presents it as a live head enchant. Its
      stat is also wrong there: dodge rating 12, not defense rating 12, and the
      required level is 69, not 70.

  - id: surefooted_stat_vector
    severity: high
    detail: >-
      Enchant Boots - Surefooted is recorded with hit 10, which is correct, but
      the entry omits the 5 percent snare and root resistance and the applied aura
      confirms the enchant grants no agility. Any secondary source giving it
      agility is wrong.

  - id: unique_equipped_jewelcrafting_gem_stats
    severity: high
    detail: >-
      The 33131 family carries inflated values in tbc-new: Crimson Sun 32 attack
      power against an actual 24, Falling Star 19 stamina against 18, and Blood of
      Amber, Stone of Blades and Facet of Eternity each 13 against 12. Four
      independent sources give the lower figures, including an older wowsims
      release. tbc-new is the outlier.

  - id: reckless_noble_topaz_hit
    severity: high
    detail: >-
      Item 35316 is recorded with hit 4. The TBC tooltip reads "+4 Spell Haste
      Rating and +5 Spell Damage". There is no hit rating on that gem. A model
      reading the database would credit a hit source that does not exist.

  - id: enchant_shield_resilience_item_id
    severity: medium
    detail: >-
      Item id 34110 is given for Enchant Shield - Resilience. That id returns HTTP
      404 on the TBC subsite and is not a 2.4.3 item. The enchant exists as spell
      44383. No replacement formula item id was found.

  - id: enchant_weapon_major_spirit_misattribution
    severity: medium
    detail: >-
      The database lists "Enchant Weapon - Major Spirit" against spell 20004. In
      the TBC database that spell is named "Life Steal", a drain-health effect of
      value 30. The real Major Spirit enchant is a TWO-HAND enchant, recipe spell
      20035.

  - id: magisters_armor_kit_use_spell
    severity: low
    detail: The use-spell id 21625 is wrong. The correct id is 32399.

  - id: warding_glyph_blank_stat_vectors
    severity: low
    detail: >-
      The five single-school Warding glyphs carry blank stat vectors. Each grants
      20 resistance of its school. Only the Chromatic glyph is recorded correctly.

  - id: duplicate_eternium_scope_row
    severity: low
    detail: >-
      Two rows exist for the eternium scope. The second, spelled "Stabilized
      Eternium Scope" with spellId 22780, is a duplicate pointing at the Biznicks
      aura and should be discarded. The real item is 23766.

  - id: heavy_tonk_armor_listed_as_a_gem
    severity: low
    detail: >-
      Item 34627, Heavy Tonk Armor, appears as a yellow rare gem. It is a Darkmoon
      Faire tonk item reading "Fits into a tonk Overdrive socket" and is not a
      character gem.

  - id: missing_uncommon_hit_gems
    severity: low
    detail: >-
      Four uncommon hit-bearing gems are absent from the extract used as a lead
      list: 23100 Glinting Flame Spessarite, 23116 Rigid Golden Draenite, 31860
      Great Golden Draenite, 31866 Veiled Flame Spessarite.

  - id: missing_zulgurub_class_enchants
    severity: medium
    detail: >-
      The database carries two of the nine Zul'Gurub class enchants. Seven are
      missing, including Falcon's Call, which is one of only two hit-bearing
      enchants outside the head, feet and hands slots.

  - id: inscription_of_endurance_unfactioned
    severity: low
    detail: >-
      Item 29187 appears among the shoulder entries with no faction, which is how
      it gets misfiled as an Aldor or Scryers item. It is The Violet Eye, Honored,
      Karazhan.

# ---------------------------------------------------------------------------
# OPEN QUESTIONS
# ---------------------------------------------------------------------------

open_questions:

  anniversary_phase_gating:
    blocks: "Every phase_3_available: false call in this file"
    detail: >-
      Fifteen entries are marked unavailable at Phase 3 on the ground that they
      are patch 2.4.0 content and the Isle of Quel'Danas is Anniversary Phase 4,
      or that they are Zul'Aman content and Zul'Aman is Anniversary Phase 3.5.
      Blizzard's published phase plan supports the schedule. What is NOT
      established is whether the Anniversary build gates the ITEMS or only the
      CONTENT. The client runs 2.4.3 item data throughout, so an item whose source
      is not itself gated could be reachable early. The affected entries are Glyph
      of the Gladiator, Enchant Chest - Defense, Enchant Cloak - Steelweave,
      Enchant Weapon - Executioner, Enchant Weapon - Deathfrost, the Adamantite
      Weapon Chain plans, Eternal Earthstorm Diamond, Ember Skyfire Diamond, Regal
      Nightseye, the six haste gems, the two Crimson Spinel re-issues, Charmed
      Amani Jewel, and Eye of the Sea.
    recommendation: >-
      Resolve on the live server in the first week and correct this file. Nothing
      in hit.yaml depends on any of them today, because none supplies hit or
      expertise.

  spicy_hot_talbuk_phase_availability:
    blocks: The retribution_paladin gap_note in hit.yaml
    detail: >-
      Spicy Hot Talbuk is patch 2.3.0 content, and 2.3.0 is the Zul'Aman patch,
      which the Anniversary plan places at Phase 3.5. Its recipe source, The
      Rokk's daily cooking quests in Shattrath, is not itself gated on Zul'Aman.
      hit.yaml names this food as the route by which retribution_paladin closes
      most of its 24-rating gap without loot. If the food is not available at
      Phase 3, that gap_note is wrong for the opening weeks.
    recommendation: Check The Rokk's daily quest rewards on day one.

  surefooted_ranged_coverage:
    blocks: Nothing today. It sharpens the hunter budget.
    detail: >-
      Enchant Boots - Surefooted grants "10 hit rating" with no school qualifier.
      Whether the rating mask covers the ranged hit index as well as the melee hit
      index was not established from the spell data, because the raw misc value is
      not exposed by any source consulted. The same question applies to Spicy Hot
      Talbuk. Both are recorded in hit.yaml as melee and ranged. Nothing found
      contradicts that; nothing found confirms it either.

  hit_bearing_leg_enchants:
    resolved: >-
      RESOLVED. Kept for the audit trail. hit.yaml acted on this: no_route now
      reads "No GENERAL-PURPOSE cloak, bracer, chest, weapon, ring, shoulder or
      leg enchant grants hit", and the two exceptions are recorded there under
      class_locked_hit_levers with their net trade, because each displaces a leg
      enchant and returns less than it takes. Nothing here contradicts that file
      any longer. The original wording is kept below because it is what caused
      the correction.
    blocks: Nothing. It was acted on in hit.yaml.class_locked_hit_levers.
    detail: >-
      hit.yaml.no_route USED TO STATE "No cloak, bracer, chest, weapon, ring,
      shoulder or leg enchant grants hit." That was correct for the general leg
      armors and spellthreads and WRONG for two class-locked head-or-leg
      enchants:
      Falcon's Call, item 19785, at 10 hit rating for Hunters, and Presence of
      Sight, item 19787, at 8 spell hit rating for Mages. Both come from Zanza the
      Restless in Zul'Gurub for one Primal Hakkari Idol plus one class Voodoo
      Doll, and Zul'Gurub is live in 2.4.3.
      The two specs affected are exactly the two that hit.yaml calls short and
      routes to gems and enchants: beast_mastery_hunter, short by 36, and
      arcane_mage, short by 23.
    recommendation: >-
      Amend hit.yaml.no_route and recheck both gap_notes. Note that whether the
      Zanza quests are repeatable is unverified, which governs whether a player can
      obtain more than one.

  flask_of_fortification_defense:
    blocks: Nothing today. It adds a route hit.yaml does not carry.
    detail: >-
      Flask of Fortification, item 22851, grants 10 defense rating for two hours
      and persists through death. hit.yaml's consumables block records only the
      hit food and the absence of a spell hit consumable. Defense rating is
      cap-relevant for the three tank specs against the crit-immunity threshold,
      which the framework calls the binding constraint for feral_bear. Insane
      Strength Potion, item 22828, runs the other way at minus 75 defense rating
      for 15 seconds.

  unique_equipped_on_heroic_gems:
    blocks: How many of the Tanzanite, Fire Opal and Chrysoprase set may be worn
    detail: >-
      Wowhead TBC tooltips display the Unique flag with maxcount:1 on that whole
      family. The wiki records patch 2.4.0 as removing Unique-Equipped from
      Heroic-instance gems. The two were not reconciled for the 2.4.3 client. This
      governs whether a player may socket more than one, and five of the family
      supply hit.

  indormi_phase_3_stock:
    blocks: Whether the three epic haste designs are buyable at Phase 3
    detail: >-
      Indormi's vendor table, as recorded in its final 2.4.3 state, lists Design:
      Quick Lionseye, Design: Reckless Pyrestone and Design: Forceful Seaspray
      Emerald at Scale of the Sands Honored. That table cannot distinguish Phase 3
      launch stock from a Phase 4 addition. None supplies hit, so nothing in
      hit.yaml turns on it.

  enchant_acquisition_gaps:
    blocks: Nothing analytical. It is completeness.
    detail: >-
      Roughly thirty enchants below level-70 relevance, plus a smaller number of
      TBC-tier enchants, carry an unverified enchanting skill level or an
      unverified acquisition route. They are marked entry by entry. The pattern is
      that the tooltip endpoints carry no vendor, cost or drop data, and the XML
      endpoint that does rate-limits to roughly one request per window. None of
      the gaps sits on a hit-bearing or expertise-bearing entry.

  shoulder_inscription_costs:
    blocks: Nothing analytical.
    detail: >-
      Gold costs for the sixteen Aldor and Scryers inscriptions were not
      retrievable. The tooltip endpoints carry no price field and the XML endpoint
      returned the vendor without one. The retail wiki pages for both
      quartermasters no longer list inscriptions, because they were removed from
      retail. Vendor npc ids and standings are solid.

  completeness_of_negative_claims:
    blocks: The strength of every "none exists" statement in this file
    detail: >-
      Every negative claim here was built by enumerating a category item by item,
      because Wowhead and Aowow filtered list pages render client-side and return
      nothing server-side. The individual entries are High confidence. The claim
      that any given enumeration is exhaustive is Conservative. Where a second
      independent method was available, it was used: the gem hit enumeration was
      built twice and the two agree, which is why that one carries Good rather
      than Conservative.
