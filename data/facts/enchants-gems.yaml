# Enchants, gems and cap-relevant consumables. Hand-authored.
#
# HOLDS   Every permanent item enhancement and every gem obtainable at Phase 3,
#         plus the consumables that carry a cap-relevant stat.
# NOT HERE  No ranking and no recommendation. Which enchant a spec takes is a
#         council judgment.
#
# BEFORE YOU USE A FIGURE
#   Several enchants that guides list do not exist in 2.4.3. Enchant Gloves -
#   Precision is a Wrath enchant. Glyph of the Wild is retired in this patch.
#   There is no belt buckle and no way to add a socket to any item.
#   Meta activation requirements are the TBC ones. Relentless Earthstorm Diamond
#   needs 2 red, 2 yellow and 2 blue, not the 3 red that Wrath sources give.
#   Consumables are NOT assumed in hit.yaml. They are recorded here for the
#   asymmetry: TBC has a 20 hit food and no spell hit consumable at all.
#
# SOURCE  Every entry confirmed by item id at the 2.4.3 tooltip endpoint at
#   nether.wowhead.com, never by name and never from a guide. Negative claims
#   were built by enumerating a category item by item rather than by failing to
#   find something. What is not settled is in open_questions.
meta:
  captured: 2026-08-08
  patch: 2.4.3
  edition: TBC Classic Anniversary Edition
  phase: 3
  phase_3_opens: 2026-08-27
  arena_season_3_opens: 2026-09-01
  feeds: data/facts/hit.yaml, discretionary_hit_budget
  excludes: >-
    Socket bonuses, which are captured per item in data/facts/items.csv and
    are not duplicated here. Consumables that carry no cap-relevant stat. The
    low-level Classic-era enchant tiers that a level 70 character supersedes,
    which are recorded as a count rather than enumerated.

sources:
  primary:
    - name: Wowhead TBC Classic tooltip endpoint
      form: https://nether.wowhead.com/tbc/tooltip/item/<ID>
      note: >-
        Server-rendered against the TBC Classic data environment, so it is
        era-correct by construction. This is the source of every stat line and
        every activation requirement below. The equivalent spell form and the
        dataEnv=5 form return the same data.
    - name: Wowhead TBC XML endpoint
      form: https://www.wowhead.com/tbc/item=<ID>&xml
      note: >-
        The only form that returns vendor, reputation, cost and drop data. It
        rate-limits hard, returning HTTP 403 under almost any concurrency, and it
        serves cached URLs in a way that makes recovery look like success.
    - name: WoWSims TBC item database
      form: assets/database/db.json from github.com/wowsims/tbc-new
      note: >-
        Used as a lead list and as a second opinion, never as proof. It carried
        seven errors that this capture found and corrected. They are listed under
        wowsims_db_errors.
  rejected:
    - name: warcraft.wiki.gg rendered article pages
      reason: >-
        Renders post-TBC values for many items. Confirmed wrong-era renders were
        found on Spicy Hot Talbuk, Elixir of Healing Power, Adamantite Sharpening
        Stone, the whole Scroll of X V family, Death's Embrace, Falcon's Call,
        Presence of Might, Enchant Ring - Healing Power, Enchant Boots -
        Vitality, and Relentless Earthstorm Diamond. The wiki is used below for
        vendor, reputation, cost and patch-history data only, never for a stat.
    - name: Percentage wording on dodge, hit or crit
      reason: >-
        A reliable tell that a page is pre-3.0 or post-3.0 rather than 2.4.3. TBC
        expresses these as rating. A source reading "1% chance to hit" is not
        describing the 2.4.3 item.

# Wowhead blocks plain HTTP clients via CloudFront, per PROVENANCE.md. Every fetch
# below went through a browser-equivalent client. No curl was used.
method:
  id_confirmation: >-
    Every id below was resolved against a TBC-era tooltip endpoint. Ids that
    return HTTP 404 on the TBC subsite are recorded as absent from 2.4.3 rather
    than omitted, because their absence is the fact.
  negative_claims: >-
    Claims of the form "no enchant supplies X" were built by enumerating the slot
    and reading each entry, not by a filtered query, because Wowhead and Aowow
    filtered list pages render client-side and return nothing server-side. The
    individual entries are verified. The claim that an enumeration is complete is
    weaker than the entries within it and is marked accordingly.
  corroboration: >-
    Four independent research passes were run and their overlaps compared. The
    gem hit enumeration was built twice, once by index scan of the 214-entry
    WoWSims gem table and once by contiguous tooltip scan of the cut blocks. The
    two agree.

# ---------------------------------------------------------------------------
# ENCHANTS
# ---------------------------------------------------------------------------
#
# Item ids given for an enchant are the FORMULA, GLYPH, INSCRIPTION, PATTERN or
# CRAFTED ITEM id, not an enchantment id. Where an enchant has no scroll item in
# 2.4.3, the recipe spell id is given instead and item_id is null.
#
# A CORRECTION THAT APPLIES TO THE WHOLE SECTION. The WoWSims db spellId column
# is not the recipe spell. In nearly every case it is the applied aura or proc
# row, which is a separate database record. Recipe spell ids below were
# re-resolved. Cite item ids in preference to spell ids.

