  # Nine Zul'Gurub class enchants and three resistance Guards apply to a leg OR a
  # head slot item. Two of the nine supply hit. hit.yaml states that no leg
  # enchant grants hit. That statement is correct for the general leg armors and
  # spellthreads and is wrong for these two class-locked entries.
