      class_locked: true
      phase_3_available: true
      removed_in: patch 4.0.3a, so all nine are live in 2.4.3
      verified: true
      verified_against: >-
        TBC tooltip endpoint for all nine ids. Item 19791 returns HTTP 404, so the
        family is exactly these nine and no tenth exists.
      repeatable: unverified
      entries:
