# GENERATED BY tools/extract_hit_captures.py. DO NOT EDIT.
#
# Rolled up from data/facts/sim-profiles/hit-capture, one file per spec, each
# collected by hand from that spec's published gear lists. To change a figure
# here, change the capture it came from.
#
# READ data/facts/hit.yaml FIRST. It holds the caps, the talents, the assumed
# buffs and the discretionary gem budget, none of which are restated here.
# This file holds one thing: what ITEM hit a realistic set carries, at three
# points in the tier.

meta:
  counts: item hit only
  excludes: gems, enchants, consumables, talents, racials
  generated_by: tools/extract_hit_captures.py
  rating_per_hit_gem: 10
  rule: 'per-spec gear sets, each sourced individually and downgraded to four to
    six weeks in. NOT uniformly published gear lists: Wowhead''s guide pages render
    client-side and were unreadable for several specs, which fell back to the in-repo
    EP Workbook, to simulator presets, to an archive snapshot or to a secondary
    site. Each spec''s `basis` field and its capture''s `sources` block say which.'
  sibling_files:
  - data/facts/hit.yaml
  - data/facts/progression.yaml
  - data/facts/sim-profiles/token-arithmetic.yaml
  specs_captured: 17
  which_tier_slots_are_worn_was_ASSUMED_not_derived: 'READ THIS BEFORE QUOTING A
    TIER FIGURE. The two states below hold the hands token, then the hands and head
    tokens, because the capture brief SAID SO. Nothing here worked out whether a
    spec should accept a token it can reach. That is a different question and token-arithmetic.yaml
    already answers it, per spec, from set bonuses and item value.

    THE TWO FILES DISAGREE FOR SIX SPECS. token-arithmetic records a collision for
    the Feral Cat, the Feral Bear, the Enhancement Shaman, the Retribution Paladin,
    the Balance Druid and the Arms Warrior. Each spec below carries the mechanical
    fact under token_configuration_contested; what it adds up to is a reading, and
    readings live in data/judgments/token-verdicts.yaml. All six wear both tokens
    below anyway.

    Only the Arcane Mage declined a token, and only because its source guide named
    the refusal explicitly.

    SO A TIER FIGURE BELOW ANSWERS: what item hit would this spec carry IF it wore
    both reachable tokens. For eleven specs that is a reasonable reading. For the
    six named above it prices a set the spec would not assemble, and the hit figure
    should not be quoted for them without saying so.'
