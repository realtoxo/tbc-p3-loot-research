meta:
  what: 'The coherence backtest: whether the slot ladders COMPOSE. Each spec starts
    at its tier profile; a full clear supplies one copy of every Tier 6 raid drop
    in any measured ladder, candidates from outside the raids uncontended; drops
    allocate greedily by largest remaining ladder gain. `predicted` is the tier
    anchor plus the banked one-slot deltas, which is what a reader adding card figures
    expects; `measured` is the built, dressed end state simmed once. `gap` is measured
    minus predicted, the additivity error; `ceiling` repeats it with contention
    ignored, every slot at its best row, and `contention_cost` is what single copies
    cost the greedy raid in predicted DPS.'
  boss_armor: 7684
  iterations: 10000
  seed: 1
  GENERATED: BY tools/run_coherence_backtest.py, which runs the simulator. Rebuilt
    by `just backtest`, not by `just regen`. DO NOT EDIT.
