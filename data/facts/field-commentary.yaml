  stance: against
  status: captured
  confidence: high where the remark is mechanical and checkable; the url opens the recording
    at the second it was said
  note: 'Griftin argues the feral exception. This is NOT a conflict with fc-001, which speaks
    to the fury warrior: Anker wants the helm for physical DPS generally and Griftin says
