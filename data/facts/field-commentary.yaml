# What creators and class communities say about specific items. Hand-authored.
#
# HOLDS   One entry per item per source: who said it, where, when, the timestamp
#         in the recording, and a short summary of the claim. Transcripts live
#         under data/research/creator-transcripts, with a manifest naming the
#         video id and URL each timestamp attaches to.
# NOT HERE  No priority and no ranking. This input explains mechanisms and nominates
#         items for a closer look. It never moves a number on its own, per the
#         framework's Guides and field commentary row.
#
# BEFORE YOU USE A FIGURE
#   EVERY ENTRY IS NOW CAPTURED AND NAMES A REAL PERSON. Until 10 August 2026
#   every entry was a placeholder naming a ROLE, on the rule that a fabricated
#   opinion attributed to a real creator is the one error here that does damage
#   if it travels. That rule is why each entry now carries a url that opens the
#   recording at the second the remark was made: the attribution is checkable in
#   about fifteen seconds, which is the only thing that makes naming people safe.
#   A claim that flatters the author's own spec needs a second source before it
#   travels. An author with a main is rarely neutral about it.
#   Class-specific coverage is spotty. Some specs will have nothing current.
#
# SOURCE  Transcripts under data/research/creator-transcripts, stored verbatim
#   so a summary here can be checked against what was actually said. The
#   paraphrases were written by an agent reading the passage, checked by a
#   second agent told to refute, and spot-checked by hand. This is NOT the
#   manual capture the file originally described, and it does not claim to be.
#   The full pass is data/facts/creator-stances.yaml.

meta:
  status: captured
  entries_captured: 7  # six placeholder ids resolved, plus fc-007 added for a conflicting view
  entries_placeholder: 0
  full_result_set: >-
    These seven are the entries the card rendering cites. The whole pass is at
    data/facts/creator-stances.yaml: 580 remarks on 173 items from 27 creators,
    each with a url that opens the recording at the second it was said.
  note: >-
    NOT MANUAL CAPTURE. The header below still describes watching a recording by
    hand, which is how this was expected to happen and is not how it happened.
    An agent read each passage and a second agent, told to refute, read it again;
    a human spot-checked a sample. What makes a row checkable is the timestamp,
    not the method. See data/facts/creator-stances.yaml for the method in full.

# The fields every entry carries, so a capture session has a checklist.
schema:
  item_id: Wowhead item id, which is what the card matches on.
  item_name: Recorded for readability; item_id is authoritative.
  creator: The person or group. A placeholder names a role instead.
  channel: Where they publish.
  url: Link to the recording, with the timestamp where the platform allows it.
  published: Date the recording went up.
  captured: Date we watched and transcribed it.
  timestamp: Position in the recording where the claim is made.
  claim: One sentence, in our words, of what they said.
  scope: >-
    Which specs the claim covers. A tier-wide guide and a class guide carry
    different weight, and a claim about one spec must not be read as general.
  stance: favours, against, or conditional.
  conflicts_with: Another entry id, where two sources disagree. Disagreement is
    recorded rather than resolved, per the framework.
  status: captured or placeholder.
  confidence: >-
    high where the claim is mechanical and checkable, conservative where it is
    a preference or where the author has a stake in the spec.

