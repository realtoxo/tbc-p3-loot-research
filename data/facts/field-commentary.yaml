  item_id: 32521
  item_name: Faceplate of the Impenetrable
  creator: DevTanks
  channel: DevTanks
  url: https://www.youtube.com/watch?v=23n12xEA4AQ&t=23s
  published: null
  captured: '2026-08-10'
