open_questions:
  capture_backlog:
    blocks: Every priority that would cite a field source.
    detail: 'Nothing is captured. The six entries above are placeholders that fix the shape
      and let the card rendering be built and tested. Ordered by value: the Warglaives first,
      since the guild has already named that decision; then the tier tokens, since the set
      bonus argument is where creators disagree most; then trinkets, where proc rates and
      internal cooldowns are absent from our own data and a community source is the only route.'
  transcript_storage:
    blocks: Nothing. Closed on 10 August 2026.
    detail: Transcripts are captured, under data/research/creator-transcripts, one .txt and
      one .tsv per recording. The .tsv carries a start time and a duration per caption line,
      which is what a timestamped citation quotes, and manifest.yaml carries the video id
      and URL that time attaches to. The Phase 2 library recorded no id, no URL and no timing,
      so a claim taken from it could not be pointed back at the moment it was said; this capture
      records all three at the same time as the words. Produced by tools/fetch_transcripts.py.
  attribution_rule:
    blocks: Nothing today, but it will matter at the first capture.
    detail: A creator's own spec is the one they will overrate, and it is also the spec whose
      claims will be contested hardest at the council table. The framework already requires
      a second source for a claim that flatters the author's own spec. Whether that rule should
      extend to a claim that flatters the author's own GUILD or faction is not decided.
