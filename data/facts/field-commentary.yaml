- id: fc-005
  item_id: 32483
  item_name: The Skull of Gul'dan
  creator: Zatar (Classic Wow Builds)
  channel: Zatar (Classic Wow Builds)
  url: https://www.youtube.com/watch?v=6SWlWDYTkvU&t=7731s
  published: null
  captured: '2026-08-10'
  timestamp: '128:51'
  claim: Calls it one of the best items in the phase and says he personally rates it above
    a lot of the weapons. His argument for warlock is that the hit rating alone is wasted
    on Elemental Shaman, Arcane Mage and Shadow Priest, and that Boomkin will often already
    be over the hit cap, so on passive stats alone the warlock benefits most. He then turns
    to the on-use, arguing that giving haste to mages is not automatically the play because
    an Arcane Mage with Icy Veins and Bloodlust must delay either the trinket or Icy Veins,
    sometimes both.
  scope:
  - destruction_warlock
  - arcane_mage
  - elemental_shaman
  - shadow_priest
  - balance_druid
  stance: favours
  conflicts_with: fc-007
  status: captured
  confidence: high where the remark is mechanical and checkable; the url opens the recording
    at the second it was said
  note: >-
    Both this remark and Darkest's speak well of the trinket, so the
    disagreement is not about whether it is good but about who should hold it.
    Zatar argues the hit rating is wasted on an Elemental Shaman and routes it
    to a warlock. Darkest calls it the best trinket an Elemental Shaman can
    wear.
  record: >-
    The published note used to open by comparing what a placeholder predicted
    against what the capture returned, and to explain that the stance labels
    hide the axis of the conflict. Both are notes to this project's authors
    rather than to a reader, and the second half repeated fc-007 word for word
    on the same item page. Rewritten 13 August 2026.
- id: fc-006
  item_id: 32014
  item_name: Merciless Gladiator's Maul
  creator: Griftin
  channel: Griftin
  url: https://www.youtube.com/watch?v=a0LdmAafzUU&t=0s
  published: null
  captured: '2026-08-10'
  timestamp: 0:00
  claim: Griftin sets out to justify a claim from his loot video, that the Maul is technically
    the best weapon a feral can get in Phase 3, against Pillar of Ferocity. He values it at
    1010 attack power plus 84 from strength, 52 from the 18 hit and 80 from 42 crit, using
