- id: fc-001
  item_id: 32235
  item_name: Cursed Vision of Sargeras
  creator: Anker_64
  channel: Anker_64
  url: https://www.youtube.com/watch?v=U_Cd8uy07vw&t=128s
  published: null
  captured: '2026-08-10'
  timestamp: '2:08'
  claim: Anker calls Cursed Vision of Sargeras a very strong leather helm from Illidan that
    every physical DPS wants, but says he would not give it to a warrior first because it
    carries a lot of hit rating fury does not need, and hit is easier to source next phase
    from a draenei or a Dreamstate/Boomkin. He adds that it is still strong enough that a
    fury warrior who gets it drops the four-piece tier bonus.
  scope:
  - fury_warrior
  stance: conditional
  status: captured
  confidence: high where the remark is mechanical and checkable; the url opens the recording
    at the second it was said
  note: A tier-wide creator on the contested leather helm. He wants it for physical DPS generally
    and still argues a fury warrior should not be first in line for it.
