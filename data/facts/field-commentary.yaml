    clear it is gated on arena points, says he did not do arenas himself, and that not having
    it is not a big deal.
  scope:
  - feral_cat
  - feral_bear
  stance: favours
  status: captured
  confidence: high on what he says. The equivalence figures are his, taken from a third party,
    and this project has not checked them.
  note: >-
    Arena Season 2 gear rather than a Phase 3 drop. The Feral Cat capture wears
    it at every anchor for its 18 hit, and a creator does argue ferals carry it.
  record: >-
    Read by hand rather than by the transcript pass, because the item sits
    outside the drop table that pass ran over and would otherwise have been
    dropped silently.
    CORRECTED 13 August 2026, previously_claimed "Arena Season 3 gear".
    Merciless Gladiator is Season 2; Season 3 is Vengeful Gladiator, which
    docs/kb/DOMAIN.md records as opening 1 September 2026, five days after
    Phase 3 and therefore barred from an entry anchor. The wrong season would
    have barred the weapon the Feral Cat capture actually walks in holding, at
    every anchor, and it is the source of the 18 hit those entry figures rest
    on. tools/extract_ladder.py had it right the whole time: it deduplicates
    Vengeful as season3 and Merciless as season2.
