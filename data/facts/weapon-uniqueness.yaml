meta:
  what: Whether each one-hand weapon in the variant rounds' dual-wield
    fields can be worn in both hands at once. A weapon marked unique
    cannot, and a doubled row for it is a measurement of a state the
    game does not allow. Two-handers and ranged never double, and the
    trinket rounds never generate a doubled pair, so this file covers
    exactly the one-hand candidates of the dual-capable specs.
  source: Wowhead TBC tooltips, nether.wowhead.com/tbc/tooltip/item/<id>,
    observed 2026-08-22. Unique or Unique-Equipped in the tooltip is the
    claim, and the two are one constraint here, since neither allows a
    second copy worn.
  why_this_file_exists: The same defect as data/facts/ring-uniqueness.yaml,
    found by extending the guild lead's ruling that an illegal double may
    not appear in a sim result, 22 August 2026, to every slot that can
    double. The wowsims database misses the unique flag on most of these
    weapons and the engine equips two copies without complaint, so the
    weapon rounds ran 13 unique one-handers doubled before the sweep.
  maintenance: Hand-maintained, not regenerated. A one-hander added to a
    dual-capable weapon_field must be added here first with its tooltip
    checked, and the runner refuses one this file does not list.
