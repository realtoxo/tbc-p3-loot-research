    14.7 and 15.1. That is the same reversal the Retribution, Arms and Fury rounds measured.'
  the_ashtongue_talisman_is_priced_by_its_procs_alone: 'The Ashtongue Talisman of Vision carries
    no worn stats per items.csv, so everything its rows measure is the simulator''s pricing of
    its procs, and the vendored binary does price them: a diagnostic run at the same settings
    read Dragonspine Trophy beside an EMPTY trinket slot at 2306.1 on the best-in-slot anchor,
    57.6 under Dragonspine beside the Talisman at 2363.7. The recovered wowsims source checkout
    marks id 32491 an unimplemented TODO, so that checkout is stale against the vendored binary
    and is not evidence about what the binary implements. So priced, the tab''s rank five sits
    within one standard error of Darkmoon Card: Crusade beside Dragonspine at best in slot,
    2363.7 against 2363.3, and behind Tsunami Talisman and Bloodlust Brooch at every anchor
    that reaches it.'
