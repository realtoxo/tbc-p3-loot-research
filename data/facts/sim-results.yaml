    the Brooch displaces DRAGONSPINE rather than Madness.'
  the_armor_tier_caveat: Madness of the Betrayer carries armor penetration, so every
    figure that holds it moves with the boss's armor, and these are at 6193, the
    tier ten of the fourteen bosses sit in. At that tier Dragonspine plus Madness
    is 5.6 behind Dragonspine plus the Brooch at tier and third at best in slot.
  the_expose_weakness_context: This spec self-applies Expose Weakness, the engine
    zeroes the external debuff for the talent holder and derives the effect from
    the wearer's OWN agility, per data/facts/raid-buffs.yaml, so an agility trinket
    on these rows moves the debuff as well as the wearer, which no other spec's
    trinket round measures. It is why the SV tab is the one melee ladder that ranks
    Badge of Tenacity, whose on-use is 150 agility for 20 seconds.
  a_workbook_reversal: 'The SV tab''s Trinket ladder ranks Dragonspine Trophy first
    at 303.25, more than double Tsunami Talisman fourth at 139.52; measured, the
    two are separated by one to five DPS beside any fixed partner, in Dragonspine''s
    favor at entry and tier and in Tsunami''s at best in slot. Bloodlust Brooch,
    ranked seventh at 118.00, is in the best pair at every anchor, the reversal
    every trinket round has measured. Badge of Tenacity, ranked fifth at 130.25
    above the Brooch, reverses against it: the Brooch pair beats the Badge pair
    beside every partner at every anchor, and the Badge''s best placement is seventh,
    beside Madness of the Betrayer at tier. Talon of Al''ar, ranked twelfth at 87.00
    above Core of Ar''kelos fourteenth at 85.00, reverses too: Core beside Dragonspine
