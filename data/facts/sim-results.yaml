    premise, so this measurement agrees with the published guide and disagrees with
    the capture as worn, the one disagreement this round records.
  the_styles_interleave_rather_than_separate: The two styles mix through this table
    at every anchor, as they did in every caster round. On the best-in-slot set
    the order runs Zhar'doom, then five one-hand rows, then the Season 3 Battle
    Staff at 2060.8 ± 0.92 in seventh, and the spread from the worn top row to the
    bottom is 92.3. On the tier set the spread is 56.1 and the worn Spellblade with
    the Fathomstone sits ELEVENTH of twelve, above only the Merciless Gladiator's
    War Staff, so at that anchor every Phase 3 main hand paired with the Chronicle
    is an upgrade over the worn pair and only Zhar'doom beats The Maelstrom's Fury.
the_hunter_ranged_pass:
  measured: 2026-08-20, 10000 iterations, seed 1, armor 6193, six ranged weapons
    per hunter run as variants of each anchor profile, only the ranged slot changed
    and the slot keeping its scope, figures in data/facts/variant-sims.yaml under
    ranged_anchors. Ruled by the guild lead the same day, the bow being the one
    hunter weapon that is not a stat stick.
  the_slow_bows_own_every_table: The three 3.0 speed bows, Bristleblitz Striker,
    the Black Bow of the Betrayer and Serpent Spine Longbow, hold the top three
    places at every anchor for BOTH hunters, and the worn Serpent Spine, a Phase
    2 drop, stays within 16.0 of the Phase 3 bows everywhere, so the ranged upgrade
    a hunter is waiting on is modest.
  the_survival_ladder_is_reversed_on_its_own_rank_one: Legionkiller is the Survival
    tab's Ranged rank one at 789.66 EPV, thirty points clear of the field, and it
    MEASURES fourth at every anchor, 92.7 DPS below the worn Bristleblitz Striker
    at best in slot and 69.4 below the worn Serpent Spine at tier. Survival punishes
    the 2.9 speed weapons by 69 to 112 DPS where Beast Mastery loses 11 to 44 on
    the same swaps. The mechanism is not read from the engine here; what is recorded
    is that the EPV column and the simulator disagree about this spec's ranged slot
    in both direction and size, and the council should weigh Legionkiller rolls
    accordingly. NOT A RULING.
the_bis_profiles_audited_against_their_own_tables:
  what: Every best-in-slot profile checked against its own measured tables at the
    default armor, after the weapon rounds became ENUMERATIVE on 21 August 2026,
    every style-legal ordered combination of the shortlist field plus the worn and
    routed weapons, 8344 variants across the thirteen specs. A gap is the best measured
    row minus the anchor figure.
  the_enumeration_confirmed_the_curation: The exhaustive tables surface NO weapon
    combination the earlier curated rounds had missed. Every profile wears its best
    measured weapons, and the only standing gaps are the two bis_no_glaives profiles
    trailing the Warglaives by 120.9 and 187.0, which is the question those profiles
    exist to answer, and the Survival trinket case below.
  the_survival_trinket_exception_is_load_bearing: The Survival slot table still
    reads Dragonspine with the Brooch 18.5 above the worn pair, and the profile
    REBUILT that way measured 9.9 BELOW it, because losing Madness of the Betrayer
    takes 20 item hit and the re-spent sockets cost more than the pair gains. Tested
    and declined, recorded in data/judgments/trinket-routing.yaml; the second measured
    case behind the profile-level confirmation rule in data/judgments/sim-context.yaml.
    A slot table prices the item alone; only a profile prices what it displaces.
the_tier_break_evens:
  measured: 2026-08-21, 10000 iterations, seed 1, armor 7684, 150 seconds, 366 runs,
    every row in data/facts/tier-sims.yaml and the page that reads them is docs/tier.md.
    Every row is the spec's ENTRY profile with a subset of slots replaced by its
    chase pieces, entry consumables held still, and the empty subset reproduces
    each spec's entry figure in sim-figures.yaml to the digit. NOT A RULING.
  the_gem_rule_shapes_every_absolute: A replacement arrives ungemmed, the variant-sims
    rule, so every figure understates a gemmed chase piece and the honest break-even
    comparison is between subsets of EQUAL size, which carry the same number of
    empty sockets. The absolute deltas against entry carry the empty sockets as
    a cost; the fully gemmed destination is priced by the anchor figures, not by
    these rows.
  the_known_case_enhancement: The Cataclysm Harness 4-piece, 5 percent additional
    Flurry haste, holds its price to the end of the chase set. Every one of the
    15 replacement subsets measures BELOW the unbroken entry set, the best single
    chase piece is the chest at 22.7 below and the full four-slot swap sits 35.7
    below, so inside the equal-count comparison breaking never beats keeping and
    the bonus is only worth breaking for gemmed pieces, which the best-in-slot anchor
    prices at 2167.0 against the entry 1992.9.
  the_widest_bonus_moat_balance_druid: The Nordrassil 4-piece, 10 percent Starfire
    damage under Moonfire, is the most expensive bonus in the roster to break. The
    FIRST chase piece costs 89.5 to 124.3 DPS, one standard error 0.74 to 0.86,
    and even the full four-token Thunderheart swap, its own 4-piece live, reads
    47.0 below entry. No subset in either of its rounds reaches the entry figure.
  the_cheapest_break_combat_rogue: The Deathmantle 4-piece dies to the first chase
    piece and the round never looks back. The subset shoulder, hands, legs measures
    62.0 ABOVE entry with the 2-piece also gone, ungemmed, and the full five-token
    Slayer chase is the roster's largest tier-six gain, the 4-piece at 85.5 above
    entry with one standard error 0.93.
  the_break_even_that_pays_at_two_elemental_shaman: The one spec holding TWO old
    2-pieces, Cataclysm chest and legs and Cyclone head and shoulder. Breaking the
    Cyclone 2-piece pays at two chase pieces, shoulder plus chest at 1741.4 against
    1707.4 for the best same-size keeper, 34.0 apart, because the two replacements
    ARE the Skyshatter 2-piece; it is one of only two specs whose old-bonus round
    beats entry at all, at plus 22.6 ungemmed.
  breaking_never_pays_inside_the_chase_set: For ten of the thirteen specs no old-bonus
    subset measures above the unbroken entry set, the gem rule stated above carrying
    part of that. Enhancement, Balance, both warriors, both warlocks, the Arcane
    Mage, the Retribution Paladin, the Survival Hunter and the Shadow Priest at
    its Avatar set. Only the Combat Rogue, the Elemental Shaman and the Beast Mastery
    Hunter, at plus 12.9 with the Gronnstalker 2-piece, walk out of the round ahead
    of entry.
  the_shadow_priest_holds_a_second_old_set: The entry capture's bonus list names
    Avatar Regalia alone, and the set derivation from the item database found Shadow's
    Embrace beside it, the Frozen Shadoweave shoulder and feet, so the round measured
    four bonus-carrying slots rather than two. Both of its 2-pieces sit at razor
    break-evens, 0.2 and 9.7 apart at equal counts, inside or near one standard
    error of 0.26.
  the_tier_six_thresholds: 'Best route to each threshold against entry, ungemmed,
    one standard error 0.26 to 1.18: Slayer 2pc +52.8 and 4pc +85.5 for the rogue;
    Onslaught 2pc +28.0 for Arms and MINUS 21.1 for Fury, whose list keeps only
    shoulder and chest; Gronnstalker 2pc +12.9 and 4pc +43.1 for Beast Mastery,
    +8.5 and +2.7 for Survival; Malefic 2pc MINUS 12.7 for Affliction and PLUS 27.9
    for Destruction; Skyshatter 2pc +33.5 and 4pc +49.0 for Elemental; Absolution
    2pc MINUS 3.9 and 4pc +4.2 for the Shadow Priest; Thunderheart 2pc MINUS 58.9
    and 4pc MINUS 47.0 for Balance. Arms is the standing warning case: its best
    two-token subset reads +28.0 while the full four-token swap reads MINUS 14.3,
    because the head token alone costs 42.0.'
  two_specs_have_no_tier_six_round: The Enhancement Shaman and the Retribution Paladin,
    whose tier anchors wear their entry sets unchanged in all five token slots,
    because their Phase 3 lists keep no tier piece there, so for them the tier question
    is entirely the old-bonus table. The Arcane Mage nearly joins them, reconsidering
    only hands and legs, and its tier hands are a FIFTH Tirisfal piece rather than
    Tier 6.
what_is_still_open:what_is_still_open:
  a_source_checkout_matching_the_binary: The vendored binary is v0.0.116 and no
    such tag exists on the upstream repository, so a matching source checkout could
    not be fetched when it was tried on 20 August 2026. The standing rule covers
    it, an implementation claim is citable only after the binary demonstrates it
    behaviorally, and the stale checkout stays good for proto field names alone.
what_is_still_open:
  expose_weakness_agility: Sent at the simulator's Phase 3 figure of 1210, which
    is NOT our hunter's measured agility. wowsimcli reports neither final player
    stats nor target aura stacks so ours cannot be read out of a run. Marked Conservative
    in raid-buffs.yaml.
  epic_gems: Confirmed Phase 3 legal by this repository's own Blizzard-sourced enchants-gems.yaml
    and worth 7 to 16 DPS per spec, deliberately deferred because it touches every
    spec's gem preferences and deserves its own pass.
  engineering: Sappers and explosives are worth 9 to 16 DPS but are inert without
    profession1, and roster.yaml records no professions for anyone. GUILD LEAD NEEDED.
  retribution_hammer_of_wrath: The shipped Retribution rotation omits Hammer of
    Wrath entirely, which is why this spec gains nothing from the execute phase
    every other execute user gains from. Its figures therefore carry conservative
    confidence, and the cost of that omission has not been measured.
the_coherence_backtest:
  what_was_tested: 'Whether the slot ladders COMPOSE: thirteen specs walked greedily
    from their tier profiles through a full clear of ladder upgrades, one copy per
    Tier 6 drop, then each end state was built, dressed and simmed and compared
    with the tier anchor plus the sum of the banked one-slot deltas. The figures
    are in data/facts/coherence-backtest.yaml.'
  what_the_figures_mean: 'Nine specs compose: the measured end state lands within
    about ten DPS of the additive prediction across four to six stacked swaps, so
    for them a reader may add card figures and the denial orderings can be followed
    as written. The failures are CONCENTRATED, not general: Destruction measured
    310.7 below its prediction and Affliction 74.2, with Balance at 17.6 and Retribution
    at 26.8, and the stacking trace names the mechanism. Destruction composes perfectly
    through its first swap, then Robe of the Malefic, whose one-slot value was priced
    against an under-cap profile and includes its 28 hit, lands on a profile the
    first swap already capped, and the gap jumps 113.5 in that single step. Spell
    hit is worth a great deal below the cap and nothing above it, so one-slot deltas
    that each bank hit value cannot be summed once the cap is crossed.'
  what_follows: 'A single swap read off an item page is safe everywhere, which is
    what the cards and the denial summaries show. A MULTI-swap plan for a spec whose
    ladder moves hit is priced by the tier subset rounds or by a fresh profile sim,
    never by adding card figures, which is the profile-level confirmation rule of
    data/judgments/sim-context.yaml demonstrated at scale. Destruction is the standing
    example: its greedy end state measured 52.8 ABOVE its tier anchor while the
    added figures promised 363.5.'
