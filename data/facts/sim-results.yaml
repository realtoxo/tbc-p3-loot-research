meta:
  what: What the simulated figures MEAN. The figures themselves are in data/facts/sim-figures.yaml
    and are not restated here.
  produced: '2026-08-15'
  settings: 10000 iterations, seed 1, single target at level 73, 150 second encounter,
    run against each of the three Phase 3 boss armor tiers. Every figure quoted
    below is at armor 6193 unless it says otherwise.
  EVERYTHING_IN_THIS_FILE_BEFORE_15_AUGUST_2026_IS_SUPERSEDED: Five independent
    audits and four arbiters reviewed the simulator configuration that day and found
    nine live defects. Three of them moved every figure this project had ever published,
    so no number from before that date survives and none is quoted here except as
    a retraction.
  the_three_that_moved_everything:
    the_boss_had_no_armor: The target was sent forty-eight zeros. Physical specs
      were inflated 17 to 23 percent and casters not at all, so no comparison between
      the two was valid. Worse, mitigation is max(armor minus debuffs minus armor
      penetration, 0), so at zero armor EVERY armor debuff this raid supplies and
      EVERY point of armor penetration on every item was worth exactly nothing.
    every_character_was_an_illegal_race: race was hardcoded to Blood Elf, which
      cannot be a Warrior, Druid or Shaman in 2.4.3, and sim/core/base_stats.go
      registers base stats only for pairings that exist. Six specs ran with no base
      strength, agility or stamina at all.
    two_hunters_had_no_pet: classOptions was empty for both, so proto defaults gave
      them no pet, no ammo and no quiver. Worth 1508 DPS to Beast Mastery.
  not_simulated: Tanks, by the ruling of 14 August 2026. The Feral Cat, because
    no action priority list for it exists in this build. The four healers, who have
    no captured gear set.
every_spec_now_improves_monotonically:
  what: entry is lower than tier and tier is lower than best in slot, for all thirteen
    specs, at every armor tier. That was NOT true before 15 August 2026 and the
    two exceptions were read for days as facts about gear.
  the_arms_warrior_anomaly_is_gone: 'It measured BELOW its own entry set by 108.3,
    then 45.3, then 25.1, then 20.8 as four separate defects were fixed. It now
    reads entry 2148.8, tier 2239.6, best in slot 2421.4. THE PUBLISHED LIST WAS
    NEVER THE PROBLEM: the missing boss armor was, because the Onslaught set pays
    in armor penetration and armor penetration was worth zero.'
  the_beast_mastery_anomaly_is_gone: It measured below its own tier set by 88.5.
    It now reads 3340.6, 3523.6, 3572.9. The cause was the same class of defect,
    an empty class options block leaving it with no pet.
  what_this_says_about_the_earlier_analysis: Both anomalies were investigated at
    length and explained in gear terms, and both explanations were wrong. A surprising
    result is worth investigating; an explanation that fits a surprising result
    is not evidence that the configuration underneath it is sound.
the_encounter_is_not_a_neutral_knob:
  length: '150 seconds, ruled 15 August 2026. Measured at 90 against 180 the same
    day: EVERY spec gained, but the mana-constrained casters gained 41 to 45 percent
    because they stop running dry while the melee gained 5 to 8. Shortening a fight
    moves specs RELATIVE TO EACH OTHER.'
  boss_armor: Phase 3 spans two tiers, 7684 and 6193, and ten of the fourteen bosses
    sit in the lower one. The same Fury Warrior measures 2856.4 against a 6193 boss
    and 2512.5 against a 7684 one, a 344 DPS swing from the boss alone. A figure
    at one tier is not comparable with a figure at the other, which is why every
    row of sim-figures.yaml carries its armor.
  casters_do_not_move_with_armor_at_all: The Arcane Mage, both Warlocks, the Elemental
    Shaman and the Shadow Priest read the same figure at every tier, which is the
    correct behaviour and a useful check that the armor change is doing what it
    claims.
the_rogue_published_trinket_was_RIGHT_and_this_file_said_otherwise:
  retracted: On 15 August 2026 this file recorded that the Combat Rogue's own Phase
    3 page ranks the weakest of its four Dragonspine pairings, and that Tsunami
    Talisman was worth 67.0 more than the published Warp-Spring Coil. THAT IS RETRACTED.
  why_it_was_wrong: It was measured against a boss with no armor. Warp-Spring Coil
    is an armor penetration trinket, so it was being priced at close to nothing.
  corrected: At armor 6193, Dragonspine Trophy plus Warp-Spring Coil is the BEST
    of the four at 2912.8, ahead of Madness by 20.2, Tsunami by 38.0 and Bloodlust
    Brooch by 43.0. The published list was right and this project was wrong.
  the_lesson: A finding that a published best-in-slot list is mistaken deserves
    more scepticism than a finding that agrees with it, not less.
  these_absolutes_are_superseded: The four figures above predate the Expose Weakness
    recalibration of the same evening, which moved every physical spec. The enumerated
    rogue trinket round of 20 August 2026 reproduces the ORDER exactly and the separations
    within 0.6 DPS at the current calibration, where the four pairings read 2918.2,
    then 20.6, 37.8 and 43.6 under it; see the_rogue_trinket_round_is_enumerated.
    The conclusion is unchanged and the old absolutes are quoted only here.
the_rogue_trinket_round_is_enumerated:
  measured: 2026-08-20, 10000 iterations, seed 1, armor 6193, every unordered pair
    from the eight-trinket pool as a variant of each of the four anchor profiles,
    99 runs, every row in data/facts/variant-sims.yaml.
  the_cross_check_against_the_block_above: The four Dragonspine pairings reproduce
    in ORDER and in SEPARATION but not in absolute value. This round reads Dragonspine
    Trophy plus Warp-Spring Coil 2918.2, Madness of the Betrayer 20.6 behind, Tsunami
    Talisman 37.8 and Bloodlust Brooch 43.6, against the recorded 20.2, 38.0 and
    43.0, each within one standard error of a difference. Every absolute figure
    sits 5.4 to 5.9 above the block above because the Expose Weakness calibration
    of 15 August 2026 POSTDATES that block by twenty-two minutes; it moved every
    physical spec up 2.8 to 7.8 and the rogue best-in-slot anchor from the 2912.8
    quoted there to 2918.2. The worn pair's row reproduces each of the four CURRENT
    anchor figures in sim-figures.yaml to the digit.
  best_combination_per_anchor: 'Dragonspine Trophy plus Warp-Spring Coil at all
    four anchors, which is the pair every anchor already wears, so each table''s
    top row IS its anchor figure: entry 2329.8, tier 2542.0, best in slot 2918.2,
    and 2708.2 without the Warglaives. One standard error is 0.98 to 1.21 across
    the four.'
  the_dragonspine_premium: 'The best pair holding Dragonspine Trophy minus the best
    pair without it, pure arithmetic on the table, 39.4 to 49.3 depending on the
    anchor: 49.3 at entry, 39.4 at tier, 43.9 at best in slot and 46.6 without the
    Warglaives. The best pair without it is Warp-Spring Coil with Madness of the
    Betrayer at every anchor except entry, where Madness is not yet reachable and
    Tsunami Talisman stands beside the Coil at 2280.5.'
  a_workbook_reversal: The Rog tab's Trinket ladder ranks the Ashtongue Talisman
    of Lethality third at 191.84, above Madness of the Betrayer at 183.80 and Tsunami
    Talisman at 153.10. Measured, every pairing that holds it lands in the bottom
    half of its table at every anchor that can reach it, its best placement sixteenth
    of twenty-eight, and Dragonspine plus the Talisman reads 111.2 under Dragonspine
    plus the Coil at best in slot, 2807.0 against 2918.2.
