    SECOND of the three pre-Phase 3 rows, The Nexus Key alone 1726.5 ± 0.86 against the
    worn Merciless Gladiator's Spellblade with the Fathomstone 1718.8 ± 0.89, a gap of
    7.7, with the Merciless Gladiator's War Staff 1711.2 ± 0.87 third. The capture's own
    notes record that the published Phase 2 guide builds around The Nexus Key and that
    the one-hand pair was substituted under an earlier task premise, so this measurement
    agrees with the published guide and disagrees with the capture as worn, the one
    disagreement this round records.
  the_styles_interleave_rather_than_separate: The two styles mix through this table at
    every anchor, as they did in every caster round. On the best-in-slot set the order
    runs Zhar'doom, then five one-hand rows, then the Season 3 Battle Staff at 2060.8 ±
    0.92 in seventh, and the spread from the worn top row to the bottom is 92.3. On the
    tier set the spread is 56.1 and the worn Spellblade with the Fathomstone sits
    ELEVENTH of twelve, above only the Merciless Gladiator's War Staff, so at that anchor every
    Phase 3 main hand paired with the Chronicle is an upgrade over the worn pair and
    only Zhar'doom beats The Maelstrom's Fury.
