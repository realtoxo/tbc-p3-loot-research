the_solarian_sapphire_caveat_is_now_measured:
  what: The Arms and Fury trinket rounds stated that the simulator prices Solarian's
    Sapphire's Battle Shout bonus outside the trinket slot and that the runs do not engage
    it. That claim was first read from the recovered source checkout, which the Enhancement
    round proved stale against the vendored binary, so it was retested against the binary
    itself on 20 August 2026.
  measured: Arms Warrior best in slot wearing Dragonspine Trophy and Solarian's Sapphire,
    10000 iterations, seed 1, armor 6193, reads 2355.4 with the runs' own request and 2386.1
    with hasBsSolarianSapphire sent, a difference of 30.8 DPS. The caveat is confirmed by
    behavior, not by source reading. No anchor profile wears the Sapphire, so no anchor
    figure is affected; only the Sapphire's own variant rows understate it, by about this
    much for a warrior whose party takes its Battle Shout.
  the_checkout_lesson: The recovered wowsims checkout disagrees with the vendored binary in
    both directions, marking the Ashtongue Talisman of Vision unimplemented while the binary
    prices it, and an implementation claim is only citable after the binary demonstrates it.
