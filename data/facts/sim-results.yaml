meta:
  what: The first simulated figures this project has ever produced, and what causes each
    delta.
  produced: '2026-08-15'
  simulator: wowsims tbc-new, wowsimcli v0.0.116, installed by tools/install_wowsimcli.sh
  settings: 3000 iterations, seed 1, single target, 180 second encounter
  run_to_run_spread: 0.3 to 3.5 DPS per profile across seeds 1, 100001 and 200001, so
    a delta larger than about 5 DPS is signal rather than noise
  WHAT THESE FIGURES ARE ABOUT: The tier profile is the ENTRY set with only the five token
    slots reconsidered. Weapons, trinkets and the other twelve slots are IDENTICAL at
    both anchors on every spec. So a delta here answers 'what do the tier tokens alone
    do to a Phase 2 raider', NOT 'what is this spec worth in Phase 3'. Six specs still
    swing Season 2 arena weapons at the tier anchor and the Combat Rogue never holds a
    Warglaive. A third profile, a full Phase 3 best-in-slot set, is queued to answer the
    broader question.
  not_simulated: Tanks, by the ruling of 14 August 2026. The Feral Cat, because no action
    priority list for it exists in this build. Thirteen specs, not seventeen.
  one_caveat_on_comparability: The twelve untouched slots are untouched as ITEMS but not
    as GEMS. A tier set is re-gemmed to re-cap hit, which flatters it slightly against
    a pure item swap. The Arms Warrior needs four hit gems at its tier anchor.
