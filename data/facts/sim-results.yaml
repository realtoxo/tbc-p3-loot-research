    so every anchor is past the target and the Skull''s 25 hit converts to nothing,
    yet the premium lands SECOND of six rather than collapsing to the priest''s
    6.0. The whole of the Skull''s measured worth beside the Capacitor, 115.2 on
    the empty-slot diagnostic, is its 55 spell damage and its 175-haste on-use,
    beside Arcane''s 117.6 and above Affliction''s 100.8, so hit position alone
    did not decide this wearer''s end of the spread; the premium is nonetheless
    a third of the Skull''s worth because the best pair without it, the Icon plus
    the Capacitor at 2091.4, keeps the Capacitor, where the priest''s no-Skull pair
    kept nothing of its worn pair.'
  the_armor_tier_note: 'These figures are at armor 6193 like every trinket round,
    and for this spec the tier is a label rather than a variable: data/facts/sim-figures.yaml
    reads the same figure at armor 0, 6193 and 7684 at every anchor, 2130.0 at best
    in slot at all three, and a diagnostic in this round reran the worn best-in-slot
    pair at all three armor tiers and read 2130.0 with the same standard error each
    time, so nothing in these runs swings a melee weapon into the boss''s armor
    and the invariance held through the rerun.'
  a_workbook_reversal: 'The loudest is the ladder''s silence: The Lightning Capacitor,
    which the Ele tab does not rank among its fifteen, sits in the measured best
    pair at every anchor, and its partner gain beside the Skull, 84.3 on the empty-slot
    diagnostic, is the largest of the six candidates. The tab ranks Eye of Magtheridon
    sixth at 71.00 above Icon of the Silver Crescent seventh at 69.00; measured,
    the Icon beats the Eye beside every partner but one, 2091.4 against 2070.3 beside
    the Capacitor at best in slot, 1893.9 against 1874.5 at tier and 1718.8 against
    1701.1 at entry, the Icon-over-Eye reversal every caster round has recorded,
    EXCEPT beside the Skull, where the Eye reads 2103.6 to the Icon''s 2096.2 at
    best in slot and the two tie at 1899.8 at tier, so beside the Skull the tab''s
    order stands. And where the Balance round measured Darkmoon Card: Crusade over
    the Sextant of Unstable Currents against the tab, this tab''s order HOLDS: the
    Sextant, ranked second at 90.20, beats the Card, ranked fifth at 80.00, in every
    shared pairing, 2119.7 against 2112.9 beside the Skull and 2087.9 against 2079.8
    beside the Capacitor at best in slot.'
  the_binary_prices_the_procs_for_this_spec_too: 'Tested behaviorally against the
    vendored binary rather than read from the stale source checkout, a fixed partner
    beside each candidate against the same partner beside an EMPTY slot, same seed,
    on the best-in-slot anchor. The worn Skull beside an empty slot read 2045.7;
    beside The Lightning Capacitor, 2130.0, 84.3 up, and that IS the anchor figure,
    this being the worn pair, every point of it the simulator''s pricing of the
    Capacitor''s charge-and-discharge proc, because the Capacitor carries no worn
    stats per data/facts/items.csv; beside the Sextant, 2119.7, 74.0 up, its worn
    spell damage plus its proc; beside Darkmoon Card: Crusade, 2112.9, 67.2 up,
    all of it the Card''s stacking proc, the Card carrying no worn stats either;
    beside Eye of Magtheridon, whose proc fires on a resist, 2103.6, 57.9 up, on
    a set past the hit target that rarely resists. The Skull itself, measured from
    the other side with the worn Capacitor fixed, is 115.2 up on the empty slot,
    2130.0 against 2014.8, its worn 55 spell damage and its 175-haste on-use, the
    25 hit converting to nothing.'
what_the_warglaives_are_worth:
  measured: 2026-08-15, 10000 iterations, seed 1, armor 6193, both weapon slots
    varied together
  note: Every candidate runs BARE, because tools/run_sims.py --swap strips the enchant
    with the item, so these compare with each other and NOT with an enchanted profile.
  combat_rogue:
    warglaives_bare: 2741.0
    best_alternative_bare: 2536.9
    the_premium: 204.1
    alternative: Blade of Infamy 30881 main hand, Blade of Savagery 32369 off hand
  fury_warrior:
    warglaives_bare: 2723.1
    best_alternative_bare: 2581.8
    the_premium: 141.3
    alternative: Blade of Infamy 30881 in both hands, which needs two copies
  the_council_arithmetic: Both profiles currently hold the same unique pair and
    only one can. Routing them to the rogue leaves the raid at roughly 5628 against
    roughly 5565 the other way, so the rogue is worth about 63 more BECAUSE IT EXTRACTS
    MORE FROM THE SAME WEAPONS, 204 against 141. Whoever does not get them lands
    near 2710 either way, which is to say the two specs are level without the glaives.
    NOT A RULING. The council decides.
no_two_bis_figures_can_be_true_at_once:
  what: A best-in-slot set is what one spec would wear having won every contested
    drop, and a raid holds one of each item. The best-in-slot column is thirteen
    ceilings, not a raid.
  the_sharpest_case: BOTH Warglaives of Azzinoth are worn by the Combat Rogue AND
    the Fury Warrior. There is one pair.
  how_wide_it_goes: Seven specs wear Dragonspine Trophy, six wear The Skull of Gul'dan,
    Ring of Ancient Knowledge and Slippers of the Seacaller, and five wear Zhar'doom.
  what_it_does_not_undermine: The entry to best-in-slot movement per spec, because
    both ends of it belong to the same spec.
four_specs_want_two_copies_of_one_item: Reported by tools/check_sim_profiles.py
  rather than failed, because it is what the pages say and two copies of a non-unique
  item is a legal set. The Affliction Warlock, the Destruction Warlock and the Shadow
  Priest each wear Ring of Ancient Knowledge in BOTH ring slots, and the Survival
  Hunter dual wields two copies of Blade of Infamy. The pages rank these rows 'Best
  x2' in their own words.
retribution_and_enhancement_read_identical_entry_and_tier_figures: 'Their gear files
  are byte-identical, verified by hash rather than assumed: neither spec''s Phase
  3 list wears a tier token in any of the five slots, so the tier anchor collapses
  onto entry by construction. A reader counting rows would otherwise take these
  for stuck runs.'
the_hit_overshoot_at_the_best_in_slot_anchor: 'A published list ranks each slot
  in isolation, so nothing stops the set overshooting a cap. The Combat Rogue carries
  195 item hit against a melee-special target of 64, and the Enhancement Shaman
  163 against 0. FOR THE ROGUE THIS IS NOT WASTE: a dual wielder keeps benefiting
  from hit up to the roughly 28 percent white-swing cap, and its whites still miss
  3.7 percent. For the casters and Enhancement it is real waste, and it is a property
  of the published lists rather than of this pipeline. NOT CORRECTED, because correcting
  it would mean rebuilding the sets to our own rule and the figures would stop describing
  the lists players follow.'
what_the_matched_pairs_measure:
  measured: 2026-08-20, 10000 iterations, seed 1, armor 6193, every matched-speed
    pair run as a VARIANT of each Enhancement anchor profile, only the two weapon
    ids replaced and each slot keeping its Mongoose, figures in data/facts/variant-sims.yaml
  note: A variant is directly comparable with its anchor's figure in sim-figures.yaml,
    because it is the same request with two item ids changed, and the anchor figure
    IS the captured mismatched pair. This replaced a bare-swap round from earlier
    the same day; the enchanted variants say the same thing the bare rows said,
    which is itself worth recording.
  the_headline: THE CAPTURED MISMATCHED PAIRS MEASURED ABOVE EVERY MATCHED PAIR
    at entry and at best in slot. The best-in-slot anchor reads 2387.4 wearing Vengeful
    Gladiator's Cleaver plus Syphon of the Nathrezim, against 2352.8 for the best
    matched pair, a gap of 34.6 DPS at a standard error near 1. The entry anchor's
    captured pair, Wicked Edge of the Planes plus Merciless Gladiator's Cleaver,
    measured 2216.4 against 2188.7 for Dragonstrike plus Rod of the Sun King, a
    gap of 27.7. The simulator prices the matched-speed rule as a cost at both anchors,
    not a gain.
  the_entry_ruling: The guild lead read those figures and ruled the entry weapons
    the same day, "use the dragonstrike+rod as entry weapons", TAKING THE MATCHED
    PAIR 27.7 BELOW the captured one, so the rule governs the anchor rather than
    the higher figure. The entry anchor now reads 2188.7, which is the Dragonstrike
    plus Rod variant to the digit because they are the same request, and the tier
    anchor carries the same pair by the slot-by-slot fallback.
  the_first_upgrade_is_matched: On the tier anchor, two Syphons of the Nathrezim
    read 2221.1 against the set's 2187.7, plus 33.4 and the largest weapon movement
    either pre-BiS anchor shows. Black Temple weapons become reachable while the
    tier set still carries the entry pair, so the first weapon upgrade of the phase
    is itself a matched pair.
  what_it_does_not_settle: The rule is the guild lead's, stated on 10 August 2026
    and ruled on 20 August 2026, and docs/kb/DOMAIN.md records that no outside source
    this project holds corroborates it. This round is the simulation DOMAIN.md named
    as the route to settle it, and the answer it returned points the other way at
    two of three anchors. The two-imbue interaction is now verified against the
    binary, 20 August 2026, the off-hand Windfury imbue worth 249.4 DPS over a bare
    off hand and 96.3 over a Flametongue off hand on the best-in-slot profile at
    armor 7684, so the engine prices the mechanism and the evidence stands on a
    modeled interaction rather than an assumed one. THE RULE STANDS until the council
    revisits it, and the compendium follows the rule.
  inside_the_matched_field: Two Syphons are the best or near-best matched pair everywhere
    they are reachable, 2350.3 at best in slot against the Vengeful pairs' 2352.8,
    despite the workbook ranking Syphon 63 EPV below the Vengeful weapons, so speed
    does real work the EPV ladder cannot see. The spread from the best matched pair
    to the worst at best in slot is 67.0 DPS, which is the size of the decision
    the weapon rows on a card are actually making.
what_the_retribution_two_handers_measure:
  measured: 2026-08-20, 10000 iterations, seed 1, armor 6193, eight two-handers
    from the workbook's Two Hand ladder run as VARIANTS of each Retribution anchor
    profile, only the main hand id replaced, the off hand empty and the slot keeping
    its Mongoose, figures in data/facts/variant-sims.yaml. Two-handers only, per
    the 20 August 2026 style ruling in data/judgments/weapon-styles.yaml.
  the_anchors_reproduce: The worn weapon's variant reads the anchor figure to the
    digit at all three anchors, Lionheart Executioner 2181.3 at entry and 2180.3
    at tier, Torch of the Damned 2374.4 at best in slot, because a variant is the
    same request as its anchor.
  the_routing_costs_this_spec_nothing: Torch of the Damned measures FIRST at both
    anchors that reach it, 2374.4 at best in slot against Cataclysm's Edge's 2345.4
    and 2227.1 at tier against 2211.7. The 15 August 2026 ruling in data/judgments/weapon-routing.yaml
    sends Cataclysm's Edge to the Arms Warrior and keeps Torch here, so the routing
    takes 29.0 DPS from nobody; it hands Arms the weapon Retribution measures second
    anyway.
  where_the_simulator_and_the_workbook_disagree: The workbook prices Halberd of
    Desolation at 330.05 EPV, above Merciless Gladiator's Bonegrinder at 315.42,
    and the simulator reverses them at every anchor that runs both, 2230.1 against
    2263.0 at best in slot. The Halberd carries 30 melee hit and this set is hit-capped
    at every anchor per hit-captured.yaml, so a third of its budget buys nothing
    here, a set condition a one-column EPV cannot carry. Soul Cleaver and Twinblade
    of the Phoenix swap order between anchors for the same class of reason, Twinblade
    ahead by 14.0 on the tier set and Soul Cleaver ahead by 10.1 on the best-in-slot
    set, whose higher attack power raises what Soul Cleaver's 315 armor penetration
    is worth. NOT A RANKING. Which weapon each raider carries is the council's call.
what_the_arms_two_handers_measure:
  measured: 2026-08-20, 10000 iterations, seed 1, armor 6193, eight two-handers
    run as VARIANTS of each Arms anchor profile, only the main hand id replaced,
    the off hand empty and the slot keeping its Mongoose, figures in data/facts/variant-sims.yaml.
    Two-handers only, per the 20 August 2026 style ruling in data/judgments/weapon-styles.yaml,
    and the Phase 3 field read from items.csv because the published Phase 3 page
    ranks only dual Warglaives, which the 15 August 2026 routing sends away from
    this spec.
  the_anchors_reproduce: The worn weapon's variant reads the anchor figure to the
    digit at all three anchors, Twinblade of the Phoenix 2149.8 at entry and 2239.8
    at tier, Cataclysm's Edge 2426.4 at best in slot. The Twinblade is socketed
    and its variant keeps the worn gems, which run_variant_sims.py does only for
    the row whose id matches the slot; every other candidate arrives ungemmed.
  the_routing_gives_each_spec_its_own_measured_best: Cataclysm's Edge measures FIRST
    for Arms at both anchors that reach it, 2426.4 at best in slot against Torch
    of the Damned's 2272.4 and 2303.8 at tier against 2154.9, while Retribution
    measures Torch first on its own round. The two rulings together hand each spec
    the weapon it extracts more from, and the Arms gap is 154.0 DPS where the Retribution
    gap is 29.0, so the routing is confirmed from both sides.
  only_cataclysms_edge_improves_on_the_worn_weapon: On the tier set every other
    Phase 3 candidate measures BELOW the worn pre-Phase 3 Twinblade, Torch by 84.9,
    Vengeful Gladiator's Bonegrinder by 112.9, Soul Cleaver by 130.9 and Halberd
    of Desolation by 198.4. For this spec the weapon decision of the phase is Cataclysm's
    Edge from Archimonde or nothing, a shape no other round so far has shown.
  where_the_simulator_and_the_workbook_disagree: The workbook's Arms ladder prices
    Lionheart Executioner tenth at 1253.89, below Vengeful Gladiator's Bonegrinder
    at 1324.06, Soul Cleaver at 1295.62 and Torch of the Damned at 1286.56, and
    the simulator puts the crafted sword ABOVE all three at every anchor that runs
    them, second only to Cataclysm's Edge at best in slot, 2349.8 against Torch's
    2272.4. This set is short of the melee special cap at every anchor per hit-captured.yaml,
    so the hit-waste account that explained the Retribution reversal does not apply
    here; Lionheart carries 52 strength and 44 agility at 3.6 speed where Torch
    carries 51 strength, 38 crit rating and 50 haste rating at 3.8, and which budget
    the shipped Arms rotation converts better has not been read out of the engine.
    NOT A RANKING. Which weapon each raider carries is the council's call.
the_fury_weapon_round:
  measured: 2026-08-20, 10000 iterations, seed 1, armor 6193, twelve main hand and
    off hand pairs run as variants of all FOUR anchor profiles, entry, tier, best
    in slot and best in slot without Warglaives, dual wield only per the 20 August
    2026 style ruling in data/judgments/weapon-styles.yaml. No candidate in the
    round carries a socket, so no figure here is understated against a gemmed worn
    weapon.
  the_anchors_reproduce: The worn pair's variant reads the anchor figure to the
    digit at all four anchors, Dragonstrike with Talon of Azshara 2479.3 at entry
    and 2505.8 at tier, the Warglaives 2862.1 at best in slot, the Vengeful Gladiator's
    Slicer with the Chopper 2727.1 at best in slot without them.
  the_two_bis_tables_are_one_measurement: The best in slot and bis-no-glaives anchors
    differ only in the two weapon slots, every variant replaces both, and neither
    worn pair carries gems, so the two tables are the same requests at the same
    seed and read identically figure for figure. That is by construction, not coincidence.
  the_enchanted_premium_is_smaller_than_the_bare_one: what_the_warglaives_are_worth
    measured BARE swaps and prices the pair at 141.3 over Blade of Infamy in both
    hands. This round keeps each slot's Mongoose, and enchanted the premium reads
    130.2, 2862.1 ± 1.23 for the Warglaives against 2731.9 ± 1.24 for two Vengeful
    Gladiator's Slicers, and the best alternative CHANGES, two Slicers above the
    doubled Blade of Infamy at 2708.7. The bare block stands as recorded; the two
    are different measurements and are not comparable row against row.
  two_slicers_edge_the_worn_no_glaive_pair: The captured bis-no-glaives anchor wears
    the Slicer with the Chopper per its capture, and two Slicers measure above that
    worn pair at every anchor that runs them, 2731.9 ± 1.24 against 2727.1 ± 1.24
    on the best in slot sets and 2516.2 ± 1.18 against 2511.2 ± 1.18 on the tier
    set, a gap of about three standard errors each time and consistent in direction
    with the capture's own bare note. Two Slicers need two copies of one Season
    3 arena weapon, a question of points and weeks rather than of drops.
  entry_found_no_upgrade: The worn Dragonstrike with Talon of Azshara is the best
    pre-Phase 3 combination the round measured, 2479.3 ± 1.16 against 2473.7 ± 1.19
    for Dragonstrike with Rod of the Sun King.
  the_raid_drop_field_sits_below_the_arena_pairs: The best pair built only from
    Hyjal and Black Temple one-handers, Blade of Infamy in both hands, measures
    2708.7 on the best in slot set, below both doubled-arena rows, and Syphon of
    the Nathrezim doubled measures 2674.2. Which pair the raider can actually reach
    first is a routing and points question for the council, not a simulator one.
the_combat_rogue_weapon_round:
  measured: 2026-08-20, 10000 iterations, seed 1, armor 6193, twelve main hand and
    off hand pairs run as variants of all FOUR anchor profiles, entry, tier, best
    in slot and best in slot without Warglaives, dual wield only per the 20 August
    2026 style ruling in data/judgments/weapon-styles.yaml. The build is Combat
    Swords with Sword Specialization 5/5 and the rotation is the simulator's Sinister
    Strike swords list, so no dagger is a row and the fist and mace rows are measured
    under the stated caveat that the talent does not benefit them. No candidate
    in the round carries a socket, so no figure here is understated against a gemmed
    worn weapon.
  the_anchors_reproduce: The worn pair's variant reads the anchor figure to the
    digit at all four anchors, Talon of Azshara with the Merciless Gladiator's Quickblade
    2329.8 at entry and 2542.0 at tier, the Warglaives 2918.2 at best in slot, the
    Vengeful Gladiator's Slicer with Blade of Savagery 2708.2 at best in slot without
    them.
  the_two_bis_tables_are_one_measurement: The best in slot and bis-no-glaives anchors
    differ only in the two weapon slots, every variant replaces both, and neither
    worn pair carries gems, so the two tables are the same requests at the same
    seed and read identically figure for figure, the same construction the Fury
    round records.
  the_enchanted_premium_confirms_the_bare_arithmetic: what_the_warglaives_are_worth
    measured BARE swaps and prices the rogue's pair at 204.1 over Blade of Infamy
    with Blade of Savagery. This round keeps each slot's Mongoose, and enchanted
    the premium reads 210.0, 2918.2 ± 1.21 for the Warglaives against 2708.2 ± 1.11
    for the best alternative, which CHANGES to the Vengeful Gladiator's Slicer with
    Blade of Savagery, above the bare round's Infamy pairing at 2697.1 ± 1.11. The
    bare block stands as recorded; the two are different measurements and are not
    comparable row against row.
  the_rogue_still_extracts_more_than_the_fury_warrior: The Fury round recorded its
    enchanted premium at 130.2 and this round reads 210.0, so the bare council arithmetic,
    that the rogue extracts more from the same pair, SURVIVES enchanted measurement
    and the gap widens, 79.8 enchanted against 62.8 bare. NOT A RULING. The council
    decides.
  entry_found_no_upgrade: The worn Talon of Azshara with the Merciless Gladiator's
    Quickblade is the best pre-Phase 3 combination the round measured, 2329.8 ±
    0.98 against 2308.4 ± 0.97 for the Merciless Gladiator's Slicer with the same
    off hand.
  the_off_class_rows_sit_below_every_sword_pair: On the best in slot sets Blade
    of Infamy with the Swiftsteel Bludgeon measures 2602.9 ± 1.06 and the Season
    3 fist pair, the Right Ripper with the Left Ripper, measures 2485.1 ± 0.99,
    below all six Phase 3 sword pairs and consistent in direction with the Sword
    Specialization caveat the round states. The workbook's off hand ladder ranks
    the Bludgeon second, and under this build the simulator does not agree.
the_beast_mastery_weapon_round:
  measured: 2026-08-20, 10000 iterations, seed 1, armor 6193, eleven rows run as
    variants of each Beast Mastery anchor profile, BOTH styles in one table per
    the 20 August 2026 style ruling in data/judgments/weapon-styles.yaml, seven
    dual wield pairs and four two-handers with the off hand empty, figures in data/facts/variant-sims.yaml.
    The melee slots are stat sticks and no row touches the ranged weapon.
  the_anchors_reproduce: The worn combination's variant reads the anchor figure
    to the digit at all three anchors, Talon of the Phoenix with Claw of the Phoenix
    3342.3 at entry and 3523.1 at tier, Boundless Agony with Blade of Infamy 3580.7
    at best in slot.
  every_two_hander_beats_every_pair: At all three anchors the four two-hander rows
    sit above every dual wield row, worst two-hander against best pair 3405.1 against
    3342.3 at entry, 3590.5 against 3550.8 at tier and 3663.6 against 3624.7 at
    best in slot, and the tier and best in slot gaps hold even though the Twinblade
    row runs UNGEMMED, three empty sockets, because no BM anchor wears it. For a
    spec whose melee slots only carry stats, one two-hand budget buys more than
    two one-hand budgets at every anchor measured.
  the_captured_best_in_slot_pair_measures_last: Boundless Agony with Blade of Infamy,
    the capture's Best MH and top Best OH, is the LOWEST of all eleven rows on the
    tier and best in slot sets, 3580.7 ± 1.01 at best in slot against 3694.5 ± 1.09
    for Bloodmoon, a gap of 113.8, and even the worn entry fists measure above it,
    3594.8. The captured page prices its dual wield table in isolation and lists
    no two-hander against it, so the capture is faithful to its source and the source
    does not ask this question.
  a_phase_2_crafted_axe_tops_every_anchor: Bloodmoon, crafted by Blacksmithing and
    reachable before Phase 3, measures FIRST at all three anchors, 3432.4 at entry,
    3618.8 at tier and 3694.5 at best in slot, above the Two Hand ladder's rank
    one Halberd of Desolation at 3673.3 and rank two Vengeful Gladiator's Decapitator
    at 3688.3 on the best in slot set. The workbook prices the Halberd 50.75 EPV
    above Bloodmoon; the Halberd spends 30 of its budget on melee hit, which feeds
    only the stat stick swings, the same one-column account the Retribution round
    recorded. NOT A RANKING. Which weapon the hunter carries, and whether a Naj'entus
    polearm is better routed to a spec whose swings it feeds, is the council's call.
  the_stone_caveat: The hunters run the Adamantite stone chosen by the WORN weapon's
    class per data/judgments/weapon-imbues.yaml, and a variant holds the anchor's
    consumables still, so the entry and tier anchors, worn with fist weapons, ran
    every sword, dagger, axe and polearm row under the Weightstone, and the best
    in slot anchor, worn with a dagger and a sword, ran the Season 3 fist pair under
    the Sharpening Stone. The weightstone is the stone that feeds ranged base damage
    per docs/kb/DOMAIN.md, so the entry and tier rows carry the ranged-fed stone
    a differently classed pair would not, and no cross-class row here prices its
    own stone.
  the_spread_is_the_finding: The whole table spans 113.8 DPS at best in slot and
    the seven dual wield rows span 44.0, from 3580.7 to 3624.7, on a set that deals
    3580.7, so a hunter weapon argument between PAIRS is worth about one percent
    of the spec's damage and the only move worth more is the style itself. The two-hander
    rows are where the DPS is; everything else is small against the same drops contested
    by the melee, whose rounds price the same one-handers at many times these gaps.
the_survival_weapon_round:
  measured: 2026-08-20, 10000 iterations, seed 1, armor 6193, eleven rows run as
    variants of each Survival anchor profile, BOTH styles in one table per the 20
    August 2026 style ruling in data/judgments/weapon-styles.yaml, seven dual wield
    pairs and the same four two-handers the Beast Mastery round ran with the off
    hand empty, figures in data/facts/variant-sims.yaml. The melee slots are stat
    sticks and no row touches the ranged weapon.
  the_anchors_reproduce: The worn combination's variant reads the anchor figure
    to the digit at all three anchors, Netherbane with Claw of the Phoenix 2797.4
    at entry and 2961.0 at tier, two copies of Blade of Infamy 3074.2 at best in
    slot.
  the_two_hander_verdict_holds_here_too: At all three anchors every two-hander row
    sits above every dual wield row, the same style finding the Beast Mastery round
    reported, worst two-hander against best pair 2840.9 against 2799.0 at entry,
    3011.4 against 3003.2 at tier and 3081.2 against 3074.2 at best in slot, and
    the tier and best in slot floors are the UNGEMMED Twinblade row, three empty
    sockets because no SV anchor wears it, so the narrowest gaps understate the
    style gap by the gems a raider would add. The captured best-in-slot pair, two
    Blades of Infamy, is therefore the best PAIR measured and still sits 33.2 below
    the best two-hander on its own set; the captured page prices its dual wield
    table in isolation and lists no two-hander against it, so the capture is faithful
    to its source and the source does not ask this question.
  the_top_of_the_table_differs_from_beast_mastery: Bloodmoon topped every BM anchor;
    here it tops only entry, 2862.8, the anchor where the Halberd does not run.
    Where both run, the Halberd of Desolation reads first, 3039.2 at tier against
    Bloodmoon's 3037.0 and 3107.4 at best in slot against the Decapitator's 3105.9
    and Bloodmoon's 3105.6. Those top figures sit within about two standard errors
    of one another at both anchors, so the ORDER among the three is rank-unstable;
    what is not is the direction of the movement. Expose Weakness is self-applied
    and scales with this hunter's own agility, and the Halberd carries 51 agility
    where Bloodmoon carries none, so the axe that beat the agility polearm by 21.2
    on the Beast Mastery set closes to a coin flip on the Survival set. NOT A RANKING.
    Which weapon the hunter carries, and whether a Naj'entus polearm is better routed
