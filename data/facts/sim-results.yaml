  the_armor_tier_caveat: Madness of the Betrayer carries armor penetration, so every figure that
    holds it moves with the boss's armor, and these are at 6193, the tier ten of the fourteen
    bosses sit in. At that tier Dragonspine plus Madness is the top row at both anchors that
