meta:
  what: The context every simulated figure is read in, ruled by the guild lead.
    The sweep still runs every armor tier, so no figure is lost; this rules
    which tier is the DEFAULT, the one the summary table shows, the variant
    rounds run at, and a decision is read from unless it says otherwise.
  ruled: '2026-08-20'
  by: the guild lead
rulings:
- rule: The default boss armor is the HIGHEST tier the phase holds, 7684.
  verbatim: our armor tiers should alway assume highest armor tiers!
  what_it_replaces: The default was 6193 because ten of the fourteen Phase 3
    bosses sit there. That fact stands and the per-tier figures remain
    published; the guild lead ruled that decisions assume the hardest target
    instead, so armor penetration and physical throughput are never read
    against the softer tier by default.
  what_it_moves: Every variant round reruns at 7684, the summary table and the
    page-top figures read 7684, and any ruling taken from a 6193 figure is
    re-read against 7684, the Beast Mastery trinket pick being the live case,
    Madness of the Betrayer paying in armor penetration.
- rule: An equipped piece is ASSUMED GEMMED AND ENCHANTED in every simulation.
  verbatim: when we equip pieces we should ASSUME they are gemmed and enchanted!
  what_it_replaces: The variant rounds ran a candidate bare of gems, pricing the
    item alone with a stated understatement caveat on every socketed candidate,
    and the first tier round did the same, which made a four-piece tier row
    read as an absolute downgrade when the empty sockets were the cost. The
    guild lead read that row the way any reader would and ruled the assumption.
  how_it_is_applied: A replacement drawn from an exported profile arrives with
    that profile's gems and enchant. A candidate no profile wears carries the
    spec's standard gem in each socket, named in enchants-by-spec.yaml, and the
    slot's enchant. A worn item keeps its own gems exactly, so the plus-zero
    self-match stands.
- rule: A slot-level variant gain is confirmed at the PROFILE level before a
    profile re-wears, because a swap that moves hit reshapes the gems and the
    food behind it.
  verbatim: derived from the Beast Mastery case rather than stated; recorded
    here because the guild lead asked for the fixes as one batch
  the_case: Removing Madness of the Betrayer cost the Beast Mastery profile 20
    item hit, the exporter re-spent four sockets on hit gems where two had
    sufficed, and the rebuilt profile measured 12.8 BELOW its old anchor while
    the slot-level variant row had measured 11.2 above it. The variant table
    holds gems and consumables still by design, so it prices the item alone; a
    profile prices the item and everything it displaces.
- rule: HUNTERS DO NOT MELEE WEAVE in any simulated figure.
  verbatim: ah yes we should assume no weaving
  ruled: '2026-08-22'
  what_it_replaces: Every hunter figure published before this ruling assumed
    weaving without anyone deciding it. The simulator's own hunter preset,
    which this project runs deliberately so the rotation is citable, carries
    Melee weave as an APL constant set true, and under weaving every
    two-hander measured above every dual pair, which drove the 20 August
    hunter re-anchors. The guild lead asked why the community lists rank a
    dual pair first, and the answer was that they price a hunter that does
    not weave.
  what_was_measured: At best in slot, boss armor 7684, the Beast Mastery
    anchor measured 3307.2 weaving and 2927.5 not weaving, so the technique
    is worth about 380 damage per second. Under weaving the arena
    two-hander led the best dual pair by 82.1; without it the two are
    10.1 apart, a stat-stick difference.
  how_it_is_applied: Both hunters run data/sim/apls/hunter-no-weave.apl.json,
    the shipped preset with exactly two edits, the weave constant set false
    and an unconditional prepull move to 25 yards. Every hunter round is
    rerun under it, and the 20 August weapon re-anchors are re-read against
    the no-weave weapon round.
