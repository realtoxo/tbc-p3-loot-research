meta:
  what: Trinket routing the guild lead settled for the best-in-slot sim profiles, and the content
    this guild does not run, which is what forced it.
  why_here: A published best-in-slot list ranks a trinket for a spec in isolation and assumes
    every raid in the game is open. This guild does not run Ahn'Qiraj, so an item from there is
    not a stronger pick, it is not a pick at all. That is a decision about how this guild raids,
    so it lives in data/judgments/ and never in data/facts/.
  ruled: '2026-08-15'
  by: the guild lead
  applies_to: data/research/wowhead-phase3-bis-full/, which is a capture and is NOT edited. The
    routing is applied when the BiS sim profile is built from it, so the capture keeps saying
    what the page said and the profile says what this raid will do. Same rule as data/judgments/weapon-routing.yaml.
unavailable_content:
- content: Ahn'Qiraj
  verbatim: We dont have badge of the swamrguards as our guild wont run aq
  ruling: This guild does not run Ahn'Qiraj, so no item that drops there may appear in a sim profile.
  barred_items:
  - item: Badge of the Swarmguard
    id: 21670
    where: Ahn'Qiraj 40, the Twin Emperors
    was_worn_by: Both warriors, at the best-in-slot anchor only, because the Wowhead Phase 3 pages
      for Arms and Fury both rank it.
  how_it_was_missed: It is the only item in any profile that predates The Burning Crusade, and
    no check looked. tools/check_sim_profiles.py now bars every id listed here, so a future capture
    that ranks one fails the build rather than quietly simulating a trinket nobody can obtain.
  it_cost_the_raid_nothing: 'Measured on 15 August 2026 before the replacement was chosen. Badge
    of the Swarmguard was the WORST of the seven trinkets either warrior could put in that slot:
    every alternative measured higher, so losing Ahn''Qiraj gained the Arms Warrior 63.0 DPS and
    the Fury Warrior 91.9. That is the opposite of what an unreachable best-in-slot item usually
    means and it is recorded so nobody re-opens the question.'
rulings:
- slot: trinket_2
  item: Bloodlust Brooch
  ids:
  - 29383
  specs:
  - arms_warrior
  - fury_warrior
  ruling: Both warriors take Bloodlust Brooch in the second trinket slot, replacing Badge of the
    Swarmguard. Dragonspine Trophy stays in the first slot.
  replaces:
    item: Badge of the Swarmguard
    id: 21670
  measured:
    when: 2026-08-15, RE-MEASURED A SECOND TIME after the boss armor defect was fixed
    how: 10000 iterations, seed 1, 150 second encounter, boss armor 6193, both trinket slots varied
      TOGETHER because a trinket is worth one thing beside an attack power partner and another
      beside an armor penetration one.
    why_it_was_measured_three_times: 'The first pass ran on characters with no base stats, because
      every spec was sent an illegal race. The second ran against a boss with NO ARMOR, which
      matters more here than anywhere else in the project: armor penetration was worth EXACTLY
      ZERO, so every armor-penetration trinket was being priced at nothing. Madness of the Betrayer
      is an armor penetration trinket. Only this third pass prices it honestly.'
    arms_warrior:
      dragonspine_plus_bloodlust: 2421.4
      dragonspine_plus_madness: 2417.0
      dragonspine_plus_tsunami: 2410.4
      dragonspine_plus_badge_UNOBTAINABLE: 2386.8
      madness_plus_bloodlust: 2379.3
    fury_warrior:
      dragonspine_plus_madness: 2862.8
      dragonspine_plus_tsunami: 2856.7
      dragonspine_plus_bloodlust: 2856.4
      dragonspine_plus_badge_UNOBTAINABLE: 2833.6
      madness_plus_bloodlust: 2819.3
    reproduce: python3 tools/run_sims.py --profile fury-warrior.bis --iterations 10000 --armor
      6193 --slot trinket_1,trinket_2 --swap 28830,29383 --swap 28830,32505
  why_it_costs_the_council_nothing: Bloodlust Brooch is a Badge of Justice purchase, so both warriors
    can hold one, it contests no drop and no other spec loses anything. It is the rare routing
    decision with no other side.
  what_it_declines: Madness of the Betrayer 32505 is not routed here, and it is wanted by the
    Beast Mastery Hunter, the Enhancement Shaman and the Survival Hunter, whose own lists rank
    it. Tsunami Talisman 30627 stays available, and both warriors moving to Bloodlust Brooch is
    what frees it. The Combat Rogue measures 67.0 higher with it than with the Warp-Spring Coil
    its own page ranks, which is recorded in data/facts/sim-results.yaml as a measurement. NO
    RULING HAS BEEN MADE on the rogue's trinkets and none is implied here.
  what_the_armor_fix_changed_about_this_ruling: 'THE ORDERING COMPRESSED AND ONE SIDE FLIPPED.
    Before armor existed, Madness of the Betrayer measured 29.4 behind Bloodlust Brooch on Arms
    and 32.8 behind on Fury, and this file explained that as armor penetration stacking into diminishing
    returns against the Tier 6 set. THAT EXPLANATION WAS WRONG, and it was wrong for a reason
    worth recording: armor penetration was worth zero to everyone at the time, so no amount of
    it could have stacked into anything. Corrected, Madness is 4.5 behind on Arms and 6.4 AHEAD
    on Fury.'
  the_ruling_stands_anyway_and_here_is_why: 'Bloodlust Brooch and Madness are now within 6.4 DPS
    of each other on both warriors, which is about four standard errors and a rounding error in
    practice. What separates them is not damage: BLOODLUST BROOCH IS A BADGE OF JUSTICE PURCHASE,
    so both warriors can hold one and it contests nothing, while MADNESS OF THE BETRAYER IS A
    BLACK TEMPLE DROP THAT THREE OTHER SPECS WANT, the Beast Mastery Hunter, the Enhancement Shaman
    and the Survival Hunter. Taking a contested drop for 6.4 DPS on one warrior is the trade this
    ruling declines. GUILD LEAD may revisit it now that the figures are honest.'
  dragonspine_trophy_is_still_the_anchor: 'Unchanged by the correction and now by a wider margin:
    every pairing that holds Dragonspine Trophy beats every pairing without it, on both warriors,
    at 37.2 to 43.8 DPS.'
what_still_needs_a_ruling: []
