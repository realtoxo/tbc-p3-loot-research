meta:
  what: Weapon routing the guild lead settled for the best-in-slot sim profiles. These
    are ALLOCATION decisions about who gets a contested weapon, not corrections to what
    Wowhead published.
  why_here: A published best-in-slot list ranks a weapon for a spec in isolation. A raid
    has one of each. Where the guild lead routes a weapon away from the spec a list gives
    it to, that is a judgment and lives in data/judgments/, never in data/facts/.
  ruled: '2026-08-15'
  by: the guild lead
  applies_to: data/research/wowhead-phase3-bis-full/, which is a capture and is NOT edited.
    The routing is applied when the BiS sim profile is built from it, so the capture keeps
    saying what the page said and the profile says what this raid will do.
rulings:
- weapon: Warglaive of Azzinoth
  ids:
  - 32837
  - 32838
  ruling: The Arms Warrior will never receive them.
  verbatim: arms warrior will never get warglaives
  the_lists_disagree: The Phase 3 lists rank dual Warglaives first for the Combat Rogue
    AND both warriors. This routes them away from Arms only.
  consequence: 'The Arms Warrior BiS profile needs a different main hand, and its weapon
    STYLE changes: the list pairs two one-hand Warglaives where this spec keeps a two-hander.
    That is a different build, not a stat swap.'
- weapon: Zhar'doom, Greatstaff of the Devourer
  ids:
  - 32374
  ruling: Goes to the warlocks, the Balance Druid, the Elemental Shaman and the Shadow
    Priest.
  verbatim: zhardooms to warlocks boomkins and elementals
  consequence: Those specs wear a TWO-HANDED staff, so their profile holds no off-hand
    at all. The captures list both a staff and an off-hand for several specs, which cannot
    both be worn; this ruling settles that contradiction for these four. The Shadow Priest
    is NOT on this list and needs a one-hand and off-hand pairing instead.
  no_off_hand: 'STATED EXPLICITLY BY THE GUILD LEAD, 15 August 2026: "Zhardoom users should
    not have offhands also". A two-handed staff occupies both hands, so the off-hand slot
    is EMPTY for these four specs. The captures list an off-hand for several of them,
    and it is discarded when the profile is built rather than carried.'
  shadow_priest_added: 'Added 15 August 2026: "spriest wears zhardoom". The first statement
    of this ruling named warlocks, boomkins and elementals only, which left the Shadow
    Priest with no main hand at all because its capture ranks Zhar''doom first and names
    no alternative. Five specs now wear the staff, and all five hold no off-hand.'
- weapon: Tempest of Chaos
  ids:
  - 30910
  previously_claimed: 'The id read 32943 from 15 August 2026 until it was corrected the
    same day. 32943 is Swiftsteel Bludgeon, a one-hand mace, and Tempest of Chaos is 30910,
    a main-hand sword. Nothing had been built on the wrong id yet. The RULING is unaffected,
    because the guild lead named the weapon and not the number; only the transcription
    was wrong. Found while building the best-in-slot sim profiles, by resolving every routed
    id against items.csv, which is the check AGENTS.md requires and which had not been run
    on this file.'
  ruling: The Arcane Mage takes it first.
  verbatim: arcane mage will get tempest of chaos first
  consequence: 'Resolves the Arcane Mage''s staff-against-off-hand contradiction: it wears
    a one hand and an off hand, not Zhar''doom. It also competes with the warlocks, whose
    lists rank Tempest of Chaos first, and the word FIRST is the ordering rather than
    an exclusion.'
- weapon: Cataclysm's Edge
  ids:
  - 30902
  ruling: The Arms Warrior takes it.
  verbatim: yes arms take cataclysm edge
  why_it_needed_a_ruling: The Arms page ranks only dual Warglaives for Phase 3, which
    the guild lead routed away from this spec, and its two-hand table carries a heading
    that says PHASE 2. So the spec had no Phase 3 two-hander of its own and the choice
    could not be read off the page.
  what_it_declines: Torch of the Damned 32332, the other candidate, stays with the Retribution
    Paladin whose own list ranks it first. Routing it to Arms would have taken it from
    a spec that has no second option.
- weapon: Vengeful Gladiator's Decapitator
  ids:
  - 33670
  ruling: The Beast Mastery Hunter's best-in-slot profile wears it alone, a two-hander, replacing
    the captured dual pair. The weapon rounds measured every two-hander above every dual pair
    for both hunters, the guild lead barred crafted weapons from hunter consideration, "no crafted
    weapons on hunter for bis", which removed the measured leader Bloodmoon, and he ruled the
    re-anchor on 20 August 2026, "yes rerun the hunter sim". The off hand runs empty.
  consequence: 'The BUILD changes from dual wield to a two-hander, the same class of change as
    the Arms Warrior ruling: not a stat swap. The dual one-handers the capture wore stop being
    hunter claims.'
- weapon: Halberd of Desolation
  ids:
  - 32248
  ruling: The Survival Hunter's best-in-slot profile wears it alone, a two-hander, replacing the
    captured dual pair of two Blades of Infamy, ruled by the guild lead on 20 August 2026 with
    the Beast Mastery re-anchor. Its own table ranks it first, rank-unstable with two others
    inside about two standard errors, and it is the one weapon its Expose Weakness agility favors.
    The off hand runs empty.
  consequence: The Naj'entus polearm becomes a Survival claim, which the melee tables also rank;
    which spec receives it remains council business, and the Beast Mastery pick avoids the
    collision by wearing the arena two-hander.
what_still_needs_a_ruling: []
twinblade_of_the_phoenix: 'CLOSED BY MEASUREMENT, 22 August 2026. The gemmed Twinblade,
  29993, led both hunters'' worn two-handers in the weapon variant tables by 5.3 and
  5.7 damage per second, so it was tested as a rebuilt profile before coming to the
  guild lead. Losing the worn weapon''s hit reshaped the gems, and the rebuilt profiles
  measured 15.1 BELOW the Beast Mastery anchor and 15.3 below the Survival anchor at
  boss armor 7684. The re-anchors above stand, and this is the second time a slot-level
  gain died at the profile level, after the Beast Mastery trinket case in
  data/judgments/sim-context.yaml.'

warlocks_before_zhardoom: 'NOT A QUESTION FOR THE SIM, closed by the guild lead on 15
  August 2026: "dont worry about what warlocks wear before zhardoom, just sim our bis
  warlocks with zhardoom". A best-in-slot profile is the finished set, so what a spec
  holds on the way to it is a routing question for the council and not a state this profile
  models.'
