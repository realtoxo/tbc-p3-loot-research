meta:
  what: The amendment to the founding rule, ruled by the guild lead. The
    compendium may emit an ordering that is a pure function of measurement.
  ruled: '2026-08-22'
  by: the guild lead
ruling:
  verbatim: we've now reached the point where i want us to reach recommendations
    from our facts
  what_it_allows: A slot's candidates sorted best to worst by simulated delta,
    and a denial cost read as this item minus the next best available, both
    recomputed by rerunning the pipeline.
  what_it_keeps_out: Any weighing of a quantitative input against a qualitative
    one, any single number blending things a simulation cannot compare, and who
    actually receives a drop. Those remain council judgments.
